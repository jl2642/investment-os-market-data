<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111f"/>
      <stop offset="0.55" stop-color="#0a1f35"/>
      <stop offset="1" stop-color="#07302e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#59c7ff"/>
      <stop offset="1" stop-color="#5ee0c2"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .sans{font-family:Inter,Segoe UI,Arial,"Microsoft YaHei","PingFang SC",sans-serif}
      .muted{fill:#9bb3c9}.white{fill:#f5f9fc}.cyan{fill:#6dd6ff}.mint{fill:#66e0c2}
      .card{fill:#0a2035;stroke:#2e6385;stroke-width:2}.small{font-size:22px}.tiny{font-size:18px}
    </style>
  </defs>
  <rect width="1200" height="1600" fill="url(#bg)"/>
  <g opacity="0.12" stroke="#65bfe8">
    <path d="M0 210 H1200 M0 350 H1200 M0 490 H1200 M0 630 H1200 M0 770 H1200 M0 910 H1200 M0 1050 H1200 M0 1190 H1200"/>
    <path d="M160 0 V1600 M360 0 V1600 M560 0 V1600 M760 0 V1600 M960 0 V1600"/>
  </g>
  <text x="600" y="72" text-anchor="middle" class="sans cyan" font-size="28" letter-spacing="5">STOCK INVESTMENT ASSISTANT</text>
  <text x="600" y="150" text-anchor="middle" class="sans white" font-size="70" font-weight="800">股票投资助手</text>
  <text x="600" y="232" text-anchor="middle" class="sans white" font-size="48" font-weight="760">让投资系统替你记住一切。</text>
  <text x="600" y="294" text-anchor="middle" class="sans white" font-size="48" font-weight="760">而不是你自己每天惦记。</text>
  <text x="600" y="340" text-anchor="middle" class="sans muted" font-size="22">A ChatGPT-native investment research agent for disciplined, low-frequency investing.</text>
  <g class="sans">
    <g transform="translate(110,400)"><rect width="980" height="142" rx="24" class="card"/><circle cx="58" cy="71" r="34" fill="#103956" stroke="#58c9ff" stroke-width="2"/><text x="58" y="80" text-anchor="middle" class="white" font-size="28" font-weight="700">1</text><text x="120" y="57" class="white" font-size="34" font-weight="800">MARKET</text><text x="120" y="96" class="muted small">市场与资料更新｜行情 · 历史数据 · 因子 · 财报 · 公告 · SEC Evidence</text></g>
    <g transform="translate(110,562)"><rect width="980" height="142" rx="24" class="card"/><circle cx="58" cy="71" r="34" fill="#103956" stroke="#58c9ff" stroke-width="2"/><text x="58" y="80" text-anchor="middle" class="white" font-size="28" font-weight="700">2</text><text x="120" y="57" class="white" font-size="34" font-weight="800">CANDIDATE</text><text x="120" y="96" class="muted small">候选池持续演化｜Core · Watch · Research Queue · Promotion / Exit</text></g>
    <g transform="translate(110,724)"><rect width="980" height="142" rx="24" class="card"/><circle cx="58" cy="71" r="34" fill="#103956" stroke="#58c9ff" stroke-width="2"/><text x="58" y="80" text-anchor="middle" class="white" font-size="28" font-weight="700">3</text><text x="120" y="57" class="white" font-size="34" font-weight="800">RESEARCH</text><text x="120" y="96" class="muted small">持续研究，而不是一次性报告｜投资命题 · Evidence · 估值 · 风险 · 下一触发器</text></g>
    <g transform="translate(110,886)"><rect width="980" height="142" rx="24" class="card"/><circle cx="58" cy="71" r="34" fill="#103956" stroke="#58c9ff" stroke-width="2"/><text x="58" y="80" text-anchor="middle" class="white" font-size="28" font-weight="700">4</text><text x="120" y="57" class="white" font-size="34" font-weight="800">PORTFOLIO</text><text x="120" y="96" class="muted small">真实持仓 + 模拟组合｜集中度 · 回撤 · 基本面 · 替代机会 · 调仓审查</text></g>
    <g transform="translate(110,1048)"><rect width="980" height="164" rx="24" class="card"/><circle cx="58" cy="82" r="34" fill="#103956" stroke="#58c9ff" stroke-width="2"/><text x="58" y="91" text-anchor="middle" class="white" font-size="28" font-weight="700">5</text><text x="120" y="58" class="white" font-size="34" font-weight="800">DAILY CONTROLLER</text><text x="120" y="98" class="muted small">每天只回答最重要的问题：发生了什么？什么值得关注？今天我需要做什么？</text><text x="120" y="132" class="mint tiny">允许结论：今天你无需做任何事。</text></g>
  </g>
  <rect x="70" y="1250" width="1060" height="112" rx="24" fill="#071a2a" stroke="#29627e" stroke-width="2"/>
  <text x="600" y="1292" text-anchor="middle" class="sans white" font-size="24" font-weight="700">能自动的，自动做。　能自动恢复的，不打扰你。</text>
  <text x="600" y="1332" text-anchor="middle" class="sans mint" font-size="24" font-weight="700">需要研究的，进入研究队列。　真正需要决定时，才把问题交给你。</text>
  <text x="600" y="1420" text-anchor="middle" class="sans white" font-size="34" font-weight="800">ChatGPT + Core Static + GitHub = AI Investment Research Agent</text>
  <text x="600" y="1472" text-anchor="middle" class="sans" font-size="36" font-weight="800" fill="url(#accent)" filter="url(#glow)">AI Research. Human Decision.</text>
  <text x="600" y="1516" text-anchor="middle" class="sans muted" font-size="20">No Auto Trading · No Return Promises · Research &amp; Decision Support Only</text>
  <text x="600" y="1552" text-anchor="middle" class="sans cyan" font-size="19">Current Status: Development Complete · Operating Observation</text>
  <text x="600" y="1583" text-anchor="middle" class="sans muted" font-size="18">Market → Candidate → Research → Portfolio → Daily Control</text>
</svg>