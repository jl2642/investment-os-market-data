name: HKCU P2B E2 Deepening D2 Top20 Synthesis

on:
  pull_request:
    paths:
      - 'config/hkcu_p2b_e2_deepening_d2_contract.json'
      - 'pipeline/hkcu_p2b_e2_synthesize_top20_partial.py'
      - 'scripts/validate_hkcu_p2b_e2_deepening_d2.py'
      - 'tests/test_hkcu_p2b_e2_deepening_d2.py'
      - 'docs/HKCU-P2B_E2_DEEPENING_D2.md'
      - '.github/workflows/hkcu-p2b-e2-deepening-d2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-and-scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q tests/test_hkcu_p2b_e2_deepening_d2.py
      - name: Enforce isolated D2 scope
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}"
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" > /tmp/p2b_e2_d2_paths.txt
          cat /tmp/p2b_e2_d2_paths.txt
          python - <<'PY'
          from pathlib import Path
          allowed = {
              "config/hkcu_p2b_e2_deepening_d2_contract.json",
              "pipeline/hkcu_p2b_e2_synthesize_top20_partial.py",
              "scripts/validate_hkcu_p2b_e2_deepening_d2.py",
              "tests/test_hkcu_p2b_e2_deepening_d2.py",
              "docs/HKCU-P2B_E2_DEEPENING_D2.md",
              ".github/workflows/hkcu-p2b-e2-deepening-d2.yml",
          }
          actual = {x.strip() for x in Path('/tmp/p2b_e2_d2_paths.txt').read_text().splitlines() if x.strip()}
          bad = sorted(actual - allowed)
          if bad:
              raise SystemExit('P2B_E2_D2_SCOPE_VIOLATION:' + ','.join(bad))
          protected_prefixes = (
              'outputs/candidate/', 'outputs/simulation/', 'outputs/real',
              'state/', 'orders/'
          )
          protected = sorted(p for p in actual if p.startswith(protected_prefixes))
          if protected:
              raise SystemExit('P2B_E2_D2_PROTECTED_PATH_MUTATION:' + ','.join(protected))
          PY

  real-top20-synthesis:
    needs: unit-and-scope
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Rebuild accepted D1 and synthesize top20 partial evidence
        run: |
          rm -rf work/hkcu_p2b_e2_d2
          python pipeline/hkcu_p2b_e2_synthesize_top20_partial.py \
            --repo-root . \
            --output work/hkcu_p2b_e2_d2
      - name: Independent D2 validation
        run: |
          python scripts/validate_hkcu_p2b_e2_deepening_d2.py \
            --output work/hkcu_p2b_e2_d2
      - name: Render D2 decision and quality
        if: always()
        run: |
          test ! -f work/hkcu_p2b_e2_d2/HKCU_P2B_E2_D2_DECISION.json || cat work/hkcu_p2b_e2_d2/HKCU_P2B_E2_D2_DECISION.json
          test ! -f work/hkcu_p2b_e2_d2/HKCU_P2B_E2_D2_QUALITY_REPORT.json || cat work/hkcu_p2b_e2_d2/HKCU_P2B_E2_D2_QUALITY_REPORT.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hkcu-p2b-e2-d2-top20-synthesis
          path: work/hkcu_p2b_e2_d2/HKCU_P2B_E2_D2_*
          if-no-files-found: error
