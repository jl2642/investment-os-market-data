name: HKCU P5A Phase5 Contract Entry Freeze

on:
  pull_request:
    paths:
      - 'config/hkcu_p5a_phase5_contract_entry_freeze.json'
      - 'pipeline/hkcu_p5a_phase5_contract_entry_freeze.py'
      - 'scripts/validate_hkcu_p5a_phase5_contract_entry_freeze.py'
      - 'tests/test_hkcu_p5a_phase5_contract_entry_freeze.py'
      - 'docs/HKCU-P5A_PHASE5_CONTRACT_AND_ENTRY_FREEZE.md'
      - '.github/workflows/hkcu-p5a-phase5-contract-entry-freeze.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-and-scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q tests/test_hkcu_p5a_phase5_contract_entry_freeze.py
      - name: Enforce isolated P5A entry-freeze scope
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}"
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" > /tmp/p5a_paths.txt
          cat /tmp/p5a_paths.txt
          python - <<'PY'
          from pathlib import Path
          allowed = {
              'config/hkcu_p5a_phase5_contract_entry_freeze.json',
              'pipeline/hkcu_p5a_phase5_contract_entry_freeze.py',
              'scripts/validate_hkcu_p5a_phase5_contract_entry_freeze.py',
              'tests/test_hkcu_p5a_phase5_contract_entry_freeze.py',
              'docs/HKCU-P5A_PHASE5_CONTRACT_AND_ENTRY_FREEZE.md',
              '.github/workflows/hkcu-p5a-phase5-contract-entry-freeze.yml',
          }
          actual = {x.strip() for x in Path('/tmp/p5a_paths.txt').read_text().splitlines() if x.strip()}
          bad = sorted(actual - allowed)
          if bad:
              raise SystemExit('P5A_SCOPE_VIOLATION:' + ','.join(bad))
          protected = ('outputs/hk_candidate/', 'outputs/simulation/', 'outputs/real', 'investment_os_runtime/30_STATE_CURRENT/', 'orders/')
          mutations = sorted(x for x in actual if x.startswith(protected))
          if mutations:
              raise SystemExit('P5A_PROTECTED_PATH_MUTATION:' + ','.join(mutations))
          PY

  real-entry-freeze:
    needs: unit-and-scope
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Rebuild and validate accepted P4-1R context
        run: |
          rm -rf work/hkcu_p5a_context work/hkcu_p5a_fit work/hkcu_p5a_review work/hkcu_p5a_scenarios work/hkcu_p5a_proposal work/hkcu_p5a_freeze
          python -m pipeline.hkcu_p4_1r_canonical_data_adapter --repo-root . --output work/hkcu_p5a_context
          python scripts/validate_hkcu_p4_1r_portfolio_context_completion.py --repo-root . --output work/hkcu_p5a_context
      - name: Rebuild and validate accepted P4-1 Portfolio Fit reassessment
        run: |
          python -m pipeline.hkcu_p4_1_portfolio_fit_reassessment_decision_adapter \
            --repo-root . \
            --context-dir work/hkcu_p5a_context \
            --output work/hkcu_p5a_fit
          python scripts/validate_hkcu_p4_1_portfolio_fit_reassessment.py \
            --repo-root . \
            --context-dir work/hkcu_p5a_context \
            --output work/hkcu_p5a_fit
      - name: Rebuild and validate accepted P4-2 construction review
        run: |
          python -m pipeline.hkcu_p4_2_portfolio_construction_review_decision_adapter \
            --repo-root . \
            --context-dir work/hkcu_p5a_context \
            --fit-dir work/hkcu_p5a_fit \
            --output work/hkcu_p5a_review
          python scripts/validate_hkcu_p4_2_portfolio_construction_review.py \
            --repo-root . \
            --context-dir work/hkcu_p5a_context \
            --fit-dir work/hkcu_p5a_fit \
            --output work/hkcu_p5a_review
      - name: Rebuild and validate accepted P4-3 scenarios
        run: |
          python -m pipeline.hkcu_p4_3_portfolio_construction_scenario_test \
            --repo-root . \
            --p4-2-dir work/hkcu_p5a_review \
            --output work/hkcu_p5a_scenarios
          python scripts/validate_hkcu_p4_3_portfolio_construction_scenario_test.py \
            --repo-root . \
            --p4-2-dir work/hkcu_p5a_review \
            --output work/hkcu_p5a_scenarios
      - name: Rebuild and validate accepted P4-4 proposal review
        run: |
          python -m pipeline.hkcu_p4_4_portfolio_proposal_review \
            --repo-root . \
            --p4-2-dir work/hkcu_p5a_review \
            --p4-3-dir work/hkcu_p5a_scenarios \
            --output work/hkcu_p5a_proposal
          python scripts/validate_hkcu_p4_4_portfolio_proposal_review.py \
            --repo-root . \
            --p4-2-dir work/hkcu_p5a_review \
            --p4-3-dir work/hkcu_p5a_scenarios \
            --output work/hkcu_p5a_proposal
      - name: Execute P5A contract and entry freeze
        run: |
          python -m pipeline.hkcu_p5a_phase5_contract_entry_freeze \
            --repo-root . \
            --p4-4-dir work/hkcu_p5a_proposal \
            --output work/hkcu_p5a_freeze
      - name: Independently validate P5A freeze
        run: |
          python scripts/validate_hkcu_p5a_phase5_contract_entry_freeze.py \
            --repo-root . \
            --p4-4-dir work/hkcu_p5a_proposal \
            --output work/hkcu_p5a_freeze
      - name: Render P5A decision and frozen gate surface
        if: always()
        run: |
          test ! -f work/hkcu_p5a_freeze/HKCU_P5A_ENTRY_FREEZE_DECISION.json || cat work/hkcu_p5a_freeze/HKCU_P5A_ENTRY_FREEZE_DECISION.json
          test ! -f work/hkcu_p5a_freeze/HKCU_P5A_ENTRY_FREEZE_QUALITY_REPORT.json || cat work/hkcu_p5a_freeze/HKCU_P5A_ENTRY_FREEZE_QUALITY_REPORT.json
          test ! -f work/hkcu_p5a_freeze/HKCU_P5A_ENTRY_FREEZE_GATE_REGISTER.csv || cat work/hkcu_p5a_freeze/HKCU_P5A_ENTRY_FREEZE_GATE_REGISTER.csv
          test ! -f work/hkcu_p5a_freeze/HKCU_P5A_ENTRY_FREEZE_PROPOSALS.csv || cat work/hkcu_p5a_freeze/HKCU_P5A_ENTRY_FREEZE_PROPOSALS.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hkcu-p5a-phase5-contract-entry-freeze
          path: |
            work/hkcu_p5a_freeze/HKCU_P5A_ENTRY_FREEZE_*
            work/hkcu_p5a_proposal/HKCU_P4_4_PROPOSAL_REVIEW_DECISION.json
            work/hkcu_p5a_scenarios/HKCU_P4_3_SCENARIO_TEST_DECISION.json
            work/hkcu_p5a_review/HKCU_P4_2_CONSTRUCTION_REVIEW_DECISION.json
            work/hkcu_p5a_fit/HKCU_P4_1_REASSESSMENT_DECISION.json
            work/hkcu_p5a_context/HKCU_P4_1R_DECISION.json
          if-no-files-found: error
