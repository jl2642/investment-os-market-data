name: Strategy Kernel Phase 3A Evidence Ledger

on:
  pull_request:
    paths:
      - 'strategy_kernel_v2/point_in_time_ledger.py'
      - 'strategy_kernel_v2/build_phase3a_ledger.py'
      - 'strategy_kernel_v2/validate_phase3a.py'
      - 'strategy_kernel_v2/PHASE3A_*.json'
      - 'strategy_kernel_v2/tests/test_phase3a.py'
      - 'strategy_kernel_v2/PROGRAM_STATE.json'
      - 'strategy_kernel_v2/CURRENT_PHASE_STATUS.json'
      - '.github/workflows/strategy-kernel-phase3a-evidence-ledger.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase3a-evidence-ledger:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Phase 3A regression tests
        run: python -m unittest strategy_kernel_v2.tests.test_phase3a
      - name: Validate Phase 3A acceptance contract
        run: python strategy_kernel_v2/validate_phase3a.py
      - name: Verify deterministic point-in-time rebuild
        run: |
          python - <<'PY'
          import hashlib
          import json
          from strategy_kernel_v2.build_phase3a_ledger import build

          def digest(value):
              payload = json.dumps(value, ensure_ascii=False, sort_keys=True, separators=(",", ":")).encode("utf-8")
              return hashlib.sha256(payload).hexdigest()

          first = digest(build())
          second = digest(build())
          assert first == second, "NON_DETERMINISTIC_LEDGER_REBUILD"
          print("PHASE3A_REBUILD_SHA256", first)
          PY
