name: R3 One-Shot Round 2 Final Dispatcher
run-name: "R3 one-shot dispatch of Round 2 Candidate loop"

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/r3-round2-final-dispatcher.yml"

permissions:
  actions: write
  contents: read

env:
  TRADE_AUTHORITY: NONE
  AUTHORIZED_HEAD: agent/r3-round2-final-dispatch-20260807

concurrency:
  group: r3-one-shot-round2-final-dispatch
  cancel-in-progress: false

jobs:
  dispatch-existing-round2:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/r3-round2-final-dispatch-20260807'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify one-shot authorization boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ github.base_ref }}" = "main"
          test "${{ github.head_ref }}" = "$AUTHORIZED_HEAD"
          test "$TRADE_AUTHORITY" = "NONE"

      - name: Dispatch existing Round 2 on current main
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          payload='{"ref":"main","inputs":{"force_weekly":"false"}}'
          code=$(curl -sS -o dispatch_response.txt -w '%{http_code}' \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/wp3_r_dynamic_candidate_loop.yml/dispatches" \
            -d "$payload")
          cat dispatch_response.txt || true
          test "$code" = "204"
          echo "round2_dispatch_http_status=$code" >> "$GITHUB_STEP_SUMMARY"

      - name: Record operating boundary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## R3 One-Shot Round 2 Final Dispatcher
          - Purpose: final production validation of the existing Round 2 Candidate loop against current Canonical main.
          - Target workflow: wp3_r_dynamic_candidate_loop.yml on main.
          - Input: force_weekly=false; normal due/no-op semantics preserved.
          - This PR must never be merged into main.
          - Candidate changes remain governed proposal/application only.
          - Simulation, real holdings, HK/HKCU and orders are outside scope.
          - trade_authority: NONE
          EOF
