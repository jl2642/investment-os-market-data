name: Strategy Kernel Program Consistency

on:
  pull_request:
    paths:
      - 'strategy_kernel_v2/**'
      - '.github/workflows/strategy-kernel-program-consistency.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  program-consistency:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate macro program contract
        run: python strategy_kernel_v2/program_consistency.py
      - name: Run program governance regression tests
        run: python -m unittest strategy_kernel_v2.tests.test_program_governance
