name: R2 Post-Merge Canonical Closure Repair
run-name: "R2 repair branch finalize canonical post-merge pointers"

on:
  push:
    branches: [agent/r2-post-merge-canonical-closure]
    paths:
      - ".r2_post_merge_repair_trigger"
      - ".github/workflows/r2_post_merge_repair_branch.yml"

permissions:
  contents: write

env:
  TRADE_AUTHORITY: NONE
  R2_MERGE_SHA: 33a5484f2ca919e80eef96a6750f801f751f8bdf

jobs:
  generate-validate-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: agent/r2-post-merge-canonical-closure

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Verify governed R2 merge
        run: |
          git fetch origin main
          git merge-base --is-ancestor "${R2_MERGE_SHA}" origin/main
          test "$(git show -s --format=%s "${R2_MERGE_SHA}")" = "R2: Portfolio Current, Candidate Refresh and Core2 hardening (#145)"

      - name: Generate post-merge canonical pointers
        run: |
          python automation/r2_integration/finalize_r2.py \
            --repo-root . \
            --mode post-merge \
            --pr-number 145 \
            --merge-sha "${R2_MERGE_SHA}"
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('investment_os_runtime/00_CONTROL/AUTHORITATIVE_ASSET_REGISTRY.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          payload['date'] = '2026-07-27'
          payload['status'] = 'GITHUB_CURRENT_R2_CAPABILITY_ACCEPTED_WP5_READY_PENDING_EXPLICIT_START_FILE_LIBRARY_PENDING'
          path.write_text(json.dumps(payload, ensure_ascii=False, indent=2, sort_keys=True, allow_nan=False) + '\n', encoding='utf-8')
          PY

      - name: Validate canonical closure and zero economic mutation
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path('.')
          sha = os.environ['R2_MERGE_SHA']
          r2 = json.loads((root / 'investment_os_runtime/00_CONTROL/R2_PRODUCT_CAPABILITY_ACCEPTANCE_CURRENT.json').read_text(encoding='utf-8'))
          execution = json.loads((root / 'investment_os_runtime/00_CONTROL/EXECUTION_REGISTER_CURRENT.json').read_text(encoding='utf-8'))
          registry = json.loads((root / 'investment_os_runtime/00_CONTROL/AUTHORITATIVE_ASSET_REGISTRY.json').read_text(encoding='utf-8'))
          gaps = json.loads((root / 'investment_os_runtime/00_CONTROL/WP2_WP4_CAPABILITY_GAP_REGISTER_CURRENT.json').read_text(encoding='utf-8'))
          status_text = (root / 'investment_os_runtime/00_CONTROL/R2_STATUS_CURRENT.md').read_text(encoding='utf-8')
          assert r2['status'] == 'R2_PRODUCT_CAPABILITY_HARDENING_ACCEPTED_ON_MAIN'
          assert r2['merge_sha'] == sha
          assert r2['wp5_status'] == 'READY_PENDING_EXPLICIT_WP5_START'
          assert r2['economic_mutations'] == {'real_account': 0, 'simulation': 0, 'candidate_membership': 0, 'orders': 0}
          assert r2['trade_authority'] == 'NONE'
          assert execution['current_step'] == 'R2_PRODUCT_CAPABILITY_HARDENING_ACCEPTED_ON_MAIN'
          assert execution['next_task'] == 'EXPLICITLY_START_WP5_PORTFOLIO_DECISION_PHASE'
          assert execution['overall_status'] == 'R2_ACCEPTED_ON_MAIN_WP5_READY_PENDING_EXPLICIT_START'
          assert execution['latest_governed_merge_sha'] == sha
          assert execution['github_merge_sha'] == sha
          assert execution['r2']['merge_sha'] == sha
          assert execution['r2']['status'] == 'R2_PRODUCT_CAPABILITY_HARDENING_ACCEPTED_ON_MAIN'
          assert execution['r2']['wp5_status'] == 'READY_PENDING_EXPLICIT_WP5_START'
          assert execution['wp5']['status'] == 'READY_PENDING_EXPLICIT_WP5_START'
          assert execution['wp5']['start_allowed'] is True
          assert execution['wp5']['action_review_allowed'] is False
          assert registry['registry_status'] == 'R2_CAPABILITY_ASSETS_ACCEPTED_ON_MAIN'
          assert registry['status'] == 'GITHUB_CURRENT_R2_CAPABILITY_ACCEPTED_WP5_READY_PENDING_EXPLICIT_START_FILE_LIBRARY_PENDING'
          assert registry['latest_governed_merge_sha'] == sha
          assert registry['github_merge_sha'] == sha
          assert gaps['status'] == 'R2_PRODUCT_CAPABILITY_HARDENING_ACCEPTED_ON_MAIN'
          assert gaps['next_task'] == 'EXPLICITLY_START_WP5_PORTFOLIO_DECISION_PHASE'
          assert gaps['wp5_gate'] == 'READY_PENDING_EXPLICIT_WP5_START'
          assert gaps['r2_closure']['wp5'] == 'READY_PENDING_EXPLICIT_WP5_START'
          assert gaps['r2_closure']['legacy_r1_gaps_blocking_wp5'] == 0
          assert all(gap['blocks_wp5'] is False for gap in gaps['gaps'])
          assert all(gap.get('r2_status') for gap in gaps['gaps'])
          assert 'Next task: `EXPLICITLY_START_WP5_PORTFOLIO_DECISION_PHASE`' in status_text
          print({'merge_sha': sha, 'r2': r2['status'], 'wp5': r2['wp5_status'], 'registry': registry['status'], 'mutations': 0})
          PY

      - name: Publish branch and remove temporary controls
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .r2_post_merge_repair_trigger .github/workflows/r2_post_merge_repair_branch.yml
          git add \
            investment_os_runtime/00_CONTROL/R2_PRODUCT_CAPABILITY_ACCEPTANCE_CURRENT.json \
            investment_os_runtime/00_CONTROL/R2_STATUS_CURRENT.md \
            investment_os_runtime/00_CONTROL/EXECUTION_REGISTER_CURRENT.json \
            investment_os_runtime/00_CONTROL/AUTHORITATIVE_ASSET_REGISTRY.json \
            investment_os_runtime/00_CONTROL/WP2_WP4_CAPABILITY_GAP_REGISTER_CURRENT.json
          git commit -m "R2 finalize canonical post-merge closure"
          git push origin HEAD:agent/r2-post-merge-canonical-closure
