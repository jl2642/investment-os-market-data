name: HKCU P4-3 Portfolio Construction Scenario Test

on:
  pull_request:
    paths:
      - 'config/hkcu_p4_3_portfolio_construction_scenario_test_contract.json'
      - 'pipeline/hkcu_p4_3_portfolio_construction_scenario_test.py'
      - 'scripts/validate_hkcu_p4_3_portfolio_construction_scenario_test.py'
      - 'tests/test_hkcu_p4_3_portfolio_construction_scenario_test.py'
      - 'docs/HKCU-P4-3_PORTFOLIO_CONSTRUCTION_SCENARIO_TEST.md'
      - '.github/workflows/hkcu-p4-3-portfolio-construction-scenario-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-and-scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q tests/test_hkcu_p4_3_portfolio_construction_scenario_test.py
      - name: Enforce isolated P4-3 scenario-test scope
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}"
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" > /tmp/p4_3_paths.txt
          cat /tmp/p4_3_paths.txt
          python - <<'PY'
          from pathlib import Path
          allowed = {
              'config/hkcu_p4_3_portfolio_construction_scenario_test_contract.json',
              'pipeline/hkcu_p4_3_portfolio_construction_scenario_test.py',
              'scripts/validate_hkcu_p4_3_portfolio_construction_scenario_test.py',
              'tests/test_hkcu_p4_3_portfolio_construction_scenario_test.py',
              'docs/HKCU-P4-3_PORTFOLIO_CONSTRUCTION_SCENARIO_TEST.md',
              '.github/workflows/hkcu-p4-3-portfolio-construction-scenario-test.yml',
          }
          actual = {x.strip() for x in Path('/tmp/p4_3_paths.txt').read_text().splitlines() if x.strip()}
          bad = sorted(actual - allowed)
          if bad:
              raise SystemExit('P4_3_SCOPE_VIOLATION:' + ','.join(bad))
          protected = ('outputs/hk_candidate/', 'outputs/simulation/', 'outputs/real', 'investment_os_runtime/30_STATE_CURRENT/', 'orders/')
          mutations = sorted(x for x in actual if x.startswith(protected))
          if mutations:
              raise SystemExit('P4_3_PROTECTED_PATH_MUTATION:' + ','.join(mutations))
          PY

  real-scenario-test:
    needs: unit-and-scope
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Rebuild and validate accepted P4-1R context
        run: |
          rm -rf work/hkcu_p4_3_context work/hkcu_p4_3_fit work/hkcu_p4_3_review work/hkcu_p4_3_scenarios
          python -m pipeline.hkcu_p4_1r_canonical_data_adapter --repo-root . --output work/hkcu_p4_3_context
          python scripts/validate_hkcu_p4_1r_portfolio_context_completion.py --repo-root . --output work/hkcu_p4_3_context
      - name: Rebuild and validate accepted P4-1 Portfolio Fit reassessment
        run: |
          python -m pipeline.hkcu_p4_1_portfolio_fit_reassessment_decision_adapter \
            --repo-root . \
            --context-dir work/hkcu_p4_3_context \
            --output work/hkcu_p4_3_fit
          python scripts/validate_hkcu_p4_1_portfolio_fit_reassessment.py \
            --repo-root . \
            --context-dir work/hkcu_p4_3_context \
            --output work/hkcu_p4_3_fit
      - name: Rebuild and validate accepted P4-2 construction review
        run: |
          python -m pipeline.hkcu_p4_2_portfolio_construction_review_decision_adapter \
            --repo-root . \
            --context-dir work/hkcu_p4_3_context \
            --fit-dir work/hkcu_p4_3_fit \
            --output work/hkcu_p4_3_review
          python scripts/validate_hkcu_p4_2_portfolio_construction_review.py \
            --repo-root . \
            --context-dir work/hkcu_p4_3_context \
            --fit-dir work/hkcu_p4_3_fit \
            --output work/hkcu_p4_3_review
      - name: Execute P4-3 Portfolio Construction Scenario Test
        run: |
          python -m pipeline.hkcu_p4_3_portfolio_construction_scenario_test \
            --repo-root . \
            --p4-2-dir work/hkcu_p4_3_review \
            --output work/hkcu_p4_3_scenarios
      - name: Independently validate P4-3 Scenario Test
        run: |
          python scripts/validate_hkcu_p4_3_portfolio_construction_scenario_test.py \
            --repo-root . \
            --p4-2-dir work/hkcu_p4_3_review \
            --output work/hkcu_p4_3_scenarios
      - name: Render scenario decision and summary
        if: always()
        run: |
          test ! -f work/hkcu_p4_3_scenarios/HKCU_P4_3_SCENARIO_TEST_DECISION.json || cat work/hkcu_p4_3_scenarios/HKCU_P4_3_SCENARIO_TEST_DECISION.json
          test ! -f work/hkcu_p4_3_scenarios/HKCU_P4_3_SCENARIO_TEST_QUALITY_REPORT.json || cat work/hkcu_p4_3_scenarios/HKCU_P4_3_SCENARIO_TEST_QUALITY_REPORT.json
          test ! -f work/hkcu_p4_3_scenarios/HKCU_P4_3_SCENARIO_TEST_SCENARIO_SUMMARY.csv || cat work/hkcu_p4_3_scenarios/HKCU_P4_3_SCENARIO_TEST_SCENARIO_SUMMARY.csv
          test ! -f work/hkcu_p4_3_scenarios/HKCU_P4_3_SCENARIO_TEST_AH_SUBSTITUTION_OPTIONS.csv || cat work/hkcu_p4_3_scenarios/HKCU_P4_3_SCENARIO_TEST_AH_SUBSTITUTION_OPTIONS.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hkcu-p4-3-portfolio-construction-scenario-test
          path: |
            work/hkcu_p4_3_scenarios/HKCU_P4_3_SCENARIO_TEST_*
            work/hkcu_p4_3_review/HKCU_P4_2_CONSTRUCTION_REVIEW_DECISION.json
            work/hkcu_p4_3_fit/HKCU_P4_1_REASSESSMENT_DECISION.json
            work/hkcu_p4_3_context/HKCU_P4_1R_DECISION.json
          if-no-files-found: error
