name: FMDL 5A Official Source Discovery

on:
  pull_request:
    paths:
      - "scripts/fmdl5a_discover_official_sources.py"
      - ".github/workflows/fmdl-5a-source-discovery.yml"
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests beautifulsoup4
      - run: python -m py_compile scripts/fmdl5a_discover_official_sources.py
      - run: python scripts/fmdl5a_discover_official_sources.py --output outputs/fmdl5a/source_discovery
      - uses: actions/upload-artifact@v4
        with:
          name: fmdl5a-source-discovery
          path: outputs/fmdl5a/source_discovery
          if-no-files-found: error
