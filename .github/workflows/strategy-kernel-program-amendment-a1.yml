name: Strategy Kernel Program Amendment A1

on:
  pull_request:
    paths:
      - "strategy_kernel_v2/**"
      - ".github/workflows/strategy-kernel-program-amendment-a1.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  TRADE_AUTHORITY: NONE

jobs:
  validate-amendment-a1:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Validate existing program consistency
        run: python strategy_kernel_v2/program_consistency.py
      - name: Validate Amendment A1
        run: python strategy_kernel_v2/validate_program_amendment_a1.py
      - name: Run Amendment A1 regression
        run: python -m unittest strategy_kernel_v2.tests.test_program_amendment_a1 -v
      - name: Revalidate frozen Phase 4 v1 contract
        run: python -m strategy_kernel_v2.validate_phase4_forward_shadow_contract
      - name: Record zero-mutation boundary
        run: |
          echo "Program Amendment A1 freezes the Phase 4 production-reconciliation plan only." >> "$GITHUB_STEP_SUMMARY"
          echo "Forward observations=0; realized outcomes=0; protected economic mutations=0; orders=0; trade_authority=NONE." >> "$GITHUB_STEP_SUMMARY"
