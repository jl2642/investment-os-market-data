name: FMDL 2A Historical Source Benchmark

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - config/fmdl2_factor_registry.json
      - docs/FMDL-2A_FACTOR_CONTRACT.md
      - docs/FMDL-2A_BENCHMARK_PLAN.md
      - scripts/benchmark_historical_sources.py
      - tests/test_fmdl2a_contract.py
      - .github/workflows/fmdl-2a-benchmark.yml
  pull_request:
    branches: [main]
    paths:
      - config/fmdl2_factor_registry.json
      - docs/FMDL-2A_FACTOR_CONTRACT.md
      - docs/FMDL-2A_BENCHMARK_PLAN.md
      - scripts/benchmark_historical_sources.py
      - tests/test_fmdl2a_contract.py
      - .github/workflows/fmdl-2a-benchmark.yml

permissions:
  contents: write

concurrency:
  group: fmdl-2a-benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Validate accepted FMDL-1 interface
        run: python scripts/validate_investment_os_interface.py

      - name: Run deterministic contract tests
        run: pytest -q tests/test_fmdl2a_contract.py

      - name: Run real free-source benchmark
        id: benchmark
        shell: bash
        run: |
          set +e
          mkdir -p diagnostics
          python scripts/benchmark_historical_sources.py \
            --timeout-seconds 15 \
            --pause-seconds 0.15 \
            --fallback-scale-size 40 \
            2>&1 | tee diagnostics/FMDL2A_BENCHMARK_LOG.txt
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fmdl-2a-historical-source-benchmark
          path: |
            outputs/benchmark/fmdl2a/
            diagnostics/FMDL2A_BENCHMARK_LOG.txt
          if-no-files-found: error
          retention-days: 14

      - name: Commit benchmark evidence
        if: github.event_name == 'push'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/benchmark/fmdl2a
          if git diff --cached --quiet; then
            echo "No benchmark evidence to commit"
          else
            git commit -m "data: FMDL-2A historical source benchmark [skip ci]"
            git push
          fi

      - name: Enforce benchmark readiness
        if: steps.benchmark.outputs.exit_code != '0'
        run: |
          echo "Benchmark did not identify a production-ready or conditional free route."
          exit ${{ steps.benchmark.outputs.exit_code }}
