name: FMDL 6X1-A Dual Activation Contract

on:
  pull_request:
    paths:
      - 'config/fmdl6x1a_existing_pilot_audit_dual_activation_contract.json'
      - 'schemas/fmdl6x1a_dual_activation_contract_v1.schema.json'
      - 'docs/FMDL-6X1-A_EXISTING_PILOT_AUDIT_AND_DUAL_ACTIVATION_CONTRACT.md'
      - 'docs/FMDL-6X1_FULL_EXECUTION_PLAN.md'
      - 'scripts/validate_fmdl6x1a_contract.py'
      - 'tests/test_fmdl6x1a_contract.py'
      - '.github/workflows/fmdl-6x1a-dual-activation-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate contract
        run: python scripts/validate_fmdl6x1a_contract.py
      - name: Run regression tests
        run: python -m unittest tests/test_fmdl6x1a_contract.py -v
      - name: Compile validator
        run: python -m py_compile scripts/validate_fmdl6x1a_contract.py
