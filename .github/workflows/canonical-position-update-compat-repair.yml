name: Canonical Position Update Compatibility Repair

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

env:
  TRADE_AUTHORITY: NONE

jobs:
  repair:
    if: startsWith(github.head_ref, 'agent/2026-08-04-position-equity-comp-update')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: automation/wp2_r/requirements.lock

      - name: Determine whether compatibility repair is required
        id: guard
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          payload = json.loads(Path('investment_os_runtime/30_STATE_CURRENT/10_REAL_ACCOUNT/REAL_ACCOUNT_CURRENT.json').read_text(encoding='utf-8'))
          print('run=' + ('false' if payload.get('canonical_position_update_compatibility_status') == 'WP2_R_COMPATIBLE' else 'true'))
          PY

      - name: Install WP2-R validation runtime
        if: steps.guard.outputs.run == 'true'
        run: python -m pip install --retries 5 --timeout 30 -r automation/wp2_r/requirements.lock

      - name: Repair legacy sources and regenerate standard Current
        if: steps.guard.outputs.run == 'true'
        run: python automation/canonical_position_update/compat_repair.py

      - name: Run existing WP2-R unit tests
        if: steps.guard.outputs.run == 'true'
        run: pytest -q automation/wp2_r/tests

      - name: Run audited position validator
        if: steps.guard.outputs.run == 'true'
        run: python automation/canonical_position_update/validate.py

      - name: Commit repaired Canonical interfaces
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            investment_os_runtime/00_CONTROL/WP2_R_PORTFOLIO_CURRENT_ACCEPTANCE_RECORD.json \
            investment_os_runtime/30_STATE_CURRENT/10_REAL_ACCOUNT/REAL_ACCOUNT_CURRENT.json \
            investment_os_runtime/30_STATE_CURRENT/10_REAL_ACCOUNT/REAL_ACCOUNT_POSITIONS_CURRENT.json \
            investment_os_runtime/30_STATE_CURRENT/15_PORTFOLIO_INPUT/USER_TRANSACTION_DELTA_LEDGER_CURRENT.json \
            investment_os_runtime/30_STATE_CURRENT/20_SIMULATION/SIMULATION_LEDGER_CURRENT.json \
            investment_os_runtime/30_STATE_CURRENT/20_SIMULATION/SIMULATION_POSITIONS_CURRENT.json \
            investment_os_runtime/30_STATE_CURRENT/25_PORTFOLIO_MARKS/PORTFOLIO_MARKS_CURRENT.json \
            investment_os_runtime/30_STATE_CURRENT/70_OPERATIONS/PORTFOLIO_CURRENT_RUN_CURRENT.json \
            investment_os_runtime/40_EVIDENCE_AND_LINEAGE/WP2_R/PORTFOLIO_MARKS_REFRESH_CANDIDATE.json
          git commit -m "Repair 2026-08-04 position update for WP2-R compatibility"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

      - name: Record no-op on already repaired branch
        if: steps.guard.outputs.run != 'true'
        run: echo "WP2-R compatibility repair already materialized; no mutation performed."
