name: WP5-B Position Review Materialization

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/wp5_position_review_materialize.yml"
      - "automation/wp5_portfolio_decision/build_wp5_position_review.py"

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'agent/wp5-portfolio-decision-start' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Build and validate full position review
        run: |
          python automation/wp5_portfolio_decision/build_wp5_position_review.py --repo-root .
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('.')
          review = json.loads((root / 'investment_os_runtime/30_STATE_CURRENT/60_DECISIONS/WP5_POSITION_REVIEW_CURRENT.json').read_text(encoding='utf-8'))
          decision = json.loads((root / 'investment_os_runtime/30_STATE_CURRENT/60_DECISIONS/WP5_PORTFOLIO_DECISION_CURRENT.json').read_text(encoding='utf-8'))
          assert len(review['real_account']['positions']) == 7
          assert len(review['simulation']['positions']) == 16
          assert review['simulation']['wp4b_hardened_position_count'] == 2
          assert review['simulation']['non_wp4b_position_count'] == 14
          assert {row['security_id'] for row in review['simulation']['positions'] if row['review_priority'].startswith('P0_')} == {'300124.SZ', '300750.SZ', '601138.SH'}
          assert review['economic_mutations'] == {'real_account': 0, 'simulation': 0, 'candidate_membership': 0, 'orders': 0}
          assert decision['full_position_review_complete'] is True
          assert decision['trade_authority'] == 'NONE'
          PY

      - name: Commit governed review products
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            investment_os_runtime/30_STATE_CURRENT/60_DECISIONS/WP5_POSITION_REVIEW_CURRENT.json \
            investment_os_runtime/30_STATE_CURRENT/60_DECISIONS/WP5_PORTFOLIO_DECISION_CURRENT.json \
            investment_os_runtime/30_STATE_CURRENT/60_DECISIONS/WP5_USER_DECISION_QUEUE_CURRENT.json \
            investment_os_runtime/00_CONTROL/EXECUTION_REGISTER_CURRENT.json \
            investment_os_runtime/00_CONTROL/AUTHORITATIVE_ASSET_REGISTRY.json
          git commit -m "WP5-B publish full position review baseline"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
