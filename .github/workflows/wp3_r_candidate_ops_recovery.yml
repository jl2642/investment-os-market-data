name: WP3-R Candidate Operations Limited Recovery
run-name: "WP3-R one-time Candidate operating refresh and publication acceptance"

on:
  push:
    branches: [main]
    paths: &candidate_recovery_paths
      - ".github/workflows/wp3_r_candidate_ops_recovery.yml"
      - ".github/workflows/wp3_r_candidate_current_promotion.yml"
      - ".github/workflows/wp3_r_candidate_price_ledger.yml"
      - ".github/workflows/wp3_r_weekly_screen.yml"
      - ".github/workflows/wp3_r_monthly_review.yml"
      - ".github/workflows/wp3_r_quarterly_rescreen.yml"
      - "automation/wp3_r/publish_current_safely.sh"
      - "automation/wp3_r/rebuild_operating_current.sh"
      - "automation/wp3_r/refresh_candidate_market_screen.py"
  pull_request:
    branches: [main]
    paths: *candidate_recovery_paths
  workflow_dispatch:
    inputs:
      validation_only:
        description: "Validate the frozen generated Candidate Current on this exact Head without reacquiring market data"
        required: false
        default: false
        type: boolean

permissions:
  actions: write
  contents: write

env:
  TRADE_AUTHORITY: NONE

jobs:
  recover-candidate-operations:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            automation/wp3_r/requirements.lock
            automation/wp3_3_4/requirements.lock

      - name: Install runtimes
        run: |
          python -m pip install --retries 5 --timeout 30 -r automation/wp3_r/requirements.lock
          python -m pip install --retries 5 --timeout 30 -r automation/wp3_3_4/requirements.lock

      - name: Resolve completed Candidate market session
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.validation_only != true }}
        id: session
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from datetime import date, datetime, time
          from zoneinfo import ZoneInfo

          from automation.wp3_r.refresh_candidate_price_ledger import BENCHMARK_ID, fetch_quotes

          cn = ZoneInfo('Asia/Shanghai')
          now = datetime.now(cn)
          quotes = fetch_quotes([BENCHMARK_ID])
          if len(quotes) != 1:
              raise SystemExit('BENCHMARK_SESSION_QUOTE_NOT_UNIQUE')
          quote = quotes[0]
          trade_date = date.fromisoformat(str(quote['trade_date']))
          quote_time = time.fromisoformat(str(quote['quote_time']))
          if trade_date > now.date():
              raise SystemExit(f'FUTURE_BENCHMARK_SESSION:{trade_date}:{now.date()}')
          completed = trade_date < now.date() or (
              trade_date == now.date()
              and quote_time >= time(15, 0)
              and now.time() >= time(15, 5)
          )
          print(f"completed={'true' if completed else 'false'}")
          print(f"session_date={trade_date.isoformat()}")
          print(f"quote_time={quote_time.isoformat()}")
          print(f"checked_at_cn={now.isoformat()}")
          print(f"classification={'COMPLETED_SESSION' if completed else 'INCOMPLETE_CURRENT_SESSION'}")
          PY

      - name: Record incomplete-session no-op
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.validation_only != true) && steps.session.outputs.completed != 'true' }}
        run: |
          test -z "$(git status --porcelain)"
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## WP3-R Candidate Operations No-op
          - Benchmark session: ${{ steps.session.outputs.session_date }}
          - Benchmark quote time: ${{ steps.session.outputs.quote_time }} Asia/Shanghai
          - Classification: ${{ steps.session.outputs.classification }}
          - Candidate Current was not rebuilt or published before the completed-session gate.
          - Candidate membership, portfolios and orders remained unchanged.
          - trade_authority: NONE
          EOF

      - name: Refresh Core ledger and all Candidate operating Current products
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.validation_only != true) && steps.session.outputs.completed == 'true' }}
        run: |
          AS_OF="$(date -u +%F)"
          python automation/wp3_r/refresh_candidate_price_ledger.py --repo-root .
          bash automation/wp3_r/rebuild_operating_current.sh "$AS_OF"
          python automation/wp3_r/build_candidate_cadence.py --repo-root . --mode monthly --as-of "$AS_OF"

      - name: Evaluate financial-report watermark
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.validation_only != true) && steps.session.outputs.completed == 'true' }}
        id: gate
        shell: bash
        run: |
          set -Eeuo pipefail
          AS_OF="$(date -u +%F)"
          python automation/wp3_r/build_candidate_cadence.py --repo-root . --mode quarterly-gate --as-of "$AS_OF"
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          state = json.loads(Path('investment_os_runtime/30_STATE_CURRENT/45_CANDIDATE_OPERATIONS/QUARTERLY_FINANCIAL_RESCREEN_CURRENT.json').read_text(encoding='utf-8'))
          period = state.get('latest_report_period_observed') or 'UNKNOWN'
          proposal_dir = f"investment_os_runtime/40_EVIDENCE_AND_LINEAGE/WP3_R/QUARTERLY_PROPOSALS/WP3R_FINANCIAL_RESCREEN_{period.replace('-', '')}"
          print(f"run_rescreen={'true' if state['run_full_rescreen_proposal'] else 'false'}")
          print(f"proposal_dir={proposal_dir}")
          PY

      - name: Build governed full-market rescreen proposal when a new report watermark exists
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.validation_only != true) && steps.session.outputs.completed == 'true' && steps.gate.outputs.run_rescreen == 'true' }}
        run: |
          AS_OF="$(date -u +%F)"
          python automation/wp3_3_4/build_milestone_v4.py \
            --repo-root . \
            --config automation/wp3_3_4/config.json \
            --output-dir "${{ steps.gate.outputs.proposal_dir }}"
          python automation/wp3_r/build_candidate_cadence.py \
            --repo-root . \
            --mode quarterly-complete \
            --as-of "$AS_OF" \
            --proposal-dir "${{ steps.gate.outputs.proposal_dir }}"

      - name: Finalize refreshed products and validate recovery boundary
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.validation_only != true) && steps.session.outputs.completed == 'true' }}
        run: |
          AS_OF="$(date -u +%F)"
          python automation/wp3_r/build_candidate_cadence.py --repo-root . --mode finalize-acceptance --as-of "$AS_OF"
          python - <<'PY'
          import json
          from datetime import date, datetime, time
          from pathlib import Path
          from zoneinfo import ZoneInfo

          root = Path('.')
          candidate = json.loads((root / 'investment_os_runtime/30_STATE_CURRENT/40_CANDIDATE/CANDIDATE_CURRENT.json').read_text(encoding='utf-8'))
          run = json.loads((root / 'investment_os_runtime/70_ATTRIBUTION_AND_CALIBRATION/CANDIDATE_PRICE_LEDGER_RUN_CURRENT.json').read_text(encoding='utf-8'))
          weekly = json.loads((root / 'investment_os_runtime/30_STATE_CURRENT/45_CANDIDATE_OPERATIONS/WEEKLY_PRICE_SCREEN_CURRENT.json').read_text(encoding='utf-8'))
          market_run = json.loads((root / 'investment_os_runtime/40_EVIDENCE_AND_LINEAGE/WP3_R/CANDIDATE_MARKET_SCREEN_RUN_CURRENT.json').read_text(encoding='utf-8'))
          monthly = json.loads((root / 'investment_os_runtime/30_STATE_CURRENT/45_CANDIDATE_OPERATIONS/MONTHLY_CANDIDATE_REVIEW_CURRENT.json').read_text(encoding='utf-8'))
          quarterly = json.loads((root / 'investment_os_runtime/30_STATE_CURRENT/45_CANDIDATE_OPERATIONS/QUARTERLY_FINANCIAL_RESCREEN_CURRENT.json').read_text(encoding='utf-8'))
          outcome = json.loads((root / 'investment_os_runtime/70_ATTRIBUTION_AND_CALIBRATION/CANDIDATE_OUTCOME_CURRENT.json').read_text(encoding='utf-8'))

          session = date.fromisoformat(weekly['as_of_date'])
          generated_cn = datetime.fromisoformat(market_run['generated_at']).astimezone(ZoneInfo('Asia/Shanghai'))
          if session == generated_cn.date():
              assert generated_cn.time() >= time(15, 5), (session, generated_cn.isoformat())
          assert candidate['counts']['candidate_core'] == 2
          assert candidate['counts']['research_queue'] == 33
          assert candidate['counts']['shadow_track'] == 38
          assert candidate['counts']['ready_for_user_decision'] == 0
          assert run['latest_trade_date'] == market_run['accepted_session']
          assert 0 <= (date.today() - session).days <= 4
          assert run['candidate_membership_mutations'] == 0
          assert run['portfolio_mutations'] == 0
          assert run['orders'] == 0
          assert weekly['tracked_count'] == weekly['covered_count'] == 73
          assert weekly['as_of_date'] == market_run['accepted_session']
          assert weekly['candidate_membership_mutations'] == 0
          assert monthly['review_month'] == date.today().strftime('%Y-%m')
          assert monthly['automatic_candidate_membership_mutations'] == 0
          assert quarterly['as_of_date'] == date.today().isoformat()
          assert quarterly['candidate_membership_mutations'] == 0
          assert quarterly['portfolio_mutations'] == 0
          assert outcome['alpha_claim_allowed'] is False
          assert outcome['required_windows'] == [20, 60, 120]
          assert all(obj.get('trade_authority') == 'NONE' for obj in (run, weekly, market_run, monthly, quarterly, outcome))
          print({
              'mode': 'LIVE_REFRESH_AND_VALIDATE',
              'candidate_counts': candidate['counts'],
              'latest_trade_date': run['latest_trade_date'],
              'weekly_as_of': weekly['as_of_date'],
              'monthly_review': monthly['review_month'],
              'quarterly_status': quarterly['status'],
              'mutations': 0,
              'orders': 0,
          })
          PY
          git fetch origin main
          git diff --exit-code origin/main -- investment_os_runtime/30_STATE_CURRENT/40_CANDIDATE/CANDIDATE_CURRENT.json

      - name: Validate frozen generated Candidate Current on exact Head
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.validation_only == true }}
        run: |
          python - <<'PY'
          import json
          from datetime import date, datetime, time
          from pathlib import Path
          from zoneinfo import ZoneInfo

          root = Path('.')
          load = lambda path: json.loads((root / path).read_text(encoding='utf-8'))
          candidate = load('investment_os_runtime/30_STATE_CURRENT/40_CANDIDATE/CANDIDATE_CURRENT.json')
          run = load('investment_os_runtime/70_ATTRIBUTION_AND_CALIBRATION/CANDIDATE_PRICE_LEDGER_RUN_CURRENT.json')
          weekly = load('investment_os_runtime/30_STATE_CURRENT/45_CANDIDATE_OPERATIONS/WEEKLY_PRICE_SCREEN_CURRENT.json')
          market_run = load('investment_os_runtime/40_EVIDENCE_AND_LINEAGE/WP3_R/CANDIDATE_MARKET_SCREEN_RUN_CURRENT.json')
          monthly = load('investment_os_runtime/30_STATE_CURRENT/45_CANDIDATE_OPERATIONS/MONTHLY_CANDIDATE_REVIEW_CURRENT.json')
          quarterly = load('investment_os_runtime/30_STATE_CURRENT/45_CANDIDATE_OPERATIONS/QUARTERLY_FINANCIAL_RESCREEN_CURRENT.json')
          outcome = load('investment_os_runtime/70_ATTRIBUTION_AND_CALIBRATION/CANDIDATE_OUTCOME_CURRENT.json')
          acceptance = load('investment_os_runtime/00_CONTROL/WP3_R_CANDIDATE_REFRESH_ACCEPTANCE_RECORD.json')

          session = date.fromisoformat(weekly['as_of_date'])
          quarterly_date = date.fromisoformat(quarterly['as_of_date'])
          generated_cn = datetime.fromisoformat(market_run['generated_at']).astimezone(ZoneInfo('Asia/Shanghai'))
          if session == generated_cn.date():
              assert generated_cn.time() >= time(15, 5), (session, generated_cn.isoformat())
          assert candidate['counts']['candidate_core'] == 2
          assert candidate['counts']['research_queue'] == 33
          assert candidate['counts']['shadow_track'] == 38
          assert candidate['counts']['ready_for_user_decision'] == 0
          assert run['status'] == 'PASS_PRICE_LEDGER_CURRENT'
          assert run['latest_trade_date'] == market_run['accepted_session'] == weekly['as_of_date']
          assert 0 <= (date.today() - session).days <= 4
          assert market_run['status'] == 'PASS_CANDIDATE_MARKET_SCREEN_CURRENT'
          assert market_run['tracked_count'] == market_run['covered_count'] == 73
          assert weekly['status'] == 'PASS_WEEKLY_PRICE_SCREEN_NO_MEMBERSHIP_MUTATION'
          assert weekly['tracked_count'] == weekly['covered_count'] == 73
          assert monthly['review_month'] == date.today().strftime('%Y-%m')
          assert monthly['status'] in {'MONTHLY_REVIEW_COMPLETE_NO_AUTOMATIC_MEMBERSHIP_CHANGE', 'NOOP_ALREADY_REVIEWED_THIS_MONTH'}
          assert 0 <= (date.today() - quarterly_date).days <= 4
          assert quarterly['status'] in {
              'BASELINE_INSTALLED_NO_RETROACTIVE_RERUN',
              'NO_NEW_FINANCIAL_WATERMARK_NO_RERUN',
              'READY_FOR_QUARTERLY_FULL_RESCREEN_PROPOSAL',
              'QUARTERLY_FULL_RESCREEN_PROPOSAL_COMPLETE_HUMAN_MERGE_REQUIRED',
          }
          assert outcome['alpha_claim_allowed'] is False
          assert outcome['required_windows'] == [20, 60, 120]
          assert acceptance['status'] == 'WP3R_CONTINUOUS_CANDIDATE_ENGINE_CAPABILITY_ACCEPTED'
          assert acceptance['continuous_candidate_engine_complete'] is True
          assert acceptance['wp4b_unblocked'] is True
          assert acceptance['wp5_unblocked'] is False

          objects = (run, weekly, market_run, monthly, quarterly, outcome, acceptance)
          assert all(obj.get('trade_authority') == 'NONE' for obj in objects)
          assert run['candidate_membership_mutations'] == 0
          assert run['portfolio_mutations'] == 0
          assert run['orders'] == 0
          assert weekly['candidate_membership_mutations'] == 0
          assert market_run['candidate_membership_mutations'] == 0
          assert market_run['research_object_mutations'] == 0
          assert market_run['portfolio_mutations'] == 0
          assert monthly['automatic_candidate_membership_mutations'] == 0
          assert monthly['automatic_research_object_mutations'] == 0
          assert monthly['portfolio_mutations'] == 0
          assert quarterly['candidate_membership_mutations'] == 0
          assert quarterly['research_object_mutations'] == 0
          assert quarterly['portfolio_mutations'] == 0
          assert acceptance['candidate_membership_mutations'] == 0
          assert acceptance['research_object_mutations'] == 0
          assert acceptance['portfolio_mutations'] == 0
          order_objects = (run, weekly, market_run, monthly, quarterly, acceptance)
          assert all(obj['orders'] == 0 for obj in order_objects)
          assert 'orders' not in outcome

          print({
              'mode': 'FROZEN_EXACT_HEAD_VALIDATION_NO_NETWORK',
              'candidate_counts': candidate['counts'],
              'accepted_session': market_run['accepted_session'],
              'coverage': market_run['covered_count'],
              'acceptance_status': acceptance['status'],
              'mutations': 0,
              'orders': 0,
              'trade_authority': 'NONE',
          })
          PY
          git fetch origin main
          git diff --exit-code origin/main -- investment_os_runtime/30_STATE_CURRENT/40_CANDIDATE/CANDIDATE_CURRENT.json

      - name: Publish recovered Candidate operating Current products
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && inputs.validation_only != true && steps.session.outputs.completed == 'true' }}
        run: |
          bash automation/wp3_r/publish_current_safely.sh \
            "WP3-R recover Candidate operating Current through latest completed market close" \
            investment_os_runtime/70_ATTRIBUTION_AND_CALIBRATION/CANDIDATE_PRICE_LEDGER.jsonl \
            investment_os_runtime/70_ATTRIBUTION_AND_CALIBRATION/CANDIDATE_PRICE_LEDGER_RUN_CURRENT.json \
            investment_os_runtime/70_ATTRIBUTION_AND_CALIBRATION/CANDIDATE_OUTCOME_CURRENT.json \
            investment_os_runtime/30_STATE_CURRENT/45_CANDIDATE_OPERATIONS/WEEKLY_PRICE_SCREEN_CURRENT.json \
            investment_os_runtime/30_STATE_CURRENT/45_CANDIDATE_OPERATIONS/MONTHLY_CANDIDATE_REVIEW_CURRENT.json \
            investment_os_runtime/30_STATE_CURRENT/45_CANDIDATE_OPERATIONS/QUARTERLY_FINANCIAL_RESCREEN_CURRENT.json \
            investment_os_runtime/30_STATE_CURRENT/45_CANDIDATE_OPERATIONS/CANDIDATE_REFRESH_CURRENT.json \
            investment_os_runtime/40_EVIDENCE_AND_LINEAGE/WP3_R/CANDIDATE_MARKET_SCREEN_RUN_CURRENT.json \
            investment_os_runtime/40_EVIDENCE_AND_LINEAGE/WP3_R/FINANCIAL_REPORT_FRESHNESS_CURRENT.json \
            investment_os_runtime/00_CONTROL/WP3_R_CANDIDATE_REFRESH_ACCEPTANCE_RECORD.json \
            "${{ steps.gate.outputs.proposal_dir }}"

      - name: Dispatch governed Candidate Current promotion
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && inputs.validation_only != true && steps.session.outputs.completed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run wp3_r_candidate_current_promotion.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main

      - name: Record recovery summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## WP3-R Candidate Operations Limited Recovery
          - Live refresh first proves that the provider date/time represents a completed China A-share session.
          - Pre-close or opening-period runs finish as clean no-ops and cannot publish intraday data as market-close Current.
          - Completed-session mode rebuilds the Core ledger, dated 73-name market screen, monthly review and report-watermark gate.
          - Frozen validation verifies the exact generated Head without reacquiring market data and rejects same-day snapshots generated before 15:05 Asia/Shanghai.
          - Generated products publish only to the rolling automation branch and enter protected main through a governed PR.
          - Candidate membership, Research Objects, portfolios and orders remain unchanged.
          - trade_authority: NONE
          EOF
