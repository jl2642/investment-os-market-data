name: FMDL 7C Portfolio Simulation Attribution and Rule Calibration Acceptance

on:
  pull_request:
    paths:
      - 'config/fmdl7c_portfolio_attribution_contract.json'
      - 'schemas/fmdl7c_portfolio_attribution_contract_v1.schema.json'
      - 'scripts/fmdl7c_portfolio_attribution.py'
      - 'tests/test_fmdl7c_portfolio_attribution.py'
      - 'docs/FMDL-7C_*.md'
      - '.github/workflows/fmdl-7c-portfolio-attribution.yml'
  push:
    branches: [main]
    paths:
      - 'config/fmdl7c_portfolio_attribution_contract.json'
      - 'schemas/fmdl7c_portfolio_attribution_contract_v1.schema.json'
      - 'scripts/fmdl7c_portfolio_attribution.py'
      - 'tests/test_fmdl7c_portfolio_attribution.py'
      - 'docs/FMDL-7C_*.md'
      - '.github/workflows/fmdl-7c-portfolio-attribution.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fmdl-7c-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Contract and regression tests
        run: python -m unittest tests/test_fmdl7c_portfolio_attribution.py
      - name: Compile producer and tests
        run: python -m py_compile scripts/fmdl7c_portfolio_attribution.py tests/test_fmdl7c_portfolio_attribution.py
      - name: Validate source bindings and fail-closed authority
        run: python scripts/fmdl7c_portfolio_attribution.py validate

  production:
    needs: quality-gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Freeze run timestamp and source commit
        run: |
          echo "RUN_TS=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
          echo "SOURCE_COMMIT=${GITHUB_SHA}" >> "$GITHUB_ENV"
      - name: Build FMDL-7C candidate
        run: |
          python scripts/fmdl7c_portfolio_attribution.py build \
            --output build/fmdl7c_candidate \
            --generated-at "$RUN_TS" \
            --source-commit "$SOURCE_COMMIT"
      - name: Independent same-input byte replay
        run: |
          python scripts/fmdl7c_portfolio_attribution.py build \
            --output build/fmdl7c_replay \
            --generated-at "$RUN_TS" \
            --source-commit "$SOURCE_COMMIT"
          diff -qr build/fmdl7c_candidate build/fmdl7c_replay
      - uses: actions/upload-artifact@v4
        with:
          name: fmdl7c-portfolio-attribution-candidate
          path: build/fmdl7c_candidate
          if-no-files-found: error
      - name: Publish Current immutable Release normalized and pointers
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python scripts/fmdl7c_portfolio_attribution.py publish --candidate build/fmdl7c_candidate
      - name: Commit accepted FMDL-7C state
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/fmdl7 datasets/fmdl7 outputs/status/FMDL7C_LAST_SUCCESS.json outputs/status/FMDL7_PORTFOLIO_ATTRIBUTION_LKG.json
          if git diff --cached --quiet; then
            echo "No publication changes"
          else
            git commit -m "data: publish FMDL-7C portfolio attribution and rule calibration [skip ci]"
            git push origin HEAD:main
          fi
