name: FMDL 4C Investment OS Re-entry and State Controls

on:
  pull_request:
    branches: [main]
    paths:
      - "config/fmdl4c_reentry_controls.json"
      - "schemas/fmdl4c_*.schema.json"
      - "docs/FMDL-4C_*.md"
      - "scripts/fmdl4c_core.py"
      - "scripts/run_fmdl4c_reentry.py"
      - "scripts/validate_fmdl4c_candidate.py"
      - "scripts/publish_fmdl4c_reentry.py"
      - "tests/test_fmdl4c_reentry.py"
      - ".github/workflows/fmdl-4c-investment-os-reentry.yml"
  push:
    branches: [main]
    paths:
      - "config/fmdl4c_reentry_controls.json"
      - "schemas/fmdl4c_*.schema.json"
      - "docs/FMDL-4C_*.md"
      - "scripts/fmdl4c_core.py"
      - "scripts/run_fmdl4c_reentry.py"
      - "scripts/validate_fmdl4c_candidate.py"
      - "scripts/publish_fmdl4c_reentry.py"
      - "tests/test_fmdl4c_reentry.py"
      - ".github/workflows/fmdl-4c-investment-os-reentry.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fmdl-4c-${{ github.ref }}
  cancel-in-progress: true

jobs:
  investment-os-reentry-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Unit tests
        run: pytest -q tests/test_fmdl4c_reentry.py
      - name: Compile checks
        run: python -m py_compile scripts/fmdl4c_core.py scripts/run_fmdl4c_reentry.py scripts/validate_fmdl4c_candidate.py scripts/publish_fmdl4c_reentry.py
      - name: Build versioned re-entry state overlay
        run: python -m scripts.run_fmdl4c_reentry
      - name: Independently validate state transitions rollback and LKG
        run: python -m scripts.validate_fmdl4c_candidate
      - name: Upload FMDL-4C acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fmdl4c-investment-os-reentry-candidate
          path: outputs/fmdl4c/reentry/candidate/
          if-no-files-found: warn
          retention-days: 30
      - name: Publish immutable Release Current Archive and Last-success
        if: github.event_name != 'pull_request'
        run: python -m scripts.publish_fmdl4c_reentry
      - name: Commit accepted FMDL-4C state
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/status outputs/fmdl4c/reentry/current outputs/fmdl4c/reentry/archive outputs/fmdl4c/reentry/candidate datasets/fmdl4c/reentry/releases
          if git diff --cached --quiet; then
            echo "No accepted FMDL-4C state changes to commit"
          else
            git commit -m "data: publish FMDL-4C Investment OS re-entry controls [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
