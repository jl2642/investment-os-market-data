name: One-shot S2 post-real-writeback refresh 20260918

on:
  push:
    branches:
      - ops/dispatch-s2-post-real-writeback-20260918
    paths:
      - .github/workflows/one-shot-dispatch-s2-post-real-writeback-20260918.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch S2 full refresh on current main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh workflow run s2-investment-pipeline.yml \
            --repo jl2642/investment-os-market-data \
            --ref main \
            -f mode=full
          echo "S2 full refresh dispatch accepted."
