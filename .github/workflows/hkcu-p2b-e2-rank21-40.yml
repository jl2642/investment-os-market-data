name: HKCU P2B E2 Ranks 21-40 Company Evidence

on:
  pull_request:
    paths:
      - 'config/hkcu_p2b_e2_rank21_40_contract.json'
      - 'evidence/hkcu_p2b/HKCU_P2B_E2_COMPANY_EVIDENCE_RANK21_40_20260807.csv'
      - 'pipeline/hkcu_p2b_apply_e2_rank21_40.py'
      - 'scripts/validate_hkcu_p2b_e2_rank21_40.py'
      - 'tests/test_hkcu_p2b_e2_rank21_40.py'
      - 'docs/HKCU-P2B_E2_RANK21_40.md'
      - '.github/workflows/hkcu-p2b-e2-rank21-40.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-and-scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q tests/test_hkcu_p2b_e2.py tests/test_hkcu_p2b_e2_rank21_40.py
      - name: Enforce isolated rank21-40 scope
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}"
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" > /tmp/p2b_e2_r21_40_paths.txt
          cat /tmp/p2b_e2_r21_40_paths.txt
          python - <<'PY'
          from pathlib import Path
          allowed = {
              "config/hkcu_p2b_e2_rank21_40_contract.json",
              "evidence/hkcu_p2b/HKCU_P2B_E2_COMPANY_EVIDENCE_RANK21_40_20260807.csv",
              "pipeline/hkcu_p2b_apply_e2_rank21_40.py",
              "scripts/validate_hkcu_p2b_e2_rank21_40.py",
              "tests/test_hkcu_p2b_e2_rank21_40.py",
              "docs/HKCU-P2B_E2_RANK21_40.md",
              ".github/workflows/hkcu-p2b-e2-rank21-40.yml",
          }
          actual = {x.strip() for x in Path('/tmp/p2b_e2_r21_40_paths.txt').read_text().splitlines() if x.strip()}
          bad = sorted(actual - allowed)
          if bad:
              raise SystemExit('P2B_E2_R21_40_SCOPE_VIOLATION:' + ','.join(bad))
          protected_prefixes = (
              'outputs/candidate/', 'outputs/simulation/', 'outputs/real',
              'state/', 'orders/'
          )
          protected = sorted(p for p in actual if p.startswith(protected_prefixes))
          if protected:
              raise SystemExit('P2B_E2_R21_40_PROTECTED_PATH_MUTATION:' + ','.join(protected))
          PY

  real-cumulative-evidence:
    needs: unit-and-scope
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Rebuild accepted Top20 E2 and apply ranks 21-40
        run: |
          rm -rf work/hkcu_p2b_e2_r21_40
          python pipeline/hkcu_p2b_apply_e2_rank21_40.py \
            --repo-root . \
            --output work/hkcu_p2b_e2_r21_40
      - name: Independent cumulative validation
        run: |
          python scripts/validate_hkcu_p2b_e2_rank21_40.py \
            --output work/hkcu_p2b_e2_r21_40
      - name: Render decision and quality
        if: always()
        run: |
          test ! -f work/hkcu_p2b_e2_r21_40/HKCU_P2B_E2_R21_40_DECISION.json || cat work/hkcu_p2b_e2_r21_40/HKCU_P2B_E2_R21_40_DECISION.json
          test ! -f work/hkcu_p2b_e2_r21_40/HKCU_P2B_E2_R21_40_QUALITY_REPORT.json || cat work/hkcu_p2b_e2_r21_40/HKCU_P2B_E2_R21_40_QUALITY_REPORT.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hkcu-p2b-e2-rank21-40-cumulative-evidence
          path: work/hkcu_p2b_e2_r21_40/HKCU_P2B_E2_*
          if-no-files-found: error
