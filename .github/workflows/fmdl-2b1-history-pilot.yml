name: FMDL 2B-1 Historical Store Pilot

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - config/fmdl2_history_store.json
      - config/fmdl2_historical_source_routes.json
      - schemas/a_share_daily_history.schema.json
      - scripts/run_history_pilot.py
      - scripts/run_history_pilot_entry.py
      - tests/test_fmdl2b1_history_pilot.py
      - docs/FMDL-2B1_HISTORY_STORE_PILOT.md
      - requirements.txt
      - .github/workflows/fmdl-2b1-history-pilot.yml
  push:
    branches: [main]
    paths:
      - config/fmdl2_history_store.json
      - config/fmdl2_historical_source_routes.json
      - schemas/a_share_daily_history.schema.json
      - scripts/run_history_pilot.py
      - scripts/run_history_pilot_entry.py
      - tests/test_fmdl2b1_history_pilot.py
      - docs/FMDL-2B1_HISTORY_STORE_PILOT.md
      - requirements.txt
      - .github/workflows/fmdl-2b1-history-pilot.yml

permissions:
  contents: read

concurrency:
  group: fmdl-2b1-history-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Validate accepted FMDL-1 interface
        run: python scripts/validate_investment_os_interface.py

      - name: Run deterministic pilot tests
        run: pytest -q tests/test_fmdl2b1_history_pilot.py tests/test_fmdl2a_contract.py

      - name: Run real 300-symbol historical-store pilot
        id: pilot
        shell: bash
        run: |
          set +e
          mkdir -p diagnostics
          python -m scripts.run_history_pilot_entry 2>&1 | tee diagnostics/FMDL2B1_PILOT_LOG.txt
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload pilot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fmdl-2b1-historical-store-pilot
          path: |
            outputs/pilot/fmdl2b1/
            diagnostics/FMDL2B1_PILOT_LOG.txt
          if-no-files-found: error
          retention-days: 14

      - name: Enforce pilot acceptance
        if: steps.pilot.outputs.exit_code != '0'
        run: |
          echo "FMDL-2B-1 pilot did not pass the frozen acceptance gates."
          exit ${{ steps.pilot.outputs.exit_code }}
