name: RETIRED - R2 Portfolio Construction Synthesis
run-name: "RETIRED - R2 Portfolio Construction Synthesis"

# S1 retirement: manual tombstone only. No push, pull_request, schedule or workflow_run trigger.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  TRADE_AUTHORITY: NONE

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Explain retirement
        run: |
          echo "Historical R2 product-development acceptance workflow. Retired from automatic CI/runtime in S1."
          echo "Historical implementation and acceptance evidence remain in Git history and repository artifacts."
          echo "This workflow is not an active product-health signal and must not rebuild historical CURRENT authorities."
          echo "orders=0"
          echo "trade_authority=NONE"
