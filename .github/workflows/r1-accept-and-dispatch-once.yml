name: R1 bounded acceptance and dispatch once
on:
  push:
    branches: [audit/r1-production-dispatch-20261126]
    paths: ['.github/workflows/r1-accept-and-dispatch-once.yml']
permissions:
  actions: write
  contents: write
  pull-requests: write
concurrency:
  group: r1-accept-and-dispatch-once-20261127
  cancel-in-progress: false
jobs:
  complete:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify immutable exact PR head and all seven CI runs
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import os,json,subprocess,time
          repo=os.environ['GITHUB_REPOSITORY']
          expected='95f0174c4ae0b4c1590ed0712022df29a2a2e8b8'
          main='06e90fe3e85477e9f8d98339cfee247d4e40efc5'
          ids=[45857327728,45857327837,45857328195,45857327804,45857327721,45857327858,45857327906]
          def get(path):
              return json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/{path}'],text=True))
          for tick in range(55):
              pr=get('pulls/536')
              assert pr['state']=='open' and not pr['draft'] and pr['head']['sha']==expected and pr['base']['ref']=='main'
              assert get('branches/main')['commit']['sha']==main
              rows=[get(f'actions/runs/{rid}') for rid in ids]
              assert all(r['head_sha']==expected and r['event']=='pull_request' for r in rows)
              bad=[r['id'] for r in rows if r['status']=='completed' and r['conclusion']!='success']
              if bad: raise SystemExit(f'CI_FAILED:{bad}')
              pending=[r['id'] for r in rows if r['status']!='completed']
              print('CHECKS',{'pending':pending,'passed':len(rows)-len(pending)},flush=True)
              if not pending:
                  break
              time.sleep(10)
          else:
              raise SystemExit('BOUNDED_CI_TIMEOUT_NO_MERGE')
          pr=get('pulls/536')
          assert pr.get('mergeable') is True and pr['head']['sha']==expected
          changed={x['filename'] for x in get('pulls/536/files')}
          assert changed=={'pipeline/build_candidate.py','pipeline/quality.py','.github/workflows/fmdl-daily-production.yml','tests/test_normalization.py'}
          assert get('branches/main')['commit']['sha']==main
          PY
      - name: Merge only the tested R1 fix using normal GitHub branch protection
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)" = '06e90fe3e85477e9f8d98339cfee247d4e40efc5'
          gh pr merge 536 --repo "$GITHUB_REPOSITORY" --squash --match-head-commit 95f0174c4ae0b4c1590ed0712022df29a2a2e8b8 --subject 'fix: recover qualified identity continuity reference after 11/25 incident'
          merge="$(gh api "repos/$GITHUB_REPOSITORY/pulls/536" --jq .merge_commit_sha)"
          test -n "$merge"
          test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/536" --jq .merged)" = true
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)" = "$merge"
          echo "MERGED_R1=$merge" >> "$GITHUB_ENV"
          echo "MERGED_R1=$merge"
      - name: Dispatch existing production once with unchanged gates
        shell: bash
        run: |
          set -Eeuo pipefail
          gh run list --repo "$GITHUB_REPOSITORY" --workflow fmdl-daily-production.yml --branch main --limit 30 --json databaseId,status,headSha,event > /tmp/r1_runs.json
          python - <<'PY'
          import os,json
          from datetime import datetime,time
          from zoneinfo import ZoneInfo
          rows=json.load(open('/tmp/r1_runs.json'))
          assert not any(r['status']!='completed' for r in rows), 'PRODUCTION_ALREADY_ACTIVE_NO_DUPLICATE'
          assert not any(r['headSha']==os.environ['MERGED_R1'] and r['event'] in {'workflow_dispatch','schedule'} for r in rows), 'ALREADY_TRIGGERED'
          now=datetime.now(ZoneInfo('Asia/Shanghai'))
          assert not (now.weekday()<5 and time(9,15)<=now.time()<time(15,30)), 'INTRADAY_NO_DISPATCH'
          PY
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)" = "$MERGED_R1"
          gh workflow run fmdl-daily-production.yml --repo "$GITHUB_REPOSITORY" --ref main -f force_run=false -f allow_same_date_refresh=false
          echo 'DISPATCH_ACCEPTED; no gate override, no separate production path'
