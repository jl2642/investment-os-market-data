name: FMDL 1B-C Candidate Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - requirements.txt
      - ingestion/**
      - pipeline/**
      - tests/**
      - config/**
      - schemas/**
      - scripts/validate_contracts.py
      - docs/FMDL-1BC_IMPLEMENTATION.md
      - .github/workflows/fmdl-1bc-candidate.yml
  pull_request:
    branches: [main]
    paths:
      - requirements.txt
      - ingestion/**
      - pipeline/**
      - tests/**
      - config/**
      - schemas/**
      - scripts/validate_contracts.py
      - docs/FMDL-1BC_IMPLEMENTATION.md
      - .github/workflows/fmdl-1bc-candidate.yml

permissions:
  contents: write

concurrency:
  group: fmdl-1bc-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-real-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Validate frozen contracts
        run: python scripts/validate_contracts.py

      - name: Run deterministic tests
        run: pytest -q

      - name: Build real A-share candidate data
        id: candidate_build
        shell: bash
        run: |
          set +e
          mkdir -p diagnostics
          python pipeline/build_candidate.py 2>&1 | tee diagnostics/FMDL_1BC_ACTION_LOG.txt
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit $status

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fmdl-1bc-diagnostics
          path: |
            diagnostics/
            outputs/candidate/
          if-no-files-found: warn
          retention-days: 7

      - name: Commit candidate evidence
        if: github.event_name == 'push' && steps.candidate_build.outcome == 'success'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/candidate datasets/raw
          if git diff --cached --quiet; then
            echo "No candidate changes to commit"
          else
            git commit -m "data: FMDL-1B/C real candidate [skip ci]"
            git push
          fi
