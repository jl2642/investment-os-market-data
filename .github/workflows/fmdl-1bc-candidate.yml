name: FMDL 1B-C Candidate Validation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - requirements.txt
      - ingestion/**
      - pipeline/build_candidate.py
      - pipeline/normalize.py
      - pipeline/quality.py
      - pipeline/common.py
      - tests/**
      - config/**
      - schemas/**
      - scripts/validate_contracts.py
      - docs/FMDL-1BC_IMPLEMENTATION.md
      - .github/workflows/fmdl-1bc-candidate.yml

permissions:
  contents: read

concurrency:
  group: fmdl-1bc-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-real-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Validate frozen contracts
        run: python scripts/validate_contracts.py

      - name: Run repository FMDL tests
        run: pytest -q tests

      - name: Build real A-share candidate data
        if: github.event_name != 'pull_request'
        id: candidate_build
        shell: bash
        run: |
          set +e
          mkdir -p diagnostics
          python pipeline/build_candidate.py 2>&1 | tee diagnostics/FMDL_1BC_ACTION_LOG.txt
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit $status

      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fmdl-1bc-candidate-evidence
          path: |
            diagnostics/
            outputs/candidate/
            datasets/raw/
          if-no-files-found: warn
          retention-days: 7
