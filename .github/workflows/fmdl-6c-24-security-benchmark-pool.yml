name: FMDL 6C 24-Security Benchmark Pool

on:
  pull_request:
    paths:
      - "config/fmdl6c_*.json"
      - "datasets/fmdl6c/source_snapshots/*.json"
      - "schemas/fmdl6c_*.json"
      - "scripts/fmdl6c_*.py"
      - "scripts/publish_fmdl6c.py"
      - "scripts/validate_fmdl6c_*.py"
      - "tests/test_fmdl6c_*.py"
      - "docs/FMDL-6C*.md"
      - ".github/workflows/fmdl-6c-24-security-benchmark-pool.yml"
  push:
    branches: [main]
    paths:
      - "config/fmdl6c_*.json"
      - "datasets/fmdl6c/source_snapshots/*.json"
      - "schemas/fmdl6c_*.json"
      - "scripts/fmdl6c_*.py"
      - "scripts/publish_fmdl6c.py"
      - "scripts/validate_fmdl6c_*.py"
      - "tests/test_fmdl6c_*.py"
      - "docs/FMDL-6C*.md"
      - ".github/workflows/fmdl-6c-24-security-benchmark-pool.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fmdl-6c-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Schema validation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          schema = json.loads(Path("schemas/fmdl6c_benchmark_pool_v1.schema.json").read_text())
          contract = json.loads(Path("config/fmdl6c_24_security_benchmark_pool_contract.json").read_text())
          errors = list(Draft202012Validator(schema).iter_errors(contract))
          for error in errors:
              print(error.json_path, error.message)
          raise SystemExit(1 if errors else 0)
          PY
      - name: Unit tests
        run: python -m pytest -q tests/test_fmdl6c_benchmark_pool.py
      - name: Compile checks
        run: >-
          python -m py_compile
          scripts/fmdl6c_benchmark_pool.py
          scripts/publish_fmdl6c.py
          scripts/validate_fmdl6c_candidate.py
      - name: Validate frozen pool contract
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from fmdl6c_benchmark_pool import validate_contract
          checks, errors = validate_contract(
              Path(".").resolve(),
              Path("config/fmdl6c_24_security_benchmark_pool_contract.json").resolve(),
          )
          print({"check_count": len(checks), "errors": errors})
          raise SystemExit(1 if errors else 0)
          PY

  build-and-accept:
    needs: quality-gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Capture official current directories
        run: |
          rm -rf outputs/fmdl6c/work outputs/fmdl6c/candidate outputs/fmdl6c/acceptance
          python scripts/fmdl6c_benchmark_pool.py fetch \
            --repo-root . \
            --capture outputs/fmdl6c/work/FMDL6C_DIRECTORY_CAPTURE.json
      - name: Build 24-security candidate
        run: |
          python scripts/fmdl6c_benchmark_pool.py build \
            --repo-root . \
            --capture outputs/fmdl6c/work/FMDL6C_DIRECTORY_CAPTURE.json \
            --candidate outputs/fmdl6c/candidate
      - name: Independent validation and captured-input replay
        run: |
          python scripts/fmdl6c_benchmark_pool.py validate \
            --repo-root . \
            --capture outputs/fmdl6c/work/FMDL6C_DIRECTORY_CAPTURE.json \
            --candidate outputs/fmdl6c/candidate \
            --acceptance outputs/fmdl6c/acceptance/FMDL6C_INDEPENDENT_ACCEPTANCE.json
      - uses: actions/upload-artifact@v4
        with:
          name: fmdl6c-24-security-benchmark-pool-candidate
          path: |
            outputs/fmdl6c/candidate
            outputs/fmdl6c/acceptance/FMDL6C_INDEPENDENT_ACCEPTANCE.json
          if-no-files-found: error
          retention-days: 30
      - name: Publish Current Immutable Archive and Last-success
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && success()
        run: |
          python scripts/fmdl6c_benchmark_pool.py publish \
            --repo-root . \
            --candidate outputs/fmdl6c/candidate
      - name: Commit accepted FMDL-6C state
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/fmdl6c/current outputs/fmdl6c/archive datasets/fmdl6c/releases outputs/status/FMDL6C_LAST_SUCCESS.json
          git diff --cached --quiet && exit 0
          git commit -m "data: publish FMDL-6C 24-security benchmark pool [skip ci]"
          git push
