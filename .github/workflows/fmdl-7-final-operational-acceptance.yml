name: FMDL 7 FINAL Cross-market and Full-system Operational Acceptance

on:
  pull_request:
    paths:
      - 'config/fmdl7_final_operational_acceptance_contract.json'
      - 'schemas/fmdl7_final_operational_acceptance_contract_v1.schema.json'
      - 'scripts/fmdl7_final_operational_acceptance.py'
      - 'tests/test_fmdl7_final_operational_acceptance.py'
      - 'docs/FMDL-7-FINAL_*.md'
      - 'docs/股票投资助手_FMDL7_FINAL_HANDOFF_CURRENT.md'
      - '.github/workflows/fmdl-7-final-operational-acceptance.yml'
  push:
    branches: [main]
    paths:
      - 'config/fmdl7_final_operational_acceptance_contract.json'
      - 'schemas/fmdl7_final_operational_acceptance_contract_v1.schema.json'
      - 'scripts/fmdl7_final_operational_acceptance.py'
      - 'tests/test_fmdl7_final_operational_acceptance.py'
      - 'docs/FMDL-7-FINAL_*.md'
      - 'docs/股票投资助手_FMDL7_FINAL_HANDOFF_CURRENT.md'
      - '.github/workflows/fmdl-7-final-operational-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fmdl-7-final-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Contract and regression tests
        run: python -m unittest tests/test_fmdl7_final_operational_acceptance.py
      - name: Compile producer and tests
        run: python -m py_compile scripts/fmdl7_final_operational_acceptance.py tests/test_fmdl7_final_operational_acceptance.py
      - name: Validate final authority bindings and scope
        run: python scripts/fmdl7_final_operational_acceptance.py validate

  production:
    needs: quality-gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Freeze run timestamp and source commit
        run: |
          echo "RUN_TS=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
          echo "SOURCE_COMMIT=${GITHUB_SHA}" >> "$GITHUB_ENV"
      - name: Build FMDL-7-FINAL candidate
        run: |
          rm -rf build/fmdl7_final_candidate build/fmdl7_final_replay
          python scripts/fmdl7_final_operational_acceptance.py build \
            --output build/fmdl7_final_candidate \
            --generated-at "$RUN_TS" \
            --source-commit "$SOURCE_COMMIT"
      - name: Independent same-input byte replay
        run: |
          python scripts/fmdl7_final_operational_acceptance.py build \
            --output build/fmdl7_final_replay \
            --generated-at "$RUN_TS" \
            --source-commit "$SOURCE_COMMIT"
          diff -qr build/fmdl7_final_candidate build/fmdl7_final_replay
      - uses: actions/upload-artifact@v4
        with:
          name: fmdl7-final-operational-acceptance-and-handoff
          path: build/fmdl7_final_candidate
          if-no-files-found: error
          retention-days: 90
      - name: Publish Current immutable Release normalized archive and pointers
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python scripts/fmdl7_final_operational_acceptance.py publish --candidate build/fmdl7_final_candidate
      - name: Commit accepted FMDL-7 final state
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/fmdl7 datasets/fmdl7 outputs/status/FMDL7_FINAL_LAST_SUCCESS.json outputs/status/FMDL7_FINAL_OPERATIONAL_LKG.json
          if git diff --cached --quiet; then
            echo "No publication changes"
          else
            git commit -m "data: publish FMDL-7 final operational acceptance [skip ci]"
            git push origin HEAD:main
          fi
