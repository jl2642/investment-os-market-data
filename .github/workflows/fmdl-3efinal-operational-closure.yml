name: FMDL 3E Final Unified Operational Closure

on:
  pull_request:
    branches: [main]
    paths:
      - "config/fmdl3efinal_operational_closure.json"
      - "scripts/fmdl3efinal_core.py"
      - "scripts/run_fmdl3efinal_acceptance.py"
      - "scripts/validate_fmdl3efinal_candidate.py"
      - "scripts/publish_fmdl3efinal.py"
      - "scripts/run_fmdl3efinal_cycle.py"
      - "tests/test_fmdl3efinal_acceptance.py"
      - "docs/FMDL-3E-FINAL_*.md"
      - ".github/workflows/fmdl-3efinal-operational-closure.yml"
  workflow_dispatch:
    inputs:
      force_refresh:
        description: "Run the retired FMDL-3E chain for diagnostic evidence only"
        required: false
        default: false
        type: boolean

# FMDL-3E Final is retained as historical/forensic validation only.
# Current production operations are governed by the newer daily and FMDL-7
# control chains. This workflow must not schedule itself or publish to main.
permissions:
  contents: read

concurrency:
  group: fmdl-3efinal-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  canonical-acceptance:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Unit and compile checks
        run: |
          pytest -q tests/test_fmdl3efinal_acceptance.py
          python -m py_compile scripts/fmdl3efinal_core.py scripts/run_fmdl3efinal_acceptance.py scripts/validate_fmdl3efinal_candidate.py scripts/publish_fmdl3efinal.py scripts/run_fmdl3efinal_cycle.py
      - name: Build unified operational candidate
        run: python -m scripts.run_fmdl3efinal_acceptance
      - name: Independently validate candidate
        run: python -m scripts.validate_fmdl3efinal_candidate
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fmdl3efinal-operational-candidate
          path: outputs/fmdl3e/operational/candidate/
          if-no-files-found: error
          retention-days: 30

  diagnostic-cycle:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run diagnostic cycle without publication authority
        run: |
          FORCE=""
          if [ "${{ inputs.force_refresh }}" = "true" ]; then FORCE="--force-refresh"; fi
          python -m scripts.run_fmdl3efinal_cycle $FORCE
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fmdl3efinal-diagnostic-cycle
          path: |
            outputs/fmdl3e/incremental/candidate/
            outputs/fmdl3e/final/candidate/
            outputs/fmdl3e/operational/candidate/
          if-no-files-found: warn
          retention-days: 30
      - name: Confirm retired production authority
        if: always()
        run: |
          echo "FMDL_3E_FINAL_MODE=DIAGNOSTIC_ONLY"
          echo "SCHEDULED_PRODUCTION=DISABLED"
          echo "DIRECT_MAIN_PUSH=DISABLED"
          echo "TRADE_AUTHORITY=NONE"
