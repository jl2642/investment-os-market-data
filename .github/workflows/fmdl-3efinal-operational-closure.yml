name: FMDL 3E Final Unified Operational Closure

on:
  pull_request:
    branches: [main]
    paths:
      - "config/fmdl3efinal_operational_closure.json"
      - "scripts/fmdl3efinal_core.py"
      - "scripts/run_fmdl3efinal_acceptance.py"
      - "scripts/validate_fmdl3efinal_candidate.py"
      - "scripts/publish_fmdl3efinal.py"
      - "scripts/run_fmdl3efinal_cycle.py"
      - "tests/test_fmdl3efinal_acceptance.py"
      - "docs/FMDL-3E-FINAL_*.md"
      - ".github/workflows/fmdl-3efinal-operational-closure.yml"
  push:
    branches: [main]
    paths:
      - "config/fmdl3efinal_operational_closure.json"
      - "scripts/fmdl3efinal_core.py"
      - "scripts/run_fmdl3efinal_acceptance.py"
      - "scripts/validate_fmdl3efinal_candidate.py"
      - "scripts/publish_fmdl3efinal.py"
      - "scripts/run_fmdl3efinal_cycle.py"
      - "tests/test_fmdl3efinal_acceptance.py"
      - "docs/FMDL-3E-FINAL_*.md"
      - ".github/workflows/fmdl-3efinal-operational-closure.yml"
  schedule:
    - cron: "45 11 * * 1-5"
  workflow_dispatch:
    inputs:
      force_refresh:
        description: Force the FMDL-3E operational refresh chain
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: fmdl-3efinal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  canonical-acceptance:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Unit and compile checks
        run: |
          pytest -q tests/test_fmdl3efinal_acceptance.py
          python -m py_compile scripts/fmdl3efinal_core.py scripts/run_fmdl3efinal_acceptance.py scripts/validate_fmdl3efinal_candidate.py scripts/publish_fmdl3efinal.py scripts/run_fmdl3efinal_cycle.py
      - name: Build unified operational candidate
        run: python -m scripts.run_fmdl3efinal_acceptance
      - name: Independently validate candidate
        run: python -m scripts.validate_fmdl3efinal_candidate
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fmdl3efinal-operational-candidate
          path: outputs/fmdl3e/operational/candidate/
          if-no-files-found: error
          retention-days: 30
      - name: Publish canonical closure
        if: github.event_name == 'push'
        run: python -m scripts.publish_fmdl3efinal
      - name: Commit accepted canonical state
        if: github.event_name == 'push'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/status outputs/fmdl3e/operational datasets/fmdl3e/operational/releases
          if git diff --cached --quiet; then
            echo "No accepted FMDL-3E-Final state changes to commit"
          else
            git commit -m "data: publish FMDL-3E-Final canonical closure [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

  operational-cycle:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run controlled operating cycle
        run: |
          FORCE=""
          if [ "${{ inputs.force_refresh }}" = "true" ]; then FORCE="--force-refresh"; fi
          python -m scripts.run_fmdl3efinal_cycle $FORCE
      - name: Upload operating evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fmdl3efinal-operational-cycle
          path: |
            outputs/fmdl3e/incremental/candidate/
            outputs/fmdl3e/final/candidate/
            outputs/fmdl3e/operational/candidate/
          if-no-files-found: warn
          retention-days: 30
      - name: Commit accepted operating state
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/status outputs/fmdl3e datasets/fmdl3e
          if git diff --cached --quiet; then
            echo "NO_OP_ALREADY_CURRENT"
          else
            git commit -m "data: operate FMDL-3E canonical cycle [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
