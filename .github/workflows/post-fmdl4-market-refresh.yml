name: POST FMDL 4 Canonical Refresh and State Reconciliation

on:
  pull_request:
    paths:
      - "config/post_fmdl4_*.json"
      - "evidence/post_fmdl4/**"
      - "scripts/post_fmdl4_*.py"
      - "scripts/publish_post_fmdl4.py"
      - "tests/test_post_fmdl4_*.py"
      - ".github/workflows/post-fmdl4-market-refresh.yml"
  push:
    branches: [main]
    paths:
      - "config/post_fmdl4_*.json"
      - "evidence/post_fmdl4/**"
      - "scripts/post_fmdl4_*.py"
      - "scripts/publish_post_fmdl4.py"
      - "tests/test_post_fmdl4_*.py"
      - ".github/workflows/post-fmdl4-market-refresh.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  canonical-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests pytest
      - name: Unit tests
        run: python -m pytest -q tests/test_post_fmdl4_market_refresh.py tests/test_post_fmdl4_publication.py
      - name: Compile checks
        run: python -m py_compile scripts/post_fmdl4_fetch_market.py scripts/publish_post_fmdl4.py
      - name: Fetch July 20 close and latest fund NAV
        run: |
          rm -rf outputs/post_fmdl4/market_refresh_candidate
          python scripts/post_fmdl4_fetch_market.py \
            --config config/post_fmdl4_symbol_universe.json \
            --output outputs/post_fmdl4/market_refresh_candidate
      - name: Build and independently validate Release 8 publication candidate
        run: |
          rm -rf outputs/post_fmdl4/publication_candidate
          python scripts/publish_post_fmdl4.py \
            --repo-root . \
            --market-dir outputs/post_fmdl4/market_refresh_candidate \
            --output outputs/post_fmdl4/publication_candidate
      - name: Upload POST-FMDL-4 acceptance evidence
        uses: actions/upload-artifact@v4
        with:
          name: post-fmdl4-canonical-refresh-candidate
          path: |
            outputs/post_fmdl4/market_refresh_candidate
            outputs/post_fmdl4/publication_candidate
            evidence/post_fmdl4
          if-no-files-found: error
          retention-days: 30
      - name: Publish immutable Current Release Archive and Last-success
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          python scripts/publish_post_fmdl4.py \
            --repo-root . \
            --market-dir outputs/post_fmdl4/market_refresh_candidate \
            --output outputs/post_fmdl4/publication_candidate \
            --publish
      - name: Commit accepted POST-FMDL-4 state
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/post_fmdl4 datasets/post_fmdl4 outputs/status/POST_FMDL4_LAST_SUCCESS.json
          if git diff --cached --quiet; then
            echo "No publication changes"
          else
            git commit -m "data: publish POST-FMDL-4 canonical refresh [skip ci]"
            git push
          fi
