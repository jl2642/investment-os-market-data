name: FMDL 2C Component Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "config/fmdl2_screening_funnel.json"
      - "schemas/fmdl2_screening_manifest.schema.json"
      - "scripts/run_screening_funnel.py"
      - "scripts/run_screening_funnel_v2.py"
      - "scripts/validate_fmdl2c_candidate.py"
      - "scripts/publish_fmdl2c.py"
      - "tests/test_fmdl2c_screening_funnel.py"
      - "tests/test_round1_governed_publication_workflows.py"
      - "docs/FMDL-2C_SCREENING_FUNNEL.md"
      - ".github/workflows/fmdl-2c-screening-funnel.yml"
      - ".github/workflows/fmdl-daily-production.yml"
  push:
    branches: [main]
    paths:
      - "config/fmdl2_screening_funnel.json"
      - "schemas/fmdl2_screening_manifest.schema.json"
      - "scripts/run_screening_funnel.py"
      - "scripts/run_screening_funnel_v2.py"
      - "scripts/validate_fmdl2c_candidate.py"
      - "scripts/publish_fmdl2c.py"
      - "tests/test_fmdl2c_screening_funnel.py"
      - "tests/test_round1_governed_publication_workflows.py"
      - ".github/workflows/fmdl-2c-screening-funnel.yml"
      - ".github/workflows/fmdl-daily-production.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fmdl-2c-component-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Contract and regression tests
        run: |
          python scripts/validate_investment_os_interface.py
          pytest -q \
            tests/test_fmdl2b3_factor_engine.py \
            tests/test_fmdl2b4_incremental_refresh.py \
            tests/test_fmdl2c_screening_funnel.py \
            tests/test_round1_governed_publication_workflows.py
      - name: Build real screening candidate
        run: python -m scripts.run_screening_funnel_v2
      - name: Independent candidate validation
        run: python -m scripts.validate_fmdl2c_candidate
      - name: Materialize component Current for evidence
        if: github.event_name == 'workflow_dispatch'
        run: python -m scripts.publish_fmdl2c
      - name: Upload screening evidence without Canonical publication
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fmdl2c-component-${{ github.run_id }}-a${{ github.run_attempt }}
          path: |
            outputs/screens/candidate/
            outputs/screens/current/
            outputs/status/FMDL2C_LAST_SUCCESS.json
          if-no-files-found: warn
          retention-days: 14
      - name: Record component boundary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## FMDL 2C component evidence
          - This workflow validates screening generation only.
          - It does not push or publish Canonical state.
          - Scheduled production is owned by fmdl-daily-production.yml.
          - Direct main publication is disabled.
          EOF
