name: FMDL 4D Thesis Attribution and Feedback

on:
  pull_request:
    branches: [main]
    paths:
      - "config/fmdl4d_thesis_attribution.json"
      - "schemas/fmdl4d_*.schema.json"
      - "docs/FMDL-4D_*.md"
      - "scripts/fmdl4d_core.py"
      - "scripts/run_fmdl4d_thesis_attribution.py"
      - "scripts/validate_fmdl4d_candidate.py"
      - "scripts/publish_fmdl4d_thesis_attribution.py"
      - "tests/test_fmdl4d_thesis_attribution.py"
      - ".github/workflows/fmdl-4d-thesis-attribution.yml"
  push:
    branches: [main]
    paths:
      - "config/fmdl4d_thesis_attribution.json"
      - "schemas/fmdl4d_*.schema.json"
      - "docs/FMDL-4D_*.md"
      - "scripts/fmdl4d_core.py"
      - "scripts/run_fmdl4d_thesis_attribution.py"
      - "scripts/validate_fmdl4d_candidate.py"
      - "scripts/publish_fmdl4d_thesis_attribution.py"
      - "tests/test_fmdl4d_thesis_attribution.py"
      - ".github/workflows/fmdl-4d-thesis-attribution.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fmdl-4d-${{ github.ref }}
  cancel-in-progress: true

jobs:
  thesis-attribution-feedback:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Unit tests
        run: python -m pytest -q tests/test_fmdl4d_thesis_attribution.py
      - name: Compile checks
        run: python -m py_compile scripts/fmdl4d_core.py scripts/run_fmdl4d_thesis_attribution.py scripts/validate_fmdl4d_candidate.py scripts/publish_fmdl4d_thesis_attribution.py
      - name: Build thesis attribution and feedback candidate
        run: python -m scripts.run_fmdl4d_thesis_attribution
      - name: Independently validate thesis attribution and feedback
        run: python -m scripts.validate_fmdl4d_candidate
      - name: Upload FMDL-4D acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fmdl4d-thesis-attribution-feedback-candidate
          path: outputs/fmdl4d/thesis/candidate/
          if-no-files-found: warn
          retention-days: 30
      - name: Publish immutable Release Current Archive and Last-success
        if: github.event_name != 'pull_request'
        run: python -m scripts.publish_fmdl4d_thesis_attribution
      - name: Commit accepted FMDL-4D state
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/status outputs/fmdl4d/thesis/current outputs/fmdl4d/thesis/archive outputs/fmdl4d/thesis/candidate datasets/fmdl4d/thesis/releases
          if git diff --cached --quiet; then
            echo "No accepted FMDL-4D state changes to commit"
          else
            git commit -m "data: publish FMDL-4D thesis attribution and feedback [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
