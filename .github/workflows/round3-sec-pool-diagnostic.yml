name: Round 3 SEC pool diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/round3-sec-pool-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Inspect SEC queue and identity enrichment coverage
        shell: bash
        run: |
          PYTHONPATH=. python - <<'PY'
          from collections import Counter, defaultdict
          from pathlib import Path
          from automation.cross_market.build_round3_limited_production import read_csv, read_jsonl_gz, first_value, sec_cik, sec_symbol, US_SEC_INITIAL, US_SEC_QUEUE

          root = Path('.')
          identity_path = root / 'outputs/fmdl6x2/current/identity/FMDL6X2B_IDENTITY_LINEAGE.jsonl.gz'
          initial = read_csv(root / US_SEC_INITIAL)
          queue = read_jsonl_gz(root / US_SEC_QUEUE)
          identity = read_jsonl_gz(identity_path)
          print({'initial_count': len(initial), 'queue_count': len(queue), 'identity_rows': len(identity)})
          print({'queue_keys': sorted(queue[0].keys()) if queue else [], 'identity_keys': sorted(identity[0].keys()) if identity else []})
          print({'identity_samples': identity[:5]})

          issuer_fields = ('canonical_issuer_id','issuer_id','parent_issuer_id')
          cik_fields = ('cik','cik10','cik_str','issuer_cik','sec_cik','CIK')
          symbol_fields = ('symbol','ticker','selected_symbol','primary_symbol','primary_ticker','listing_symbol','security_symbol')
          identity_by_issuer = defaultdict(list)
          for row in identity:
              issuer = first_value(row, issuer_fields)
              if issuer:
                  identity_by_issuer[issuer].append(row)
          queue_ids = [first_value(row, issuer_fields) for row in queue]
          matched = [issuer for issuer in queue_ids if issuer in identity_by_issuer]
          cik_covered = []
          symbol_covered = []
          for issuer in matched:
              rows = identity_by_issuer[issuer]
              if any(sec_cik(row) for row in rows):
                  cik_covered.append(issuer)
              if any(sec_symbol(row) for row in rows):
                  symbol_covered.append(issuer)
          print({'identity_unique_issuers': len(identity_by_issuer), 'queue_unique_issuers': len(set(queue_ids)), 'queue_identity_matches': len(set(matched)), 'queue_cik_covered': len(set(cik_covered)), 'queue_symbol_covered': len(set(symbol_covered))})
          print({'identity_field_presence': {field: sum(1 for row in identity if row.get(field) not in (None,'',[])) for field in issuer_fields + cik_fields + symbol_fields}})
          missing = [issuer for issuer in queue_ids if issuer not in identity_by_issuer]
          no_cik = [issuer for issuer in matched if not any(sec_cik(row) for row in identity_by_issuer[issuer])]
          print({'missing_identity_samples': missing[:10], 'matched_without_cik_samples': no_cik[:10]})
          for issuer in list(dict.fromkeys(matched))[:5]:
              print({'issuer': issuer, 'rows': identity_by_issuer[issuer][:3]})
          PY
