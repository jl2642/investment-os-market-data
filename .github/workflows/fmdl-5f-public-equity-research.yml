name: FMDL 5F Public Equity Research Adapter
run-name: "FMDL 5F Public Equity Research Adapter (retired)"

# S1 retirement: historical acceptance evidence stays in Git, but unrelated PRs no longer rebuild it.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/fmdl-5f-public-equity-research.yml"

permissions:
  contents: read

env:
  TRADE_AUTHORITY: NONE

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Explain retirement
        run: |
          echo "Historical FMDL-5F adapter acceptance workflow; current investment research production is governed by the simplified S1-S4 program."
          echo "Whole-system maturity is read from investment_os_runtime/00_CONTROL/SYSTEM_CURRENT.json."
          echo "This workflow is not an active runtime or product-health signal."
          echo "orders=0"
          echo "trade_authority=NONE"
