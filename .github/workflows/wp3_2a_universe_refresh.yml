name: WP3-2A Universe Refresh
run-name: "WP3-2A refresh ${{ inputs.accepted_session || 'provider-session' }}"

on:
  workflow_dispatch:
    inputs:
      accepted_session:
        description: "Optional accepted session YYYY-MM-DD; blank uses provider row timestamps"
        required: false
        type: string
      provider_policy:
        description: "Provider policy"
        required: true
        default: configured
        type: choice
        options: [configured, eastmoney_public, sina_public]
      create_pr:
        description: "Create or update a data-proposal PR after Gate v3 PASS"
        required: true
        default: true
        type: boolean
  schedule:
    - cron: "17 17 * * 1-5"
      timezone: "Asia/Shanghai"
    - cron: "47 18 * * 1-5"
      timezone: "Asia/Shanghai"
    - cron: "17 20 * * 1-5"
      timezone: "Asia/Shanghai"
    - cron: "47 22 * * 1-5"
      timezone: "Asia/Shanghai"
    - cron: "17 7 * * 2-6"
      timezone: "Asia/Shanghai"

permissions: {}
concurrency:
  group: wp3-2a-universe-refresh
  cancel-in-progress: false

env:
  TRADE_AUTHORITY: NONE
  CONFIG: automation/wp3_2a/config.json
  RUN_DIR: .wp3_2a_run

jobs:
  refresh-and-propose:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: automation/wp3_2a/requirements.lock
      - name: Install requirements
        run: python -m pip install --retries 5 --timeout 30 -r automation/wp3_2a/requirements.lock
      - name: Acquire full universe with finite retries
        id: acquire
        continue-on-error: true
        env:
          MANUAL_SESSION: ${{ inputs.accepted_session || '' }}
          PROVIDER_POLICY: ${{ inputs.provider_policy || 'configured' }}
        run: |
          python automation/wp3_2a/acquire_universe.py \
            --config "$CONFIG" --output-dir "$RUN_DIR" \
            --manual-session "$MANUAL_SESSION" --provider-policy "$PROVIDER_POLICY"
      - name: Read acquisition status
        id: status
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          p=Path('.wp3_2a_run/ACQUISITION_MANIFEST.json')
          data=json.loads(p.read_text()) if p.exists() else {'run_status':'FAIL'}
          print('success=' + ('true' if data.get('run_status')=='PASS' else 'false'))
          print('session=' + str(data.get('session') or 'UNRESOLVED'))
          print('provider=' + str(data.get('selected_provider') or 'NONE'))
          PY
      - name: Run Gate v3
        id: gate
        if: steps.status.outputs.success == 'true'
        env:
          SESSION: ${{ steps.status.outputs.session }}
          PROVIDER: ${{ steps.status.outputs.provider }}
        run: |
          python automation/wp3_2a/validate_a_share_universe_gate_v3.py \
            --previous-jsonl investment_os_runtime/40_EVIDENCE_AND_LINEAGE/WP3_2_R4/WP3_2_OLD_ACCEPTED_IDENTITY_EVIDENCE_20260717.jsonl \
            --current-csv "$RUN_DIR/A_SHARE_FULL_UNIVERSE_CURRENT.csv" \
            --as-of "$SESSION" --latest-completed-session "$SESSION" \
            --expected-provider "$PROVIDER" --expected-min 5400 --expected-max 5900 \
            --output "$RUN_DIR/LINEAGE_ACCEPTANCE.json"
      - name: Stage data proposal only
        id: stage
        if: steps.status.outputs.success == 'true' && steps.gate.outcome == 'success'
        env:
          RUN_ID_SAFE: ${{ github.run_id }}_${{ github.run_attempt }}
        run: |
          python automation/wp3_2a/stage_data_proposal.py \
            --repo-root . --run-dir "$RUN_DIR" \
            --gate-result "$RUN_DIR/LINEAGE_ACCEPTANCE.json" \
            --config "$CONFIG" --run-id "$RUN_ID_SAFE" | tee "$RUN_DIR/STAGE_RESULT.json"
      - name: Self-test automation
        if: steps.stage.outcome == 'success'
        run: |
          python automation/wp3_2a/self_test.py --repo-root .
          python -m pytest -q automation/wp3_2a/tests
      - name: Runtime regression
        if: steps.stage.outcome == 'success'
        working-directory: investment_os_runtime/80_EXECUTABLE_RUNTIME
        run: |
          python -m pip install --retries 5 --timeout 30 -r requirements.lock
          python -m pytest -q
          PYTHONPATH=src python bin/validate_runtime.py --evaluation-date "${{ steps.status.outputs.session }}" --output "$GITHUB_WORKSPACE/$RUN_DIR/RUNTIME_ACCEPTANCE.json"
      - name: Build PR body
        if: steps.stage.outcome == 'success'
        run: |
          cat > "$RUN_DIR/PR_BODY.md" <<EOF
          ## WP3-2A automated data proposal
          - Session: `${{ steps.status.outputs.session }}`
          - Provider: `${{ steps.status.outputs.provider }}`
          - Gate v3: `PASS`
          - Runtime: `PASS`
          - Candidate / Research / account mutations: `0`
          - Orders: `0`
          - trade_authority: `NONE`

          This PR stores a proposal only. It does not replace A_SHARE_CURRENT. Run the manual acceptance workflow after review.
          EOF
      - name: Create or update controlled PR
        if: steps.stage.outcome == 'success' && (github.event_name == 'schedule' || inputs.create_pr)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="automation/wp3-2a-universe-${{ steps.status.outputs.session }}"
          automation/wp3_2a/create_or_update_pr.sh \
            "$BRANCH" \
            "WP3-2A data proposal: ${{ steps.status.outputs.session }}" \
            "$RUN_DIR/PR_BODY.md" \
            "wp3-2a,data-proposal,human-review-required" main
      - name: Upload run evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wp3-2a-universe-${{ github.run_id }}-${{ github.run_attempt }}
          path: .wp3_2a_run/
          if-no-files-found: warn
          retention-days: 14
      - name: Upsert blocked-data issue
        if: steps.stage.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TITLE="WP3-2A data acquisition blocked"
          BODY="Run $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT did not produce a Gate-v3-passed proposal. Provider attempts and raw failure evidence are retained in the workflow artifact. No Current, Candidate, account, simulation or order state changed."
          NUMBER=$(gh issue list --state open --search "$TITLE in:title" --json number,title --jq '.[] | select(.title=="'"$TITLE"'") | .number' | head -1)
          if [[ -n "$NUMBER" ]]; then gh issue comment "$NUMBER" --body "$BODY"; else gh issue create --title "$TITLE" --body "$BODY" --label "wp3-2a" || gh issue create --title "$TITLE" --body "$BODY"; fi
      - name: Fail closed when no proposal was produced
        if: steps.stage.outcome != 'success'
        run: exit 1
