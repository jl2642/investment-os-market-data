name: WP3-2A Universe Refresh
run-name: "WP3-2A refresh ${{ inputs.accepted_session || 'provider-session' }}"

on:
  workflow_dispatch:
    inputs:
      accepted_session:
        description: "Optional accepted session YYYY-MM-DD; blank uses provider row timestamps"
        required: false
        type: string
      provider_policy:
        description: "Provider policy"
        required: true
        default: configured
        type: choice
        options: [configured, eastmoney_public, sina_public]
      create_pr:
        description: "Create a data-proposal PR after Gate v3 PASS"
        required: true
        default: true
        type: boolean

permissions: {}
concurrency:
  group: wp3-2a-universe-refresh
  cancel-in-progress: false

env:
  TRADE_AUTHORITY: NONE
  CONFIG: automation/wp3_2a/config.json
  RUN_DIR: .wp3_2a_run
  EVIDENCE_DIR: wp3_2a_run_evidence

jobs:
  refresh-and-propose:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: automation/wp3_2a/requirements.lock
      - name: Install requirements
        run: python -m pip install --retries 5 --timeout 30 -r automation/wp3_2a/requirements.lock

      - name: Acquire full universe with finite retries
        id: acquire
        continue-on-error: true
        env:
          MANUAL_SESSION: ${{ inputs.accepted_session || '' }}
          PROVIDER_POLICY: ${{ inputs.provider_policy || 'configured' }}
        run: |
          python automation/wp3_2a/acquire_universe.py \
            --config "$CONFIG" --output-dir "$RUN_DIR" \
            --manual-session "$MANUAL_SESSION" --provider-policy "$PROVIDER_POLICY"

      - name: Read acquisition status
        id: status
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          path = Path('.wp3_2a_run/ACQUISITION_MANIFEST.json')
          data = json.loads(path.read_text()) if path.exists() else {'run_status': 'FAIL'}
          print('acquisition_pass=' + ('true' if data.get('run_status') == 'PASS' else 'false'))
          print('session=' + str(data.get('session') or 'UNRESOLVED'))
          print('provider=' + str(data.get('selected_provider') or 'NONE'))
          PY

      - name: Preserve and summarize acquisition diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p "$EVIDENCE_DIR"
          if [[ -d "$RUN_DIR" ]]; then
            cp -a "$RUN_DIR"/. "$EVIDENCE_DIR"/
          fi
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest_path = Path('.wp3_2a_run/ACQUISITION_MANIFEST.json')
          summary_path = Path(os.environ['GITHUB_STEP_SUMMARY'])
          if manifest_path.exists():
              data = json.loads(manifest_path.read_text(encoding='utf-8'))
          else:
              data = {
                  'run_status': 'FAIL',
                  'failure_reasons': ['ACQUISITION_MANIFEST_MISSING'],
                  'attempts': [],
                  'trade_authority': 'NONE',
              }
              Path('wp3_2a_run_evidence/ACQUISITION_MANIFEST_MISSING.json').write_text(
                  json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
              )

          lines = [
              '## WP3-2A acquisition diagnostics',
              '',
              f"- Run status: `{data.get('run_status', 'UNKNOWN')}`",
              f"- Session: `{data.get('session') or data.get('derived_session') or 'UNRESOLVED'}`",
              f"- Selected provider: `{data.get('selected_provider') or 'NONE'}`",
              f"- Failure reasons: `{', '.join(data.get('failure_reasons') or []) or 'NONE_RECORDED'}`",
              f"- Attempt count: `{len(data.get('attempts') or [])}`",
              '- Candidate / Research / account / simulation mutations: `0`',
              '- Orders: `0`',
              '- trade_authority: `NONE`',
              '',
              '### Provider attempts',
              '',
          ]
          attempts = data.get('attempts') or []
          if not attempts:
              lines.append('- No provider attempt record was produced.')
          else:
              for attempt in attempts:
                  error = str(attempt.get('error') or '').replace('\n', ' ')[:500]
                  lines.append(
                      f"- `{attempt.get('provider')}` attempt `{attempt.get('attempt')}`: "
                      f"`{attempt.get('status')}` rows=`{attempt.get('rows', 0)}` "
                      f"error=`{error or 'NONE'}`"
                  )
          with summary_path.open('a', encoding='utf-8') as handle:
              handle.write('\n'.join(lines) + '\n')
          print(json.dumps(data, ensure_ascii=False, indent=2))
          PY

      - name: Determine whether a new proposal is needed
        id: decision
        if: steps.status.outputs.acquisition_pass == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SESSION: ${{ steps.status.outputs.session }}
        shell: bash
        run: |
          OPEN_COUNT=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --search "WP3-2A data proposal: ${SESSION} in:title" \
            --json number \
            --jq 'length')
          python automation/wp3_2a/refresh_decision.py \
            --repo-root . \
            --session "$SESSION" \
            --open-proposal-count "$OPEN_COUNT" \
            --output "$RUN_DIR/REFRESH_DECISION.json"
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          data = json.load(open('.wp3_2a_run/REFRESH_DECISION.json', encoding='utf-8'))
          print('proceed=' + ('true' if data['proceed'] else 'false'))
          print('reason=' + data['reason'])
          PY

      - name: Record successful no-op
        if: steps.status.outputs.acquisition_pass == 'true' && steps.decision.outputs.proceed == 'false'
        run: |
          {
            echo '## WP3-2A refresh no-op'
            echo
            echo '- Outcome: `NO_OP`'
            echo '- Reason: `${{ steps.decision.outputs.reason }}`'
            echo '- Incoming session: `${{ steps.status.outputs.session }}`'
            echo '- Current was not changed.'
            echo '- Candidate / Research / account / simulation mutations: `0`'
            echo '- Orders: `0`'
            echo '- trade_authority: `NONE`'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run Gate v3
        id: gate
        if: steps.status.outputs.acquisition_pass == 'true' && steps.decision.outputs.proceed == 'true'
        continue-on-error: true
        env:
          SESSION: ${{ steps.status.outputs.session }}
          PROVIDER: ${{ steps.status.outputs.provider }}
        shell: bash
        run: |
          set +e
          python automation/wp3_2a/validate_a_share_universe_gate_v3.py \
            --previous-jsonl investment_os_runtime/40_EVIDENCE_AND_LINEAGE/WP3_2_R4/WP3_2_OLD_ACCEPTED_IDENTITY_EVIDENCE_20260717.jsonl \
            --current-csv "$RUN_DIR/A_SHARE_FULL_UNIVERSE_CURRENT.csv" \
            --as-of "$SESSION" --latest-completed-session "$SESSION" \
            --expected-provider "$PROVIDER" --expected-min 5400 --expected-max 5900 \
            --output "$RUN_DIR/LINEAGE_ACCEPTANCE.json" \
            > >(tee "$RUN_DIR/GATE_V3_STDOUT.log") \
            2> >(tee "$RUN_DIR/GATE_V3_STDERR.log" >&2)
          rc=$?
          set -e
          printf '%s\n' "$rc" > "$RUN_DIR/GATE_V3_EXIT_CODE.txt"
          exit "$rc"

      - name: Summarize Gate v3 diagnostics
        if: steps.decision.outputs.proceed == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          run_dir = Path('.wp3_2a_run')
          report_path = run_dir / 'LINEAGE_ACCEPTANCE.json'
          exit_path = run_dir / 'GATE_V3_EXIT_CODE.txt'
          stderr_path = run_dir / 'GATE_V3_STDERR.log'
          summary_path = Path(os.environ['GITHUB_STEP_SUMMARY'])

          report = None
          if report_path.exists():
              try:
                  report = json.loads(report_path.read_text(encoding='utf-8'))
              except Exception as exc:
                  report = {
                      'status': 'FAIL',
                      'errors': ['GATE_REPORT_UNREADABLE'],
                      'runtime_exception': {'type': type(exc).__name__, 'message': str(exc)},
                      'trade_authority': 'NONE',
                  }
          exit_code = exit_path.read_text(encoding='utf-8').strip() if exit_path.exists() else 'MISSING'
          stderr = stderr_path.read_text(encoding='utf-8', errors='replace').strip() if stderr_path.exists() else ''
          lines = [
              '',
              '## WP3-2A Gate v3 diagnostics',
              '',
              f"- Exit code: `{exit_code}`",
              f"- Report present: `{'yes' if report_path.exists() else 'no'}`",
              f"- Status: `{(report or {}).get('status', 'NO_REPORT')}`",
              f"- Errors: `{', '.join((report or {}).get('errors') or []) or 'NONE_RECORDED'}`",
              f"- Runtime exception: `{json.dumps((report or {}).get('runtime_exception') or {}, ensure_ascii=False)}`",
              '- Candidate / Research / account / simulation mutations: `0`',
              '- Orders: `0`',
              '- trade_authority: `NONE`',
          ]
          if stderr:
              lines.extend(['', '### Gate stderr tail', '', '```text', stderr[-4000:], '```'])
          with summary_path.open('a', encoding='utf-8') as handle:
              handle.write('\n'.join(lines) + '\n')
          print(json.dumps(report or {'status': 'NO_REPORT'}, ensure_ascii=False, indent=2))
          PY

      - name: Stage data proposal only
        id: stage
        if: steps.decision.outputs.proceed == 'true' && steps.gate.outcome == 'success'
        env:
          RUN_ID_SAFE: ${{ github.run_id }}_${{ github.run_attempt }}
        run: |
          python automation/wp3_2a/stage_data_proposal.py \
            --repo-root . --run-dir "$RUN_DIR" \
            --gate-result "$RUN_DIR/LINEAGE_ACCEPTANCE.json" \
            --config "$CONFIG" --run-id "$RUN_ID_SAFE" | tee "$RUN_DIR/STAGE_RESULT.json"

      - name: Self-test automation
        if: steps.stage.outcome == 'success'
        run: |
          python automation/wp3_2a/self_test.py --repo-root .
          python -m pytest -q automation/wp3_2a/tests

      - name: Runtime regression
        if: steps.stage.outcome == 'success'
        working-directory: investment_os_runtime/80_EXECUTABLE_RUNTIME
        run: |
          python -m pip install --retries 5 --timeout 30 -r requirements.lock
          python -m pytest -q
          PYTHONPATH=src python bin/validate_runtime.py \
            --evaluation-date "${{ steps.status.outputs.session }}" \
            --output "$GITHUB_WORKSPACE/$RUN_DIR/RUNTIME_ACCEPTANCE.json"

      - name: Build PR body
        if: steps.stage.outcome == 'success'
        run: |
          cat > "$RUN_DIR/PR_BODY.md" <<EOF
          ## WP3-2A automated data proposal
          - Session: `${{ steps.status.outputs.session }}`
          - Provider: `${{ steps.status.outputs.provider }}`
          - Gate v3: `PASS`
          - Runtime: `PASS`
          - Candidate / Research / account / simulation mutations: `0`
          - Orders: `0`
          - trade_authority: `NONE`

          This PR stores a proposal only. It does not replace A_SHARE_CURRENT. Run the protected acceptance workflow after review.
          EOF

      - name: Create controlled proposal PR
        if: steps.stage.outcome == 'success' && (github.event_name == 'schedule' || inputs.create_pr)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="automation/wp3-2a-universe-${{ steps.status.outputs.session }}"
          automation/wp3_2a/create_or_update_pr.sh \
            "$BRANCH" \
            "WP3-2A data proposal: ${{ steps.status.outputs.session }}" \
            "$RUN_DIR/PR_BODY.md" \
            "wp3-2a,data-proposal,human-review-required" main

      - name: Refresh visible evidence copy after downstream steps
        if: always()
        shell: bash
        run: |
          mkdir -p "$EVIDENCE_DIR"
          if [[ -d "$RUN_DIR" ]]; then
            cp -a "$RUN_DIR"/. "$EVIDENCE_DIR"/
          fi

      - name: Upload run evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wp3-2a-universe-${{ github.run_id }}-${{ github.run_attempt }}
          path: wp3_2a_run_evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Upsert blocked-data issue
        if: ${{ always() && (steps.status.outputs.acquisition_pass != 'true' || (steps.decision.outputs.proceed == 'true' && steps.stage.outcome != 'success')) }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TITLE="WP3-2A proposal generation blocked"
          RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}"
          BODY="Run ${RUN_URL} did not produce a Gate-v3-passed proposal. Download artifact wp3-2a-universe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT} for acquisition, Gate v3 and runtime evidence. No Current, Candidate, Research, account, simulation or order state changed. trade_authority=NONE."
          NUMBER=$(gh issue list --state open --search "$TITLE in:title" --json number,title --jq '.[] | select(.title=="'"$TITLE"'") | .number' | head -1)
          if [[ -n "$NUMBER" ]]; then
            gh issue comment "$NUMBER" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY" --label "wp3-2a" || gh issue create --title "$TITLE" --body "$BODY"
          fi

      - name: Fail closed when a required proposal was not produced
        if: ${{ always() && (steps.status.outputs.acquisition_pass != 'true' || (steps.decision.outputs.proceed == 'true' && steps.stage.outcome != 'success')) }}
        run: exit 1
