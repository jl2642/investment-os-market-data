name: WP3-R Weekly Candidate Price Screen
run-name: "WP3-R weekly 73-name price and valuation screen"

on:
  schedule:
    - cron: "5 15 * * 5"
  workflow_dispatch:

permissions:
  contents: write

env:
  TRADE_AUTHORITY: NONE

jobs:
  weekly-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: automation/wp3_r/requirements.lock

      - name: Install runtime
        run: python -m pip install --retries 5 --timeout 30 -r automation/wp3_r/requirements.lock

      - name: Rebuild audit and weekly operating products
        run: |
          AS_OF="$(date -u +%F)"
          bash automation/wp3_r/rebuild_operating_current.sh "$AS_OF"
          python automation/wp3_r/build_candidate_cadence.py --repo-root . --mode finalize-acceptance --as-of "$AS_OF"

      - name: Validate full weekly coverage and zero mutations
        run: |
          python - <<'PY'
          import json
          from datetime import date
          from pathlib import Path
          root = Path('.')
          weekly = json.loads((root / 'investment_os_runtime/30_STATE_CURRENT/45_CANDIDATE_OPERATIONS/WEEKLY_PRICE_SCREEN_CURRENT.json').read_text(encoding='utf-8'))
          market_run = json.loads((root / 'investment_os_runtime/40_EVIDENCE_AND_LINEAGE/WP3_R/CANDIDATE_MARKET_SCREEN_RUN_CURRENT.json').read_text(encoding='utf-8'))
          acceptance = json.loads((root / 'investment_os_runtime/00_CONTROL/WP3_R_CANDIDATE_REFRESH_ACCEPTANCE_RECORD.json').read_text(encoding='utf-8'))
          session = date.fromisoformat(weekly['as_of_date'])
          assert weekly['status'] == 'PASS_WEEKLY_PRICE_SCREEN_NO_MEMBERSHIP_MUTATION'
          assert weekly['tracked_count'] == weekly['covered_count'] == 73
          assert weekly['as_of_date'] == market_run['accepted_session']
          assert 0 <= (date.today() - session).days <= 4
          assert weekly['candidate_membership_mutations'] == 0
          assert weekly['research_object_mutations'] == 0
          assert weekly['orders'] == 0
          assert weekly['trade_authority'] == 'NONE'
          assert market_run['portfolio_mutations'] == 0
          assert acceptance['wp5_unblocked'] is False
          print({'covered': 73, 'as_of': weekly['as_of_date'], 'mutations': 0})
          PY

      - name: Publish observation-only weekly Current
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        run: |
          bash automation/wp3_r/publish_current_safely.sh \
            "WP3-R automated weekly Candidate price screen" \
            investment_os_runtime/30_STATE_CURRENT/45_CANDIDATE_OPERATIONS/WEEKLY_PRICE_SCREEN_CURRENT.json \
            investment_os_runtime/30_STATE_CURRENT/45_CANDIDATE_OPERATIONS/CANDIDATE_REFRESH_CURRENT.json \
            investment_os_runtime/40_EVIDENCE_AND_LINEAGE/WP3_R/CANDIDATE_MARKET_SCREEN_RUN_CURRENT.json \
            investment_os_runtime/40_EVIDENCE_AND_LINEAGE/WP3_R/FINANCIAL_REPORT_FRESHNESS_CURRENT.json \
            investment_os_runtime/00_CONTROL/WP3_R_CANDIDATE_REFRESH_ACCEPTANCE_RECORD.json

      - name: Record summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## WP3-R Weekly Candidate Screen
          - 73 Candidate Core, Shadow and Research Queue names
          - Price, daily change, liquidity and current valuation snapshot
          - Observation-only; no Candidate membership or Research Object mutation
          - No portfolio mutation, order or trade authority
          EOF
