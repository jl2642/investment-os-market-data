name: Round 3 SEC Exact Route Probe
run-name: "Round 3 probe exact official SEC routes and raw-response hashing"

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/round3-sec-exact-route-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  TRADE_AUTHORITY: NONE

jobs:
  exact-route-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Probe exact Round 3 SEC official routes
        id: probe
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import urllib.error
          import urllib.request

          urls = [
              "https://www.sec.gov/files/company_tickers.json",
              "https://data.sec.gov/submissions/CIK0000320193.json",
              "https://data.sec.gov/api/xbrl/companyfacts/CIK0000320193.json",
          ]
          headers = {
              "User-Agent": "InvestmentOS-Round3/1.0 jl2642@users.noreply.github.com",
              "From": "jl2642@users.noreply.github.com",
              "Accept": "application/json",
              "Accept-Encoding": "identity",
          }
          results = []
          for url in urls:
              status = None
              payload = b""
              content_type = None
              error = None
              try:
                  req = urllib.request.Request(url, headers=headers, method="GET")
                  with urllib.request.urlopen(req, timeout=30) as response:
                      status = int(response.status)
                      payload = response.read()
                      content_type = response.headers.get("Content-Type")
              except urllib.error.HTTPError as exc:
                  status = int(exc.code)
                  payload = exc.read()
                  content_type = exc.headers.get("Content-Type") if exc.headers else None
                  error = f"HTTPError:{exc.code}"
              except Exception as exc:  # noqa: BLE001
                  error = f"{type(exc).__name__}:{exc}"
              results.append({
                  "url": url,
                  "http_status": status,
                  "bytes": len(payload),
                  "sha256": hashlib.sha256(payload).hexdigest() if payload else None,
                  "content_type": content_type,
                  "error": error,
                  "source_authority": "SEC_OFFICIAL",
              })

          all_success = all(row["http_status"] == 200 and row["bytes"] > 0 and row["sha256"] for row in results)
          controlled_403 = all(row["http_status"] == 403 for row in results)
          print(json.dumps({
              "execution_environment": "GITHUB_HOSTED_RUNNER_EXACT_ROUND3_PROBE",
              "results": results,
              "all_success": all_success,
              "controlled_403": controlled_403,
              "orders": 0,
              "trade_authority": "NONE",
          }, indent=2, sort_keys=True))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"all_success={'true' if all_success else 'false'}\n")
              handle.write(f"controlled_403={'true' if controlled_403 else 'false'}\n")
          if not all_success and not controlled_403:
              raise SystemExit("ROUND3_SEC_EXACT_ROUTE_PROBE_UNEXPECTED_MIXED_FAILURE")
          PY

      - name: SEC exact routes direct available with raw-response SHA
        if: steps.probe.outputs.all_success == 'true'
        run: echo "ROUND3_SEC_GITHUB_HOSTED_DIRECT_AVAILABLE"

      - name: SEC exact routes repeatable controlled 403
        if: steps.probe.outputs.controlled_403 == 'true'
        run: echo "ROUND3_SEC_GITHUB_HOSTED_DIRECT_BLOCKED_403"

      - name: Record authority boundary
        run: |
          echo "orders=0"
          echo "trade_authority=NONE"
          echo "This probe creates no Candidate, portfolio, decision or SEC success state."
