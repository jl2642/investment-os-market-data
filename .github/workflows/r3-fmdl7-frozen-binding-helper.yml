name: R3 temporary FMDL7 frozen-binding helper

on:
  push:
    branches:
      - agent/r3-daily-publication-pathspec-fix

permissions:
  contents: write

jobs:
  rebind-historical-contracts:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r3-daily-publication-pathspec-fix
          fetch-depth: 1
      - name: Rebind FMDL7 historical contracts to immutable evidence
        run: |
          python - <<'PY'
          from pathlib import Path

          old = '"path": "outputs/investment_os/INVESTMENT_OS_MARKET_DATA_INTERFACE.json"'
          new = '"path": "evidence/fmdl7/frozen_inputs/FMDL_A_SHARE_MARKET_DATA_INTERFACE_20260717.json"'
          targets = [
              Path('config/fmdl7a_state_reconciliation_contract.json'),
              Path('config/fmdl7d_operations_controls_contract.json'),
          ]
          frozen = Path('evidence/fmdl7/frozen_inputs/FMDL_A_SHARE_MARKET_DATA_INTERFACE_20260717.json')
          if not frozen.exists():
              raise SystemExit('FROZEN_INTERFACE_EVIDENCE_MISSING')
          for path in targets:
              text = path.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'EXPECTED_ONE_DYNAMIC_BINDING:{path}:{text.count(old)}')
              if new in text:
                  raise SystemExit(f'ALREADY_REBOUND:{path}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          git diff -- config/fmdl7a_state_reconciliation_contract.json config/fmdl7d_operations_controls_contract.json
      - name: Commit bounded contract reconciliation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/fmdl7a_state_reconciliation_contract.json config/fmdl7d_operations_controls_contract.json
          git commit -m "R3: bind historical FMDL7 contracts to frozen A-share evidence"
          git push origin HEAD:agent/r3-daily-publication-pathspec-fix
