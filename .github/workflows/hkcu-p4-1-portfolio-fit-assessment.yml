name: HKCU P4-1 Portfolio Fit Assessment

on:
  pull_request:
    paths:
      - 'config/hkcu_p4_1_portfolio_fit_assessment_contract.json'
      - 'pipeline/hkcu_p4_1_portfolio_fit_assessment.py'
      - 'scripts/validate_hkcu_p4_1_portfolio_fit_assessment.py'
      - 'tests/test_hkcu_p4_1_portfolio_fit_assessment.py'
      - 'docs/HKCU-P4-1_PORTFOLIO_FIT_ASSESSMENT.md'
      - '.github/workflows/hkcu-p4-1-portfolio-fit-assessment.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-and-scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q tests/test_hkcu_p4_1_portfolio_fit_assessment.py
      - name: Enforce isolated P4-1 scope
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}"
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" > /tmp/p4_1_paths.txt
          cat /tmp/p4_1_paths.txt
          python - <<'PY'
          from pathlib import Path
          allowed = {
              'config/hkcu_p4_1_portfolio_fit_assessment_contract.json',
              'pipeline/hkcu_p4_1_portfolio_fit_assessment.py',
              'scripts/validate_hkcu_p4_1_portfolio_fit_assessment.py',
              'tests/test_hkcu_p4_1_portfolio_fit_assessment.py',
              'docs/HKCU-P4-1_PORTFOLIO_FIT_ASSESSMENT.md',
              '.github/workflows/hkcu-p4-1-portfolio-fit-assessment.yml',
          }
          actual = {x.strip() for x in Path('/tmp/p4_1_paths.txt').read_text().splitlines() if x.strip()}
          bad = sorted(actual - allowed)
          if bad:
              raise SystemExit('P4_1_SCOPE_VIOLATION:' + ','.join(bad))
          protected = ('outputs/hk_candidate/', 'outputs/simulation/', 'outputs/real', 'investment_os_runtime/30_STATE_CURRENT/', 'orders/')
          mutations = sorted(x for x in actual if x.startswith(protected))
          if mutations:
              raise SystemExit('P4_1_PROTECTED_PATH_MUTATION:' + ','.join(mutations))
          PY

  real-assessment:
    needs: unit-and-scope
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Execute P4-1 against current Canonical inputs
        run: |
          rm -rf work/hkcu_p4_1
          python pipeline/hkcu_p4_1_portfolio_fit_assessment.py --repo-root . --output work/hkcu_p4_1
      - name: Independently validate P4-1 assessment
        run: |
          python scripts/validate_hkcu_p4_1_portfolio_fit_assessment.py --repo-root . --output work/hkcu_p4_1
      - name: Render P4-1 decision and context gaps
        if: always()
        run: |
          test ! -f work/hkcu_p4_1/HKCU_P4_1_DECISION.json || cat work/hkcu_p4_1/HKCU_P4_1_DECISION.json
          test ! -f work/hkcu_p4_1/HKCU_P4_1_QUALITY_REPORT.json || cat work/hkcu_p4_1/HKCU_P4_1_QUALITY_REPORT.json
          test ! -f work/hkcu_p4_1/HKCU_P4_1_CONTEXT_GAP_REGISTER.csv || cat work/hkcu_p4_1/HKCU_P4_1_CONTEXT_GAP_REGISTER.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hkcu-p4-1-portfolio-fit-assessment
          path: work/hkcu_p4_1/HKCU_P4_1_*
          if-no-files-found: error
