name: Strategy Kernel Phase 3D-R2 Performance Measurement

on:
  pull_request:
    paths:
      - 'strategy_kernel_v2/**'
      - '.github/workflows/strategy-kernel-phase3d-r2-performance-measurement.yml'
  workflow_dispatch:

concurrency:
  group: strategy-kernel-phase3d-r2-performance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  performance-measurement:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Freeze and test performance measurement contract
        run: python -m unittest strategy_kernel_v2.tests.test_phase3d_r2_performance_measurement
      - name: Re-validate Phase 3D-R2 Round 1 parent
        run: python -m strategy_kernel_v2.validate_phase3d_r2_measurability
      - name: Execute and validate deterministic R2 performance measurement
        run: python -m strategy_kernel_v2.validate_phase3d_r2_performance_measurement
      - name: Validate accepted Independent Holdout remains unchanged
        run: python -m strategy_kernel_v2.validate_phase3_r2_independent_holdout_replay
      - name: Validate Phase 3C-R2B remains unchanged
        run: python -m strategy_kernel_v2.validate_phase3c_r2b
      - name: Validate Phase 3B-R2 remains unchanged
        run: python -m strategy_kernel_v2.validate_phase3b_r2
      - name: Validate historical Phase 3F remains blocked
        run: python -m strategy_kernel_v2.validate_phase3f
      - name: Validate Post-3F path
        run: python -m strategy_kernel_v2.validate_post3f_research_path
      - name: Validate program consistency
        run: python strategy_kernel_v2/program_consistency.py
      - name: Run program governance regressions
        run: python -m unittest strategy_kernel_v2.tests.test_program_governance strategy_kernel_v2.tests.test_post3f_research_path
      - name: Upload deterministic performance measurement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3d-r2-performance-measurement
          retention-days: 30
          if-no-files-found: ignore
          path: strategy_kernel_v2/generated/PHASE3D_R2_PERFORMANCE_MEASUREMENT.json
