name: Strategy Kernel Phase 3E-R2 Structural Support Gate

on:
  pull_request:
    paths:
      - 'strategy_kernel_v2/**'
      - '.github/workflows/strategy-kernel-phase3e-r2-structural-support-gate.yml'
  workflow_dispatch:

concurrency:
  group: strategy-kernel-phase3e-r2-support-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  structural-support-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test frozen structural support contract
        run: python -m unittest strategy_kernel_v2.tests.test_phase3e_r2_structural_support_gate
      - name: Execute result-value-blind structural support gate
        run: python -m strategy_kernel_v2.validate_phase3e_r2_structural_support_gate
      - name: Re-validate accepted Phase 3D-R2 performance
        run: python -m strategy_kernel_v2.validate_phase3d_r2_performance_measurement
      - name: Validate Phase 3D-R2 outcome evidence remains accepted
        run: python -m strategy_kernel_v2.validate_phase3d_r2_outcome_evidence
      - name: Validate Independent Holdout remains unchanged
        run: python -m strategy_kernel_v2.validate_phase3_r2_independent_holdout_replay
      - name: Validate Phase 3C-R2B remains unchanged
        run: python -m strategy_kernel_v2.validate_phase3c_r2b
      - name: Validate Phase 3B-R2 remains unchanged
        run: python -m strategy_kernel_v2.validate_phase3b_r2
      - name: Validate historical Phase 3E remains historical only
        run: python -m strategy_kernel_v2.validate_phase3e
      - name: Validate historical Phase 3F remains blocked
        run: python -m strategy_kernel_v2.validate_phase3f
      - name: Validate Post-3F path
        run: python -m strategy_kernel_v2.validate_post3f_research_path
      - name: Validate program consistency
        run: python strategy_kernel_v2/program_consistency.py
      - name: Upload structural support gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3e-r2-structural-support-gate
          retention-days: 30
          if-no-files-found: ignore
          path: strategy_kernel_v2/generated/PHASE3E_R2_STRUCTURAL_SUPPORT_GATE.json
