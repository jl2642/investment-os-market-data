name: HKCU P3-2 PR Materializer

on:
  pull_request:
    branches: [main]
    paths:
      - 'config/hkcu_p3_2_candidate_pool_promotion_contract.json'
      - 'pipeline/hkcu_p3_2_candidate_pool_promotion.py'
      - '.github/workflows/hkcu-p3-2-pr-materializer.yml'

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'agent/hkcu-p3-2-candidate-pool-promotion'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build and validate exact Current
        run: |
          rm -rf work/hkcu_p3_2_materializer
          python pipeline/hkcu_p3_2_candidate_pool_promotion.py \
            --repo-root . \
            --output work/hkcu_p3_2_materializer
          mkdir -p outputs/hk_candidate/current
          cp work/hkcu_p3_2_materializer/HK_CANDIDATE_* outputs/hk_candidate/current/
          python scripts/validate_hkcu_p3_2_candidate_pool_promotion.py \
            --repo-root . \
            --output work/hkcu_p3_2_materializer \
            --committed-current outputs/hk_candidate/current
      - name: Commit Current and remove ephemeral materializers
        run: |
          rm -f .github/workflows/hkcu-p3-2-pr-materializer.yml
          rm -f .github/workflows/hkcu-p3-2-bootstrap-current.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add outputs/hk_candidate/current/ .github/workflows/
          if git diff --cached --quiet; then
            echo 'No materialization delta.'
            exit 0
          fi
          git commit -m 'HKCU P3-2: materialize audited Candidate Current'
          git push origin HEAD:${{ github.head_ref }}
