name: P4-5 Clean Baseline Forward Parallel Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "automation/forward_validation/**"
      - ".github/workflows/p4-5-forward-validation.yml"
  push:
    branches: [main]
    paths:
      - "automation/forward_validation/**"
      - ".github/workflows/p4-5-forward-validation.yml"
  schedule:
    - cron: "50 8 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: p4-5-forward-validation-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TRADE_AUTHORITY: NONE
  P45_CONTRACT_REF: agent/strategy-kernel-p4-5-clean-baseline-forward-validation-contract-20260828
  P45_CONTRACT_HEAD: 63b2df2c79cb65856ecee3bf6db1f2ac55408d12
  RUNTIME_DIR: .p4_5_runtime
  FROZEN_RUNTIME: .p4_5_frozen_runtime
  OUTPUT_DIR: .p4_5_output

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Fetch frozen P4-5 contract and governed Operating Current inputs
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin             refs/heads/operating-current:refs/remotes/origin/operating-current             "refs/heads/$P45_CONTRACT_REF:refs/remotes/origin/p4-5-contract"             --force --no-tags
          CONTRACT_ACTUAL="$(git rev-parse refs/remotes/origin/p4-5-contract)"
          [[ "$CONTRACT_ACTUAL" == "$P45_CONTRACT_HEAD" ]] || {
            echo "P45_CONTRACT_HEAD_DRIFT:$CONTRACT_ACTUAL:$P45_CONTRACT_HEAD"
            exit 1
          }

          mkdir -p "$RUNTIME_DIR" "$FROZEN_RUNTIME/strategy_kernel_v2"
          git show origin/operating-current:operating_current/OPERATING_CURRENT_INDEX.json > "$RUNTIME_DIR/OPERATING_CURRENT_INDEX.json"
          git show origin/operating-current:operating_current/domains/RESEARCH_D2.json > "$RUNTIME_DIR/RESEARCH_D2_DOMAIN.json"
          git show origin/operating-current:operating_current/recommendations/RECOMMENDATION_CURRENT.json > "$RUNTIME_DIR/RECOMMENDATION_CURRENT.json"
          git show origin/operating-current:operating_current/domains/RECOMMENDATION.json > "$RUNTIME_DIR/RECOMMENDATION_DOMAIN.json"
          git show origin/operating-current:operating_current/trigger_monitor/TRIGGER_MONITOR_CURRENT.json > "$RUNTIME_DIR/TRIGGER_MONITOR_CURRENT.json"
          git show origin/operating-current:operating_current/shadow_book/SHADOW_BOOK_CURRENT.json > "$RUNTIME_DIR/SHADOW_BOOK_CURRENT.json"

          D2_BRANCH="$(python - <<'PY'
          import json
          x=json.load(open(".p4_5_runtime/RESEARCH_D2_DOMAIN.json",encoding="utf-8"))
          print(x["source_branch"])
          PY
          )"
          D2_COMMIT="$(python - <<'PY'
          import json
          x=json.load(open(".p4_5_runtime/RESEARCH_D2_DOMAIN.json",encoding="utf-8"))
          print(x["source_commit_sha"])
          PY
          )"
          git fetch origin "refs/heads/$D2_BRANCH:refs/remotes/origin/p4-5-d2" --force --no-tags
          [[ "$(git rev-parse refs/remotes/origin/p4-5-d2)" == "$D2_COMMIT" ]] || {
            echo "P45_D2_SOURCE_HEAD_DRIFT"
            exit 1
          }
          echo "$D2_COMMIT" > "$RUNTIME_DIR/D2_COMMIT"

          for path in             strategy_kernel_v2/__init__.py             strategy_kernel_v2/PHASE3B_R2_MODEL_CONTRACT.json             strategy_kernel_v2/phase3b_r2_contract.py             strategy_kernel_v2/historical_feature_extractor.py
          do
            mkdir -p "$FROZEN_RUNTIME/$(dirname "$path")"
            git show "refs/remotes/origin/p4-5-contract:$path" > "$FROZEN_RUNTIME/$path"
          done
          git show refs/remotes/origin/p4-5-contract:strategy_kernel_v2/PHASE4_P4_5_CLEAN_BASELINE_FORWARD_VALIDATION_CONTRACT.json > "$RUNTIME_DIR/P45_CONTRACT.json"

      - name: Compile implementation
        run: |
          python -m py_compile             automation/forward_validation/registered_evidence.py             automation/forward_validation/build_forward_validation.py             automation/forward_validation/market_outcomes.py             automation/forward_validation/bind_checkpoint_entry.py             automation/forward_validation/refresh_forward_outcomes.py             automation/forward_validation/publish_forward_validation.py

      - name: Deterministic P4-5 tests
        run: python -m unittest automation.forward_validation.tests.test_forward_validation -v

      - name: Validate frozen contract identity and preserved gates
        run: |
          python - <<'PY'
          import json
          c=json.load(open(".p4_5_runtime/P45_CONTRACT.json",encoding="utf-8"))
          assert c["status"]=="FROZEN_PRE_BASELINE_IMPLEMENTATION"
          assert c["forward_checkpoint_selector"]["selector"]=="CENSUS_OF_ALL_ELIGIBLE_DISTINCT_POST_CUTOFF_REGISTERED_EVIDENCE_EVENTS"
          assert set(c["forward_checkpoint_selector"]["registered_evidence_families"])=={
              "RESEARCH_D2","CANDIDATE_STATE","REAL_ACCOUNT_STATE",
              "RESEARCH_CORE2","RESEARCH_601138_P0","DECISION_00669_BUY_REVIEW",
          }
          assert c["runner_set"]["candidate"]["model_version"]=="R2.0.1_RESEARCH"
          assert c["runner_set"]["candidate"]["transform_rule_count"]==20
          assert c["economic_measurement"]["fixed_horizon_exchange_sessions"]==[1,3,5]
          g=c["forward_sufficiency_gate"]
          assert g["minimum_complete_economically_mature_parallel_cycles"]==12
          assert g["minimum_distinct_iso_weeks"]==4
          assert g["minimum_distinct_evidence_regimes"]==4
          assert g["minimum_distinct_comparison_signatures"]==2
          assert g["minimum_distinct_edges_per_observed_signature"]==6
          assert c["protected_state"]["orders"]==0
          assert c["protected_state"]["trade_authority"]=="NONE"
          print("P45_FROZEN_CONTRACT_PIN_PASS")
          PY

      - name: Build baseline candidate against current production state without network
        shell: bash
        run: |
          set -Eeuo pipefail
          D2_COMMIT="$(cat "$RUNTIME_DIR/D2_COMMIT")"
          python automation/forward_validation/build_forward_validation.py             --mode baseline             --repo-root .             --main-source-commit "$(git rev-parse HEAD)"             --d2-source-commit "$D2_COMMIT"             --recommendation-current "$RUNTIME_DIR/RECOMMENDATION_CURRENT.json"             --recommendation-domain "$RUNTIME_DIR/RECOMMENDATION_DOMAIN.json"             --trigger-current "$RUNTIME_DIR/TRIGGER_MONITOR_CURRENT.json"             --shadow-current "$RUNTIME_DIR/SHADOW_BOOK_CURRENT.json"             --operating-index "$RUNTIME_DIR/OPERATING_CURRENT_INDEX.json"             --output-dir "$OUTPUT_DIR"

      - name: Validate baseline candidate remains pre-cutoff and zero-evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path(".p4_5_output")
          b=json.load(open(root/"FORWARD_BASELINE_CANDIDATE.json",encoding="utf-8"))
          c=json.load(open(root/"FORWARD_VALIDATION_CURRENT.json",encoding="utf-8"))
          r=json.load(open(root/"cycle_receipt.json",encoding="utf-8"))
          assert b["eligibility_cutoff_utc"] is None
          assert set(b["registered_family_baselines"])=={
              "RESEARCH_D2","CANDIDATE_STATE","REAL_ACCOUNT_STATE",
              "RESEARCH_CORE2","RESEARCH_601138_P0","DECISION_00669_BUY_REVIEW",
          }
          assert c["phase4_forward_observation_count"]==0
          assert c["phase4_realized_outcome_read_count"]==0
          assert c["phase5_migration_allowed"] is False
          assert r["new_checkpoint_count"]==0
          assert r["outcome_read_increment"]==0
          assert r["orders"]==0 and r["trade_authority"]=="NONE"
          print("P45_BASELINE_CANDIDATE_PASS")
          PY

      - name: Enforce protected-state and stacked-governance isolation
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin main --no-tags
          changed="$(git diff --name-only origin/main...HEAD)"
          echo "$changed"
          if echo "$changed" | grep -Eq '^investment_os_runtime/30_STATE_CURRENT/(10_REAL_ACCOUNT|20_SIMULATION|40_CANDIDATE|50_DECISION_INTERFACE|60_DECISIONS)/'; then
            echo "P45_PROTECTED_STATE_MUTATION"
            exit 1
          fi
          if echo "$changed" | grep -Eq '^strategy_kernel_v2/'; then
            echo "P45_STACKED_GOVERNANCE_CHAIN_MUST_NOT_ENTER_MAIN"
            exit 1
          fi
          if echo "$changed" | grep -Eq '^automation/(recommendations|opportunity_funnel|research_queue_d2|shadow_book)/'; then
            echo "P45_UPSTREAM_COMPONENT_REWRITE_NOT_AUTHORIZED"
            exit 1
          fi

      - name: Upload P4-5 validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: p4-5-forward-validation-${{ github.run_id }}-a${{ github.run_attempt }}
          path: |
            .p4_5_output/
            .p4_5_runtime/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  operate:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Fetch frozen contract and all governed runtime inputs
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin             refs/heads/operating-current:refs/remotes/origin/operating-current             "refs/heads/$P45_CONTRACT_REF:refs/remotes/origin/p4-5-contract"             --force --no-tags
          [[ "$(git rev-parse refs/remotes/origin/p4-5-contract)" == "$P45_CONTRACT_HEAD" ]] || {
            echo "P45_CONTRACT_HEAD_DRIFT"
            exit 1
          }
          mkdir -p "$RUNTIME_DIR" "$FROZEN_RUNTIME/strategy_kernel_v2"
          git show origin/operating-current:operating_current/OPERATING_CURRENT_INDEX.json > "$RUNTIME_DIR/OPERATING_CURRENT_INDEX.json"
          git show origin/operating-current:operating_current/domains/RESEARCH_D2.json > "$RUNTIME_DIR/RESEARCH_D2_DOMAIN.json"
          git show origin/operating-current:operating_current/recommendations/RECOMMENDATION_CURRENT.json > "$RUNTIME_DIR/RECOMMENDATION_CURRENT.json"
          git show origin/operating-current:operating_current/domains/RECOMMENDATION.json > "$RUNTIME_DIR/RECOMMENDATION_DOMAIN.json"
          git show origin/operating-current:operating_current/trigger_monitor/TRIGGER_MONITOR_CURRENT.json > "$RUNTIME_DIR/TRIGGER_MONITOR_CURRENT.json"
          git show origin/operating-current:operating_current/shadow_book/SHADOW_BOOK_CURRENT.json > "$RUNTIME_DIR/SHADOW_BOOK_CURRENT.json"

          D2_BRANCH="$(python - <<'PY'
          import json
          x=json.load(open(".p4_5_runtime/RESEARCH_D2_DOMAIN.json",encoding="utf-8"))
          print(x["source_branch"])
          PY
          )"
          D2_COMMIT="$(python - <<'PY'
          import json
          x=json.load(open(".p4_5_runtime/RESEARCH_D2_DOMAIN.json",encoding="utf-8"))
          print(x["source_commit_sha"])
          PY
          )"
          git fetch origin "refs/heads/$D2_BRANCH:refs/remotes/origin/p4-5-d2" --force --no-tags
          [[ "$(git rev-parse refs/remotes/origin/p4-5-d2)" == "$D2_COMMIT" ]] || {
            echo "P45_D2_SOURCE_HEAD_DRIFT"
            exit 1
          }
          echo "$D2_COMMIT" > "$RUNTIME_DIR/D2_COMMIT"

          for path in             strategy_kernel_v2/__init__.py             strategy_kernel_v2/PHASE3B_R2_MODEL_CONTRACT.json             strategy_kernel_v2/phase3b_r2_contract.py             strategy_kernel_v2/historical_feature_extractor.py
          do
            mkdir -p "$FROZEN_RUNTIME/$(dirname "$path")"
            git show "refs/remotes/origin/p4-5-contract:$path" > "$FROZEN_RUNTIME/$path"
          done

      - name: Detect baseline or active-forward mode
        id: mode
        shell: bash
        run: |
          set -Eeuo pipefail
          if git cat-file -e origin/operating-current:operating_current/forward_validation/FORWARD_BASELINE_CURRENT.json 2>/dev/null; then
            echo "mode=collect" >> "$GITHUB_OUTPUT"
          else
            echo "mode=baseline" >> "$GITHUB_OUTPUT"
          fi

      - name: Build clean baseline candidate
        if: steps.mode.outputs.mode == 'baseline'
        shell: bash
        run: |
          set -Eeuo pipefail
          python automation/forward_validation/build_forward_validation.py             --mode baseline             --repo-root .             --main-source-commit "$(git rev-parse HEAD)"             --d2-source-commit "$(cat "$RUNTIME_DIR/D2_COMMIT")"             --recommendation-current "$RUNTIME_DIR/RECOMMENDATION_CURRENT.json"             --recommendation-domain "$RUNTIME_DIR/RECOMMENDATION_DOMAIN.json"             --trigger-current "$RUNTIME_DIR/TRIGGER_MONITOR_CURRENT.json"             --shadow-current "$RUNTIME_DIR/SHADOW_BOOK_CURRENT.json"             --operating-index "$RUNTIME_DIR/OPERATING_CURRENT_INDEX.json"             --output-dir "$OUTPUT_DIR"

      - name: Publish clean baseline atomically
        if: steps.mode.outputs.mode == 'baseline'
        shell: bash
        run: |
          set -Eeuo pipefail
          MAIN_HEAD="$(git rev-parse HEAD)"
          python -m automation.forward_validation.publish_forward_validation             --baseline-candidate "$OUTPUT_DIR/FORWARD_BASELINE_CANDIDATE.json"             --current "$OUTPUT_DIR/FORWARD_VALIDATION_CURRENT.json"             --observation-ledger "$OUTPUT_DIR/FORWARD_OBSERVATION_LEDGER.jsonl"             --cycle-receipt "$OUTPUT_DIR/cycle_receipt.json"             --source-workflow "P4-5 Clean Baseline Forward Parallel Validation"             --source-run-id "${{ github.run_id }}"             --source-run-attempt "${{ github.run_attempt }}"             --source-branch main             --source-commit "$MAIN_HEAD"

      - name: Verify clean baseline remote readback
        if: steps.mode.outputs.mode == 'baseline'
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin refs/heads/operating-current:refs/remotes/origin/operating-current --force --no-tags
          python - <<'PY'
          import json,subprocess
          def show(path):
              return json.loads(subprocess.check_output(["git","show",f"origin/operating-current:{path}"],text=True))
          b=show("operating_current/forward_validation/FORWARD_BASELINE_CURRENT.json")
          c=show("operating_current/forward_validation/FORWARD_VALIDATION_CURRENT.json")
          d=show("operating_current/domains/FORWARD_VALIDATION.json")
          assert b["status"]=="CLEAN_BASELINE_ACCEPTED"
          assert b["eligibility_cutoff_utc"]==d["published_at_utc"]
          assert b["eligibility_cutoff_utc"]>"2026-08-27T13:42:29Z"
          assert c["eligibility_cutoff_utc"]==b["eligibility_cutoff_utc"]
          assert c["phase4_forward_observation_count"]==0
          assert c["phase4_realized_outcome_read_count"]==0
          assert c["phase5_migration_allowed"] is False
          assert d["status"]=="PASS"
          assert d["protected_mutations"]=={"candidate_membership":0,"real_account":0,"simulation":0}
          assert d["orders"]==0 and d["trade_authority"]=="NONE"
          print({
              "baseline":"PASS",
              "cutoff":b["eligibility_cutoff_utc"],
              "observations":0,"outcomes":0,"phase5":False,
              "orders":0,"trade_authority":"NONE",
          })
          PY

      - name: Materialize prior P4-5 state for active collection
        if: steps.mode.outputs.mode == 'collect'
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNTIME_DIR/prior_checkpoints" "$RUNTIME_DIR/d2_receipts"
          git show origin/operating-current:operating_current/forward_validation/FORWARD_BASELINE_CURRENT.json > "$RUNTIME_DIR/FORWARD_BASELINE_CURRENT.json"
          git show origin/operating-current:operating_current/forward_validation/FORWARD_VALIDATION_CURRENT.json > "$RUNTIME_DIR/FORWARD_VALIDATION_CURRENT.json"
          git show origin/operating-current:operating_current/forward_validation/FORWARD_OBSERVATION_LEDGER.jsonl > "$RUNTIME_DIR/FORWARD_OBSERVATION_LEDGER.jsonl"
          while IFS= read -r path; do
            [[ -n "$path" ]] || continue
            git show "origin/operating-current:$path" > "$RUNTIME_DIR/prior_checkpoints/$(basename "$path")"
          done < <(git ls-tree -r --name-only origin/operating-current -- operating_current/forward_validation/checkpoints)
          while IFS= read -r path; do
            [[ -n "$path" ]] || continue
            git show "origin/operating-current:$path" > "$RUNTIME_DIR/d2_receipts/$(basename "$path")"
          done < <(git ls-tree -r --name-only origin/operating-current -- operating_current/runs/RESEARCH_D2)

      - name: Discover all eligible registered evidence events and build parallel checkpoints
        if: steps.mode.outputs.mode == 'collect'
        shell: bash
        run: |
          set -Eeuo pipefail
          python automation/forward_validation/build_forward_validation.py             --mode collect             --repo-root .             --main-source-commit "$(git rev-parse HEAD)"             --d2-source-commit "$(cat "$RUNTIME_DIR/D2_COMMIT")"             --recommendation-current "$RUNTIME_DIR/RECOMMENDATION_CURRENT.json"             --recommendation-domain "$RUNTIME_DIR/RECOMMENDATION_DOMAIN.json"             --trigger-current "$RUNTIME_DIR/TRIGGER_MONITOR_CURRENT.json"             --shadow-current "$RUNTIME_DIR/SHADOW_BOOK_CURRENT.json"             --operating-index "$RUNTIME_DIR/OPERATING_CURRENT_INDEX.json"             --d2-receipts-dir "$RUNTIME_DIR/d2_receipts"             --baseline "$RUNTIME_DIR/FORWARD_BASELINE_CURRENT.json"             --forward-current "$RUNTIME_DIR/FORWARD_VALIDATION_CURRENT.json"             --observation-ledger "$RUNTIME_DIR/FORWARD_OBSERVATION_LEDGER.jsonl"             --r2-runtime-root "$FROZEN_RUNTIME"             --output-dir .p4_5_plan

      - name: Assemble immutable checkpoint set
        if: steps.mode.outputs.mode == 'collect'
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p .p4_5_work/checkpoints
          cp "$RUNTIME_DIR"/prior_checkpoints/*.json .p4_5_work/checkpoints/ 2>/dev/null || true
          cp .p4_5_plan/checkpoint_candidates/*.json .p4_5_work/checkpoints/ 2>/dev/null || true

      - name: Refresh only matured 1-3-5 session outcome evidence
        if: steps.mode.outputs.mode == 'collect'
        shell: bash
        run: |
          set -Eeuo pipefail
          python automation/forward_validation/refresh_forward_outcomes.py             --checkpoints-dir .p4_5_work/checkpoints             --current .p4_5_plan/FORWARD_VALIDATION_CURRENT.json             --observation-ledger .p4_5_plan/FORWARD_OBSERVATION_LEDGER.jsonl             --collector-receipt .p4_5_plan/cycle_receipt.json             --output-dir .p4_5_final

      - name: Publish active forward state atomically
        if: steps.mode.outputs.mode == 'collect'
        shell: bash
        run: |
          set -Eeuo pipefail
          MAIN_HEAD="$(git rev-parse HEAD)"
          python -m automation.forward_validation.publish_forward_validation             --current .p4_5_final/FORWARD_VALIDATION_CURRENT.json             --observation-ledger .p4_5_final/FORWARD_OBSERVATION_LEDGER.jsonl             --checkpoints-dir .p4_5_final/checkpoints             --cycle-receipt .p4_5_final/cycle_receipt.json             --source-workflow "P4-5 Clean Baseline Forward Parallel Validation"             --source-run-id "${{ github.run_id }}"             --source-run-attempt "${{ github.run_attempt }}"             --source-branch main             --source-commit "$MAIN_HEAD"

      - name: Remote readback active-forward invariants
        if: steps.mode.outputs.mode == 'collect'
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin refs/heads/operating-current:refs/remotes/origin/operating-current --force --no-tags
          python - <<'PY'
          import json,subprocess
          def show(path):
              return json.loads(subprocess.check_output(["git","show",f"origin/operating-current:{path}"],text=True))
          b=show("operating_current/forward_validation/FORWARD_BASELINE_CURRENT.json")
          c=show("operating_current/forward_validation/FORWARD_VALIDATION_CURRENT.json")
          assert c["eligibility_cutoff_utc"]==b["eligibility_cutoff_utc"]
          assert c["phase5_migration_allowed"] is False
          assert c["controls"]["candidate_membership_mutations"]==0
          assert c["controls"]["real_account_mutations"]==0
          assert c["controls"]["simulation_mutations"]==0
          assert c["controls"]["orders"]==0
          assert c["controls"]["trade_authority"]=="NONE"
          print({
              "readback":"PASS",
              "cutoff":c["eligibility_cutoff_utc"],
              "observations":c["phase4_forward_observation_count"],
              "outcome_reads":c["phase4_realized_outcome_read_count"],
              "mature":c["economically_mature_checkpoint_count"],
              "completion":c["completion_outcome"],
              "phase5_execution":False,
              "orders":0,"trade_authority":"NONE",
          })
          PY

      - name: Record P4-5 boundary
        if: always()
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## P4-5 Clean-Baseline Forward Parallel Validation
          - Frozen contract head: 63b2df2c79cb65856ecee3bf6db1f2ac55408d12.
          - Clean cutoff is created only by the first accepted Operating Current baseline receipt.
          - Only substantive post-cutoff registered evidence events can create checkpoints.
          - Same immutable packet feeds Legacy Policy Baseline and frozen R2.0.1.
          - 1/3/5-session outcome evidence is append-only and cannot mutate packet/model/regime.
          - Unsupported markets remain explicit pending evidence; no cross-market substitution.
          - Candidate / Real / protected Simulation mutations: 0 / 0 / 0.
          - Orders: 0.
          - trade_authority: NONE.
          - Phase-5 execution authority: false.
          EOF
