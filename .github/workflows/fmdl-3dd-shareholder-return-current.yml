name: FMDL 3D-D Shareholder Return Event Current

on:
  pull_request:
    branches: [main]
    paths:
      - "config/fmdl3dd_engine.json"
      - "schemas/fmdl3dd_shareholder_return_event_v1.schema.json"
      - "schemas/fmdl3dd_shareholder_return_current_v1.schema.json"
      - "scripts/fmdl3dd_core.py"
      - "scripts/run_fmdl3dd_shard.py"
      - "scripts/validate_fmdl3dd_shard.py"
      - "scripts/aggregate_fmdl3dd.py"
      - "scripts/validate_fmdl3dd_candidate.py"
      - "scripts/validate_fmdl3dd_contract.py"
      - "scripts/publish_fmdl3dd.py"
      - "tests/test_fmdl3dd_engine.py"
      - "docs/FMDL-3DD_PRODUCT_SPEC.md"
      - ".github/workflows/fmdl-3dd-shareholder-return-current.yml"
  push:
    branches: [main]
    paths:
      - "config/fmdl3dd_engine.json"
      - "schemas/fmdl3dd_shareholder_return_event_v1.schema.json"
      - "schemas/fmdl3dd_shareholder_return_current_v1.schema.json"
      - "scripts/fmdl3dd_core.py"
      - "scripts/run_fmdl3dd_shard.py"
      - "scripts/validate_fmdl3dd_shard.py"
      - "scripts/aggregate_fmdl3dd.py"
      - "scripts/validate_fmdl3dd_candidate.py"
      - "scripts/validate_fmdl3dd_contract.py"
      - "scripts/publish_fmdl3dd.py"
      - "tests/test_fmdl3dd_engine.py"
      - "docs/FMDL-3DD_PRODUCT_SPEC.md"
      - ".github/workflows/fmdl-3dd-shareholder-return-current.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: fmdl-3dd-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: .

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Validate contract and source bindings
        run: python -m scripts.validate_fmdl3dd_contract
      - name: Run deterministic tests
        run: python -m pytest -q tests/test_fmdl3dd_engine.py
      - name: Compile modules
        run: python -m py_compile scripts/fmdl3dd_core.py scripts/run_fmdl3dd_shard.py scripts/validate_fmdl3dd_shard.py scripts/aggregate_fmdl3dd.py scripts/validate_fmdl3dd_candidate.py scripts/validate_fmdl3dd_contract.py scripts/publish_fmdl3dd.py

  shards:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard_id: ["00", "01", "02", "03", "04", "05", "06", "07", "08", "09", "10", "11", "12", "13", "14", "15"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run dividend source shard
        continue-on-error: true
        run: python -m scripts.run_fmdl3dd_shard --shard-id ${{ matrix.shard_id }}
      - name: Independently validate shard
        continue-on-error: true
        run: python -m scripts.validate_fmdl3dd_shard --shard-id ${{ matrix.shard_id }}
      - name: Upload shard package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fmdl3dd-shard-${{ matrix.shard_id }}
          path: outputs/shareholder_returns/full_build/shards/shard-${{ matrix.shard_id }}/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce shard validation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          shard = "${{ matrix.shard_id }}"
          payload = json.loads(Path(f"outputs/shareholder_returns/full_build/shards/shard-{shard}/SHARD_VALIDATION.json").read_text())
          assert payload["status"] == "PASS", payload
          assert payload["hard_failures"] == [], payload
          PY

  aggregate:
    needs: shards
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: fmdl3dd-shard-*
          path: downloaded-shards
          merge-multiple: false
      - name: Aggregate full-Universe shareholder-return candidate
        continue-on-error: true
        run: python -m scripts.aggregate_fmdl3dd --input-root downloaded-shards
      - name: Independently validate aggregate candidate
        continue-on-error: true
        run: python -m scripts.validate_fmdl3dd_candidate
      - name: Upload full-market candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fmdl3dd-shareholder-return-current-candidate
          path: outputs/shareholder_returns/full_build/candidate/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce aggregate acceptance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("outputs/shareholder_returns/full_build/candidate")
          decision = json.loads((root / "FMDL3DD_DECISION.json").read_text())
          validation = json.loads((root / "FMDL3DD_VALIDATION.json").read_text())
          assert decision["status"] == "FMDL3DD_SHAREHOLDER_RETURN_EVENT_CURRENT_ACCEPTED", decision
          assert decision["hard_failures"] == [], decision
          assert validation["status"] == "PASS", validation
          assert validation["hard_failures"] == [], validation
          assert decision["trade_authority"] == "NONE"
          PY
      - name: Publish immutable Shareholder Return Current on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          python -m scripts.publish_fmdl3dd
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config http.postBuffer 524288000
          git add datasets/shareholder_returns/releases outputs/shareholder_returns/current outputs/shareholder_returns/archive outputs/status/FMDL3DD_LAST_SUCCESS.json
          if git diff --cached --quiet; then
            echo "No FMDL-3D-D publication changes"
          else
            git commit -m "data: publish FMDL-3D-D shareholder return Current [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
