name: FMDL Contract Validation

on:
  workflow_dispatch:
  push:
    paths:
      - "config/**"
      - "schemas/**"
      - "docs/**"
      - "scripts/validate_contracts.py"
      - ".github/workflows/contract-validation.yml"
      - "README.md"
      - "investment_os_runtime/00_CONTROL/SYSTEM_CURRENT.json"
      - "investment_os_runtime/00_CONTROL/ACTIVE_WORKFLOW_REGISTRY.json"
      - "investment_os_runtime/00_CONTROL/BRANCH_POLICY.md"
      - ".github/workflows/fmdl-daily-production.yml"
      - ".github/workflows/r0_product_authority_freeze.yml"
      - ".github/workflows/r2_portfolio_construction.yml"
      - ".github/workflows/fmdl-3-architecture.yml"
      - ".github/workflows/stock-investment-assistant-final-integration.yml"
      - "scripts/materialize_fmdl_history_dependencies.py"
      - "tests/test_post_occ_history_dependency_materialization.py"
      - "tests/test_s1_control_runtime_simplification.py"
  pull_request:
    paths:
      - "config/**"
      - "schemas/**"
      - "docs/**"
      - "scripts/validate_contracts.py"
      - ".github/workflows/contract-validation.yml"
      - "README.md"
      - "investment_os_runtime/00_CONTROL/SYSTEM_CURRENT.json"
      - "investment_os_runtime/00_CONTROL/ACTIVE_WORKFLOW_REGISTRY.json"
      - "investment_os_runtime/00_CONTROL/BRANCH_POLICY.md"
      - ".github/workflows/fmdl-daily-production.yml"
      - ".github/workflows/r0_product_authority_freeze.yml"
      - ".github/workflows/r2_portfolio_construction.yml"
      - ".github/workflows/fmdl-3-architecture.yml"
      - ".github/workflows/stock-investment-assistant-final-integration.yml"
      - "scripts/materialize_fmdl_history_dependencies.py"
      - "tests/test_post_occ_history_dependency_materialization.py"
      - "tests/test_s1_control_runtime_simplification.py"

permissions:
  contents: read

jobs:
  validate-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install S1 validation dependencies
        run: python -m pip install --disable-pip-version-check pytest pyyaml
      - name: Validate FMDL contracts and S1 system controls
        run: |
          python scripts/validate_contracts.py
          python -m py_compile scripts/materialize_fmdl_history_dependencies.py
          python - <<'PY'
          from pathlib import Path
          import yaml
          for path in [
              ".github/workflows/fmdl-daily-production.yml",
              ".github/workflows/r0_product_authority_freeze.yml",
              ".github/workflows/r2_portfolio_construction.yml",
              ".github/workflows/fmdl-3-architecture.yml",
              ".github/workflows/stock-investment-assistant-final-integration.yml",
          ]:
              yaml.safe_load(Path(path).read_text(encoding="utf-8"))
          print({"s1_workflow_yaml": "PASS"})
          PY
          pytest -q \
            tests/test_post_occ_history_dependency_materialization.py \
            tests/test_s1_control_runtime_simplification.py
