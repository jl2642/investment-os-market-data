name: HKCU TTI 00669 Buy Review Validation

on:
  pull_request:
    paths:
      - '.github/workflows/hkcu-tti-00669-buy-review-validation.yml'
      - 'investment_os_runtime/00_CONTROL/HKCU_TTI_00669_BUY_REVIEW_ACCEPTANCE_RECORD.json'
      - 'investment_os_runtime/30_STATE_CURRENT/60_DECISIONS/HKCU_TTI_00669_BUY_REVIEW_CURRENT.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Validate scope and no protected economic mutations
        run: |
          git fetch origin main
          python - <<'PY'
          import subprocess
          allowed = {
              '.github/workflows/hkcu-tti-00669-buy-review-validation.yml',
              'investment_os_runtime/00_CONTROL/HKCU_TTI_00669_BUY_REVIEW_ACCEPTANCE_RECORD.json',
              'investment_os_runtime/30_STATE_CURRENT/60_DECISIONS/HKCU_TTI_00669_BUY_REVIEW_CURRENT.json',
          }
          changed = set(subprocess.check_output(
              ['git', 'diff', '--name-only', 'origin/main...HEAD'], text=True
          ).splitlines())
          bad = changed - allowed
          assert not bad, (changed, bad)
          assert changed, 'EMPTY_SCOPE'
          protected_tokens = (
              '30_STATE_CURRENT/10_REAL_ACCOUNT',
              '30_STATE_CURRENT/20_SIMULATION',
              '30_STATE_CURRENT/40_CANDIDATE',
              '/ORDERS',
              '/EXECUTION',
          )
          assert not any(any(token in path for token in protected_tokens) for path in changed), changed
          print({'changed_files': sorted(changed), 'protected_economic_mutations': 0})
          PY

      - name: Validate buy review semantics and no-trade boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          review = json.loads(Path('investment_os_runtime/30_STATE_CURRENT/60_DECISIONS/HKCU_TTI_00669_BUY_REVIEW_CURRENT.json').read_text())
          acceptance = json.loads(Path('investment_os_runtime/00_CONTROL/HKCU_TTI_00669_BUY_REVIEW_ACCEPTANCE_RECORD.json').read_text())

          assert review['security_id'] == 'HKEX:00669'
          assert review['status'] == 'BUY_REVIEW_COMPLETE_NO_TRADE_MONITORING_ACTIVE'
          assert review['execution_instruction'] == 'NO_TRADE'
          assert review['valuation_review']['buy_review_range_hkd'] == {'min': 125.0, 'max': 135.0}
          assert review['valuation_review']['reopen_buy_review_at_or_below_hkd'] == 135.0
          assert review['valuation_review']['high_priority_buy_review_at_or_below_hkd'] == 130.0
          assert review['valuation_review']['attractive_valuation_reunderwrite_at_or_below_hkd'] == 125.0
          assert review['portfolio_sizing_review']['p5b_governed_research_weight'] == 0.01
          assert review['portfolio_sizing_review']['economic_review_weight_range']['hard_review_upper'] == 0.02
          assert review['portfolio_sizing_review']['standard_board_lot_shares'] == 500
          assert review['portfolio_sizing_review']['board_lot_sizing_mismatch'] is True
          assert review['formal_plan']['current_action'] == 'WATCH_NO_TRADE_WAIT_FOR_PRICE_OR_POSITION_SIZING_GATE'
          assert review['formal_plan']['real_position_change_authorized'] is False
          assert review['formal_plan']['simulation_position_change_authorized'] is False
          assert review['formal_plan']['candidate_membership_change_authorized'] is False
          assert review['formal_plan']['target_portfolio_writeback_authorized'] is False
          assert review['formal_plan']['order_authorized'] is False
          assert review['formal_plan']['implementation_ready'] is False
          assert review['formal_plan']['orders'] == 0
          assert review['formal_plan']['trade_authority'] == 'NONE'

          assert acceptance['security_id'] == 'HKEX:00669'
          assert acceptance['review_status'] == review['status']
          assert acceptance['execution_instruction'] == 'NO_TRADE'
          assert acceptance['status'] in {'PENDING_GOVERNED_PR_ACCEPTANCE', 'ACCEPTED_ON_MAIN_NO_TRADE_MONITORING_ACTIVE'}
          assert acceptance['real_position_change_authorized'] is False
          assert acceptance['simulation_position_change_authorized'] is False
          assert acceptance['candidate_membership_change_authorized'] is False
          assert acceptance['target_portfolio_writeback_authorized'] is False
          assert acceptance['order_authorized'] is False
          assert acceptance['implementation_ready'] is False
          assert acceptance['economic_mutations'] == {
              'real_account': 0,
              'simulation': 0,
              'candidate_membership': 0,
              'orders': 0,
          }
          assert acceptance['trade_authority'] == 'NONE'
          print({'status': review['status'], 'execution_instruction': 'NO_TRADE', 'orders': 0})
          PY
