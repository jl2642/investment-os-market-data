name: OCC-R3B Candidate Proposal Recovery
run-name: "OCC-R3B one-shot accepted-Screening Candidate proposal"

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/occ-r3b-candidate-proposal-recovery.yml"
      - "tests/test_occ_r3b_recovery_workflow_contract.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/occ-r3b-candidate-proposal-recovery.yml"
      - "tests/test_occ_r3b_recovery_workflow_contract.py"

permissions:
  contents: write

env:
  TRADE_AUTHORITY: NONE

concurrency:
  group: occ-r3b-candidate-proposal-recovery
  cancel-in-progress: false

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile retained Candidate proposal engine
        run: |
          python -m py_compile             automation/wp3_r/build_candidate_dynamic_loop.py             automation/wp3_r/validate_candidate_dynamic_pr.py
          python tests/test_occ_r3b_recovery_workflow_contract.py

  production:
    if: github.event_name == 'push'
    needs: validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Canonical main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Restore exact accepted 2026-08-28 Screening Current
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin refs/heads/operating-current:refs/remotes/origin/operating-current --force --no-tags
          git show origin/operating-current:operating_current/domains/A_SHARE_FULL_MARKET.json > /tmp/OCC_R3B_SCREENING_CURRENT.json
          python - <<'PY' > /tmp/OCC_R3B_SOURCE.env
          import json
          row=json.load(open('/tmp/OCC_R3B_SCREENING_CURRENT.json',encoding='utf-8'))
          assert row.get('status')=='PASS', row
          assert row.get('qc_status')=='PASS_CHAIN_COHERENT', row
          assert row.get('trade_authority')=='NONE', row
          assert row.get('data_watermark')=='2026-08-28', row
          print('SCREENING_BRANCH='+str(row['source_branch']))
          print('SCREENING_COMMIT='+str(row['source_commit_sha']))
          print('SCREENING_WATERMARK='+str(row['data_watermark']))
          PY
          cat /tmp/OCC_R3B_SOURCE.env >> "$GITHUB_ENV"
          source /tmp/OCC_R3B_SOURCE.env
          git fetch origin "refs/heads/$SCREENING_BRANCH:refs/remotes/origin/occ-r3b-screening" --force --no-tags
          test "$(git rev-parse refs/remotes/origin/occ-r3b-screening)" = "$SCREENING_COMMIT"
          git checkout "$SCREENING_COMMIT" --             outputs/screens/current/SCREENING_MANIFEST.json             outputs/screens/current/SCREENING_LONGLIST.csv
          python - <<'PY'
          import csv,json,os
          manifest=json.load(open('outputs/screens/current/SCREENING_MANIFEST.json',encoding='utf-8'))
          with open('outputs/screens/current/SCREENING_LONGLIST.csv',encoding='utf-8-sig',newline='') as f:
              rows=list(csv.DictReader(f))
          assert manifest.get('as_of_date')==os.environ['SCREENING_WATERMARK'], manifest
          assert len(rows)==100, len(rows)
          assert {row['as_of_date'] for row in rows}=={os.environ['SCREENING_WATERMARK']}
          print({'screening_watermark':os.environ['SCREENING_WATERMARK'],'longlist':len(rows),'trade_authority':'NONE'})
          PY

      - name: Freeze Canonical Candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          cp investment_os_runtime/30_STATE_CURRENT/40_CANDIDATE/CANDIDATE_CURRENT.json /tmp/CANDIDATE_BASE.json
          sha256sum /tmp/CANDIDATE_BASE.json | awk '{print "CANDIDATE_BASE_SHA="$1}' >> "$GITHUB_ENV"

      - name: Force one accepted weekly proposal cycle
        id: loop
        shell: bash
        run: |
          set -Eeuo pipefail
          result="$(python automation/wp3_r/build_candidate_dynamic_loop.py --force-weekly)"
          echo "$result"
          python - "$result" <<'PY' >> "$GITHUB_OUTPUT"
          import json,sys
          data=json.loads(sys.argv[1])
          assert data.get('due') is True, data
          assert data.get('proposal_id')=='ROUND2_CANDIDATE_DELTA_20260828', data
          assert data.get('orders')==0, data
          assert data.get('trade_authority')=='NONE', data
          print('proposal_id='+data['proposal_id'])
          print('status='+data['status'])
          print('admission_count='+str(data.get('admission_count',0)))
          print('dynamic_exit_count='+str(data.get('dynamic_exit_count',0)))
          print('legacy_exit_review_count='+str(data.get('legacy_exit_review_count',0)))
          PY

      - name: Materialize proposed Candidate and restore Canonical
        shell: bash
        env:
          PROPOSAL_ID: ${{ steps.loop.outputs.proposal_id }}
        run: |
          set -Eeuo pipefail
          candidate=investment_os_runtime/30_STATE_CURRENT/40_CANDIDATE/CANDIDATE_CURRENT.json
          proposal_dir="investment_os_runtime/40_EVIDENCE_AND_LINEAGE/WP3_R/DYNAMIC_PROPOSALS/$PROPOSAL_ID"
          proposed="$proposal_dir/CANDIDATE_CURRENT_PROPOSED.json"
          cp "$candidate" "$proposed"
          cp /tmp/CANDIDATE_BASE.json "$candidate"
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          proposal_id=os.environ['PROPOSAL_ID']
          root=Path('investment_os_runtime/40_EVIDENCE_AND_LINEAGE/WP3_R/DYNAMIC_PROPOSALS')/proposal_id
          proposed=root/'CANDIDATE_CURRENT_PROPOSED.json'
          manifest_path=root/'CANDIDATE_DYNAMIC_MANIFEST.json'
          manifest=json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['candidate_current_proposed_path']=str(proposed)
          manifest['candidate_current_proposed_sha256']=hashlib.sha256(proposed.read_bytes()).hexdigest()
          manifest['canonical_candidate_restored_before_publication']=True
          manifest['proposal_then_application_pr_required']=True
          manifest_path.write_text(json.dumps(manifest,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          PY
          cmp -s "$candidate" /tmp/CANDIDATE_BASE.json
          git diff --exit-code HEAD -- "$candidate"

      - name: Validate proposal and write recovery receipt
        shell: bash
        env:
          PROPOSAL_ID: ${{ steps.loop.outputs.proposal_id }}
          ADMISSION_COUNT: ${{ steps.loop.outputs.admission_count }}
          DYNAMIC_EXIT_COUNT: ${{ steps.loop.outputs.dynamic_exit_count }}
          LEGACY_EXIT_REVIEW_COUNT: ${{ steps.loop.outputs.legacy_exit_review_count }}
        run: |
          set -Eeuo pipefail
          proposed="investment_os_runtime/40_EVIDENCE_AND_LINEAGE/WP3_R/DYNAMIC_PROPOSALS/$PROPOSAL_ID/CANDIDATE_CURRENT_PROPOSED.json"
          python automation/wp3_r/validate_candidate_dynamic_pr.py             --base /tmp/CANDIDATE_BASE.json             --head "$proposed"
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path('investment_os_runtime/40_EVIDENCE_AND_LINEAGE/WP3_R/DYNAMIC_PROPOSALS')/os.environ['PROPOSAL_ID']
          proposal=json.loads(Path('investment_os_runtime/30_STATE_CURRENT/45_CANDIDATE_OPERATIONS/CANDIDATE_CHANGE_PROPOSAL_CURRENT.json').read_text(encoding='utf-8'))
          loop=json.loads(Path('investment_os_runtime/30_STATE_CURRENT/45_CANDIDATE_OPERATIONS/CANDIDATE_DYNAMIC_LOOP_CURRENT.json').read_text(encoding='utf-8'))
          assert proposal['as_of']=='2026-08-28_CLOSE', proposal
          assert proposal['controls']['candidate_core_mutations']==0
          assert proposal['controls']['shadow_track_mutations']==0
          assert proposal['controls']['ready_for_user_decision_mutations']==0
          assert proposal['controls']['real_account_mutations']==0
          assert proposal['controls']['simulation_mutations']==0
          assert proposal['controls']['orders']==0
          assert proposal['controls']['trade_authority']=='NONE'
          assert loop['canonical_authority']=='MERGE_OF_GOVERNED_PR_ONLY'
          receipt={
            'schema_version':'1.0.0',
            'status':'PASS_GOVERNED_CANDIDATE_PROPOSAL_RECOVERY',
            'proposal_id':os.environ['PROPOSAL_ID'],
            'screening_watermark':os.environ['SCREENING_WATERMARK'],
            'screening_source_branch':os.environ['SCREENING_BRANCH'],
            'screening_source_commit':os.environ['SCREENING_COMMIT'],
            'candidate_base_sha256':os.environ['CANDIDATE_BASE_SHA'],
            'admission_count':int(os.environ['ADMISSION_COUNT']),
            'dynamic_exit_count':int(os.environ['DYNAMIC_EXIT_COUNT']),
            'legacy_exit_review_count':int(os.environ['LEGACY_EXIT_REVIEW_COUNT']),
            'canonical_candidate_mutations':0,
            'core_shadow_ready_automatic_mutations':0,
            'portfolio_mutations':0,
            'orders':0,
            'trade_authority':'NONE',
          }
          (root/'OCC_R3B_RECOVERY_RECEIPT.json').write_text(json.dumps(receipt,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(receipt,ensure_ascii=False,indent=2))
          PY

      - name: Publish governed one-shot proposal branch
        shell: bash
        env:
          RESULT_BRANCH: automation/occ-r3b-candidate-proposal-${{ github.run_id }}-a${{ github.run_attempt }}
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$RESULT_BRANCH"
          git add             investment_os_runtime/30_STATE_CURRENT/45_CANDIDATE_OPERATIONS/CANDIDATE_DYNAMIC_LEDGER_CURRENT.json             investment_os_runtime/30_STATE_CURRENT/45_CANDIDATE_OPERATIONS/CANDIDATE_CHANGE_PROPOSAL_CURRENT.json             investment_os_runtime/30_STATE_CURRENT/45_CANDIDATE_OPERATIONS/CANDIDATE_DYNAMIC_LOOP_CURRENT.json             investment_os_runtime/40_EVIDENCE_AND_LINEAGE/WP3_R/DYNAMIC_PROPOSALS
          git diff --cached --quiet && { echo "OCC_R3B_RECOVERY_NO_PROPOSAL_DIFF"; exit 1; }
          git commit -m "candidate: publish OCC-R3B governed proposal recovery"
          git push origin "HEAD:refs/heads/$RESULT_BRANCH"
          echo "RESULT_BRANCH=$RESULT_BRANCH" >> "$GITHUB_ENV"
          echo "RESULT_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Prove Canonical Candidate remains unchanged
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin main --force --no-tags
          REMOTE_SHA="$(git show origin/main:investment_os_runtime/30_STATE_CURRENT/40_CANDIDATE/CANDIDATE_CURRENT.json | sha256sum | awk '{print $1}')"
          test "$REMOTE_SHA" = "$CANDIDATE_BASE_SHA"
          {
            echo "## OCC-R3B one-shot production acceptance"
            echo "- proposal_id: `${{ steps.loop.outputs.proposal_id }}`"
            echo "- screening_watermark: `$SCREENING_WATERMARK`"
            echo "- admission_count: `${{ steps.loop.outputs.admission_count }}`"
            echo "- dynamic_exit_count: `${{ steps.loop.outputs.dynamic_exit_count }}`"
            echo "- legacy_exit_review_count: `${{ steps.loop.outputs.legacy_exit_review_count }}`"
            echo "- result_branch: `$RESULT_BRANCH`"
            echo "- result_commit: `$RESULT_COMMIT`"
            echo "- Canonical Candidate mutation: 0"
            echo "- orders: 0"
            echo "- trade_authority: NONE"
          } >> "$GITHUB_STEP_SUMMARY"
