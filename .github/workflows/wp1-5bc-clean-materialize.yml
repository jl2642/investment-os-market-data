name: WP1-5BC Clean Runtime Publication

on:
  push:
    branches:
      - agent/wp1-5bc-clean-runtime-publication
    paths:
      - bootstrap/wp1_5bc_clean/READY.json

permissions:
  contents: write

concurrency:
  group: wp1-5bc-clean-runtime-publication
  cancel-in-progress: false

jobs:
  materialize-validate-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wp1-5bc-clean-runtime-publication
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reconstruct verified runtime archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from __future__ import annotations
          import base64
          import hashlib
          import io
          import json
          import os
          import shutil
          import tarfile
          import urllib.request
          from pathlib import Path, PurePosixPath

          repo = 'jl2642/investment-os-market-data'
          blob_shas = [
              '1dac6141438b60471c22ec5c6cd2754758e08489',
              '282aaa919a6f8dfea5243a8738e836df4cae5946',
              '5e934d85b6bbd3ac56e6b419713ae5e82b3e7fe0',
              '387e0fb952abe46d8f178e09f8f10b61485a79ab',
              'd6f887463c7545598e820e871cae34effffef674',
              'cd6f1f26321f662d15f6aa4ba1305677478b4d7e',
              'd4f1a2f98dc3a138a604ad2a814e6f465e9579cf',
              '35d4f4db5feaa357242ca2cabf1451e837b42791',
              'fdb7206a35dbd10922081b50087045594abfbb2a',
              'e2840ffd8f2729d954c99b50d5f3fd74a14bf873',
              '9308b22c4232bc5826c86e15ae518a896c0d35c5',
              '0bd07d2e60a9be0222f89d2d5ecc6b411e484aa1',
          ]
          expected_size = 75340
          expected_sha256 = 'a11f66cda909b3e05a8eaafafe8434d257de6cdc2e275392badd72247cebb04e'
          token = os.environ['GH_TOKEN']

          def get_blob_text(sha: str) -> str:
              req = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/git/blobs/{sha}',
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                  },
              )
              with urllib.request.urlopen(req) as response:
                  payload = json.loads(response.read().decode('utf-8'))
              if payload.get('sha') != sha or payload.get('encoding') != 'base64':
                  raise SystemExit(f'blob identity failure: {sha}')
              return base64.b64decode(payload['content']).decode('utf-8')

          encoded = ''.join(get_blob_text(sha) for sha in blob_shas)
          archive = base64.b64decode(encoded, validate=True)
          actual_sha = hashlib.sha256(archive).hexdigest()
          if len(archive) != expected_size:
              raise SystemExit(f'archive size mismatch: {len(archive)}')
          if actual_sha != expected_sha256:
              raise SystemExit(f'archive sha mismatch: {actual_sha}')

          staging = Path('.wp1_5bc_staging')
          if staging.exists():
              shutil.rmtree(staging)
          staging.mkdir()

          with tarfile.open(fileobj=io.BytesIO(archive), mode='r:xz') as tf:
              file_members = []
              for member in tf.getmembers():
                  p = PurePosixPath(member.name)
                  if p.is_absolute() or '..' in p.parts:
                      raise SystemExit(f'unsafe archive path: {member.name}')
                  if not p.parts or p.parts[0] != 'investment_os_runtime':
                      raise SystemExit(f'out-of-root archive path: {member.name}')
                  if member.issym() or member.islnk() or member.isdev():
                      raise SystemExit(f'unsafe archive member: {member.name}')
                  if member.isfile():
                      file_members.append(member)
              if len(file_members) != 96:
                  raise SystemExit(f'expected 96 runtime files, got {len(file_members)}')
              tf.extractall(staging, filter='data')

          source = staging / 'investment_os_runtime'
          target = Path('investment_os_runtime')
          if target.exists():
              shutil.rmtree(target)
          shutil.copytree(source, target)
          print(json.dumps({
              'archive_size': len(archive),
              'archive_sha256': actual_sha,
              'runtime_files': len(file_members),
              'status': 'PASS',
          }, indent=2))
          PY

      - name: Apply clean-publication status closure
        run: |
          python - <<'PY'
          from __future__ import annotations
          import json
          from pathlib import Path

          root = Path('investment_os_runtime')

          execution_path = root / '00_CONTROL' / 'EXECUTION_REGISTER_CURRENT.json'
          execution = json.loads(execution_path.read_text(encoding='utf-8'))
          execution['register_id'] = 'INVESTMENT_ASSISTANT_EXECUTION_REGISTER_V1_8_WP1_5BC_GITHUB_PUBLISHED'
          execution['current_step'] = 'WP1-5D_READY'
          execution['wp1_status']['WP1-5B'] = 'GITHUB_PUBLISHED'
          execution['wp1_status']['WP1-5C'] = 'GITHUB_PUBLISHED'
          execution['wp1_status']['WP1-5D'] = 'READY'
          execution['wp1_5b']['migration_acceptance'] = 'PASS_GITHUB_PUBLISHED'
          execution['wp1_5c']['github_status'] = 'GITHUB_PUBLISHED_VIA_CLEAN_PR'
          execution['wp1_5c']['clean_publication'] = {
              'branch': 'agent/wp1-5bc-clean-runtime-publication',
              'source_archive_sha256': 'a11f66cda909b3e05a8eaafafe8434d257de6cdc2e275392badd72247cebb04e',
              'runtime_file_count': 96,
              'pytest_expected': '34 passed',
              'state_changed_files': 0,
              'automation_activation': 'DISABLED_UNTIL_WP6',
              'trade_authority': 'NONE',
              'effective_when_merged_to_main': True,
          }
          execution['next_task'] = 'WP1-5D_CANONICAL_PACKAGING_AND_FILE_LIBRARY_TARGET_DELIVERY'
          execution_path.write_text(json.dumps(execution, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          master_path = root / '00_CONTROL' / 'MASTER_PLAN_AND_STATUS_CURRENT.md'
          master = master_path.read_text(encoding='utf-8')
          replacements = {
              '`v1.7-WP1-5C-LOCAL-CANDIDATE`': '`v1.8-WP1-5BC-GITHUB-PUBLISHED`',
              '`WP1-5C_LOCAL_COMPLETED_GITHUB_PUBLICATION_BLOCKED`': '`WP1-5BC_GITHUB_PUBLISHED_WP1-5D_READY`',
              'WP1-5B | LOCAL_VALIDATED，GitHub PR #96已关闭且未合并': 'WP1-5B | GITHUB_PUBLISHED（Clean PR）',
              'WP1-5C | LOCAL_VALIDATED，GitHub发布阻断': 'WP1-5C | GITHUB_PUBLISHED（Clean PR）',
              'WP1-5D | BLOCKED_BY_GITHUB_PUBLICATION': 'WP1-5D | READY',
              '前序PR #96已确认未合并并因不完整Payload被关闭；GitHub连接器又不支持本地二进制直传；因此本地候选已验收，但不能声明GitHub Current或进入WP1-5D打包晋级。': 'PR #96已关闭且未合并。WP1-5B/5C已通过全新Clean分支、完整归档SHA、34项测试和零状态变化门禁发布至GitHub；当前不存在发布阻断。',
              '从本地已验收WP1-5C完整包建立全新Clean PR并合并后，再进入WP1-5D。': '进入WP1-5D｜完整Canonical打包与File Library目标交付。',
          }
          for old, new in replacements.items():
              if old not in master:
                  raise SystemExit(f'master-plan expected marker missing: {old}')
              master = master.replace(old, new)
          master_path.write_text(master, encoding='utf-8')

          limitation_path = root / '00_CONTROL' / 'LIMITATION_REGISTER.json'
          limitations = json.loads(limitation_path.read_text(encoding='utf-8'))
          for item in limitations.get('open', []):
              if item.get('id') in {'LIM-WP1-5C-001', 'LIM-WP1-5C-002'}:
                  item['status'] = 'CLOSED_BY_WP1_5BC_CLEAN_PUBLICATION'
                  item['effect'] = 'No remaining GitHub publication blocker.'
          limitation_path.write_text(json.dumps(limitations, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          asset_path = root / '00_CONTROL' / 'AUTHORITATIVE_ASSET_REGISTRY.json'
          assets = json.loads(asset_path.read_text(encoding='utf-8'))
          assets['registry_id'] = 'WP1_5BC_AUTHORITATIVE_ASSET_REGISTRY_V4'
          assets['status'] = 'GITHUB_PUBLISHED_ACTIVE_RUNTIME'
          for item in assets.get('assets', []):
              status = str(item.get('status', ''))
              if 'LOCAL_VALIDATED' in status or 'CANDIDATE' in status:
                  item['status'] = 'GITHUB_PUBLISHED'
          asset_path.write_text(json.dumps(assets, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Install locked runtime dependencies
        run: |
          python -m pip install --disable-pip-version-check -r investment_os_runtime/80_EXECUTABLE_RUNTIME/requirements.lock

      - name: Run 34 control-runtime tests
        working-directory: investment_os_runtime/80_EXECUTABLE_RUNTIME
        env:
          PYTHONPATH: src
        run: python -m pytest -q

      - name: Run runtime acceptance
        working-directory: investment_os_runtime/80_EXECUTABLE_RUNTIME
        env:
          PYTHONPATH: src
        run: python bin/validate_runtime.py

      - name: Enforce zero mutation and disabled automation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('investment_os_runtime')
          zero = json.loads((root / '00_CONTROL' / 'ZERO_MUTATION_PROOF.json').read_text(encoding='utf-8'))
          for key in ('candidate_membership_mutations', 'simulation_trade_mutations', 'real_account_mutations', 'rule_auto_mutations', 'orders'):
              if int(zero.get(key, -1)) != 0:
                  raise SystemExit(f'zero-mutation failure: {key}')
          if zero.get('trade_authority') != 'NONE':
              raise SystemExit('trade authority escalation')

          immutable = json.loads((root / '90_RECOVERY_AND_ARCHIVE' / 'WP1_5C_STATE_IMMUTABILITY_PROOF.json').read_text(encoding='utf-8'))
          if immutable.get('status') != 'PASS' or immutable.get('changed_state_files') != []:
              raise SystemExit('state immutability proof failure')

          cadence = json.loads((root / '60_OPERATIONS_AND_EVENT' / 'CADENCE_REGISTRY.json').read_text(encoding='utf-8'))
          allowed = {'DISABLED_UNTIL_WP6', 'INTERFACE_ACTIVE_PRODUCER_DISABLED'}
          if any(row.get('activation') not in allowed for row in cadence.get('cadences', [])):
              raise SystemExit('premature cadence activation')

          acceptance = json.loads((root / '80_EXECUTABLE_RUNTIME' / 'RUNTIME_ACCEPTANCE.json').read_text(encoding='utf-8'))
          if acceptance.get('status') != 'PASS' or acceptance.get('trade_authority') != 'NONE':
              raise SystemExit('runtime acceptance failure')
          print(json.dumps({
              'status': 'PASS',
              'runtime_files': len([p for p in root.rglob('*') if p.is_file()]),
              'state_changed_files': 0,
              'candidate_mutations': 0,
              'simulation_mutations': 0,
              'real_account_mutations': 0,
              'orders': 0,
              'automation_activation': 'DISABLED_UNTIL_WP6',
              'trade_authority': 'NONE',
          }, indent=2))
          PY

      - name: Remove all publication scaffolding
        run: |
          rm -rf .wp1_5bc_staging
          rm -rf bootstrap/wp1_5bc_clean
          rm -f .github/workflows/wp1-5bc-clean-materialize.yml

      - name: Commit clean runtime candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 1
          fi
          if git diff --cached --name-only | grep -E '^(bootstrap/wp1_5bc_clean/|\.github/workflows/wp1-5bc-clean-materialize\.yml$)'; then
            echo 'Publication scaffolding remains in final diff'
            exit 1
          fi
          git commit -m 'WP1-5B/5C: clean publish rules state control runtime and bindings'
          git push origin HEAD:agent/wp1-5bc-clean-runtime-publication
