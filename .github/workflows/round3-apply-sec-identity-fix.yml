name: Round 3 apply SEC identity enrichment fix

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/round3-apply-sec-identity-fix.yml"

permissions:
  contents: write

jobs:
  patch-test-push:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/round3-hk-us-limited-production
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Patch issuer identity enrichment and official resolution route
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f'ROUND3_PATCH_TARGET_MISSING:{label}')
              return text.replace(old, new, 1)

          script_path = Path('automation/cross_market/build_round3_limited_production.py')
          text = script_path.read_text(encoding='utf-8')
          text = replace_once(
              text,
              'US_SEC_QUEUE = Path("outputs/fmdl6x2/current/sec_filings_facts/FMDL6X2E_BACKFILL_QUEUE.jsonl.gz")\nOPS_ROOT',
              'US_SEC_QUEUE = Path("outputs/fmdl6x2/current/sec_filings_facts/FMDL6X2E_BACKFILL_QUEUE.jsonl.gz")\nUS_IDENTITY_LINEAGE = Path("outputs/fmdl6x2/current/identity/FMDL6X2B_IDENTITY_LINEAGE.jsonl.gz")\nOPS_ROOT',
              'identity_constant',
          )
          text = replace_once(
              text,
              'raw = first_value(row, ("cik", "cik10", "cik_str", "issuer_cik", "sec_cik", "CIK"))',
              'raw = first_value(row, ("cik", "cik10", "cik_str", "issuer_cik", "sec_cik", "sec_cik10", "CIK"))',
              'sec_cik_alias',
          )
          marker = '''def fetch_sec_metadata(row: dict[str, Any], fetcher: Fetcher) -> dict[str, Any]:\n'''
          helper = '''def identity_preference(row: dict[str, Any]) -> tuple[Any, ...]:\n    return (\n        0 if str(row.get("row_disposition") or "") == "INCLUDED" else 1,\n        0 if not bool(row.get("test_issue")) else 1,\n        0 if str(row.get("listing_lifecycle_status") or "") == "ACTIVE_LISTED_OBSERVED" else 1,\n        0 if str(row.get("instrument_type") or "") == "COMMON_EQUITY" else 1,\n        str(row.get("venue") or ""),\n        sec_symbol(row),\n        first_value(row, ("canonical_security_id", "security_id")),\n    )\n\n\ndef build_identity_maps(rows: list[dict[str, Any]]) -> tuple[dict[str, dict[str, Any]], dict[str, dict[str, Any]]]:\n    issuer_candidates: dict[str, list[dict[str, Any]]] = defaultdict(list)\n    symbol_candidates: dict[str, list[dict[str, Any]]] = defaultdict(list)\n    for row in rows:\n        issuer_id = first_value(row, ("canonical_issuer_id", "issuer_id"))\n        symbol = sec_symbol(row)\n        if issuer_id and symbol:\n            issuer_candidates[issuer_id].append(row)\n        if symbol:\n            symbol_candidates[symbol].append(row)\n    issuer_map = {key: min(values, key=identity_preference) for key, values in issuer_candidates.items()}\n    symbol_map = {key: min(values, key=identity_preference) for key, values in symbol_candidates.items()}\n    return issuer_map, symbol_map\n\n\n'''
          text = replace_once(text, marker, helper + marker, 'identity_helpers')
          old_sec = '''    sec_sources = read_csv(root / US_SEC_INITIAL) + read_jsonl_gz(root / US_SEC_QUEUE)\n    sec_pool: dict[str, dict[str, Any]] = {}\n    for row in sec_sources:\n        symbol = sec_symbol(row)\n        cik = sec_cik(row)\n        key = first_value(row, ("canonical_issuer_id", "issuer_id")) or cik or symbol\n        if key and (symbol or cik):\n            sec_pool[key] = {**row, "symbol": symbol, "cik": cik, "_issuer_key": key}\n    normalized_sec = list(sec_pool.values())\n'''
          new_sec = '''    identity_rows = read_jsonl_gz(root / US_IDENTITY_LINEAGE)\n    identity_by_issuer, identity_by_symbol = build_identity_maps(identity_rows)\n    sec_sources = read_csv(root / US_SEC_INITIAL) + read_jsonl_gz(root / US_SEC_QUEUE)\n    sec_pool: dict[str, dict[str, Any]] = {}\n    for row in sec_sources:\n        source_issuer_id = first_value(row, ("canonical_issuer_id", "issuer_id"))\n        source_symbol = sec_symbol(row)\n        identity = identity_by_issuer.get(source_issuer_id) or identity_by_symbol.get(source_symbol) or {}\n        enriched = {**identity, **row}\n        issuer_id = source_issuer_id or first_value(enriched, ("canonical_issuer_id", "issuer_id"))\n        symbol = sec_symbol(enriched)\n        cik = sec_cik(enriched)\n        key = issuer_id or cik or symbol\n        if key and symbol:\n            sec_pool[key] = {**enriched, "canonical_issuer_id": issuer_id, "symbol": symbol, "cik": cik, "_issuer_key": key}\n    normalized_sec = list(sec_pool.values())\n'''
          text = replace_once(text, old_sec, new_sec, 'sec_pool')
          old_queue = '''def build_sec_retrieval_queue(rows: list[dict[str, Any]], as_of: date) -> list[dict[str, Any]]:\n    queue: list[dict[str, Any]] = []\n    for row in rows:\n        symbol = sec_symbol(row)\n        cik = sec_cik(row)\n        issuer_id = first_value(row, ("canonical_issuer_id", "issuer_id"))\n        queue.append({\n            "symbol": symbol,\n            "cik": cik,\n            "canonical_issuer_id": issuer_id,\n            "as_of_date": as_of.isoformat(),\n            "status": "PENDING_CHATGPT_WEB_OFFICIAL_RETRIEVAL",\n            "required_sources": ["SEC_SUBMISSIONS", "SEC_COMPANYFACTS"],\n            "data_grade_required": "OFFICIAL_SEC_RESEARCH_EVIDENCE",\n            "candidate_pool_mutation_authorized": False,\n            "trade_authority": "NONE",\n        })\n    queue.sort(key=lambda row: (row["symbol"], row["cik"], row["canonical_issuer_id"]))\n    return queue\n'''
          new_queue = '''def build_sec_retrieval_queue(rows: list[dict[str, Any]], as_of: date) -> list[dict[str, Any]]:\n    queue: list[dict[str, Any]] = []\n    for row in rows:\n        symbol = sec_symbol(row)\n        cik = sec_cik(row)\n        issuer_id = first_value(row, ("canonical_issuer_id", "issuer_id"))\n        cik_status = "RESOLVED_FROM_ACCEPTED_EVIDENCE" if cik else "PENDING_OFFICIAL_SEC_TICKER_MAP_RESOLUTION"\n        required_sources = ["SEC_SUBMISSIONS", "SEC_COMPANYFACTS"] if cik else ["SEC_COMPANY_TICKERS", "SEC_SUBMISSIONS", "SEC_COMPANYFACTS"]\n        queue.append({\n            "symbol": symbol,\n            "cik": cik,\n            "canonical_issuer_id": issuer_id,\n            "as_of_date": as_of.isoformat(),\n            "status": "PENDING_CHATGPT_WEB_OFFICIAL_RETRIEVAL",\n            "cik_resolution_status": cik_status,\n            "official_resolution_route": "CIK_DIRECT" if cik else "SYMBOL_TO_SEC_OFFICIAL_TICKER_MAP_TO_CIK",\n            "required_sources": required_sources,\n            "data_grade_required": "OFFICIAL_SEC_RESEARCH_EVIDENCE",\n            "candidate_pool_mutation_authorized": False,\n            "trade_authority": "NONE",\n        })\n    queue.sort(key=lambda row: (row["symbol"], row["cik"], row["canonical_issuer_id"]))\n    return queue\n'''
          text = replace_once(text, old_queue, new_queue, 'sec_retrieval_queue')
          text = replace_once(
              text,
              '            str(US_SEC_QUEUE): sha256_file(root / US_SEC_QUEUE),\n        },',
              '            str(US_SEC_QUEUE): sha256_file(root / US_SEC_QUEUE),\n            str(US_IDENTITY_LINEAGE): sha256_file(root / US_IDENTITY_LINEAGE),\n        },',
              'manifest_identity_hash',
          )
          script_path.write_text(text, encoding='utf-8')

          test_path = Path('automation/cross_market/tests/test_round3_limited_production.py')
          tests = test_path.read_text(encoding='utf-8')
          tests = replace_once(
              tests,
              '    sec_rows = [{"symbol": f"T{idx:03d}", "canonical_issuer_id": f"USISS-{idx:03d}", "cik": str(1000000 + idx)} for idx in range(2, 30)]\n    write_jsonl_gz(root / "outputs/fmdl6x2/current/market_reference/FMDL6X2D_BACKFILL_QUEUE.jsonl.gz", market_rows)\n    write_jsonl_gz(root / "outputs/fmdl6x2/current/sec_filings_facts/FMDL6X2E_BACKFILL_QUEUE.jsonl.gz", sec_rows)\n',
              '    identity_rows = [{"canonical_issuer_id": f"USISS-{idx:03d}", "canonical_security_id": f"USSEC-{idx:03d}", "symbol": f"T{idx:03d}", "venue": "XNAS", "row_disposition": "INCLUDED", "listing_lifecycle_status": "ACTIVE_LISTED_OBSERVED", "instrument_type": "COMMON_EQUITY", "test_issue": False, "sec_cik10": None} for idx in range(30)]\n    sec_rows = [{"canonical_issuer_id": f"USISS-{idx:03d}", "status": "PENDING"} for idx in range(2, 30)]\n    write_jsonl_gz(root / "outputs/fmdl6x2/current/market_reference/FMDL6X2D_BACKFILL_QUEUE.jsonl.gz", market_rows)\n    write_jsonl_gz(root / "outputs/fmdl6x2/current/sec_filings_facts/FMDL6X2E_BACKFILL_QUEUE.jsonl.gz", sec_rows)\n    write_jsonl_gz(root / "outputs/fmdl6x2/current/identity/FMDL6X2B_IDENTITY_LINEAGE.jsonl.gz", identity_rows)\n',
              'realistic_sec_fixture',
          )
          tests = replace_once(
              tests,
              '        assert all(row["symbol"] for row in plan["us_selected"])\n        assert plan["bucket"] == offset\n',
              '        assert all(row["symbol"] for row in plan["us_selected"])\n        assert plan["us_sec_pool_count"] == 30\n        assert all(row["symbol"] for row in plan["us_sec_selected"])\n        assert plan["bucket"] == offset\n',
              'sec_plan_assertions',
          )
          tests = replace_once(
              tests,
              '    assert run_current["united_states"]["sec_official_success_claimed"] is False\n    assert validate(run_current, proposal, ledger, policy())["status"] == "ROUND3_OUTPUTS_VALID"\n',
              '    assert run_current["united_states"]["sec_official_success_claimed"] is False\n    run_id = run_current["run_id"]\n    queue_payload = json.loads((tmp_path / f"investment_os_runtime/40_EVIDENCE_AND_LINEAGE/CROSS_MARKET_LIMITED/{run_id}/ROUND3_SEC_OFFICIAL_RETRIEVAL_QUEUE.json").read_text())\n    assert all(row["symbol"] for row in queue_payload["queue"])\n    assert all(row["official_resolution_route"] in {"CIK_DIRECT", "SYMBOL_TO_SEC_OFFICIAL_TICKER_MAP_TO_CIK"} for row in queue_payload["queue"])\n    assert validate(run_current, proposal, ledger, policy())["status"] == "ROUND3_OUTPUTS_VALID"\n',
              'queue_route_assertions',
          )
          test_path.write_text(tests, encoding='utf-8')
          PY
      - name: Compile, test and validate real Canonical inputs
        run: |
          python -m pip install --retries 5 --timeout 30 pytest
          python -m py_compile automation/cross_market/build_round3_limited_production.py automation/cross_market/validate_round3_outputs.py
          pytest -q automation/cross_market/tests/test_round3_limited_production.py
          PYTHONPATH=. python - <<'PY'
          from datetime import date, timedelta
          from pathlib import Path
          from automation.cross_market.build_round3_limited_production import plan_batches, read_json, build_sec_retrieval_queue
          root = Path('.')
          policy = read_json(root / 'automation/cross_market/round3_policy.json')
          plans = [plan_batches(root, policy, date(2026, 8, 3) + timedelta(days=i)) for i in range(5)]
          assert {p['hk_universe_count'] for p in plans} == {644}
          assert len({row['canonical_security_id'] for p in plans for row in p['hk_selected']}) == 644
          assert {p['us_rotation_pool_count'] for p in plans} == {8785}
          assert all(len(p['us_selected']) == 64 for p in plans)
          assert {p['us_sec_pool_count'] for p in plans} == {7419}
          assert all(len(p['us_sec_selected']) == 8 for p in plans)
          assert all(all(row['symbol'] for row in p['us_sec_selected']) for p in plans)
          queues = [build_sec_retrieval_queue(p['us_sec_selected'], date(2026, 8, 3) + timedelta(days=i)) for i,p in enumerate(plans)]
          assert all(all(row['required_sources'] for row in queue) for queue in queues)
          assert all(len(p['us_benchmark']) == 7 for p in plans)
          print({'hk_universe': 644, 'us_rotation_pool': 8785, 'us_daily_batch': 64, 'us_issuer_pool': 7419, 'sec_daily_queue': 8, 'identity_enrichment': 'PASS'})
          PY
      - name: Commit non-workflow fix
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/cross_market/build_round3_limited_production.py automation/cross_market/tests/test_round3_limited_production.py
          git commit -m "round3: enrich SEC queue from issuer identity lineage"
          git push origin HEAD:agent/round3-hk-us-limited-production
