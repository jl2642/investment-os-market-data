name: FMDL 6X3-E Screening Funnel Research Cards and US Benchmark Pool

on:
  pull_request:
    paths:
      - "config/fmdl6x3e_*.json"
      - "schemas/fmdl6x3e_*.json"
      - "scripts/fmdl6x3e_*.py"
      - "tests/test_fmdl6x3e_*.py"
      - "docs/FMDL-6X3-E*.md"
      - ".github/workflows/fmdl-6x3e-screening-research-cards.yml"
  push:
    branches: [main]
    paths:
      - "config/fmdl6x3e_*.json"
      - "schemas/fmdl6x3e_*.json"
      - "scripts/fmdl6x3e_*.py"
      - "tests/test_fmdl6x3e_*.py"
      - "docs/FMDL-6X3-E*.md"
      - ".github/workflows/fmdl-6x3e-screening-research-cards.yml"
  workflow_run:
    workflows: ["FMDL 6X3-D Sector Industry Peer and Benchmark Framework"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fmdl-6x3e-${{ github.workflow }}-${{ github.ref || github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  quality-gates:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Contract and screening regression tests
        run: PYTHONPATH=scripts python -m unittest -v tests/test_fmdl6x3e_screening_research_cards.py
      - name: Compile producer and tests
        run: python -m py_compile scripts/fmdl6x3e_screening_research_cards.py tests/test_fmdl6x3e_screening_research_cards.py
      - name: Validate frozen production contract
        run: PYTHONPATH=scripts python scripts/fmdl6x3e_screening_research_cards.py --repo-root . validate-contract

  production:
    needs: quality-gates
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Freeze run timestamp and source commit
        run: |
          echo "RUN_AS_OF=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Build screening and cards candidate
        run: |
          rm -rf outputs/fmdl6x3e/candidate outputs/fmdl6x3e/candidate_replay outputs/fmdl6x3e/acceptance
          PYTHONPATH=scripts python scripts/fmdl6x3e_screening_research_cards.py --repo-root . build --candidate outputs/fmdl6x3e/candidate --accepted-at "$RUN_AS_OF" --source-commit "$SOURCE_COMMIT"
      - name: Independent same-input replay
        run: PYTHONPATH=scripts python scripts/fmdl6x3e_screening_research_cards.py --repo-root . validate-candidate --candidate outputs/fmdl6x3e/candidate --accepted-at "$RUN_AS_OF" --source-commit "$SOURCE_COMMIT" --acceptance outputs/fmdl6x3e/acceptance/FMDL6X3E_INDEPENDENT_ACCEPTANCE.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fmdl6x3e-screening-research-cards-candidate
          path: |
            outputs/fmdl6x3e/candidate
            outputs/fmdl6x3e/acceptance
          if-no-files-found: error
          retention-days: 30
      - name: Publish Current immutable Release normalized and pointers
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main' && success()) || (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main' && success())
        run: PYTHONPATH=scripts python scripts/fmdl6x3e_screening_research_cards.py --repo-root . publish --candidate outputs/fmdl6x3e/candidate --published-at "$RUN_AS_OF" --source-commit "$SOURCE_COMMIT"
      - name: Commit accepted FMDL-6X3-E state
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main' && success()) || (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main' && success())
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A outputs/fmdl6x3/current/screening_research_cards datasets/fmdl6x3/releases datasets/fmdl6x3/normalized/screening_research_cards outputs/status/FMDL6X3E_LAST_SUCCESS.json outputs/status/FMDL6X3_SCREENING_RESEARCH_CARDS_LKG.json
          if [ -d outputs/fmdl6x3/archive ]; then git add -A outputs/fmdl6x3/archive; fi
          git diff --cached --quiet && exit 0
          git commit -m "data: publish FMDL-6X3-E screening research cards [skip ci]"
          git push
