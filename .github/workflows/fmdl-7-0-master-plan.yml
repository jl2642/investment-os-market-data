name: FMDL 7-0 Master Plan and Acceptance Contract Freeze

on:
  pull_request:
    paths:
      - 'config/fmdl7_0_master_plan_contract.json'
      - 'schemas/fmdl7_0_master_plan_contract_v1.schema.json'
      - 'scripts/fmdl7_0_master_plan.py'
      - 'tests/test_fmdl7_0_master_plan.py'
      - 'docs/FMDL-7-0_*.md'
      - '.github/workflows/fmdl-7-0-master-plan.yml'
  push:
    branches: [main]
    paths:
      - 'config/fmdl7_0_master_plan_contract.json'
      - 'schemas/fmdl7_0_master_plan_contract_v1.schema.json'
      - 'scripts/fmdl7_0_master_plan.py'
      - 'tests/test_fmdl7_0_master_plan.py'
      - 'docs/FMDL-7-0_*.md'
      - '.github/workflows/fmdl-7-0-master-plan.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fmdl-7-0-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Contract and regression tests
        run: python -m unittest tests/test_fmdl7_0_master_plan.py
      - name: Compile producer and tests
        run: python -m py_compile scripts/fmdl7_0_master_plan.py tests/test_fmdl7_0_master_plan.py
      - name: Validate authoritative assets and frozen plan
        run: python scripts/fmdl7_0_master_plan.py validate

  production:
    needs: quality-gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Freeze run timestamp and source commit
        run: |
          echo "RUN_TS=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
          echo "SOURCE_COMMIT=${GITHUB_SHA}" >> "$GITHUB_ENV"
      - name: Build FMDL-7-0 candidate
        run: |
          python scripts/fmdl7_0_master_plan.py build \
            --output build/fmdl7_0_candidate \
            --generated-at "$RUN_TS" \
            --source-commit "$SOURCE_COMMIT"
      - name: Independent same-input byte replay
        run: |
          python scripts/fmdl7_0_master_plan.py build \
            --output build/fmdl7_0_replay \
            --generated-at "$RUN_TS" \
            --source-commit "$SOURCE_COMMIT"
          diff -qr build/fmdl7_0_candidate build/fmdl7_0_replay
      - uses: actions/upload-artifact@v4
        with:
          name: fmdl7-0-master-plan-candidate
          path: build/fmdl7_0_candidate
          if-no-files-found: error
      - name: Publish Current immutable Release normalized and pointers
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python scripts/fmdl7_0_master_plan.py publish --candidate build/fmdl7_0_candidate
      - name: Commit accepted FMDL-7-0 state
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/fmdl7 datasets/fmdl7 outputs/status/FMDL7_0_LAST_SUCCESS.json outputs/status/FMDL7_MASTER_PLAN_LKG.json
          if git diff --cached --quiet; then
            echo "No publication changes"
          else
            git commit -m "data: publish FMDL-7-0 master plan and acceptance contract [skip ci]"
            git push origin HEAD:main
          fi
