name: WP3-2A Lineage Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_ref:
        description: "Base branch used for a manual verification run"
        required: false
        default: main
        type: string
      enforce_wp3_2a_scope:
        description: "Enforce WP3-2 operating-package forbidden-mutation rules"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: wp3-2a-lineage-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  TRADE_AUTHORITY: NONE

jobs:
  lineage-gate:
    name: WP3-2A / Lineage Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: automation/wp3_2a/requirements.lock

      - name: Install automation requirements
        run: python -m pip install --retries 5 --timeout 30 -r automation/wp3_2a/requirements.lock

      - name: Resolve gate scope
        id: scope
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
          MANUAL_ENFORCE: ${{ inputs.enforce_wp3_2a_scope || false }}
        run: |
          ENFORCE=false
          if [[ "$HEAD_REF" == automation/wp3-2-* || "$HEAD_REF" == automation/wp3-2a-* || "$HEAD_REF" == automation/wp3-2b-* ]]; then
            ENFORCE=true
          fi
          if [[ "$MANUAL_ENFORCE" == "true" ]]; then
            ENFORCE=true
          fi
          echo "enforce=$ENFORCE" >> "$GITHUB_OUTPUT"
          echo "head_ref=${HEAD_REF:-MANUAL_DISPATCH}"
          echo "wp3_2_forbidden_mutation_enforcement=$ENFORCE"

      - name: Validate workflow and authority contract
        run: python automation/wp3_2a/self_test.py --repo-root .

      - name: Count identity-baseline transport parts
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path('investment_os_runtime/40_EVIDENCE_AND_LINEAGE/WP3_2_R4')
          parts = sorted(root.glob('WP3_2_OLD_ACCEPTED_IDENTITY_BASELINE_20260717.slim.jsonl.gz.b64.part*'))
          assert len(parts) == 6, f'expected 6 parts, got {len(parts)}'
          print([p.name for p in parts])
          PY

      - name: Decode identity-baseline Base64 transport
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          root = Path('investment_os_runtime/40_EVIDENCE_AND_LINEAGE/WP3_2_R4')
          parts = sorted(root.glob('WP3_2_OLD_ACCEPTED_IDENTITY_BASELINE_20260717.slim.jsonl.gz.b64.part*'))
          encoded = ''.join(p.read_text(encoding='ascii').strip() for p in parts)
          payload = base64.b64decode(encoded, validate=True)
          Path('/tmp/wp3_2a_identity.gz').write_bytes(payload)
          print(len(payload))
          PY

      - name: Decompress identity-baseline transport
        run: |
          python - <<'PY'
          import gzip
          from pathlib import Path
          payload = gzip.decompress(Path('/tmp/wp3_2a_identity.gz').read_bytes())
          Path('/tmp/wp3_2a_identity.jsonl').write_bytes(payload)
          print(len(payload))
          PY

      - name: Verify identity-baseline size and hash
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          payload = Path('/tmp/wp3_2a_identity.jsonl').read_bytes()
          assert len(payload) == 444_911, len(payload)
          digest = hashlib.sha256(payload).hexdigest()
          assert digest == 'c99f9bcca0c32a3992ef8f1b46679e854a958027fc48d89f3244c510985d304a', digest
          print(digest)
          PY

      - name: Verify identity-baseline record schema
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          records = [json.loads(line) for line in Path('/tmp/wp3_2a_identity.jsonl').read_text(encoding='utf-8').splitlines() if line]
          assert len(records) == 5_528, len(records)
          symbols = [record['symbol'] for record in records]
          assert len(set(symbols)) == 5_528
          assert all(set(record) == {'symbol', 'name', 'market_evidence'} for record in records)
          assert all(isinstance(record['market_evidence'], dict) and record['market_evidence'].get('exchange') for record in records)
          print(len(records))
          PY

      - name: Validate identity-baseline materialization
        run: python -m pytest -q automation/wp3_2a/tests/test_identity_baseline_materialization.py

      - name: Validate remaining WP3-2A regression suite
        run: python -m pytest -q automation/wp3_2a/tests --ignore=automation/wp3_2a/tests/test_identity_baseline_materialization.py --junitxml=/tmp/wp3_2a_pytest.xml

      - name: Upload WP3-2A pytest diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wp3-2a-pytest-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/wp3_2a_pytest.xml
          if-no-files-found: warn
          retention-days: 7

      - name: Reject investment-object mutations for WP3-2 operating branches
        if: steps.scope.outputs.enforce == 'true'
        env:
          BASE_REF: ${{ github.base_ref || inputs.base_ref || 'main' }}
        run: |
          git fetch origin "$BASE_REF"
          python automation/wp3_2a/check_forbidden_mutations.py \
            --repo-root . \
            --base-ref "origin/$BASE_REF" \
            --config automation/wp3_2a/config.json

      - name: Record non-WP3-2 applicability
        if: steps.scope.outputs.enforce != 'true'
        run: |
          echo "This PR is outside an automation/wp3-2-*, automation/wp3-2a-* or automation/wp3-2b-* branch."
          echo "The required check reports success but does not impose WP3-2 investment-object restrictions."

      - name: Validate proposal and Current hashes
        run: python automation/wp3_2a/validate_repository_state.py --repo-root .

      - name: Runtime acceptance
        working-directory: investment_os_runtime/80_EXECUTABLE_RUNTIME
        run: |
          python -m pip install --retries 5 --timeout 30 -r requirements.lock
          python -m pytest -q
          PYTHONPATH=src python bin/validate_runtime.py \
            --evaluation-date "$(date -u +%F)" \
            --output /tmp/runtime_acceptance.json
