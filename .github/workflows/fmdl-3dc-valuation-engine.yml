name: FMDL 3D-C Valuation Engine Current

on:
  pull_request:
    branches: [main]
    paths:
      - "config/fmdl3dc_engine.json"
      - "schemas/fmdl3dc_valuation_metric_detail_v1.schema.json"
      - "schemas/fmdl3dc_valuation_current_v1.schema.json"
      - "scripts/fmdl3dc_core.py"
      - "scripts/run_fmdl3dc_valuation_engine.py"
      - "scripts/validate_fmdl3dc_candidate.py"
      - "scripts/validate_fmdl3dc_contract.py"
      - "scripts/publish_fmdl3dc.py"
      - "tests/test_fmdl3dc_engine.py"
      - "docs/FMDL-3DC_PRODUCT_SPEC.md"
      - "docs/FMDL-3DC_ACCEPTANCE.md"
      - ".github/workflows/fmdl-3dc-valuation-engine.yml"
  push:
    branches: [main]
    paths:
      - "config/fmdl3dc_engine.json"
      - "schemas/fmdl3dc_valuation_metric_detail_v1.schema.json"
      - "schemas/fmdl3dc_valuation_current_v1.schema.json"
      - "scripts/fmdl3dc_core.py"
      - "scripts/run_fmdl3dc_valuation_engine.py"
      - "scripts/validate_fmdl3dc_candidate.py"
      - "scripts/validate_fmdl3dc_contract.py"
      - "scripts/publish_fmdl3dc.py"
      - "tests/test_fmdl3dc_engine.py"
      - "docs/FMDL-3DC_PRODUCT_SPEC.md"
      - "docs/FMDL-3DC_ACCEPTANCE.md"
      - ".github/workflows/fmdl-3dc-valuation-engine.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: fmdl-3dc-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: .

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Validate contract and source bindings
        run: python -m scripts.validate_fmdl3dc_contract

      - name: Run deterministic tests
        run: python -m pytest -q tests/test_fmdl3dc_engine.py

      - name: Compile production modules
        run: python -m py_compile scripts/fmdl3dc_core.py scripts/run_fmdl3dc_valuation_engine.py scripts/validate_fmdl3dc_candidate.py scripts/validate_fmdl3dc_contract.py scripts/publish_fmdl3dc.py

  build:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Build full-Universe point-in-time valuation Current
        id: build
        continue-on-error: true
        run: python -m scripts.run_fmdl3dc_valuation_engine

      - name: Independently validate valuation candidate
        id: validate
        continue-on-error: true
        run: python -m scripts.validate_fmdl3dc_candidate

      - name: Upload valuation candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fmdl3dc-valuation-engine-candidate
          path: outputs/valuation/engine/candidate/
          if-no-files-found: error
          retention-days: 30

      - name: Enforce valuation acceptance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("outputs/valuation/engine/candidate")
          decision = json.loads((root / "FMDL3DC_DECISION.json").read_text(encoding="utf-8"))
          validation = json.loads((root / "FMDL3DC_VALIDATION.json").read_text(encoding="utf-8"))
          assert decision["status"] == "FMDL3DC_VALUATION_ENGINE_CURRENT_ACCEPTED", decision
          assert decision["hard_failures"] == [], decision
          assert validation["status"] == "PASS", validation
          assert validation["hard_failures"] == [], validation
          assert decision["trade_authority"] == "NONE"
          PY

      - name: Publish immutable Valuation Current on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          python -m scripts.publish_fmdl3dc
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config http.postBuffer 524288000
          git add datasets/valuation/engine/releases outputs/valuation/engine/current outputs/valuation/engine/archive outputs/status/FMDL3DC_LAST_SUCCESS.json
          if git diff --cached --quiet; then
            echo "No FMDL-3D-C publication changes"
          else
            git commit -m "data: publish FMDL-3D-C valuation Current [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
