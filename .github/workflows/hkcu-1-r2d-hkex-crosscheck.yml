name: HKCU-1 R2D HKEX Cross-check

on:
  pull_request:
    paths:
      - 'pipeline/hkcu1_hkex_crosscheck.py'
      - 'config/hkcu1_hkex_crosscheck_contract.json'
      - 'config/hkcu1_official_source_registry.json'
      - 'tests/test_hkcu1_r2d.py'
      - '.github/workflows/hkcu-1-r2d-hkex-crosscheck.yml'
  workflow_dispatch:
    inputs:
      validation_date:
        description: Validation date YYYY-MM-DD; blank uses Asia/Shanghai current date
        required: false
        type: string

permissions:
  contents: read

jobs:
  r2d-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q tests/test_hkcu1_r2d.py
      - run: python -m json.tool config/hkcu1_hkex_crosscheck_contract.json >/dev/null

  r2d-live-hkex-crosscheck:
    needs: r2d-unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate HKEX official Southbound reference chain
        run: |
          VALIDATION_DATE="${{ inputs.validation_date }}"
          if [ -z "$VALIDATION_DATE" ]; then VALIDATION_DATE=$(TZ=Asia/Shanghai date +%F); fi
          rm -rf work/hkcu1_r2d
          python pipeline/hkcu1_hkex_crosscheck.py \
            --contract config/hkcu1_hkex_crosscheck_contract.json \
            --output-dir work/hkcu1_r2d \
            --validation-date "$VALIDATION_DATE"
      - name: Render R2D decision
        if: always()
        run: |
          test ! -f work/hkcu1_r2d/HKCU1_R2D_HKEX_CROSSCHECK_DECISION.json || cat work/hkcu1_r2d/HKCU1_R2D_HKEX_CROSSCHECK_DECISION.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hkcu1-r2d-hkex-crosscheck-evidence
          path: work/hkcu1_r2d/**
          if-no-files-found: error
