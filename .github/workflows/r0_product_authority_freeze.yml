name: R0 Product Authority Freeze
run-name: "R0 freeze product authority and finite roadmap"

on:
  push:
    branches: [agent/r0-product-authority-freeze]
    paths:
      - ".r0_product_authority_freeze_trigger"
      - "automation/r0_product_authority_freeze/**"
      - ".github/workflows/r0_product_authority_freeze.yml"
  pull_request:
    branches: [main]
    paths:
      - "automation/r0_product_authority_freeze/**"
      - ".github/workflows/r0_product_authority_freeze.yml"
      - "automation/wp3_2a/tests/test_operating_closure_and_wp3_2b.py"
      - "investment_os_runtime/00_CONTROL/INVESTMENT_ASSISTANT_PRODUCT_CHARTER_CURRENT.md"
      - "investment_os_runtime/00_CONTROL/WORK_PACKAGE_MASTER_PLAN_CURRENT.md"
      - "investment_os_runtime/00_CONTROL/CAPABILITY_REALITY_MATRIX_CURRENT.md"
      - "investment_os_runtime/00_CONTROL/USER_OPERATING_GUIDE_CURRENT.md"
      - "investment_os_runtime/00_CONTROL/R0_PRODUCT_AUTHORITY_FREEZE_ACCEPTANCE_RECORD.json"
      - "investment_os_runtime/00_CONTROL/WP5_PORTFOLIO_DECISION_CONTRACT.json"
      - "investment_os_runtime/00_CONTROL/EXECUTION_REGISTER_CURRENT.json"
      - "investment_os_runtime/00_CONTROL/AUTHORITATIVE_ASSET_REGISTRY.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-validate-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install validation runtime
        run: python -m pip install --retries 5 --timeout 30 pytest

      - name: Snapshot protected economic, Candidate and legacy-decision states
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          paths = [
              'investment_os_runtime/30_STATE_CURRENT/10_REAL_ACCOUNT/REAL_ACCOUNT_POSITIONS_CURRENT.json',
              'investment_os_runtime/30_STATE_CURRENT/20_SIMULATION/SIMULATION_POSITIONS_CURRENT.json',
              'investment_os_runtime/30_STATE_CURRENT/40_CANDIDATE/CANDIDATE_CURRENT.json',
              'investment_os_runtime/30_STATE_CURRENT/60_DECISIONS/DECISION_PROPOSALS_CURRENT.json',
          ]
          hashes = {path: hashlib.sha256(Path(path).read_bytes()).hexdigest() for path in paths}
          Path('/tmp/r0_protected_hashes.json').write_text(json.dumps(hashes, sort_keys=True), encoding='utf-8')
          PY

      - name: Build R0 authority products and aligned control state
        run: |
          python -m py_compile automation/r0_product_authority_freeze/build_r0_product_authority_freeze.py
          python automation/r0_product_authority_freeze/build_r0_product_authority_freeze.py \
            --repo-root . \
            --source-head-sha "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Validate authority products, finite roadmap and zero mutation
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('.')
          control = root / 'investment_os_runtime/00_CONTROL'
          charter = (control / 'INVESTMENT_ASSISTANT_PRODUCT_CHARTER_CURRENT.md').read_text(encoding='utf-8')
          master = (control / 'WORK_PACKAGE_MASTER_PLAN_CURRENT.md').read_text(encoding='utf-8')
          matrix = (control / 'CAPABILITY_REALITY_MATRIX_CURRENT.md').read_text(encoding='utf-8')
          guide = (control / 'USER_OPERATING_GUIDE_CURRENT.md').read_text(encoding='utf-8')
          execution = json.loads((control / 'EXECUTION_REGISTER_CURRENT.json').read_text(encoding='utf-8'))
          registry = json.loads((control / 'AUTHORITATIVE_ASSET_REGISTRY.json').read_text(encoding='utf-8'))
          contract = json.loads((control / 'WP5_PORTFOLIO_DECISION_CONTRACT.json').read_text(encoding='utf-8'))
          acceptance = json.loads((control / 'R0_PRODUCT_AUTHORITY_FREEZE_ACCEPTANCE_RECORD.json').read_text(encoding='utf-8'))

          assert '用户最终产品' in charter
          assert '不得仅因JSON、Workflow、Schema或测试通过而宣称产品完成' in charter
          assert 'WP5-H' in charter and 'VOID_NOT_STARTED' in charter
          for stage in ('R0｜Product Authority Freeze', 'R1｜Decision Coverage Completion', 'R2｜Portfolio Construction Synthesis', 'R3｜Position Action Matrix & User Decision Pack', 'R4｜Operating Products', 'R5｜Attribution & Calibration', 'R6｜Production Acceptance'):
              assert stage in master
          assert 'PR #141' in master and 'PR #151' in master
          assert '其余11只' in master
          assert '自动交易 | 永久不提供' in matrix
          assert '当前不应怎样使用' in guide

          assert execution['current_step'] == 'R0_PRODUCT_AUTHORITY_FREEZE_CURRENT_IF_PRESENT_ON_MAIN'
          assert execution['latest_completed_main_pr'] == 151
          assert execution['latest_completed_main_merge_sha'] == '247203c005b76cfa32a0d04d31390631c304e738'
          assert execution['next_task'] == 'R1_DECISION_COVERAGE_COMPLETION_AFTER_R0_PRESENT_ON_MAIN'
          assert execution['development_roadmap']['R0']['status'] == 'CURRENT_IF_PRESENT_ON_MAIN'
          assert execution['development_roadmap']['R1']['status'] == 'NOT_STARTED'
          assert execution['wp5']['formal_plan'] == 'WP5_1_TO_WP5_5'
          assert execution['wp5']['wp5_h_status'] == 'VOID_NOT_STARTED'
          assert execution['wp5']['ready_for_user_decision_count'] == 0
          assert execution['trade_authority'] == 'NONE'

          assert contract['contract_id'] == 'WP5_PORTFOLIO_DECISION_CONTRACT_V2_R0_FREEZE'
          assert set(contract['fixed_workstreams']) == {'WP5-1', 'WP5-2', 'WP5-3', 'WP5-4', 'WP5-5'}
          assert contract['historical_label_map']['WP5-H'] == 'VOID_NOT_STARTED'
          assert contract['fixed_workstreams']['WP5-2']['remaining'][0] == 'SIMULATION_DECISION_GRADE_11'
          assert contract['trade_authority'] == 'NONE'

          registered = {row['asset_id']: row for row in registry['assets']}
          for asset_id in (
              'INVESTMENT_ASSISTANT_PRODUCT_CHARTER_CURRENT',
              'WORK_PACKAGE_MASTER_PLAN_CURRENT',
              'CAPABILITY_REALITY_MATRIX_CURRENT',
              'USER_OPERATING_GUIDE_CURRENT',
              'WP5_PORTFOLIO_DECISION_CONTRACT_V2',
              'R0_PRODUCT_AUTHORITY_FREEZE_ACCEPTANCE',
          ):
              assert registered[asset_id]['status'] == 'CURRENT_IF_PRESENT_ON_MAIN'
              assert registered[asset_id]['source_pr'] == 152
          assert registered['WP5_POSITION_CONTINUITY_CONTRACT']['status'] == 'CURRENT'
          assert registered['WP5_POSITION_CONTINUITY_REQUEST_CURRENT']['status'] == 'CURRENT'

          assert acceptance['historical_pr_range_audited'] == '141-151'
          assert acceptance['historical_wp5_labels'] == 'A-G_MAPPED_H_VOID_NOT_STARTED'
          assert acceptance['next_authorized_stage'] == 'R1_DECISION_COVERAGE_COMPLETION'
          assert acceptance['new_research_records'] == 0
          assert acceptance['economic_mutations'] == {
              'real_account': 0,
              'simulation': 0,
              'candidate_membership': 0,
              'legacy_decisions': 0,
              'orders': 0,
          }

          before = json.loads(Path('/tmp/r0_protected_hashes.json').read_text(encoding='utf-8'))
          after = {path: hashlib.sha256(Path(path).read_bytes()).hexdigest() for path in before}
          assert before == after, sorted(path for path in before if before[path] != after[path])
          assert acceptance['protected_state_hashes']['real_account_positions_sha256'] == before['investment_os_runtime/30_STATE_CURRENT/10_REAL_ACCOUNT/REAL_ACCOUNT_POSITIONS_CURRENT.json']
          assert acceptance['protected_state_hashes']['simulation_positions_sha256'] == before['investment_os_runtime/30_STATE_CURRENT/20_SIMULATION/SIMULATION_POSITIONS_CURRENT.json']
          print({'authority_products': 5, 'wp5_fixed_workstreams': 5, 'next_stage': 'R1', 'mutations': 0, 'orders': 0})
          PY

      - name: Validate global lineage forward compatibility
        run: python -m pytest -q automation/wp3_2a/tests/test_operating_closure_and_wp3_2b.py

      - name: Enforce exact R0 scope
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin main
          python - <<'PY'
          import subprocess
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', 'origin/main...HEAD'], text=True).splitlines())
          allowed = {
              '.github/workflows/r0_product_authority_freeze.yml',
              'automation/r0_product_authority_freeze/build_r0_product_authority_freeze.py',
              'automation/wp3_2a/tests/test_operating_closure_and_wp3_2b.py',
              'investment_os_runtime/00_CONTROL/INVESTMENT_ASSISTANT_PRODUCT_CHARTER_CURRENT.md',
              'investment_os_runtime/00_CONTROL/WORK_PACKAGE_MASTER_PLAN_CURRENT.md',
              'investment_os_runtime/00_CONTROL/CAPABILITY_REALITY_MATRIX_CURRENT.md',
              'investment_os_runtime/00_CONTROL/USER_OPERATING_GUIDE_CURRENT.md',
              'investment_os_runtime/00_CONTROL/R0_PRODUCT_AUTHORITY_FREEZE_ACCEPTANCE_RECORD.json',
              'investment_os_runtime/00_CONTROL/WP5_PORTFOLIO_DECISION_CONTRACT.json',
              'investment_os_runtime/00_CONTROL/EXECUTION_REGISTER_CURRENT.json',
              'investment_os_runtime/00_CONTROL/AUTHORITATIVE_ASSET_REGISTRY.json',
          }
          forbidden = sorted(changed - allowed)
          if forbidden:
              raise SystemExit('R0_SCOPE_VIOLATION:' + ','.join(forbidden))
          protected_prefixes = (
              'investment_os_runtime/30_STATE_CURRENT/10_REAL_ACCOUNT/',
              'investment_os_runtime/30_STATE_CURRENT/20_SIMULATION/',
              'investment_os_runtime/30_STATE_CURRENT/30_RESEARCH/',
              'investment_os_runtime/30_STATE_CURRENT/40_CANDIDATE/',
              'investment_os_runtime/30_STATE_CURRENT/60_DECISIONS/',
              'investment_os_runtime/40_EVIDENCE_AND_LINEAGE/',
          )
          leaked = sorted(path for path in changed if path.startswith(protected_prefixes))
          if leaked:
              raise SystemExit('R0_RESEARCH_OR_ECONOMIC_SCOPE_LEAK:' + ','.join(leaked))
          print({'changed_paths': sorted(changed), 'scope': 'CONTROL_AND_USER_PRODUCTS_ONLY'})
          PY

      - name: Publish deterministic R0 products to branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/agent/r0-product-authority-freeze'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .r0_product_authority_freeze_trigger 2>/dev/null || true
          git add \
            automation/wp3_2a/tests/test_operating_closure_and_wp3_2b.py \
            investment_os_runtime/00_CONTROL/INVESTMENT_ASSISTANT_PRODUCT_CHARTER_CURRENT.md \
            investment_os_runtime/00_CONTROL/WORK_PACKAGE_MASTER_PLAN_CURRENT.md \
            investment_os_runtime/00_CONTROL/CAPABILITY_REALITY_MATRIX_CURRENT.md \
            investment_os_runtime/00_CONTROL/USER_OPERATING_GUIDE_CURRENT.md \
            investment_os_runtime/00_CONTROL/R0_PRODUCT_AUTHORITY_FREEZE_ACCEPTANCE_RECORD.json \
            investment_os_runtime/00_CONTROL/WP5_PORTFOLIO_DECISION_CONTRACT.json \
            investment_os_runtime/00_CONTROL/EXECUTION_REGISTER_CURRENT.json \
            investment_os_runtime/00_CONTROL/AUTHORITATIVE_ASSET_REGISTRY.json
          if git diff --cached --quiet; then
            echo "R0 products already materialized."
            exit 0
          fi
          git commit -m "R0 materialize product authority freeze"
          git push origin HEAD:agent/r0-product-authority-freeze

      - name: Record R0 summary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## R0 Product Authority Freeze
          - One Product Charter and one authoritative Master Plan
          - PR #141-#151 actual development chain mapped
          - WP5 A-G retained only as historical labels; H is VOID_NOT_STARTED
          - Fixed R1-R6 future roadmap
          - Five user-facing authority products
          - New research / Real / Simulation / Candidate / orders: 0 / 0 / 0 / 0 / 0
          - trade_authority: NONE
          EOF
