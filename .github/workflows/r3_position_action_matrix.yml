name: R3 Development Boundary Correction
run-name: "R3 development product only; R4 next"

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "automation/r3_position_action_matrix/**"
      - ".github/workflows/r3_position_action_matrix.yml"
      - "automation/wp3_2a/tests/test_operating_closure_and_wp3_2b.py"
      - "investment_os_runtime/00_CONTROL/R3_*"
      - "investment_os_runtime/00_CONTROL/EXECUTION_REGISTER_CURRENT.json"
      - "investment_os_runtime/00_CONTROL/WORK_PACKAGE_MASTER_PLAN_CURRENT.md"
      - "investment_os_runtime/00_CONTROL/WP5_PORTFOLIO_DECISION_CONTRACT.json"
      - "investment_os_runtime/00_CONTROL/AUTHORITATIVE_ASSET_REGISTRY.json"
      - "investment_os_runtime/30_STATE_CURRENT/60_DECISIONS/R3_*"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

env:
  TRADE_AUTHORITY: NONE

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'agent/r3-')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install validation runtime
        run: python -m pip install --retries 5 --timeout 30 pytest
      - name: Validate corrected R3 boundary
        run: |
          python -m py_compile automation/r3_position_action_matrix/normalize_r3_control.py
          python -m py_compile automation/r3_position_action_matrix/patch_forward_lineage.py
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('.')
          control = root / 'investment_os_runtime/00_CONTROL'
          state = root / 'investment_os_runtime/30_STATE_CURRENT'
          matrix = json.loads((state / '60_DECISIONS/R3_POSITION_ACTION_MATRIX_CURRENT.json').read_text())
          queue = json.loads((state / '60_DECISIONS/R3_USER_DECISION_QUEUE_CURRENT.json').read_text())
          acceptance = json.loads((control / 'R3_POSITION_ACTION_MATRIX_ACCEPTANCE_RECORD.json').read_text())
          execution = json.loads((control / 'EXECUTION_REGISTER_CURRENT.json').read_text())
          contract = json.loads((control / 'WP5_PORTFOLIO_DECISION_CONTRACT.json').read_text())
          registry = json.loads((control / 'AUTHORITATIVE_ASSET_REGISTRY.json').read_text())
          pack = (state / '60_DECISIONS/R3_USER_DECISION_PACK_CURRENT.md').read_text()

          assert matrix['development_mode'] is True
          assert matrix['operating_activation'] is False
          assert matrix['development_decision_scenario_count'] == 7
          assert matrix['ready_for_user_decision_count'] == 0
          assert matrix['implementation_ready_count'] == 0
          assert matrix['next_stage'] == 'R4_OPERATING_PRODUCTS_DEVELOPMENT'
          assert len(matrix['real_account']['actions']) == 7
          assert len(matrix['simulation']['actions']) == 16
          assert all(r['development_scenario_only'] and not r['ready_for_user_decision'] for r in matrix['real_account']['actions'] + matrix['simulation']['actions'])

          assert queue['status'] == 'DEVELOPMENT_SCENARIO_LIBRARY_NOT_LIVE_USER_QUEUE'
          assert queue['ready_for_user_decision_count'] == 0
          assert queue['implementation_ready_count'] == 0
          assert queue['next_stage'] == 'R4_OPERATING_PRODUCTS_DEVELOPMENT'
          assert all(not item['approval_required_now'] for item in queue['decision_items'])

          assert acceptance['development_stage'] is True
          assert acceptance['operating_activation'] is False
          assert acceptance['next_authorized_step'] == 'R4_OPERATING_PRODUCTS_DEVELOPMENT'
          assert execution['development_roadmap']['R3']['status'] == 'DEVELOPMENT_PRODUCT_COMPLETE_ON_MAIN'
          assert execution['development_roadmap']['R4']['status'] == 'NOT_STARTED_NEXT_AUTHORIZED_STAGE'
          assert execution['next_task'] == 'R4_OPERATING_PRODUCTS_DEVELOPMENT'
          assert execution['wp5']['ready_for_user_decision_count'] == 0
          assert execution['wp5']['operating_activation'] is False
          assert contract['ready_for_user_decision_count'] == 0
          assert contract['operating_activation'] is False
          assert contract['next_stage'] == 'R4_OPERATING_PRODUCTS_DEVELOPMENT'
          assert registry['latest_completed_main_pr'] == 155
          assert registry['latest_completed_main_merge_sha'] == '8682e4ae8ecd5860e1957efc12ba50645767c545'
          assert '> **开发阶段说明**' in pack
          assert '当前Ready for User Decision：`0`' in pack

          for key, expected in acceptance['protected_state_hashes'].items():
              paths = {
                  'real_account_positions_sha256': state / '10_REAL_ACCOUNT/REAL_ACCOUNT_POSITIONS_CURRENT.json',
                  'simulation_positions_sha256': state / '20_SIMULATION/SIMULATION_POSITIONS_CURRENT.json',
                  'candidate_current_sha256': state / '40_CANDIDATE/CANDIDATE_CURRENT.json',
                  'legacy_decisions_sha256': state / '60_DECISIONS/DECISION_PROPOSALS_CURRENT.json',
              }
              assert hashlib.sha256(paths[key].read_bytes()).hexdigest() == expected
          print({'development_scenarios': 7, 'live_decisions': 0, 'operating_activation': False, 'next_stage': 'R4_OPERATING_PRODUCTS_DEVELOPMENT', 'mutations': 0, 'orders': 0})
          PY
      - name: Validate forward lineage
        run: python -m pytest -q automation/wp3_2a/tests/test_operating_closure_and_wp3_2b.py
      - name: Enforce correction-only scope
        run: |
          git fetch origin main
          python - <<'PY'
          import subprocess
          changed = set(subprocess.check_output(['git','diff','--name-only','origin/main...HEAD'], text=True).splitlines())
          allowed = {
              '.github/workflows/r3_position_action_matrix.yml',
              'automation/r3_position_action_matrix/normalize_r3_control.py',
              'automation/r3_position_action_matrix/patch_forward_lineage.py',
              'automation/wp3_2a/tests/test_operating_closure_and_wp3_2b.py',
              'investment_os_runtime/00_CONTROL/AUTHORITATIVE_ASSET_REGISTRY.json',
              'investment_os_runtime/00_CONTROL/EXECUTION_REGISTER_CURRENT.json',
              'investment_os_runtime/00_CONTROL/R3_POSITION_ACTION_MATRIX_ACCEPTANCE_RECORD.json',
              'investment_os_runtime/00_CONTROL/R3_STATUS_CURRENT.md',
              'investment_os_runtime/00_CONTROL/WORK_PACKAGE_MASTER_PLAN_CURRENT.md',
              'investment_os_runtime/00_CONTROL/WP5_PORTFOLIO_DECISION_CONTRACT.json',
              'investment_os_runtime/30_STATE_CURRENT/60_DECISIONS/R3_POSITION_ACTION_MATRIX_CURRENT.json',
              'investment_os_runtime/30_STATE_CURRENT/60_DECISIONS/R3_USER_DECISION_PACK_CURRENT.md',
              'investment_os_runtime/30_STATE_CURRENT/60_DECISIONS/R3_USER_DECISION_QUEUE_CURRENT.json',
          }
          forbidden = sorted(changed - allowed)
          if forbidden:
              raise SystemExit('R3_CORRECTION_SCOPE_VIOLATION:' + ','.join(forbidden))
          protected = {
              'investment_os_runtime/30_STATE_CURRENT/10_REAL_ACCOUNT/REAL_ACCOUNT_POSITIONS_CURRENT.json',
              'investment_os_runtime/30_STATE_CURRENT/20_SIMULATION/SIMULATION_POSITIONS_CURRENT.json',
              'investment_os_runtime/30_STATE_CURRENT/40_CANDIDATE/CANDIDATE_CURRENT.json',
              'investment_os_runtime/30_STATE_CURRENT/60_DECISIONS/DECISION_PROPOSALS_CURRENT.json',
          }
          assert not (changed & protected)
          print({'scope': 'R3_DEVELOPMENT_BOUNDARY_CORRECTION_ONLY', 'files': sorted(changed)})
          PY
