name: R3 One-Shot Recovery Dispatcher
run-name: "R3 one-shot dispatch of FMDL 2B-4 recovery"

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/r3-recovery-dispatcher.yml"

permissions:
  actions: write
  contents: read

env:
  TRADE_AUTHORITY: NONE
  AUTHORIZED_HEAD: agent/r3-real-recovery-dispatch-20260807

concurrency:
  group: r3-one-shot-recovery-dispatch
  cancel-in-progress: false

jobs:
  dispatch-existing-recovery:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/r3-real-recovery-dispatch-20260807'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify one-shot authorization boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ github.base_ref }}" = "main"
          test "${{ github.head_ref }}" = "$AUTHORIZED_HEAD"
          test "$TRADE_AUTHORITY" = "NONE"

      - name: Dispatch governed recovery on main
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          payload='{"ref":"main"}'
          code=$(curl -sS -o dispatch_response.txt -w '%{http_code}' \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/fmdl-2b4-full-rebase.yml/dispatches" \
            -d "$payload")
          cat dispatch_response.txt || true
          test "$code" = "204"
          echo "recovery_dispatch_http_status=$code" >> "$GITHUB_STEP_SUMMARY"

      - name: Record immutable operating boundary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## R3 One-Shot Dispatcher
          - Purpose: bridge connector limitation only; no recovery logic duplicated here.
          - Target workflow: fmdl-2b4-full-rebase.yml on main.
          - Target event: workflow_dispatch.
          - This PR must never be merged into main.
          - Candidate, simulation, real holdings and orders are outside scope.
          - trade_authority: NONE
          EOF
