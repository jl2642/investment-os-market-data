name: Strategy Kernel Phase 3D Final Acceptance
on:
  pull_request:
    paths:
      - 'strategy_kernel_v2/**'
      - '.github/workflows/strategy-kernel-phase3d-final-acceptance.yml'
jobs:
  phase3d-final-acceptance:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Phase 3D closeout tests
        run: python -m unittest strategy_kernel_v2.tests.test_phase3d
      - name: Validate Phase 3D final closeout
        run: python strategy_kernel_v2/validate_phase3d.py
      - name: Validate frozen contract proof
        run: python strategy_kernel_v2/validate_phase3d_contract.py
      - name: Validate Post-3C governance
        run: python strategy_kernel_v2/validate_post3c_evaluation_path.py
      - name: Validate program consistency
        run: python strategy_kernel_v2/program_consistency.py
      - name: Re-run Phase 3C regression tests
        run: python -m unittest strategy_kernel_v2.tests.test_phase3c
      - name: Re-run Phase 3B dependency tests
        run: python -m unittest strategy_kernel_v2.tests.test_phase3b
      - name: Re-run Phase 3A dependency tests
        run: python -m unittest strategy_kernel_v2.tests.test_phase3a
