name: FMDL 3 Overall Architecture and Phased Plan

on:
  pull_request:
    branches: [main]
    paths:
      - "config/fmdl3_program_contract.json"
      - "schemas/fmdl3_program_contract.schema.json"
      - "docs/FMDL-3_ARCHITECTURE.md"
      - "docs/FMDL-3_POINT_IN_TIME_POLICY.md"
      - "docs/FMDL-3_PHASED_PLAN.md"
      - "scripts/validate_fmdl3_architecture.py"
      - "scripts/publish_fmdl3_architecture.py"
      - "tests/test_fmdl3_architecture.py"
      - ".github/workflows/fmdl-3-architecture.yml"
      - "README.md"
  push:
    branches: [main]
    paths:
      - "config/fmdl3_program_contract.json"
      - "schemas/fmdl3_program_contract.schema.json"
      - "docs/FMDL-3_ARCHITECTURE.md"
      - "docs/FMDL-3_POINT_IN_TIME_POLICY.md"
      - "docs/FMDL-3_PHASED_PLAN.md"
      - "scripts/validate_fmdl3_architecture.py"
      - "scripts/publish_fmdl3_architecture.py"
      - "tests/test_fmdl3_architecture.py"
      - ".github/workflows/fmdl-3-architecture.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fmdl-3-architecture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Regression tests
        run: |
          python scripts/validate_investment_os_interface.py
          pytest -q tests/test_fmdl3_architecture.py
      - name: Validate FMDL-3 architecture candidate
        run: python -m scripts.validate_fmdl3_architecture
      - name: Upload architecture evidence
        uses: actions/upload-artifact@v4
        with:
          name: fmdl3-architecture-candidate
          path: outputs/architecture/candidate/
          if-no-files-found: error
          retention-days: 30
      - name: Publish FMDL-3 architecture on main
        if: github.event_name != 'pull_request'
        run: |
          python -m scripts.publish_fmdl3_architecture
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/architecture/candidate outputs/architecture/current outputs/architecture/archive outputs/status/FMDL3_ARCHITECTURE_LAST_SUCCESS.json
          if git diff --cached --quiet; then
            echo "No FMDL-3 architecture state changes to commit"
          else
            git commit -m "data: publish FMDL-3 architecture and phased plan [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
