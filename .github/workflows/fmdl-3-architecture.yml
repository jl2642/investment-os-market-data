name: FMDL 3 Overall Architecture and Phased Plan
run-name: "FMDL 3 Overall Architecture and Phased Plan (retired)"

# S1 retirement: this historical acceptance gate no longer runs on unrelated PRs.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/fmdl-3-architecture.yml"

permissions:
  contents: read

env:
  TRADE_AUTHORITY: NONE

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Explain retirement
        run: |
          echo "Historical FMDL-3 architecture acceptance gate. Superseded at whole-system level by S1 SYSTEM_CURRENT authority."
          echo "The historical implementation and evidence remain available in Git history."
          echo "Whole-system maturity is read from investment_os_runtime/00_CONTROL/SYSTEM_CURRENT.json."
          echo "orders=0"
          echo "trade_authority=NONE"
