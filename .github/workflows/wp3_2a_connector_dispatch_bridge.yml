name: WP3-2A Connector Dispatch Bridge
run-name: "WP3-2A connector dispatch ${{ github.event.pull_request.head.ref || github.ref_name }}"

on:
  push:
    branches:
      - "automation/wp3-2a-run-*"
    paths:
      - ".wp3_2a_control/run_request.json"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".wp3_2a_control/run_request.json"

permissions:
  actions: write
  contents: read
  pull-requests: write

concurrency:
  group: wp3-2a-connector-dispatch
  cancel-in-progress: false

env:
  TRADE_AUTHORITY: NONE

jobs:
  dispatch:
    if: ${{ startsWith(github.event.pull_request.head.ref || github.ref_name, 'automation/wp3-2a-run-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Validate connector run request
        id: request
        env:
          TRIGGER_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import re
          from pathlib import Path

          branch = os.environ['TRIGGER_BRANCH']
          head_repository = os.environ['HEAD_REPOSITORY']
          repository = os.environ['GITHUB_REPOSITORY']
          if not branch.startswith('automation/wp3-2a-run-'):
              raise SystemExit(f'unsupported trigger branch: {branch}')
          if head_repository != repository:
              raise SystemExit('forked trigger requests are not permitted')

          path = Path('.wp3_2a_control/run_request.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          allowed_keys = {'accepted_session', 'provider_policy', 'create_pr'}
          extra = set(data) - allowed_keys
          if extra:
              raise SystemExit(f'unsupported request keys: {sorted(extra)}')

          session = str(data.get('accepted_session') or '')
          if session and not re.fullmatch(r'\d{4}-\d{2}-\d{2}', session):
              raise SystemExit('accepted_session must be YYYY-MM-DD or blank')

          provider = str(data.get('provider_policy') or 'configured')
          if provider not in {'configured', 'eastmoney_public', 'sina_public'}:
              raise SystemExit(f'unsupported provider_policy: {provider}')

          create_pr = data.get('create_pr', True)
          if not isinstance(create_pr, bool):
              raise SystemExit('create_pr must be boolean')

          print(f'accepted_session={session}')
          print(f'provider_policy={provider}')
          print(f"create_pr={'true' if create_pr else 'false'}")
          print('trade_authority=NONE')
          PY

      - name: Dispatch Universe Refresh and resolve receipt
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          ACCEPTED_SESSION: ${{ steps.request.outputs.accepted_session }}
          PROVIDER_POLICY: ${{ steps.request.outputs.provider_policy }}
          CREATE_PR: ${{ steps.request.outputs.create_pr }}
        shell: bash
        run: |
          started_epoch=$(date -u +%s)
          expected_title="WP3-2A refresh ${ACCEPTED_SESSION:-provider-session}"

          gh workflow run wp3_2a_universe_refresh.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f accepted_session="$ACCEPTED_SESSION" \
            -f provider_policy="$PROVIDER_POLICY" \
            -f create_pr="$CREATE_PR"

          run_id=""
          run_url=""
          run_status=""
          for _ in $(seq 1 24); do
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow wp3_2a_universe_refresh.yml \
              --event workflow_dispatch \
              --branch main \
              --limit 30 \
              --json databaseId,createdAt,status,conclusion,url,displayTitle \
              > /tmp/wp3_2a_runs.json

            receipt=$(STARTED_EPOCH="$started_epoch" EXPECTED_TITLE="$expected_title" python - <<'PY'
          import datetime as dt
          import json
          import os

          threshold = int(os.environ['STARTED_EPOCH']) - 10
          expected = os.environ['EXPECTED_TITLE']
          runs = json.load(open('/tmp/wp3_2a_runs.json', encoding='utf-8'))
          candidates = []
          for run in runs:
              stamp = str(run.get('createdAt') or '')
              try:
                  epoch = int(dt.datetime.fromisoformat(stamp.replace('Z', '+00:00')).timestamp())
              except Exception:
                  continue
              if epoch >= threshold and run.get('displayTitle') == expected:
                  candidates.append((epoch, run))
          if candidates:
              run = sorted(candidates, key=lambda item: item[0], reverse=True)[0][1]
              print(f"{run['databaseId']}\t{run['url']}\t{run['status']}")
          PY
            )
            if [[ -n "$receipt" ]]; then
              IFS=$'\t' read -r run_id run_url run_status <<< "$receipt"
              break
            fi
            sleep 5
          done

          if [[ -z "$run_id" ]]; then
            echo "Universe Refresh dispatch was accepted but no matching run receipt was resolved." >&2
            exit 2
          fi

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "run_url=$run_url" >> "$GITHUB_OUTPUT"
          echo "run_status=$run_status" >> "$GITHUB_OUTPUT"

      - name: Publish dispatch receipt and close transient PR
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
          RUN_URL: ${{ steps.dispatch.outputs.run_url }}
          RUN_STATUS: ${{ steps.dispatch.outputs.run_status }}
        shell: bash
        run: |
          cat > /tmp/dispatch_receipt.md <<EOF
          ## WP3-2A dispatch receipt

          - Universe Refresh run: [${RUN_ID}](${RUN_URL})
          - Initial status: \`${RUN_STATUS}\`
          - accepted_session: \`${{ steps.request.outputs.accepted_session || 'provider-derived' }}\`
          - provider_policy: \`${{ steps.request.outputs.provider_policy }}\`
          - create_pr: \`${{ steps.request.outputs.create_pr }}\`
          - Candidate / Research / account / simulation mutations: \`0\`
          - Orders: \`0\`
          - trade_authority: \`NONE\`
          EOF
          gh pr comment "$PR_NUMBER" --body-file /tmp/dispatch_receipt.md
          gh pr close "$PR_NUMBER" --comment "Transient connector trigger closed after Universe Refresh dispatch receipt was recorded."

      - name: Record dispatch contract
        shell: bash
        run: |
          {
            echo '## WP3-2A connector dispatch'
            echo
            echo "- Trigger branch: \`${{ github.event.pull_request.head.ref || github.ref_name }}\`"
            echo "- Universe Refresh run: [${{ steps.dispatch.outputs.run_id }}](${{ steps.dispatch.outputs.run_url }})"
            echo "- Initial status: \`${{ steps.dispatch.outputs.run_status }}\`"
            echo "- accepted_session: \`${{ steps.request.outputs.accepted_session || 'provider-derived' }}\`"
            echo "- provider_policy: \`${{ steps.request.outputs.provider_policy }}\`"
            echo "- create_pr: \`${{ steps.request.outputs.create_pr }}\`"
            echo '- Candidate / Research / account / simulation mutations: `0`'
            echo '- Orders: `0`'
            echo '- trade_authority: `NONE`'
          } >> "$GITHUB_STEP_SUMMARY"
