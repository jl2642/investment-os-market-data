name: HKCU-1 R2E FMDL-5E Investable Universe

on:
  pull_request:
    paths:
      - 'pipeline/hkcu1_r2e_*.py'
      - 'pipeline/hkcu1_fetch_sse_browser.py'
      - 'pipeline/hkcu1_fetch_official_lists.py'
      - 'pipeline/hkcu1_fetch_adjustment_events.py'
      - 'pipeline/hkcu1_reconstruct_eligibility.py'
      - 'pipeline/hkcu1_hkex_crosscheck.py'
      - 'config/hkcu1_r2e_universe_contract.json'
      - 'config/hkcu1_lkg_snapshot.json'
      - 'config/hkcu1_official_source_registry.json'
      - 'config/hkcu1_stock_connect_calendar_2026.json'
      - 'config/hkcu1_hkex_crosscheck_contract.json'
      - 'outputs/hkcu1/HKCU1_R2C_ACCEPTANCE_*.json'
      - 'tests/test_hkcu1_r2e*.py'
      - '.github/workflows/hkcu-1-r2e-fmdl5e-universe.yml'
  workflow_dispatch:
    inputs:
      as_of_date:
        description: Eligibility and R2E valuation date YYYY-MM-DD; blank uses Asia/Shanghai current date
        required: false
        type: string

permissions:
  contents: read

jobs:
  r2e-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q tests/test_hkcu1_r2e.py tests/test_hkcu1_r2e_bootstrap.py tests/test_hkcu1_r2e_r2c_gate.py tests/test_hkcu1_r2e_refresh_research_inputs.py tests/test_hkcu1_build_universe.py
      - run: python -m json.tool config/hkcu1_r2e_universe_contract.json >/dev/null

  r2e-live-build:
    needs: r2e-unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install runtime dependencies
        run: |
          pip install -r requirements.txt
          pip install playwright
          playwright install --with-deps chromium

      - name: Resolve R2E as-of date
        run: |
          AS_OF_DATE="${{ inputs.as_of_date }}"
          if [ -z "$AS_OF_DATE" ]; then AS_OF_DATE=$(TZ=Asia/Shanghai date +%F); fi
          echo "AS_OF_DATE=$AS_OF_DATE" >> "$GITHUB_ENV"
          rm -rf work/hkcu1_r2e_live
          mkdir -p work/hkcu1_r2e_live/source/browser

      - name: Attempt fresh SSE official current list with bounded retries
        run: |
          set +e
          python pipeline/hkcu1_fetch_sse_browser.py \
            --output-file work/hkcu1_r2e_live/source/browser/SSE_SH_SOUTHBOUND_BUY_LIST.xls \
            --evidence-file work/hkcu1_r2e_live/source/browser/HKCU1_SSE_BROWSER_FETCH_EVIDENCE.json \
            --max-attempts 3
          code=$?
          set -e
          echo "SSE fresh acquisition exit_code=${code}; R2E bootstrap resolver will classify fresh vs LKG continuity"
          exit 0

      - name: Attempt fresh SSE and SZSE reconciliation when SSE is available
        run: |
          fresh_sse=$(python - <<'PY'
          import json
          from pathlib import Path
          p=Path('work/hkcu1_r2e_live/source/browser/HKCU1_SSE_BROWSER_FETCH_EVIDENCE.json')
          d=json.loads(p.read_text()) if p.exists() else {}
          print('1' if d.get('status')=='PASS' and Path('work/hkcu1_r2e_live/source/browser/SSE_SH_SOUTHBOUND_BUY_LIST.xls').exists() else '0')
          PY
          )
          if [ "$fresh_sse" != "1" ]; then
            echo "Fresh SSE unavailable; skip fresh dual-source reconciliation and use governed bootstrap resolver"
            exit 0
          fi
          passed=0
          for attempt in 1 2 3 4 5 6; do
            rm -rf work/hkcu1_r2e_live/source/current_lists
            python pipeline/hkcu1_fetch_official_lists.py \
              --registry config/hkcu1_official_source_registry.json \
              --output-dir work/hkcu1_r2e_live/source/current_lists \
              --sse-raw-file work/hkcu1_r2e_live/source/browser/SSE_SH_SOUTHBOUND_BUY_LIST.xls \
              --allow-partial
            if python - <<'PY'
          import json
          from pathlib import Path
          root=Path('work/hkcu1_r2e_live/source/current_lists')
          dp=root/'HKCU1_FETCH_DECISION.json'; lp=root/'HKCU1_SOURCE_LEDGER.json'
          if not dp.exists() or not lp.exists(): raise SystemExit(1)
          d=json.load(open(dp)); ledger=json.load(open(lp)); by={r['source_id']:r for r in ledger}
          ids=('SSE_SH_SOUTHBOUND_BUY_LIST','SZSE_SZ_SOUTHBOUND_BUY_LIST')
          ok=d.get('status')=='PASS'
          for sid in ids:
              row=by.get(sid,{})
              actual=d.get('source_rows',{}).get(sid)
              ok = ok and row.get('status')=='PASS' and isinstance(actual,int) and actual>0 and actual==row.get('declared_record_count')
          raise SystemExit(0 if ok else 1)
          PY
            then
              passed=1
              break
            fi
            if [ "$attempt" -lt 6 ]; then sleep $((attempt * 5)); fi
          done
          echo "fresh dual-source reconciliation passed=${passed}; if 0, bootstrap resolver may use LKG continuity"
          exit 0

      - name: Resolve fresh official vs LKG continuity bootstrap
        run: |
          python pipeline/hkcu1_r2e_prepare_bootstrap.py \
            --fresh-rows work/hkcu1_r2e_live/source/current_lists/HKCU1_OFFICIAL_LIST_ROWS.csv \
            --fresh-decision work/hkcu1_r2e_live/source/current_lists/HKCU1_FETCH_DECISION.json \
            --lkg config/hkcu1_lkg_snapshot.json \
            --as-of-date "$AS_OF_DATE" \
            --max-lkg-age-days 14 \
            --output-snapshot work/hkcu1_r2e_live/HKCU1_R2E_BOOTSTRAP_SNAPSHOT.csv \
            --output-decision work/hkcu1_r2e_live/HKCU1_R2E_BOOTSTRAP_SOURCE_DECISION.json
          ELIGIBILITY_SOURCE_STATUS=$(python - <<'PY'
          import json
          d=json.load(open('work/hkcu1_r2e_live/HKCU1_R2E_BOOTSTRAP_SOURCE_DECISION.json'))
          print(d['eligibility_source_status'])
          PY
          )
          echo "ELIGIBILITY_SOURCE_STATUS=$ELIGIBILITY_SOURCE_STATUS" >> "$GITHUB_ENV"

      - name: Refresh R2C adjustment events without overwriting accepted state on degradation
        run: |
          python pipeline/hkcu1_fetch_adjustment_events.py \
            --registry config/hkcu1_official_source_registry.json \
            --output-dir work/hkcu1_r2e_live/events \
            --as-of-date "$AS_OF_DATE"
          python pipeline/hkcu1_r2e_r2c_gate.py \
            --current-decision work/hkcu1_r2e_live/events/HKCU1_R2C_EVENT_DECISION.json \
            --accepted-r2c outputs/hkcu1/HKCU1_R2C_ACCEPTANCE_20260807.json \
            --as-of-date "$AS_OF_DATE" \
            --output work/hkcu1_r2e_live/HKCU1_R2E_R2C_OPERATING_GATE.json

      - name: Reconstruct point-in-time eligibility
        run: |
          python pipeline/hkcu1_reconstruct_eligibility.py \
            --snapshot work/hkcu1_r2e_live/HKCU1_R2E_BOOTSTRAP_SNAPSHOT.csv \
            --events work/hkcu1_r2e_live/events/HKCU1_ADJUSTMENT_EVENTS_RESOLVED.csv \
            --as-of-date "$AS_OF_DATE" \
            --output-dir work/hkcu1_r2e_live/eligibility

      - name: Enforce HKEX secondary official cross-check
        run: |
          python pipeline/hkcu1_hkex_crosscheck.py \
            --contract config/hkcu1_hkex_crosscheck_contract.json \
            --output-dir work/hkcu1_r2e_live/hkex \
            --validation-date "$AS_OF_DATE"
          python - <<'PY'
          import json
          d=json.load(open('work/hkcu1_r2e_live/hkex/HKCU1_R2D_HKEX_CROSSCHECK_DECISION.json'))
          assert d['status']=='PASS_REFERENCE_CONSISTENT', d
          assert d['publication_allowed'] is True, d
          assert d['primary_authority_unchanged'] is True, d
          PY

      - name: Refresh completed-session FMDL-5C and FMDL-5E research inputs
        env:
          FMDL5C_WORKERS: '10'
        run: |
          python pipeline/hkcu1_r2e_refresh_research_inputs.py \
            --repo-root . \
            --calendar config/hkcu1_stock_connect_calendar_2026.json \
            --eligibility-as-of-date "$AS_OF_DATE" \
            --work-dir work/hkcu1_r2e_live/research_refresh
          cat work/hkcu1_r2e_live/research_refresh/HKCU1_R2E_UPSTREAM_REFRESH_DECISION.json

      - name: Merge with refreshed completed-session FMDL-5E candidate
        run: |
          python pipeline/hkcu1_r2e_merge_fmdl5e.py \
            --eligibility work/hkcu1_r2e_live/eligibility/HKCU1_POINT_IN_TIME_ELIGIBILITY.csv \
            --fmdl5e-screening work/hkcu1_r2e_live/research_refresh/fmdl5e_fresh/FMDL5E_SCREENING_UNIVERSE.csv \
            --fmdl5e-decision work/hkcu1_r2e_live/research_refresh/fmdl5e_fresh/FMDL5E_DECISION.json \
            --calendar config/hkcu1_stock_connect_calendar_2026.json \
            --contract config/hkcu1_r2e_universe_contract.json \
            --as-of-date "$AS_OF_DATE" \
            --eligibility-source-status "$ELIGIBILITY_SOURCE_STATUS" \
            --output-dir work/hkcu1_r2e_live/release

      - name: Render R2E evidence
        if: always()
        run: |
          test ! -f work/hkcu1_r2e_live/HKCU1_R2E_BOOTSTRAP_SOURCE_DECISION.json || cat work/hkcu1_r2e_live/HKCU1_R2E_BOOTSTRAP_SOURCE_DECISION.json
          test ! -f work/hkcu1_r2e_live/HKCU1_R2E_R2C_OPERATING_GATE.json || cat work/hkcu1_r2e_live/HKCU1_R2E_R2C_OPERATING_GATE.json
          test ! -f work/hkcu1_r2e_live/research_refresh/HKCU1_R2E_UPSTREAM_REFRESH_DECISION.json || cat work/hkcu1_r2e_live/research_refresh/HKCU1_R2E_UPSTREAM_REFRESH_DECISION.json
          test ! -f work/hkcu1_r2e_live/release/HKCU1_R2E_DECISION.json || cat work/hkcu1_r2e_live/release/HKCU1_R2E_DECISION.json
          test ! -f work/hkcu1_r2e_live/release/HKCU1_R2E_QUALITY_REPORT.json || cat work/hkcu1_r2e_live/release/HKCU1_R2E_QUALITY_REPORT.json

      - name: Enforce formal R2E Current promotion gate
        run: |
          python - <<'PY'
          import json
          d=json.load(open('work/hkcu1_r2e_live/release/HKCU1_R2E_DECISION.json'))
          assert d['status']=='PASS_CURRENT', d
          assert d['publication_allowed'] is True, d
          assert d['eligibility_source_fresh'] is True, d
          assert d['fmdl5e_age_stock_connect_service_days'] <= 5, d
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hkcu1-r2e-fmdl5e-universe-evidence
          path: work/hkcu1_r2e_live/**
          if-no-files-found: error
          retention-days: 30
