name: FMDL 3C-A Factor Architecture and Contract

on:
  pull_request:
    paths:
      - "config/fmdl3c_factor_contract.json"
      - "config/fmdl3c_factor_dictionary.csv"
      - "schemas/fmdl3c_factor_contract_v1.schema.json"
      - "docs/FMDL-3C_PRODUCT_SPEC.md"
      - "docs/FMDL-3C_VALIDATION_RULES.md"
      - "docs/FMDL-3C_ROADMAP.md"
      - "scripts/validate_fmdl3ca_contract.py"
      - "scripts/publish_fmdl3ca_contract.py"
      - "tests/test_fmdl3ca_contract.py"
      - ".github/workflows/fmdl-3ca-factor-contract.yml"
  push:
    branches: [main]
    paths:
      - "config/fmdl3c_factor_contract.json"
      - "config/fmdl3c_factor_dictionary.csv"
      - "schemas/fmdl3c_factor_contract_v1.schema.json"
      - "docs/FMDL-3C_PRODUCT_SPEC.md"
      - "docs/FMDL-3C_VALIDATION_RULES.md"
      - "docs/FMDL-3C_ROADMAP.md"
      - "scripts/validate_fmdl3ca_contract.py"
      - "scripts/publish_fmdl3ca_contract.py"
      - "tests/test_fmdl3ca_contract.py"
      - ".github/workflows/fmdl-3ca-factor-contract.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fmdl-3ca-factor-contract-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-factor-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip jsonschema pytest

      - name: Validate architecture contract and tests
        run: |
          python scripts/validate_fmdl3ca_contract.py
          python -m pytest -q tests/test_fmdl3ca_contract.py
          python -m py_compile scripts/validate_fmdl3ca_contract.py scripts/publish_fmdl3ca_contract.py

      - name: Upload contract candidate
        uses: actions/upload-artifact@v4
        with:
          name: fmdl3ca-factor-architecture-contract-candidate
          path: outputs/financial_factors/contract/candidate
          retention-days: 30

      - name: Enforce acceptance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('outputs/financial_factors/contract/candidate')
          decision = json.loads((root / 'FMDL3CA_DECISION.json').read_text())
          validation = json.loads((root / 'FMDL3CA_VALIDATION.json').read_text())
          assert decision['status'] == 'FMDL3CA_FACTOR_ARCHITECTURE_AND_CONTRACT_ACCEPTED'
          assert decision['hard_failures'] == []
          assert validation['status'] == 'PASS'
          assert validation['hard_failures'] == []
          assert decision['trade_authority'] == 'NONE'
          PY

      - name: Publish immutable contract Current on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          python scripts/publish_fmdl3ca_contract.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datasets/financial_factors/contract outputs/financial_factors/contract outputs/status/FMDL3CA_LAST_SUCCESS.json
          git commit -m "data: publish FMDL-3C-A factor contract [skip ci]"
          git push
