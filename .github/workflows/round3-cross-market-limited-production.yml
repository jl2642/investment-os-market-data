name: Round 3 HK and US Limited Production
run-name: "Round 3 bounded cross-market batch and research proposal"

on:
  schedule:
    - cron: "45 0 * * 2-6"
  workflow_dispatch:
    inputs:
      as_of:
        description: "Market date in YYYY-MM-DD; defaults to previous UTC date"
        required: false
        type: string
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/round3-cross-market-limited-production.yml"
      - "automation/cross_market/**"
      - "docs/ROUND3_HK_US_LIMITED_PRODUCTION.md"
      - "investment_os_runtime/30_STATE_CURRENT/46_CROSS_MARKET_OPERATIONS/**"
      - "investment_os_runtime/40_EVIDENCE_AND_LINEAGE/CROSS_MARKET_LIMITED/**"
  push:
    branches:
      - "automation/cross-market-limited-*"
    paths:
      - "investment_os_runtime/40_EVIDENCE_AND_LINEAGE/CROSS_MARKET_LIMITED/**/ROUND3_SEC_OBSERVER_INBOX.json"

permissions:
  actions: read
  contents: write

concurrency:
  group: round3-cross-market-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  TRADE_AUTHORITY: NONE
  SEC_USER_AGENT: "investment-os-market-data/1.0 contact:https://github.com/jl2642/investment-os-market-data"

jobs:
  deterministic-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test runtime
        run: python -m pip install --retries 5 --timeout 30 pytest
      - name: Compile and test bounded cross-market system
        run: |
          python -m py_compile automation/cross_market/*.py
          pytest -q automation/cross_market/tests
      - name: Validate real Canonical input compatibility
        run: |
          PYTHONPATH=. python - <<'PY'
          from datetime import date, timedelta
          from pathlib import Path
          from automation.cross_market.build_round3_limited_production import (
              build_sec_retrieval_queue,
              plan_batches,
              read_json,
          )

          root = Path('.')
          policy = read_json(root / 'automation/cross_market/round3_policy.json')
          start = date(2026, 8, 3)
          plans = [plan_batches(root, policy, start + timedelta(days=offset)) for offset in range(5)]
          assert {plan['hk_universe_count'] for plan in plans} == {644}
          hk_ids = {
              row['canonical_security_id']
              for plan in plans
              for row in plan['hk_selected']
          }
          assert len(hk_ids) == 644
          assert {plan['us_rotation_pool_count'] for plan in plans} == {8785}
          assert all(len(plan['us_selected']) == 64 for plan in plans)
          assert all(all(row['symbol'] for row in plan['us_selected']) for plan in plans)
          assert {plan['us_sec_pool_count'] for plan in plans} == {7419}
          assert all(len(plan['us_sec_selected']) == 8 for plan in plans)
          assert all(all(row['symbol'] for row in plan['us_sec_selected']) for plan in plans)
          queues = [
              build_sec_retrieval_queue(plan['us_sec_selected'], start + timedelta(days=offset))
              for offset, plan in enumerate(plans)
          ]
          assert all(all(row['required_sources'] for row in queue) for queue in queues)
          assert all(len(plan['us_benchmark']) == 7 for plan in plans)
          print({
              'hk_universe': len(hk_ids),
              'us_rotation_pool': plans[0]['us_rotation_pool_count'],
              'us_daily_batch': len(plans[0]['us_selected']),
              'us_issuer_pool': plans[0]['us_sec_pool_count'],
              'sec_daily_queue': len(plans[0]['us_sec_selected']),
              'benchmark_daily': len(plans[0]['us_benchmark']),
              'sec_identity_enrichment': 'PASS',
          })
          PY

  validate-generated-pr:
    if: github.event_name == 'pull_request'
    needs: deterministic-validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Enforce generated scope and protected-state firewall
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin main
          python - <<'PY'
          import subprocess
          allowed_exact = {
              'investment_os_runtime/30_STATE_CURRENT/46_CROSS_MARKET_OPERATIONS/CROSS_MARKET_LIMITED_LEDGER_CURRENT.json',
              'investment_os_runtime/30_STATE_CURRENT/46_CROSS_MARKET_OPERATIONS/CROSS_MARKET_LIMITED_RUN_CURRENT.json',
              'investment_os_runtime/30_STATE_CURRENT/46_CROSS_MARKET_OPERATIONS/CROSS_MARKET_RESEARCH_PROPOSAL_CURRENT.json',
          }
          allowed_prefix = 'investment_os_runtime/40_EVIDENCE_AND_LINEAGE/CROSS_MARKET_LIMITED/'
          engineering_control_exact = {
              'investment_os_runtime/00_CONTROL/P4_1_OPERATING_CURRENT_CONTRACT.json',
          }
          changed = subprocess.check_output(['git', 'diff', '--name-only', 'origin/main...HEAD'], text=True).splitlines()
          generated = [
              path for path in changed
              if path.startswith('investment_os_runtime/') and path not in engineering_control_exact
          ]
          forbidden = [path for path in generated if path not in allowed_exact and not path.startswith(allowed_prefix)]
          if forbidden:
              raise SystemExit('ROUND3_GENERATED_SCOPE_VIOLATION:' + ','.join(forbidden))
          protected = (
              'investment_os_runtime/30_STATE_CURRENT/10_REAL_ACCOUNT/',
              'investment_os_runtime/30_STATE_CURRENT/20_SIMULATION/',
              'investment_os_runtime/30_STATE_CURRENT/40_CANDIDATE/',
              'investment_os_runtime/30_STATE_CURRENT/60_DECISIONS/',
              'investment_os_runtime/30_STATE_CURRENT/80_GOVERNANCE/',
          )
          leaked = [path for path in changed if path.startswith(protected)]
          if leaked:
              raise SystemExit('ROUND3_ECONOMIC_SCOPE_LEAK:' + ','.join(leaked))
          print({'generated_paths': generated, 'orders': 0, 'trade_authority': 'NONE'})
          PY
      - name: Validate generated operating products when present
        shell: bash
        run: |
          set -Eeuo pipefail
          root=investment_os_runtime/30_STATE_CURRENT/46_CROSS_MARKET_OPERATIONS
          if [[ ! -f "$root/CROSS_MARKET_LIMITED_RUN_CURRENT.json" ]]; then
            echo "Engineering PR: no generated Round 3 products."
            exit 0
          fi
          python automation/cross_market/validate_round3_outputs.py \
            --run "$root/CROSS_MARKET_LIMITED_RUN_CURRENT.json" \
            --proposal "$root/CROSS_MARKET_RESEARCH_PROPOSAL_CURRENT.json" \
            --ledger "$root/CROSS_MARKET_LIMITED_LEDGER_CURRENT.json"

  operate:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: deterministic-validation
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout Canonical main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Resolve completed market date
        id: market_date
        shell: bash
        run: |
          set -Eeuo pipefail
          requested="${{ inputs.as_of }}"
          if [[ -n "$requested" ]]; then
            as_of="$requested"
          else
            as_of="$(date -u -d 'yesterday' +%F)"
          fi
          python - "$as_of" <<'PY'
          from datetime import date
          import sys
          value = date.fromisoformat(sys.argv[1])
          if value.weekday() > 4:
              raise SystemExit('ROUND3_NON_TRADING_WEEKDAY_INPUT')
          PY
          echo "as_of=$as_of" >> "$GITHUB_OUTPUT"
      - name: Run bounded HK and US production batch
        id: operate
        shell: bash
        run: |
          set -Eeuo pipefail
          result="$(python automation/cross_market/build_round3_limited_production.py --repo-root . --as-of '${{ steps.market_date.outputs.as_of }}')"
          echo "$result"
          python - "$result" <<'PY' >> "$GITHUB_OUTPUT"
          import json, sys
          data = json.loads(sys.argv[1])
          print(f"due={'true' if data.get('due') else 'false'}")
          print(f"run_id={data.get('run_id', '')}")
          print(f"status={data.get('status', '')}")
          print(f"capture_status={data.get('capture_status', '')}")
          print(f"operating_state={data.get('operating_state', '')}")
          print(f"us_bounded_capture_quality={data.get('us_bounded_capture_quality', '')}")
          print(f"us_rotation_success_ratio={data.get('us_rotation_success_ratio', 0)}")
          print(f"us_benchmark_success={data.get('us_benchmark_success', 0)}")
          PY
      - name: Consume official SEC retrieval queue
        id: sec_consumer
        if: steps.operate.outputs.due == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          evidence_dir="investment_os_runtime/40_EVIDENCE_AND_LINEAGE/CROSS_MARKET_LIMITED/${{ steps.operate.outputs.run_id }}"
          queue="$evidence_dir/ROUND3_SEC_OFFICIAL_RETRIEVAL_QUEUE.json"
          inbox="$evidence_dir/ROUND3_SEC_CONTROLLED_RETRIEVAL_INBOX.json"
          raw_dir="$evidence_dir/SEC_RAW"
          raw_manifest="$evidence_dir/ROUND3_SEC_RAW_RESPONSE_MANIFEST.json"
          python automation/cross_market/collect_round3_sec_official.py \
            --queue "$queue" \
            --output "$inbox" \
            --raw-dir "$raw_dir" \
            --raw-manifest "$raw_manifest" \
            --user-agent "$SEC_USER_AGENT"
          apply_result="$(python automation/cross_market/apply_round3_sec_observer_results.py \
            --repo-root . \
            --inbox "$inbox")"
          echo "$apply_result"
          python - "$inbox" "$apply_result" <<'PY' >> "$GITHUB_OUTPUT"
          import json, sys
          inbox=json.load(open(sys.argv[1],encoding="utf-8"))
          applied=json.loads(sys.argv[2])
          processed=len(inbox.get("issuers",[]))+len(inbox.get("failures",[]))
          if processed == 0:
              raise SystemExit("OCC_R4_SEC_CONSUMER_EMPTY_RESULT")
          print("consumer_status=PASS_QUEUE_CONSUMED")
          print(f"official_success_count={len(inbox.get('issuers',[]))}")
          print(f"official_failure_count={len(inbox.get('failures',[]))}")
          print(f"sec_completed={applied.get('sec_official_completed_issuer_count',0)}")
          print(f"sec_status={applied.get('sec_official_retrieval_status','')}")
          PY
      - name: Validate generated operating products
        if: steps.operate.outputs.due == 'true'
        run: |
          root=investment_os_runtime/30_STATE_CURRENT/46_CROSS_MARKET_OPERATIONS
          python automation/cross_market/validate_round3_outputs.py \
            --run "$root/CROSS_MARKET_LIMITED_RUN_CURRENT.json" \
            --proposal "$root/CROSS_MARKET_RESEARCH_PROPOSAL_CURRENT.json" \
            --ledger "$root/CROSS_MARKET_LIMITED_LEDGER_CURRENT.json"
      - name: Upload immutable Round 3 evidence
        if: steps.operate.outputs.due == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: round3-cross-market-${{ github.run_id }}-a${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: error
          path: |
            investment_os_runtime/30_STATE_CURRENT/46_CROSS_MARKET_OPERATIONS/
            investment_os_runtime/40_EVIDENCE_AND_LINEAGE/CROSS_MARKET_LIMITED/${{ steps.operate.outputs.run_id }}/
      - name: Publish to unique governed result branch
        if: steps.operate.outputs.due == 'true'
        shell: bash
        env:
          RESULT_BRANCH: automation/cross-market-limited-${{ github.run_id }}-a${{ github.run_attempt }}
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$RESULT_BRANCH"
          git add \
            investment_os_runtime/30_STATE_CURRENT/46_CROSS_MARKET_OPERATIONS \
            investment_os_runtime/40_EVIDENCE_AND_LINEAGE/CROSS_MARKET_LIMITED/${{ steps.operate.outputs.run_id }}
          if git diff --cached --quiet; then
            echo "No new Round 3 operating evidence."
            exit 0
          fi
          git commit -m "cross-market: stage bounded HK and US operating evidence"
          git push origin "HEAD:$RESULT_BRANCH"
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          WATERMARK="${{ steps.market_date.outputs.as_of }}"
          if [[ "${{ steps.operate.outputs.capture_status }}" == "CAPTURED_BOTH_MARKETS" ]]; then
            OPERATING_STATUS="PASS"
            ADVANCE_ARGS=(--advance-current)
          else
            OPERATING_STATUS="BLOCKED"
            ADVANCE_ARGS=()
          fi
          python automation/operating_current/publish_operating_current.py \
            --domain CROSS_MARKET_LIMITED \
            --status "$OPERATING_STATUS" \
            --source-workflow "Round 3 HK and US Limited Production" \
            --source-run-id "${{ github.run_id }}" \
            --source-run-attempt "${{ github.run_attempt }}" \
            --source-branch "$RESULT_BRANCH" \
            --source-commit "$SOURCE_COMMIT" \
            --watermark "$WATERMARK" \
            --watermark-sort-key "$WATERMARK" \
            --qc-status "${{ steps.operate.outputs.status }}:${{ steps.operate.outputs.capture_status }}" \
            "${ADVANCE_ARGS[@]}"
          python automation/operating_current/publish_operating_current.py \
            --domain US_BOUNDED_COVERAGE \
            --status PASS \
            --source-workflow "Round 3 HK and US Limited Production" \
            --source-run-id "${{ github.run_id }}" \
            --source-run-attempt "${{ github.run_attempt }}" \
            --source-branch "$RESULT_BRANCH" \
            --source-commit "$SOURCE_COMMIT" \
            --watermark "$WATERMARK" \
            --watermark-sort-key "$WATERMARK" \
            --qc-status "${{ steps.operate.outputs.us_bounded_capture_quality }}:rotation_ratio=${{ steps.operate.outputs.us_rotation_success_ratio }}:benchmark_success=${{ steps.operate.outputs.us_benchmark_success }}" \
            --advance-current
          python automation/operating_current/publish_operating_current.py \
            --domain SEC_QUEUE_CONSUMER \
            --status PASS \
            --source-workflow "Round 3 HK and US Limited Production" \
            --source-run-id "${{ github.run_id }}" \
            --source-run-attempt "${{ github.run_attempt }}" \
            --source-branch "$RESULT_BRANCH" \
            --source-commit "$SOURCE_COMMIT" \
            --watermark "$WATERMARK" \
            --watermark-sort-key "$WATERMARK" \
            --qc-status "${{ steps.sec_consumer.outputs.consumer_status }}:success=${{ steps.sec_consumer.outputs.official_success_count }}:failure=${{ steps.sec_consumer.outputs.official_failure_count }}" \
            --advance-current
          SEC_STATUS="PASS"
          SEC_ADVANCE=(--advance-current)
          if [[ "${{ steps.sec_consumer.outputs.official_success_count }}" == "0" ]]; then
            SEC_STATUS="BLOCKED"
            SEC_ADVANCE=()
          fi
          python automation/operating_current/publish_operating_current.py \
            --domain SEC_OFFICIAL_RETRIEVAL \
            --status "$SEC_STATUS" \
            --source-workflow "Round 3 HK and US Limited Production" \
            --source-run-id "${{ github.run_id }}" \
            --source-run-attempt "${{ github.run_attempt }}" \
            --source-branch "$RESULT_BRANCH" \
            --source-commit "$SOURCE_COMMIT" \
            --watermark "$WATERMARK" \
            --watermark-sort-key "$WATERMARK" \
            --qc-status "PASS_QUEUE_CONSUMED:${{ steps.sec_consumer.outputs.sec_status }}:success=${{ steps.sec_consumer.outputs.official_success_count }}:failure=${{ steps.sec_consumer.outputs.official_failure_count }}" \
            "${SEC_ADVANCE[@]}"
          {
            echo "## Round 3 governed handoff"
            echo "- result_branch: \`$RESULT_BRANCH\`"
            echo "- run_id: \`${{ steps.operate.outputs.run_id }}\`"
            echo "- as_of: \`${{ steps.market_date.outputs.as_of }}\`"
            echo "- status: \`${{ steps.operate.outputs.status }}\`"
            echo "- capture_status: \`${{ steps.operate.outputs.capture_status }}\`"
            echo "- operating_state: \`${{ steps.operate.outputs.operating_state }}\`"
            echo "- HK scope: Southbound Stock Connect only"
            echo "- US scope: seven-name daily benchmark plus bounded 64-name rotation and eight-issuer official SEC retrieval queue"
            echo "- Candidate / simulation / real account / decisions / orders: 0 / 0 / 0 / 0 / 0"
            echo "- trade_authority: NONE"
            echo "- operating_current_domain: CROSS_MARKET_LIMITED"
            echo "- us_coverage_authority: US_BOUNDED_COVERAGE / ${{ steps.operate.outputs.us_bounded_capture_quality }}"
            echo "- sec_queue_consumer_authority: SEC_QUEUE_CONSUMER / ${{ steps.sec_consumer.outputs.consumer_status }}"
            echo "- sec_operating_current_domain: SEC_OFFICIAL_RETRIEVAL"
            echo "- SEC queue consumer: ${{ steps.sec_consumer.outputs.consumer_status }}"
            echo "- SEC official successes/failures this run: ${{ steps.sec_consumer.outputs.official_success_count }}/${{ steps.sec_consumer.outputs.official_failure_count }}"
            echo "- formal investment-state promotion remains separate"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Record no-op or observation state
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Round 3 HK and US Limited Production
          - as_of: ${{ steps.market_date.outputs.as_of }}
          - status: ${{ steps.operate.outputs.status }}
          - capture_status: ${{ steps.operate.outputs.capture_status }}
          - operating_state: ${{ steps.operate.outputs.operating_state }}
          - stale or missing completed sessions remain retryable and do not close a bucket
          - no full-HKEX or full-US weekly coverage claim
          - no Candidate, simulation, real-account, decision or order authority
          - trade_authority: NONE
          EOF

  ingest-sec-observer:
    if: github.event_name == 'push'
    needs: deterministic-validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout governed result branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - name: Resolve exactly one newly committed observer inbox
        id: inbox
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t inboxes < <(
            git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" \
              | grep -E '^investment_os_runtime/40_EVIDENCE_AND_LINEAGE/CROSS_MARKET_LIMITED/[^/]+/ROUND3_SEC_OBSERVER_INBOX\.json$' \
              || true
          )
          if [[ ${#inboxes[@]} -ne 1 ]]; then
            printf 'ROUND3_OBSERVER_EXPECTED_ONE_NEW_INBOX count=%s\n' "${#inboxes[@]}" >&2
            printf '%s\n' "${inboxes[@]}" >&2
            exit 1
          fi
          inbox="${inboxes[0]}"
          run_id="$(basename "$(dirname "$inbox")")"
          echo "inbox=$inbox" >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - name: Apply official SEC observer evidence
        id: apply
        shell: bash
        run: |
          set -Eeuo pipefail
          result="$(python automation/cross_market/apply_round3_sec_observer_results.py \
            --repo-root . \
            --inbox '${{ steps.inbox.outputs.inbox }}')"
          echo "$result"
          python - "$result" <<'PY' >> "$GITHUB_OUTPUT"
          import json, sys
          data = json.loads(sys.argv[1])
          print(f"status={data.get('status', '')}")
          print(f"cycle_id={data.get('cycle_id', '')}")
          print(f"cycle_completed={'true' if data.get('cycle_completed') else 'false'}")
          print(f"sec_completed={data.get('sec_official_completed_issuer_count', 0)}")
          print(f"operating_state={data.get('operating_state', '')}")
          PY
      - name: Validate updated operating state
        run: |
          root=investment_os_runtime/30_STATE_CURRENT/46_CROSS_MARKET_OPERATIONS
          python automation/cross_market/validate_round3_outputs.py \
            --run "$root/CROSS_MARKET_LIMITED_RUN_CURRENT.json" \
            --proposal "$root/CROSS_MARKET_RESEARCH_PROPOSAL_CURRENT.json" \
            --ledger "$root/CROSS_MARKET_LIMITED_LEDGER_CURRENT.json"
      - name: Enforce observer output firewall
        shell: bash
        run: |
          set -Eeuo pipefail
          python - '${{ steps.inbox.outputs.run_id }}' <<'PY'
          import subprocess
          import sys

          run_id = sys.argv[1]
          allowed = {
              'investment_os_runtime/30_STATE_CURRENT/46_CROSS_MARKET_OPERATIONS/CROSS_MARKET_LIMITED_LEDGER_CURRENT.json',
              'investment_os_runtime/30_STATE_CURRENT/46_CROSS_MARKET_OPERATIONS/CROSS_MARKET_LIMITED_RUN_CURRENT.json',
              'investment_os_runtime/30_STATE_CURRENT/46_CROSS_MARKET_OPERATIONS/CROSS_MARKET_RESEARCH_PROPOSAL_CURRENT.json',
              f'investment_os_runtime/40_EVIDENCE_AND_LINEAGE/CROSS_MARKET_LIMITED/{run_id}/ROUND3_SEC_OFFICIAL_RETRIEVAL_RESULT.json',
              f'investment_os_runtime/40_EVIDENCE_AND_LINEAGE/CROSS_MARKET_LIMITED/{run_id}/ROUND3_SEC_OBSERVER_MANIFEST.json',
          }
          changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          forbidden = [path for path in changed if path not in allowed]
          if forbidden:
              raise SystemExit('ROUND3_OBSERVER_SCOPE_VIOLATION:' + ','.join(forbidden))
          print({'observer_generated_paths': changed, 'orders': 0, 'trade_authority': 'NONE'})
          PY
      - name: Commit governed observer outputs to the same result branch
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            investment_os_runtime/30_STATE_CURRENT/46_CROSS_MARKET_OPERATIONS \
            investment_os_runtime/40_EVIDENCE_AND_LINEAGE/CROSS_MARKET_LIMITED/${{ steps.inbox.outputs.run_id }}/ROUND3_SEC_OFFICIAL_RETRIEVAL_RESULT.json \
            investment_os_runtime/40_EVIDENCE_AND_LINEAGE/CROSS_MARKET_LIMITED/${{ steps.inbox.outputs.run_id }}/ROUND3_SEC_OBSERVER_MANIFEST.json
          if git diff --cached --quiet; then
            echo "No new observer outputs to commit."
            exit 0
          fi
          git commit -m "cross-market: apply official SEC observer evidence"
          git push origin "HEAD:${{ github.ref_name }}"
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          WATERMARK="$(python - <<'PY'
          import json
          from pathlib import Path
          p=Path('investment_os_runtime/30_STATE_CURRENT/46_CROSS_MARKET_OPERATIONS/CROSS_MARKET_LIMITED_RUN_CURRENT.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          print(data.get('as_of') or data.get('as_of_date') or data.get('market_date') or data.get('data_watermark') or '')
          PY
          )"
          test -n "$WATERMARK"
          CAPTURE_STATUS="$(python - <<'PY'
          import json
          from pathlib import Path
          p=Path('investment_os_runtime/30_STATE_CURRENT/46_CROSS_MARKET_OPERATIONS/CROSS_MARKET_LIMITED_RUN_CURRENT.json')
          print(json.loads(p.read_text(encoding='utf-8')).get('capture_status', ''))
          PY
          )"
          if [[ "$CAPTURE_STATUS" == "CAPTURED_BOTH_MARKETS" ]]; then
            OPERATING_STATUS="PASS"
            ADVANCE_ARGS=(--advance-current)
          else
            OPERATING_STATUS="BLOCKED"
            ADVANCE_ARGS=()
          fi
          python automation/operating_current/publish_operating_current.py \
            --domain CROSS_MARKET_LIMITED \
            --status "$OPERATING_STATUS" \
            --source-workflow "Round 3 SEC Observer Ingestion" \
            --source-run-id "${{ github.run_id }}" \
            --source-run-attempt "${{ github.run_attempt }}" \
            --source-branch "${{ github.ref_name }}" \
            --source-commit "$SOURCE_COMMIT" \
            --watermark "$WATERMARK" \
            --watermark-sort-key "$WATERMARK" \
            --qc-status "${{ steps.apply.outputs.status }}:$CAPTURE_STATUS" \
            "${ADVANCE_ARGS[@]}"
          {
            echo "## Round 3 SEC observer ingestion"
            echo "- branch: \`${{ github.ref_name }}\`"
            echo "- run_id: \`${{ steps.inbox.outputs.run_id }}\`"
