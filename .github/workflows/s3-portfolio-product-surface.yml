name: S3 Portfolio + Product Surface
run-name: "S3 simplify portfolio and user product surface"

on:
  push:
    branches: [main]
    paths:
      - "automation/product_surface/**"
      - "tests/test_s3_portfolio_product_surface.py"
      - "tests/test_s4_runtime_publishers.py"
      - "tests/test_s2_investment_pipeline.py"
      - ".github/workflows/s3-portfolio-product-surface.yml"
      - ".github/workflows/occ-r4-portfolio-decision-freshness.yml"
      - "investment_os_runtime/00_CONTROL/SYSTEM_CURRENT.json"
      - "investment_os_runtime/00_CONTROL/ACTIVE_WORKFLOW_REGISTRY.json"
      - "investment_os_runtime/50_OPERATING_PRODUCTS/S3_PRODUCT_SURFACE_CONTRACT.md"
      - "automation/operating_current/publish_operating_current.py"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "automation/product_surface/**"
      - "tests/test_s3_portfolio_product_surface.py"
      - "tests/test_s2_investment_pipeline.py"
      - ".github/workflows/s3-portfolio-product-surface.yml"
      - ".github/workflows/occ-r4-portfolio-decision-freshness.yml"
      - "investment_os_runtime/00_CONTROL/SYSTEM_CURRENT.json"
      - "investment_os_runtime/00_CONTROL/ACTIVE_WORKFLOW_REGISTRY.json"
      - "investment_os_runtime/50_OPERATING_PRODUCTS/S3_PRODUCT_SURFACE_CONTRACT.md"
      - "automation/operating_current/publish_operating_current.py"
  workflow_run:
    workflows:
      - "R2 WP2-R Market Marks Refresh"
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  TRADE_AUTHORITY: NONE

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install deterministic validation runtime
        run: python -m pip install --retries 5 --timeout 30 pytest pyyaml

      - name: Compile S3 producers
        run: python -m py_compile automation/product_surface/build_product_surface.py automation/product_surface/publish_product_surface.py automation/operating_current/publish_operating_current.py

      - name: Validate S3 and preserve S2 contracts
        run: |
          pytest -q             tests/test_s3_portfolio_product_surface.py             tests/test_s2_investment_pipeline.py             tests/test_s4_runtime_publishers.py

      - name: Parse S3 and retired portfolio workflows
        run: |
          python - <<'PY'
          import yaml
          from pathlib import Path
          for path in [
              ".github/workflows/s3-portfolio-product-surface.yml",
              ".github/workflows/occ-r4-portfolio-decision-freshness.yml",
          ]:
              yaml.safe_load(Path(path).read_text(encoding="utf-8"))
          s3 = Path(".github/workflows/s3-portfolio-product-surface.yml").read_text(encoding="utf-8")
          assert "actions: write" in s3
          assert "gh workflow run final-closure-phase2-decision-lifecycle.yml --ref main" in s3
          print({"s3_workflow_yaml": "PASS", "explicit_lifecycle_handoff": "PASS"})
          PY

      - name: Enforce read-only S3 scope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin main
          python - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(
              ["git","diff","--name-only","origin/main...HEAD"], text=True
          ).splitlines())
          forbidden_prefixes=(
              "investment_os_runtime/30_STATE_CURRENT/10_REAL_ACCOUNT/",
              "investment_os_runtime/30_STATE_CURRENT/12_EQUITY_COMPENSATION/",
              "investment_os_runtime/30_STATE_CURRENT/15_PORTFOLIO_INPUT/",
              "investment_os_runtime/30_STATE_CURRENT/20_SIMULATION/",
              "investment_os_runtime/30_STATE_CURRENT/40_CANDIDATE/",
              "investment_os_runtime/30_STATE_CURRENT/60_DECISIONS/",
          )
          leaked=sorted(path for path in changed if path.startswith(forbidden_prefixes))
          if leaked:
              raise SystemExit("S3_PROTECTED_STATE_MUTATION:" + ",".join(leaked))
          print({
              "protected_state_mutations":0,
              "target_portfolio_writebacks":0,
              "orders":0,
              "trade_authority":"NONE",
          })
          PY

  production:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: s3-portfolio-product-surface-production
      cancel-in-progress: false
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Resolve current S2 and Portfolio Marks authorities
        id: authority
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin operating-current:refs/remotes/origin/operating-current --force
          git show origin/operating-current:operating_current/domains/PORTFOLIO_MARKS.json > /tmp/marks-domain.json
          git show origin/operating-current:operating_current/domains/INVESTMENT_PIPELINE.json > /tmp/investment-domain.json
          git show origin/operating-current:operating_current/investment_pipeline/RECOMMENDATION_CURRENT.json > /tmp/s2-recommendation.json
          git show origin/operating-current:operating_current/investment_pipeline/D1_CURRENT.json > /tmp/s2-d1.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          marks=json.load(open("/tmp/marks-domain.json",encoding="utf-8"))
          investment=json.load(open("/tmp/investment-domain.json",encoding="utf-8"))
          for label,payload in [("marks",marks),("investment",investment)]:
              if payload.get("status") != "PASS":
                  raise SystemExit(f"S3_{label.upper()}_OPERATING_CURRENT_NOT_PASS")
              if payload.get("trade_authority") != "NONE" or payload.get("orders") != 0:
                  raise SystemExit(f"S3_{label.upper()}_AUTHORITY_VIOLATION")
          print(f"mark_branch={marks['source_branch']}")
          print(f"mark_commit={marks['source_commit_sha']}")
          print(f"mark_watermark={marks['data_watermark']}")
          print(f"investment_commit={investment['source_commit_sha']}")
          print(f"investment_watermark={investment['data_watermark']}")
          PY

      - name: Restore exact current portfolio marks and position identities
        shell: bash
        env:
          MARK_BRANCH: ${{ steps.authority.outputs.mark_branch }}
          MARK_COMMIT: ${{ steps.authority.outputs.mark_commit }}
        run: |
          set -Eeuo pipefail
          git fetch origin "$MARK_BRANCH"
          git cat-file -e "$MARK_COMMIT^{commit}"
          git show "$MARK_COMMIT:investment_os_runtime/30_STATE_CURRENT/25_PORTFOLIO_MARKS/PORTFOLIO_MARKS_CURRENT.json" > /tmp/portfolio-marks.json
          git show "$MARK_COMMIT:investment_os_runtime/30_STATE_CURRENT/10_REAL_ACCOUNT/REAL_ACCOUNT_POSITIONS_CURRENT.json" > /tmp/real-positions.json
          git show "$MARK_COMMIT:investment_os_runtime/30_STATE_CURRENT/20_SIMULATION/SIMULATION_POSITIONS_CURRENT.json" > /tmp/simulation-positions.json

      - name: Build simplified portfolio decision surface and daily brief
        run: |
          python automation/product_surface/build_product_surface.py             --marks-domain /tmp/marks-domain.json             --investment-domain /tmp/investment-domain.json             --marks /tmp/portfolio-marks.json             --real-positions /tmp/real-positions.json             --simulation-positions /tmp/simulation-positions.json             --recommendation /tmp/s2-recommendation.json             --d1 /tmp/s2-d1.json             --output-json /tmp/PORTFOLIO_DECISION_SURFACE_CURRENT.json             --output-md /tmp/DAILY_INVESTMENT_BRIEF_CURRENT.md

      - name: Validate product boundary before publication
        run: |
          python - <<'PY'
          import json
          p=json.load(open("/tmp/PORTFOLIO_DECISION_SURFACE_CURRENT.json",encoding="utf-8"))
          assert p["status"] == "PASS_S3_PORTFOLIO_PRODUCT_SURFACE"
          assert p["product_surface"]["canonical_user_products"] == [
              "DAILY_INVESTMENT_BRIEF",
              "PORTFOLIO_DECISION_SURFACE",
          ]
          assert p["product_surface"]["legacy_r3_r4_wp5_products_are_current"] is False
          assert p["executive"]["automatic_rebalance_allowed"] is False
          assert p["executive"]["automatic_position_change_allowed"] is False
          assert p["controls"]["real_account_mutations"] == 0
          assert p["controls"]["simulation_mutations"] == 0
          assert p["controls"]["target_portfolio_writebacks"] == 0
          assert p["orders"] == 0
          assert p["trade_authority"] == "NONE"
          print({
              "as_of_date":p["as_of_date"],
              "portfolio_holding_count":p["executive"]["portfolio_holding_count"],
              "portfolio_recommendation_coverage_count":p["executive"]["portfolio_recommendation_coverage_count"],
              "decision_review_required_count":p["executive"]["decision_review_required_count"],
              "orders":0,
              "trade_authority":"NONE",
          })
          PY

      - name: Publish canonical S3 product surface to Operating Current
        shell: bash
        run: |
          set -Eeuo pipefail
          MAIN_HEAD="$(git rev-parse HEAD)"
          python automation/product_surface/publish_product_surface.py             --surface-json /tmp/PORTFOLIO_DECISION_SURFACE_CURRENT.json             --daily-brief /tmp/DAILY_INVESTMENT_BRIEF_CURRENT.md             --source-workflow "S3 Portfolio + Product Surface"             --source-run-id "${{ github.run_id }}"             --source-run-attempt "${{ github.run_attempt }}"             --source-branch main             --source-commit "$MAIN_HEAD"

      - name: Explicitly hand off Current S3 to Decision Lifecycle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh workflow run final-closure-phase2-decision-lifecycle.yml --ref main
          echo "Decision Lifecycle workflow_dispatch accepted after S3 publication."

      - name: Record S3 operating summary
        run: |
          {
            echo "## S3 Portfolio + Product Surface"
            echo "- Portfolio Marks: ${{ steps.authority.outputs.mark_watermark }}"
            echo "- S2 Investment Pipeline: ${{ steps.authority.outputs.investment_watermark }}"
            echo "- canonical user products: Daily Investment Brief + Portfolio Decision Surface"
            echo "- downstream handoff: explicit workflow_dispatch to Decision Lifecycle"
            echo "- old R3/R4/WP5 product entrypoints: retired from current surface"
            echo "- automatic portfolio mutation / orders: 0 / 0"
            echo "- trade_authority: NONE"
          } >> "$GITHUB_STEP_SUMMARY"
