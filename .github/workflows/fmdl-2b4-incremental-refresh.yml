name: FMDL 2B-4 Incremental History and Factor Refresh

on:
  pull_request:
    branches: [main]
    paths:
      - "config/fmdl2_incremental_refresh.json"
      - "scripts/fmdl2b4_history.py"
      - "scripts/run_incremental_history_refresh.py"
      - "scripts/run_incremental_history_refresh_v2.py"
      - "scripts/finalize_b4_history_candidate.py"
      - "scripts/run_b4_factor_refresh.py"
      - "scripts/validate_fmdl2b4_candidate.py"
      - "scripts/publish_fmdl2b4.py"
      - "scripts/run_fmdl2b4_operating.py"
      - "scripts/validate_fmdl2b4_freshness.py"
      - "scripts/refresh_investment_os_interface.py"
      - "tests/test_fmdl2b4_incremental_refresh.py"
      - "tests/test_fmdl2b4_snapshot_identity.py"
      - "docs/FMDL-2B4_INCREMENTAL_REFRESH.md"
      - ".github/workflows/fmdl-2b4-incremental-refresh.yml"
  schedule:
    - cron: "15 10 * * 1-5"
  workflow_dispatch:
    inputs:
      refresh_fmdl1_current:
        description: "Refresh FMDL-1 Current before B4 operation"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: fmdl-2b4-refresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Validate contracts and regression suite
        shell: bash
        run: |
          set -o pipefail
          mkdir -p diagnostics
          {
            python -m scripts.refresh_investment_os_interface
            python scripts/validate_investment_os_interface.py
            pytest -q tests/test_fmdl2a_contract.py tests/test_fmdl2b2_full_backfill.py tests/test_fmdl2b2_aggregate_policy.py tests/test_fmdl2b3_factor_engine.py tests/test_fmdl2b4_incremental_refresh.py tests/test_fmdl2b4_snapshot_identity.py
          } 2>&1 | tee diagnostics/FMDL2B4_DETERMINISTIC_VALIDATION.log
      - name: Upload deterministic validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fmdl2b4-deterministic-validation
          path: diagnostics/FMDL2B4_DETERMINISTIC_VALIDATION.log
          if-no-files-found: error
          retention-days: 14

  operate:
    needs: deterministic-validation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source branch for one-shot acceptance persistence
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Refresh FMDL-1 Current for acceptance
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.refresh_fmdl1_current == true)
        run: python pipeline/run_daily.py --trigger manual
      - name: Rebind and validate Investment OS interface
        run: |
          python -m scripts.refresh_investment_os_interface
          python scripts/validate_investment_os_interface.py
      - name: Enforce latest completed-session Current
        run: python -m scripts.validate_fmdl2b4_freshness
      - name: Run incremental history and factor operating chain
        run: python -m scripts.run_fmdl2b4_operating
      - name: Upload B4 operating evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fmdl2b4-operating-evidence
          path: |
            diagnostics/FMDL2B4_*.json
            diagnostics/SCRIPTS_RUN_*_STDOUT.txt
            diagnostics/SCRIPTS_RUN_*_STDERR.txt
            outputs/status/FMDL2B4_*.json
            outputs/history/refresh_candidate/
            outputs/history/current/
            outputs/factors/refresh_candidate/
            outputs/factors/current/
            outputs/investment_os/INVESTMENT_OS_MARKET_DATA_INTERFACE.json
          if-no-files-found: warn
          retention-days: 14
      - name: Persist accepted operating state to source branch
        shell: bash
        run: |
          target="${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/current outputs/status outputs/archive outputs/investment_os outputs/history/current outputs/history/archive outputs/history/refresh_candidate outputs/factors/current outputs/factors/archive outputs/factors/refresh_candidate datasets/history/incremental datasets/history/repair
          if git diff --cached --quiet; then
            echo "No accepted operating-state changes to commit"
          else
            git commit -m "data: FMDL-2B-4 incremental history and factor Current [skip ci]"
            git pull --rebase origin "$target"
            git push origin HEAD:"$target"
          fi
