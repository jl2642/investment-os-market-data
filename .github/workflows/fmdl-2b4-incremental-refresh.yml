name: FMDL 2B-4 Component Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "config/fmdl2_incremental_refresh.json"
      - "scripts/fmdl2b4_history.py"
      - "scripts/run_incremental_history_refresh.py"
      - "scripts/run_incremental_history_refresh_v2.py"
      - "scripts/finalize_b4_history_candidate.py"
      - "scripts/run_b4_factor_refresh.py"
      - "scripts/validate_fmdl2b4_candidate.py"
      - "scripts/publish_fmdl2b4.py"
      - "scripts/run_fmdl2b4_operating.py"
      - "scripts/validate_fmdl2b4_freshness.py"
      - "scripts/validate_fmdl2b4_replay.py"
      - "scripts/refresh_investment_os_interface.py"
      - "tests/test_fmdl2b4_incremental_refresh.py"
      - "tests/test_fmdl2b4_snapshot_identity.py"
      - "tests/test_round1_governed_publication_workflows.py"
      - "docs/FMDL-2B4_*.md"
      - ".github/workflows/fmdl-2b4-incremental-refresh.yml"
      - ".github/workflows/fmdl-daily-production.yml"
  push:
    branches: [main]
    paths:
      - "config/fmdl2_incremental_refresh.json"
      - "scripts/fmdl2b4_history.py"
      - "scripts/run_incremental_history_refresh.py"
      - "scripts/run_incremental_history_refresh_v2.py"
      - "scripts/finalize_b4_history_candidate.py"
      - "scripts/run_b4_factor_refresh.py"
      - "scripts/validate_fmdl2b4_candidate.py"
      - "scripts/publish_fmdl2b4.py"
      - "scripts/run_fmdl2b4_operating.py"
      - "scripts/validate_fmdl2b4_freshness.py"
      - "scripts/validate_fmdl2b4_replay.py"
      - "scripts/refresh_investment_os_interface.py"
      - "tests/test_fmdl2b4_incremental_refresh.py"
      - "tests/test_fmdl2b4_snapshot_identity.py"
      - "tests/test_round1_governed_publication_workflows.py"
      - ".github/workflows/fmdl-2b4-incremental-refresh.yml"
      - ".github/workflows/fmdl-daily-production.yml"
  workflow_dispatch:
    inputs:
      refresh_fmdl1_current:
        description: "Refresh FMDL-1 Current before component evidence run"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: fmdl-2b4-component-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Validate contracts and regression suite
        shell: bash
        run: |
          set -o pipefail
          mkdir -p diagnostics
          {
            python -m scripts.refresh_investment_os_interface
            python scripts/validate_investment_os_interface.py
            pytest -q \
              tests/test_fmdl2a_contract.py \
              tests/test_fmdl2b2_full_backfill.py \
              tests/test_fmdl2b2_aggregate_policy.py \
              tests/test_fmdl2b3_factor_engine.py \
              tests/test_fmdl2b4_incremental_refresh.py \
              tests/test_fmdl2b4_snapshot_identity.py \
              tests/test_round1_governed_publication_workflows.py
          } 2>&1 | tee diagnostics/FMDL2B4_DETERMINISTIC_VALIDATION.log
      - name: Upload deterministic validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fmdl2b4-deterministic-validation
          path: diagnostics/FMDL2B4_DETERMINISTIC_VALIDATION.log
          if-no-files-found: error
          retention-days: 14

  component-operating-evidence:
    if: github.event_name == 'workflow_dispatch'
    needs: deterministic-validation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Optionally refresh FMDL-1 Current
        if: inputs.refresh_fmdl1_current == true
        run: python pipeline/run_daily.py --trigger manual
      - name: Rebind and validate Investment OS interface
        run: |
          python -m scripts.refresh_investment_os_interface
          python scripts/validate_investment_os_interface.py
      - name: Enforce latest completed-session Current
        run: python -m scripts.validate_fmdl2b4_freshness
      - name: Run incremental history and factor component
        run: python -m scripts.run_fmdl2b4_operating
      - name: Upload component evidence without Canonical publication
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fmdl2b4-component-${{ github.run_id }}-a${{ github.run_attempt }}
          path: |
            diagnostics/FMDL2B4_*.json
            diagnostics/SCRIPTS_RUN_*_STDOUT.txt
            diagnostics/SCRIPTS_RUN_*_STDERR.txt
            outputs/status/FMDL2B4_*.json
            outputs/current/
            outputs/investment_os/
            outputs/history/refresh_candidate/
            outputs/history/current/
            outputs/factors/refresh_candidate/
            outputs/factors/current/
          if-no-files-found: warn
          retention-days: 14
      - name: Record component boundary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## FMDL 2B-4 component evidence
          - This workflow validates history and factor generation only.
          - It does not push or publish Canonical state.
          - Scheduled production is owned by fmdl-daily-production.yml.
          - Direct main publication is disabled.
          EOF
