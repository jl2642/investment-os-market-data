name: HKCU P5B REAL Pretrade Memo

on:
  pull_request:
    paths:
      - 'config/hkcu_p5b_real_pretrade_memo_contract.json'
      - 'evidence/hkcu_p5b/HKCU_P5B_REAL_PRETRADE_EVIDENCE_20260807.csv'
      - 'pipeline/hkcu_p5b_real_pretrade_memo.py'
      - 'scripts/validate_hkcu_p5b_real_pretrade_memo.py'
      - 'tests/test_hkcu_p5b_real_pretrade_memo.py'
      - 'docs/HKCU-P5B_REAL_PRETRADE_MEMO.md'
      - '.github/workflows/hkcu-p5b-real-pretrade-memo.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-and-scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q tests/test_hkcu_p5b_real_pretrade_memo.py
      - name: Enforce isolated P5B scope
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}"
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" > /tmp/p5b_paths.txt
          cat /tmp/p5b_paths.txt
          python - <<'PY'
          from pathlib import Path
          allowed = {
              'config/hkcu_p5b_real_pretrade_memo_contract.json',
              'evidence/hkcu_p5b/HKCU_P5B_REAL_PRETRADE_EVIDENCE_20260807.csv',
              'pipeline/hkcu_p5b_real_pretrade_memo.py',
              'scripts/validate_hkcu_p5b_real_pretrade_memo.py',
              'tests/test_hkcu_p5b_real_pretrade_memo.py',
              'docs/HKCU-P5B_REAL_PRETRADE_MEMO.md',
              '.github/workflows/hkcu-p5b-real-pretrade-memo.yml',
          }
          actual = {x.strip() for x in Path('/tmp/p5b_paths.txt').read_text().splitlines() if x.strip()}
          bad = sorted(actual - allowed)
          if bad:
              raise SystemExit('P5B_SCOPE_VIOLATION:' + ','.join(bad))
          protected = ('outputs/hk_candidate/', 'outputs/simulation/', 'outputs/real', 'investment_os_runtime/30_STATE_CURRENT/', 'orders/')
          mutations = sorted(x for x in actual if x.startswith(protected))
          if mutations:
              raise SystemExit('P5B_PROTECTED_PATH_MUTATION:' + ','.join(mutations))
          PY

  real-pretrade-memo:
    needs: unit-and-scope
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Rebuild P4-1R context
        run: |
          rm -rf work/hkcu_p5b_context work/hkcu_p5b_fit work/hkcu_p5b_review work/hkcu_p5b_scenarios work/hkcu_p5b_proposal work/hkcu_p5b_freeze work/hkcu_p5b_memo
          python -m pipeline.hkcu_p4_1r_canonical_data_adapter --repo-root . --output work/hkcu_p5b_context
          python scripts/validate_hkcu_p4_1r_portfolio_context_completion.py --repo-root . --output work/hkcu_p5b_context
      - name: Rebuild P4-1 fit
        run: |
          python -m pipeline.hkcu_p4_1_portfolio_fit_reassessment_decision_adapter --repo-root . --context-dir work/hkcu_p5b_context --output work/hkcu_p5b_fit
          python scripts/validate_hkcu_p4_1_portfolio_fit_reassessment.py --repo-root . --context-dir work/hkcu_p5b_context --output work/hkcu_p5b_fit
      - name: Rebuild P4-2 construction review
        run: |
          python -m pipeline.hkcu_p4_2_portfolio_construction_review_decision_adapter --repo-root . --context-dir work/hkcu_p5b_context --fit-dir work/hkcu_p5b_fit --output work/hkcu_p5b_review
          python scripts/validate_hkcu_p4_2_portfolio_construction_review.py --repo-root . --context-dir work/hkcu_p5b_context --fit-dir work/hkcu_p5b_fit --output work/hkcu_p5b_review
      - name: Rebuild P4-3 scenarios
        run: |
          python -m pipeline.hkcu_p4_3_portfolio_construction_scenario_test --repo-root . --p4-2-dir work/hkcu_p5b_review --output work/hkcu_p5b_scenarios
          python scripts/validate_hkcu_p4_3_portfolio_construction_scenario_test.py --repo-root . --p4-2-dir work/hkcu_p5b_review --output work/hkcu_p5b_scenarios
      - name: Rebuild P4-4 proposal
        run: |
          python -m pipeline.hkcu_p4_4_portfolio_proposal_review --repo-root . --p4-2-dir work/hkcu_p5b_review --p4-3-dir work/hkcu_p5b_scenarios --output work/hkcu_p5b_proposal
          python scripts/validate_hkcu_p4_4_portfolio_proposal_review.py --repo-root . --p4-2-dir work/hkcu_p5b_review --p4-3-dir work/hkcu_p5b_scenarios --output work/hkcu_p5b_proposal
      - name: Rebuild P5A frozen entry
        run: |
          python -m pipeline.hkcu_p5a_phase5_contract_entry_freeze --repo-root . --p4-4-dir work/hkcu_p5b_proposal --output work/hkcu_p5b_freeze
          python scripts/validate_hkcu_p5a_phase5_contract_entry_freeze.py --repo-root . --p4-4-dir work/hkcu_p5b_proposal --output work/hkcu_p5b_freeze
      - name: Execute P5B REAL Pre-trade Memo
        run: |
          python -m pipeline.hkcu_p5b_real_pretrade_memo --repo-root . --p5a-dir work/hkcu_p5b_freeze --output work/hkcu_p5b_memo
      - name: Independently validate P5B
        run: |
          python scripts/validate_hkcu_p5b_real_pretrade_memo.py --repo-root . --p5a-dir work/hkcu_p5b_freeze --output work/hkcu_p5b_memo
      - name: Render P5B decision and memo
        if: always()
        run: |
          test ! -f work/hkcu_p5b_memo/HKCU_P5B_REAL_PRETRADE_MEMO_DECISION.json || cat work/hkcu_p5b_memo/HKCU_P5B_REAL_PRETRADE_MEMO_DECISION.json
          test ! -f work/hkcu_p5b_memo/HKCU_P5B_REAL_PRETRADE_MEMO_SUMMARY.json || cat work/hkcu_p5b_memo/HKCU_P5B_REAL_PRETRADE_MEMO_SUMMARY.json
          test ! -f work/hkcu_p5b_memo/HKCU_P5B_REAL_PRETRADE_MEMO_SECURITY_MEMOS.csv || cat work/hkcu_p5b_memo/HKCU_P5B_REAL_PRETRADE_MEMO_SECURITY_MEMOS.csv
          test ! -f work/hkcu_p5b_memo/HKCU_P5B_REAL_PRETRADE_MEMO.md || cat work/hkcu_p5b_memo/HKCU_P5B_REAL_PRETRADE_MEMO.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hkcu-p5b-real-pretrade-memo
          path: |
            work/hkcu_p5b_memo/HKCU_P5B_REAL_PRETRADE_MEMO*
            work/hkcu_p5b_freeze/HKCU_P5A_ENTRY_FREEZE_*
            work/hkcu_p5b_proposal/HKCU_P4_4_PROPOSAL_REVIEW_DECISION.json
            work/hkcu_p5b_scenarios/HKCU_P4_3_SCENARIO_TEST_DECISION.json
            work/hkcu_p5b_review/HKCU_P4_2_CONSTRUCTION_REVIEW_DECISION.json
            work/hkcu_p5b_fit/HKCU_P4_1_REASSESSMENT_DECISION.json
            work/hkcu_p5b_context/HKCU_P4_1R_DECISION.json
          if-no-files-found: error
