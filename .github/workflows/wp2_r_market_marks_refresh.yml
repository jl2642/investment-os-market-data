name: R2 WP2-R Market Marks Refresh
run-name: "R2 WP2-R tracked price and NAV refresh"

on:
  push:
    branches:
      - main
      - agent/r2-product-capability-hardening
      - "agent/runtime-closure-*"
    paths:
      - "automation/wp2_r/**"
      - ".github/workflows/wp2_r_market_marks_refresh.yml"
      - "investment_os_runtime/30_STATE_CURRENT/10_REAL_ACCOUNT/REAL_ACCOUNT_CURRENT.json"
      - "investment_os_runtime/30_STATE_CURRENT/12_EQUITY_COMPENSATION/**"
      - "investment_os_runtime/30_STATE_CURRENT/15_PORTFOLIO_INPUT/**"
      - "investment_os_runtime/30_STATE_CURRENT/20_SIMULATION/SIMULATION_LEDGER_CURRENT.json"
  pull_request:
    branches: [main]
    paths:
      - "automation/wp2_r/**"
      - ".github/workflows/wp2_r_market_marks_refresh.yml"
      - "investment_os_runtime/30_STATE_CURRENT/10_REAL_ACCOUNT/**"
      - "investment_os_runtime/30_STATE_CURRENT/12_EQUITY_COMPENSATION/**"
      - "investment_os_runtime/30_STATE_CURRENT/15_PORTFOLIO_INPUT/**"
      - "investment_os_runtime/30_STATE_CURRENT/20_SIMULATION/**"
      - "investment_os_runtime/30_STATE_CURRENT/25_PORTFOLIO_MARKS/**"
      - "investment_os_runtime/30_STATE_CURRENT/70_OPERATIONS/**"
  workflow_dispatch:
  schedule:
    - cron: "45 14 * * 1-5"

permissions:
  contents: write

env:
  TRADE_AUTHORITY: NONE

jobs:
  refresh-build-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install PR validation runtime
        if: github.event_name == 'pull_request'
        run: python -m pip install --retries 5 --timeout 30 -r automation/wp2_r/requirements.lock

      - name: Run deterministic market-mark regression tests
        if: github.event_name == 'pull_request'
        run: |
          python -m pytest -q \
            automation/wp2_r/tests/test_intraday_previous_close_session.py \
            automation/wp2_r/tests/test_pending_settlement_receivable.py \
            automation/wp2_r/tests/test_validate_authorized_real_deltas.py

      - name: Build position identity baseline
        run: |
          python automation/wp2_r/build_portfolio_current.py --repo-root .
          python automation/wp2_r/finalize_account_summaries.py --repo-root .
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          identity = {}
          for relative in [
              'investment_os_runtime/30_STATE_CURRENT/10_REAL_ACCOUNT/REAL_ACCOUNT_POSITIONS_CURRENT.json',
              'investment_os_runtime/30_STATE_CURRENT/20_SIMULATION/SIMULATION_POSITIONS_CURRENT.json',
          ]:
              payload = json.loads((root / relative).read_text(encoding='utf-8'))
              identity[payload['account']] = [
                  {
                      'security_id': row['security_id'],
                      'quantity': row['quantity'],
                      'available_quantity': row['available_quantity'],
                      'cost_basis': row['cost_basis'],
                      'unit_cost': row['unit_cost'],
                  }
                  for row in payload['holdings']
              ]
          Path('/tmp/wp2r_position_economic_identity.json').write_text(
              json.dumps(identity, ensure_ascii=False, sort_keys=True),
              encoding='utf-8',
          )
          PY

      - name: Refresh all tracked listed prices and fund NAVs
        if: github.event_name != 'pull_request'
        run: python automation/wp2_r/refresh_market_marks.py --repo-root .

      - name: Use governed marks during PR validation
        if: github.event_name == 'pull_request'
        run: |
          echo "PR validation is deterministic and network-independent."
          echo "Live provider refresh is reserved for push, schedule and workflow_dispatch production runs."

      - name: Rebuild Portfolio Current from governed marks
        run: |
          python automation/wp2_r/build_portfolio_current.py --repo-root .
          python automation/wp2_r/finalize_account_summaries.py --repo-root .

      - name: Validate fresh marks and zero market-driven economic mutation
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          marks = json.loads((root / 'investment_os_runtime/30_STATE_CURRENT/25_PORTFOLIO_MARKS/PORTFOLIO_MARKS_CURRENT.json').read_text(encoding='utf-8'))
          real = json.loads((root / 'investment_os_runtime/30_STATE_CURRENT/10_REAL_ACCOUNT/REAL_ACCOUNT_POSITIONS_CURRENT.json').read_text(encoding='utf-8'))
          sim = json.loads((root / 'investment_os_runtime/30_STATE_CURRENT/20_SIMULATION/SIMULATION_POSITIONS_CURRENT.json').read_text(encoding='utf-8'))
          run = json.loads((root / 'investment_os_runtime/30_STATE_CURRENT/70_OPERATIONS/PORTFOLIO_CURRENT_RUN_CURRENT.json').read_text(encoding='utf-8'))
          candidate = json.loads((root / 'investment_os_runtime/40_EVIDENCE_AND_LINEAGE/WP2_R/PORTFOLIO_MARKS_REFRESH_CANDIDATE.json').read_text(encoding='utf-8'))
          before = json.loads(Path('/tmp/wp2r_position_economic_identity.json').read_text(encoding='utf-8'))

          after = {}
          for payload in (real, sim):
              after[payload['account']] = [
                  {
                      'security_id': row['security_id'],
                      'quantity': row['quantity'],
                      'available_quantity': row['available_quantity'],
                      'cost_basis': row['cost_basis'],
                      'unit_cost': row['unit_cost'],
                  }
                  for row in payload['holdings']
              ]

          required_ids = {row['security_id'] for row in real['holdings'] + sim['holdings']}
          marked_ids = {row['security_id'] for row in marks['marks']}
          applied_delta_count = (
              int(real['position_watermark']['applied_delta_count'])
              + int(sim['position_watermark']['applied_delta_count'])
          )

          assert candidate['status'] == 'PASS_COMPLETE'
          assert marks['status'] == 'CURRENT_COMPLETE'
          assert marks['required_security_count'] == len(required_ids)
          assert marks['marked_security_count'] == len(marked_ids)
          assert required_ids == marked_ids
          assert marks['missing_security_ids'] == []
          assert candidate['stale_security_ids'] == []
          assert run['portfolio_marks_fresh'] is True
          assert run['wp4b_position_level_fit_ready'] is True
          assert run['wp5_live_action_ready'] is False
          assert run['economic_transaction_mutations'] == applied_delta_count
          assert run['position_or_cost_mutations_from_reconciliation'] == 0
          assert run['orders'] == 0
          assert before == after
          assert len(real['holdings']) == len(before['REAL'])
          assert len(sim['holdings']) == len(before['SIMULATION'])
          assert real['summary']['execution_cash_balance'] >= 0
          assert sim['summary']['execution_cash_balance'] >= 0
          assert real['summary']['account_total_assets'] == round(
              real['summary']['position_market_value']
              + real['summary']['execution_cash_balance']
              + real['summary'].get('pending_settlement_receivable', 0.0)
              + real['summary']['broker_reconciliation_exception_amount'],
              6,
          )
          assert sim['summary']['account_total_assets'] == round(
              sim['summary']['position_market_value']
              + sim['summary']['execution_cash_balance'],
              6,
          )
          assert all(row['mark_freshness_status'] == 'FRESH' for row in real['holdings'] + sim['holdings'])
          assert all(row['broker_verified'] is False for row in real['holdings'])
          assert run['trade_authority'] == marks['trade_authority'] == 'NONE'

          print({
              'validation_mode': 'governed_existing_marks' if '${{ github.event_name }}' == 'pull_request' else 'live_provider_refresh',
              'marks': marks['marked_security_count'],
              'latest_mark_date': marks['data_watermark']['latest_mark_date'],
              'real_holdings': len(real['holdings']),
              'simulation_holdings': len(sim['holdings']),
              'applied_user_deltas': applied_delta_count,
              'real_total_assets': real['summary']['account_total_assets'],
              'real_execution_cash': real['summary']['execution_cash_balance'],
              'real_pending_settlement_receivable': real['summary'].get('pending_settlement_receivable', 0.0),
              'simulation_total_assets': sim['summary']['account_total_assets'],
              'market_driven_economic_mutations': 0,
              'orders': 0,
              'trade_authority': 'NONE',
          })
          PY

      - name: Publish refreshed marks to governed agent branch
        if: github.event_name == 'push' && (github.ref == 'refs/heads/agent/r2-product-capability-hardening' || startsWith(github.ref, 'refs/heads/agent/runtime-closure-')) && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            investment_os_runtime/40_EVIDENCE_AND_LINEAGE/WP2_R/PORTFOLIO_MARKS_REFRESH_CANDIDATE.json \
            investment_os_runtime/30_STATE_CURRENT/10_REAL_ACCOUNT/REAL_ACCOUNT_POSITIONS_CURRENT.json \
            investment_os_runtime/30_STATE_CURRENT/20_SIMULATION/SIMULATION_POSITIONS_CURRENT.json \
            investment_os_runtime/30_STATE_CURRENT/25_PORTFOLIO_MARKS/PORTFOLIO_MARKS_CURRENT.json \
            investment_os_runtime/30_STATE_CURRENT/70_OPERATIONS/PORTFOLIO_CURRENT_RUN_CURRENT.json \
            investment_os_runtime/00_CONTROL/WP2_R_PORTFOLIO_CURRENT_ACCEPTANCE_RECORD.json
          if git diff --cached --quiet; then
            echo "Portfolio marks already current."
            exit 0
          fi
          git commit -m "R2 WP2-R refresh tracked Portfolio Current marks"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload immutable validated WP2-R result
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v4
        with:
          name: wp2r-eod-${{ github.run_id }}-a${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          path: |
            investment_os_runtime/40_EVIDENCE_AND_LINEAGE/WP2_R/PORTFOLIO_MARKS_REFRESH_CANDIDATE.json
            investment_os_runtime/30_STATE_CURRENT/10_REAL_ACCOUNT/REAL_ACCOUNT_POSITIONS_CURRENT.json
            investment_os_runtime/30_STATE_CURRENT/20_SIMULATION/SIMULATION_POSITIONS_CURRENT.json
            investment_os_runtime/30_STATE_CURRENT/25_PORTFOLIO_MARKS/PORTFOLIO_MARKS_CURRENT.json
            investment_os_runtime/30_STATE_CURRENT/70_OPERATIONS/PORTFOLIO_CURRENT_RUN_CURRENT.json
            investment_os_runtime/00_CONTROL/WP2_R_PORTFOLIO_CURRENT_ACCEPTANCE_RECORD.json

      - name: Publish governed production result to run branch and Operating Current
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push') && github.ref == 'refs/heads/main'
        shell: bash
        env:
          RESULT_BRANCH: automation/wp2r-eod-${{ github.run_id }}-a${{ github.run_attempt }}
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$RESULT_BRANCH"
          git add \
            investment_os_runtime/40_EVIDENCE_AND_LINEAGE/WP2_R/PORTFOLIO_MARKS_REFRESH_CANDIDATE.json \
            investment_os_runtime/30_STATE_CURRENT/10_REAL_ACCOUNT/REAL_ACCOUNT_POSITIONS_CURRENT.json \
            investment_os_runtime/30_STATE_CURRENT/20_SIMULATION/SIMULATION_POSITIONS_CURRENT.json \
            investment_os_runtime/30_STATE_CURRENT/25_PORTFOLIO_MARKS/PORTFOLIO_MARKS_CURRENT.json \
            investment_os_runtime/30_STATE_CURRENT/70_OPERATIONS/PORTFOLIO_CURRENT_RUN_CURRENT.json \
            investment_os_runtime/00_CONTROL/WP2_R_PORTFOLIO_CURRENT_ACCEPTANCE_RECORD.json
          if ! git diff --cached --quiet; then
            git commit -m "WP2-R stage validated EOD marks for operating publication"
          fi
          git push origin "HEAD:$RESULT_BRANCH"
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          MARK_DATE="$(python - <<'PY'
          import json
          print(json.load(open('investment_os_runtime/30_STATE_CURRENT/25_PORTFOLIO_MARKS/PORTFOLIO_MARKS_CURRENT.json', encoding='utf-8'))['data_watermark']['latest_mark_date'])
          PY
          )"
          python automation/operating_current/publish_operating_current.py \
            --domain PORTFOLIO_MARKS \
            --status PASS \
            --source-workflow "R2 WP2-R Market Marks Refresh" \
            --source-run-id "${{ github.run_id }}" \
            --source-run-attempt "${{ github.run_attempt }}" \
            --source-branch "$RESULT_BRANCH" \
            --source-commit "$SOURCE_COMMIT" \
            --watermark "$MARK_DATE" \
            --watermark-sort-key "$MARK_DATE" \
            --qc-status PASS_COMPLETE \
            --advance-current
          {
            echo "### Governed publication handoff"
            echo "- result_branch: $RESULT_BRANCH"
            echo "- operating_current_domain: PORTFOLIO_MARKS"
            echo "- operating_current_watermark: $MARK_DATE"
            echo "- protected-main daily promotion PR: disabled for market-only valuation refresh"
            echo "- market-driven economic mutations: 0"
            echo "- direct_main_push: disabled"
            echo "- orders: 0"
            echo "- trade_authority: NONE"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record summary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## WP2-R tracked market refresh
          - Production push/schedule/dispatch performs live provider refresh
          - Pull-request validation is deterministic and does not depend on live market-provider availability
          - Dynamic coverage for every current Real and Simulation security
          - Market-only refresh preserves the post-user-delta economic identity
          - User-confirmed transaction deltas remain explicit and auditable
          - Main source changes, scheduled runs and manual dispatches are stored as immutable artifacts and governed run branches
          - User-confirmed source changes on main immediately refresh and publish Portfolio Current; the fixed clock remains a backstop
          - Market-only results publish to Operating Current without opening a daily protected-main promotion PR
          - Protected main is never pushed directly
          - Pending settlement receivables remain separate from execution cash
          - Broker verification remains separate and false
          - WP5 live action remains blocked
          - Orders: 0
          - trade_authority: NONE
          EOF
