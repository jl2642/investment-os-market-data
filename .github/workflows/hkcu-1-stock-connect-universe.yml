name: HKCU-1 Stock Connect Universe

on:
  pull_request:
    paths:
      - 'pipeline/hkcu1_*.py'
      - 'config/hkcu1_*.json'
      - 'schemas/hkcu1_*.json'
      - 'tests/test_hkcu1*.py'
      - '.github/workflows/hkcu-1-stock-connect-universe.yml'
  workflow_dispatch:
    inputs:
      as_of_date:
        description: Point-in-time eligibility date (YYYY-MM-DD)
        required: true
        type: string
      publish_candidate:
        description: Build a release candidate after official source resolution
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q tests/test_hkcu1_build_universe.py tests/test_hkcu1_r2.py
      - name: Validate JSON contracts
        run: |
          python -m json.tool config/hkcu1_stock_connect_universe_contract.json >/dev/null
          python -m json.tool config/hkcu1_official_source_registry.json >/dev/null
          python -m json.tool schemas/hkcu1_stock_connect_eligibility.schema.json >/dev/null

  official-fetch-validation:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: First official fetch with bounded retry
        run: |
          rm -rf work/hkcu1/replay_1
          for attempt in 1 2 3 4; do
            echo "replay_1 official fetch attempt ${attempt}/4"
            python pipeline/hkcu1_fetch_official_lists.py \
              --registry config/hkcu1_official_source_registry.json \
              --output-dir work/hkcu1/replay_1 \
              --allow-partial
            if python - <<'PY'
          import json
          d=json.load(open('work/hkcu1/replay_1/HKCU1_FETCH_DECISION.json',encoding='utf-8'))
          raise SystemExit(0 if d['status']=='PASS' else 1)
          PY
            then
              break
            fi
            if [ "$attempt" -lt 4 ]; then sleep $((attempt * 5)); fi
          done
      - name: Second independent official fetch with bounded retry
        run: |
          rm -rf work/hkcu1/replay_2
          for attempt in 1 2 3 4; do
            echo "replay_2 official fetch attempt ${attempt}/4"
            python pipeline/hkcu1_fetch_official_lists.py \
              --registry config/hkcu1_official_source_registry.json \
              --output-dir work/hkcu1/replay_2 \
              --allow-partial
            if python - <<'PY'
          import json
          d=json.load(open('work/hkcu1/replay_2/HKCU1_FETCH_DECISION.json',encoding='utf-8'))
          raise SystemExit(0 if d['status']=='PASS' else 1)
          PY
            then
              break
            fi
            if [ "$attempt" -lt 4 ]; then sleep $((attempt * 5)); fi
          done
      - name: Enforce dual-source counts and deterministic replay
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import pandas as pd

          root=Path('work/hkcu1')
          decisions=[]
          frames=[]
          for replay in ('replay_1','replay_2'):
              decision=json.loads((root/replay/'HKCU1_FETCH_DECISION.json').read_text(encoding='utf-8'))
              assert decision['status']=='PASS', {replay:decision}
              rows=decision['source_rows']
              assert rows.get('SSE_SH_SOUTHBOUND_BUY_LIST')==651, {replay:rows}
              assert rows.get('SZSE_SZ_SOUTHBOUND_BUY_LIST')==651, {replay:rows}
              decisions.append(decision)
              frames.append(pd.read_csv(root/replay/'HKCU1_OFFICIAL_LIST_ROWS.csv',dtype=str))

          def codes(df, channel):
              return sorted(set(df.loc[df['channel']==channel,'security_code'].dropna().astype(str).str.zfill(5)))
          def digest(values):
              return hashlib.sha256(('\n'.join(values)+'\n').encode()).hexdigest()

          replay_hashes={}
          for idx,df in enumerate(frames,1):
              replay_hashes[f'replay_{idx}']={c:digest(codes(df,c)) for c in ('SH','SZ')}
          assert replay_hashes['replay_1']==replay_hashes['replay_2'], replay_hashes

          sh=codes(frames[0],'SH'); sz=codes(frames[0],'SZ')
          sh_set=set(sh); sz_set=set(sz)
          diff={
              'as_of_date':'2026-08-06',
              'status':'PASS',
              'deterministic_replay':True,
              'normalized_hashes':replay_hashes,
              'sh_count':len(sh),
              'sz_count':len(sz),
              'intersection_count':len(sh_set & sz_set),
              'sh_only_count':len(sh_set-sz_set),
              'sz_only_count':len(sz_set-sh_set),
              'sh_only_codes':sorted(sh_set-sz_set),
              'sz_only_codes':sorted(sz_set-sh_set),
              'trade_authority':'NONE'
          }
          (root/'HKCU1_R2B_REPLAY_AND_CHANNEL_DIFF.json').write_text(
              json.dumps(diff,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(diff,ensure_ascii=False,indent=2))
          PY
      - name: Render source-level evidence
        run: |
          cat work/hkcu1/replay_1/HKCU1_FETCH_DECISION.json
          cat work/hkcu1/replay_1/HKCU1_SOURCE_LEDGER.json
          cat work/hkcu1/replay_2/HKCU1_FETCH_DECISION.json
          cat work/hkcu1/replay_2/HKCU1_SOURCE_LEDGER.json
          cat work/hkcu1/HKCU1_R2B_REPLAY_AND_CHANNEL_DIFF.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hkcu1-official-fetch-replay-evidence
          path: work/hkcu1/**
          if-no-files-found: error

  endpoint-discovery-evidence:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: Refresh endpoint evidence
        run: |
          python pipeline/hkcu1_discover_official_endpoints.py --output outputs/hkcu1/discovery/HKCU1_OFFICIAL_ENDPOINT_DISCOVERY.json || true
          python pipeline/hkcu1_probe_endpoint_contracts.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hkcu1-endpoint-evidence
          path: outputs/hkcu1/discovery/*.json
          if-no-files-found: error

  controlled-production:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_candidate
    needs: [test, official-fetch-validation]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch official evidence
        run: python pipeline/hkcu1_fetch_official_lists.py --registry config/hkcu1_official_source_registry.json --output-dir work/hkcu1/source
      - name: Stop before publication without sell-only and cross-check closure
        run: |
          test -s work/hkcu1/source/HKCU1_SOURCE_LEDGER.csv
          echo 'Full buy-list fetch passed. Sell-only ingestion, HKEX cross-check and independent release validation remain mandatory.'
          exit 2
