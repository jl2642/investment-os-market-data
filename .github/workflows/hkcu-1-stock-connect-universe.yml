name: HKCU-1 Stock Connect Universe

on:
  pull_request:
    paths:
      - 'pipeline/hkcu1_*.py'
      - 'config/hkcu1_*.json'
      - 'schemas/hkcu1_*.json'
      - 'tests/test_hkcu1*.py'
      - '.github/workflows/hkcu-1-stock-connect-universe.yml'
  workflow_dispatch:
    inputs:
      as_of_date:
        description: Point-in-time eligibility date (YYYY-MM-DD)
        required: true
        type: string
      publish_candidate:
        description: Build a release candidate after official source resolution
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q tests/test_hkcu1_build_universe.py tests/test_hkcu1_r2.py
      - name: Validate JSON contracts
        run: |
          python -m json.tool config/hkcu1_stock_connect_universe_contract.json >/dev/null
          python -m json.tool config/hkcu1_official_source_registry.json >/dev/null
          python -m json.tool schemas/hkcu1_stock_connect_eligibility.schema.json >/dev/null

  official-fetch-validation:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch full official SSE and SZSE lists
        run: |
          python pipeline/hkcu1_fetch_official_lists.py \
            --registry config/hkcu1_official_source_registry.json \
            --output-dir work/hkcu1/source
      - name: Enforce count and source gates
        run: |
          python - <<'PY'
          import json
          d=json.load(open('work/hkcu1/source/HKCU1_FETCH_DECISION.json',encoding='utf-8'))
          assert d['status']=='PASS', d
          rows=d['source_rows']
          assert rows.get('SSE_SH_SOUTHBOUND_BUY_LIST',0)>=100, rows
          assert rows.get('SZSE_SZ_SOUTHBOUND_BUY_LIST',0)>=100, rows
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hkcu1-official-fetch-evidence
          path: work/hkcu1/source/**
          if-no-files-found: error

  endpoint-discovery-evidence:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: Refresh endpoint evidence
        run: |
          python pipeline/hkcu1_discover_official_endpoints.py --output outputs/hkcu1/discovery/HKCU1_OFFICIAL_ENDPOINT_DISCOVERY.json || true
          python pipeline/hkcu1_probe_endpoint_contracts.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hkcu1-endpoint-evidence
          path: outputs/hkcu1/discovery/*.json
          if-no-files-found: error

  controlled-production:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_candidate
    needs: [test, official-fetch-validation]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch official evidence
        run: python pipeline/hkcu1_fetch_official_lists.py --registry config/hkcu1_official_source_registry.json --output-dir work/hkcu1/source
      - name: Stop before publication without sell-only and cross-check closure
        run: |
          test -s work/hkcu1/source/HKCU1_SOURCE_LEDGER.csv
          echo 'Full buy-list fetch passed. Sell-only ingestion, HKEX cross-check and independent release validation remain mandatory.'
          exit 2
