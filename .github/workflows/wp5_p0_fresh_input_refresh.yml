name: WP5 P0 Fresh Portfolio Input Refresh
run-name: "WP5 refresh completed-close Portfolio Current before P0 re-underwrite"

on:
  push:
    branches: [agent/wp5-p0-external-reunderwrite]
    paths:
      - ".wp5_p0_refresh_trigger"
      - ".github/workflows/wp5_p0_fresh_input_refresh.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  TRADE_AUTHORITY: NONE
  WP5_P0_BRANCH: agent/wp5-p0-external-reunderwrite

jobs:
  refresh-validate-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Restore accepted completed-close baseline before provider refresh
        run: |
          git fetch origin main
          git checkout origin/main -- \
            investment_os_runtime/40_EVIDENCE_AND_LINEAGE/WP2_R/PORTFOLIO_MARKS_REFRESH_CANDIDATE.json \
            investment_os_runtime/30_STATE_CURRENT/10_REAL_ACCOUNT/REAL_ACCOUNT_POSITIONS_CURRENT.json \
            investment_os_runtime/30_STATE_CURRENT/20_SIMULATION/SIMULATION_POSITIONS_CURRENT.json \
            investment_os_runtime/30_STATE_CURRENT/25_PORTFOLIO_MARKS/PORTFOLIO_MARKS_CURRENT.json \
            investment_os_runtime/30_STATE_CURRENT/70_OPERATIONS/PORTFOLIO_CURRENT_RUN_CURRENT.json \
            investment_os_runtime/00_CONTROL/WP2_R_PORTFOLIO_CURRENT_ACCEPTANCE_RECORD.json

      - name: Snapshot protected economic identity and governed states
        run: |
          python automation/wp2_r/build_portfolio_current.py --repo-root .
          python automation/wp2_r/finalize_account_summaries.py --repo-root .
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('.')
          identity = {}
          for rel in (
              'investment_os_runtime/30_STATE_CURRENT/10_REAL_ACCOUNT/REAL_ACCOUNT_POSITIONS_CURRENT.json',
              'investment_os_runtime/30_STATE_CURRENT/20_SIMULATION/SIMULATION_POSITIONS_CURRENT.json',
          ):
              payload = json.loads((root / rel).read_text(encoding='utf-8'))
              identity[payload['account']] = [
                  {
                      'security_id': row['security_id'],
                      'quantity': row['quantity'],
                      'available_quantity': row['available_quantity'],
                      'unit_cost': row['unit_cost'],
                      'cost_basis': row['cost_basis'],
                  }
                  for row in payload['holdings']
              ]
          protected = {
              'candidate': hashlib.sha256((root / 'investment_os_runtime/30_STATE_CURRENT/40_CANDIDATE/CANDIDATE_CURRENT.json').read_bytes()).hexdigest(),
              'legacy_decisions': hashlib.sha256((root / 'investment_os_runtime/30_STATE_CURRENT/60_DECISIONS/DECISION_PROPOSALS_CURRENT.json').read_bytes()).hexdigest(),
          }
          Path('/tmp/wp5_p0_position_identity.json').write_text(json.dumps(identity, sort_keys=True), encoding='utf-8')
          Path('/tmp/wp5_p0_protected_hashes.json').write_text(json.dumps(protected, sort_keys=True), encoding='utf-8')
          PY

      - name: Refresh completed-close marks and capture intraday observations separately
        run: python automation/wp2_r/refresh_market_marks.py --repo-root .

      - name: Rebuild Portfolio Current with completed-close marks only
        run: |
          python automation/wp2_r/build_portfolio_current.py --repo-root .
          python automation/wp2_r/finalize_account_summaries.py --repo-root .

      - name: Build WP5 P0 fresh-input status
        run: |
          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          root = Path('.')
          cn = ZoneInfo('Asia/Shanghai')
          candidate = json.loads((root / 'investment_os_runtime/40_EVIDENCE_AND_LINEAGE/WP2_R/PORTFOLIO_MARKS_REFRESH_CANDIDATE.json').read_text(encoding='utf-8'))
          completed = candidate['latest_completed_listed_close_date']
          today = datetime.now(cn).date().isoformat()
          action_ready = completed == today and candidate['intraday_observation_count'] == 0
          payload = {
              'state_id': 'WP5_P0_FRESH_INPUT_STATUS_CURRENT',
              'generated_at': datetime.now(cn).isoformat(),
              'provider_observation_date': today,
              'latest_completed_listed_close_date': completed,
              'intraday_observation_count': candidate['intraday_observation_count'],
              'status': 'LATEST_COMPLETED_CLOSE_CURRENT' if action_ready else 'INTRADAY_OBSERVED_COMPLETED_CLOSE_PENDING',
              'research_use_allowed': True,
              'implementation_action_mark_ready': action_ready,
              'decision_rule': 'INTRADAY_QUOTES_ARE_NON_DECISION_EVIDENCE_AND_MUST_NOT_REPLACE_COMPLETED_CLOSE_CURRENT',
              'economic_mutations': {'real_account': 0, 'simulation': 0, 'candidate_membership': 0, 'orders': 0},
              'trade_authority': 'NONE',
          }
          path = root / 'investment_os_runtime/40_EVIDENCE_AND_LINEAGE/WP5/P0_REUNDERWRITE/WP5_P0_FRESH_INPUT_STATUS_CURRENT.json'
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(payload, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(payload)
          PY

      - name: Validate completed-close coverage, intraday separation and zero economic mutation
        run: |
          python - <<'PY'
          import hashlib, json
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          root = Path('.')
          today = datetime.now(ZoneInfo('Asia/Shanghai')).date().isoformat()
          marks = json.loads((root / 'investment_os_runtime/30_STATE_CURRENT/25_PORTFOLIO_MARKS/PORTFOLIO_MARKS_CURRENT.json').read_text(encoding='utf-8'))
          candidate = json.loads((root / 'investment_os_runtime/40_EVIDENCE_AND_LINEAGE/WP2_R/PORTFOLIO_MARKS_REFRESH_CANDIDATE.json').read_text(encoding='utf-8'))
          status = json.loads((root / 'investment_os_runtime/40_EVIDENCE_AND_LINEAGE/WP5/P0_REUNDERWRITE/WP5_P0_FRESH_INPUT_STATUS_CURRENT.json').read_text(encoding='utf-8'))
          real = json.loads((root / 'investment_os_runtime/30_STATE_CURRENT/10_REAL_ACCOUNT/REAL_ACCOUNT_POSITIONS_CURRENT.json').read_text(encoding='utf-8'))
          sim = json.loads((root / 'investment_os_runtime/30_STATE_CURRENT/20_SIMULATION/SIMULATION_POSITIONS_CURRENT.json').read_text(encoding='utf-8'))
          run = json.loads((root / 'investment_os_runtime/30_STATE_CURRENT/70_OPERATIONS/PORTFOLIO_CURRENT_RUN_CURRENT.json').read_text(encoding='utf-8'))
          before = json.loads(Path('/tmp/wp5_p0_position_identity.json').read_text(encoding='utf-8'))
          after = {}
          for payload in (real, sim):
              after[payload['account']] = [
                  {
                      'security_id': row['security_id'],
                      'quantity': row['quantity'],
                      'available_quantity': row['available_quantity'],
                      'unit_cost': row['unit_cost'],
                      'cost_basis': row['cost_basis'],
                  }
                  for row in payload['holdings']
              ]
          protected_before = json.loads(Path('/tmp/wp5_p0_protected_hashes.json').read_text(encoding='utf-8'))
          protected_after = {
              'candidate': hashlib.sha256((root / 'investment_os_runtime/30_STATE_CURRENT/40_CANDIDATE/CANDIDATE_CURRENT.json').read_bytes()).hexdigest(),
              'legacy_decisions': hashlib.sha256((root / 'investment_os_runtime/30_STATE_CURRENT/60_DECISIONS/DECISION_PROPOSALS_CURRENT.json').read_bytes()).hexdigest(),
          }
          assert candidate['status'] == 'PASS_COMPLETE'
          assert marks['status'] == 'CURRENT_COMPLETE'
          assert marks['required_security_count'] == marks['marked_security_count'] == 22
          assert marks['missing_security_ids'] == []
          assert candidate['stale_security_ids'] == []
          assert before == after
          assert protected_before == protected_after
          assert len(real['holdings']) == 7
          assert len(sim['holdings']) == 16
          assert real['summary']['execution_cash_balance'] == 120.49
          assert sim['summary']['execution_cash_balance'] == 219533.98
          assert all(row['mark_freshness_status'] == 'FRESH' for row in real['holdings'] + sim['holdings'])
          assert run['economic_transaction_mutations'] == 0
          assert run['position_or_cost_mutations_from_reconciliation'] == 0
          assert run['orders'] == 0
          assert run['trade_authority'] == 'NONE'
          assert candidate['latest_completed_listed_close_date'] <= today
          if candidate['intraday_observation_count'] > 0:
              assert candidate['latest_completed_listed_close_date'] < today
              assert status['implementation_action_mark_ready'] is False
              assert status['status'] == 'INTRADAY_OBSERVED_COMPLETED_CLOSE_PENDING'
              assert all(
                  not (row.get('as_of_date') == today and str(row.get('as_of_time', '')) < '15:05:00')
                  for row in marks['marks']
              )
          assert status['economic_mutations'] == {'real_account': 0, 'simulation': 0, 'candidate_membership': 0, 'orders': 0}
          assert status['trade_authority'] == 'NONE'
          print({
              'latest_completed_close_date': candidate['latest_completed_listed_close_date'],
              'intraday_observations': candidate['intraday_observation_count'],
              'implementation_action_mark_ready': status['implementation_action_mark_ready'],
              'marks': marks['marked_security_count'],
              'economic_identity_unchanged': True,
              'candidate_unchanged': True,
              'orders': 0,
          })
          PY

      - name: Publish corrected WP5 P0 input watermark
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .wp5_p0_refresh_trigger
          git add \
            investment_os_runtime/40_EVIDENCE_AND_LINEAGE/WP2_R/PORTFOLIO_MARKS_REFRESH_CANDIDATE.json \
            investment_os_runtime/30_STATE_CURRENT/10_REAL_ACCOUNT/REAL_ACCOUNT_POSITIONS_CURRENT.json \
            investment_os_runtime/30_STATE_CURRENT/20_SIMULATION/SIMULATION_POSITIONS_CURRENT.json \
            investment_os_runtime/30_STATE_CURRENT/25_PORTFOLIO_MARKS/PORTFOLIO_MARKS_CURRENT.json \
            investment_os_runtime/30_STATE_CURRENT/70_OPERATIONS/PORTFOLIO_CURRENT_RUN_CURRENT.json \
            investment_os_runtime/00_CONTROL/WP2_R_PORTFOLIO_CURRENT_ACCEPTANCE_RECORD.json \
            investment_os_runtime/40_EVIDENCE_AND_LINEAGE/WP5/P0_REUNDERWRITE/WP5_P0_FRESH_INPUT_STATUS_CURRENT.json
          git commit -m "WP5 separate intraday observations from completed-close Portfolio Current"
          git pull --rebase origin "${WP5_P0_BRANCH}"
          git push origin "HEAD:${WP5_P0_BRANCH}"

      - name: Record summary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## WP5 P0 fresh input refresh
          - Refreshes all 22 tracked securities and fund NAVs
          - Publishes only completed-close prices into Portfolio Current
          - Captures current-session intraday quotes separately as non-decision evidence
          - Preserves security identity, quantity, availability, unit cost and cost basis exactly
          - Preserves Candidate membership and legacy decisions
          - Real-account external liquidity remains excluded; only broker execution cash is carried
          - Orders: 0
          - trade_authority: NONE
          EOF
