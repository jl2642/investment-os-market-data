name: Round 3 apply completed-session gate

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/round3-apply-completed-session-gate.yml"

permissions:
  contents: write

jobs:
  patch-test-push:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/round3-hk-us-limited-production
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Patch completed-session and retry-safe gates
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f'ROUND3_PATCH_TARGET_MISSING:{label}')
              return text.replace(old, new, 1)

          script_path = Path('automation/cross_market/build_round3_limited_production.py')
          text = script_path.read_text(encoding='utf-8')
          text = replace_once(
              text,
              '''    if trade_date > as_of:\n        raise ValueError("future market observation")\n    if (as_of - trade_date).days > 4:\n        raise ValueError("stale market observation")\n''',
              '''    if trade_date > as_of:\n        raise ValueError("future market observation")\n    if trade_date != as_of:\n        raise ValueError(f"SESSION_NOT_COMPLETED_FOR_AS_OF:expected={as_of.isoformat()},observed={trade_date.isoformat()}")\n''',
              'strict_completed_session',
          )
          text = replace_once(
              text,
              '''    if bucket not in cycle["hk_buckets"]:\n        cycle["hk_buckets"].append(bucket)\n        cycle["hk_attempted"] += len(hk_ok) + len(hk_fail)\n        cycle["hk_success"] += len(hk_ok)\n    new_us_bucket = bucket not in cycle["us_buckets"]\n    if new_us_bucket:\n        cycle["us_buckets"].append(bucket)\n        rotation = [row for row in us_ok if row["symbol"] not in benchmark_symbols]\n        rotation_fail = [row for row in us_fail if row["symbol"] not in benchmark_symbols]\n        cycle["us_rotation_attempted"] += len(rotation) + len(rotation_fail)\n        cycle["us_rotation_success"] += len(rotation)\n        cycle["sec_queued"] += len(sec_rows)\n''',
              '''    hk_session_observed = bool(hk_ok)\n    us_session_observed = bool(us_ok)\n    if bucket not in cycle["hk_buckets"] and hk_session_observed:\n        cycle["hk_buckets"].append(bucket)\n        cycle["hk_attempted"] += len(hk_ok) + len(hk_fail)\n        cycle["hk_success"] += len(hk_ok)\n    new_us_bucket = bucket not in cycle["us_buckets"]\n    if new_us_bucket and us_session_observed:\n        cycle["us_buckets"].append(bucket)\n        rotation = [row for row in us_ok if row["symbol"] not in benchmark_symbols]\n        rotation_fail = [row for row in us_fail if row["symbol"] not in benchmark_symbols]\n        cycle["us_rotation_attempted"] += len(rotation) + len(rotation_fail)\n        cycle["us_rotation_success"] += len(rotation)\n        cycle["sec_queued"] += len(sec_rows)\n''',
              'session_bucket_close',
          )
          text = replace_once(
              text,
              '''    hk_ratio = cycle["hk_success"] / cycle["hk_attempted"] if cycle["hk_attempted"] else 0.0\n    cycle["hk_success_ratio"] = round(hk_ratio, 6)\n    cycle["market_rotation_completed"] = (\n''',
              '''    hk_ratio = cycle["hk_success"] / cycle["hk_attempted"] if cycle["hk_attempted"] else 0.0\n    us_ratio = cycle["us_rotation_success"] / cycle["us_rotation_attempted"] if cycle["us_rotation_attempted"] else 0.0\n    cycle["hk_success_ratio"] = round(hk_ratio, 6)\n    cycle["us_rotation_success_ratio"] = round(us_ratio, 6)\n    cycle["market_rotation_completed"] = (\n''',
              'us_success_ratio_compute',
          )
          text = replace_once(
              text,
              '''        and cycle["us_rotation_attempted"] >= int(policy["united_states"]["minimum_weekly_rotation_attempted_count"])\n        and len(cycle["us_benchmark_success_symbols"]) >= int(policy["united_states"]["minimum_weekly_benchmark_success_count"])\n''',
              '''        and cycle["us_rotation_attempted"] >= int(policy["united_states"]["minimum_weekly_rotation_attempted_count"])\n        and us_ratio >= float(policy["united_states"]["minimum_weekly_rotation_success_ratio"])\n        and len(cycle["us_benchmark_success_symbols"]) >= int(policy["united_states"]["minimum_weekly_benchmark_success_count"])\n''',
              'us_success_ratio_gate',
          )
          text = replace_once(
              text,
              '''    proposal = build_proposal(root, cycle, plan["us_benchmark"], policy)\n    acceptance_required = int(policy["acceptance"]["completed_weekly_cycles_for_limited_production_acceptance"])\n''',
              '''    proposal = build_proposal(root, cycle, plan["us_benchmark"], policy)\n    hk_bucket_captured = plan["bucket"] in cycle["hk_buckets"]\n    us_bucket_captured = plan["bucket"] in cycle["us_buckets"]\n    capture_complete = hk_bucket_captured and us_bucket_captured\n    capture_status = "CAPTURED_BOTH_MARKETS" if capture_complete else "PARTIAL_RETRYABLE_MISSING_COMPLETED_SESSION"\n    acceptance_required = int(policy["acceptance"]["completed_weekly_cycles_for_limited_production_acceptance"])\n''',
              'capture_status',
          )
          text = replace_once(
              text,
              '''        "bucket": plan["bucket"],\n        "operating_state": operating_state,\n''',
              '''        "bucket": plan["bucket"],\n        "capture_status": capture_status,\n        "hong_kong_completed_session_captured": hk_bucket_captured,\n        "united_states_completed_session_captured": us_bucket_captured,\n        "operating_state": operating_state,\n''',
              'run_record_capture_status',
          )
          text = replace_once(
              text,
              '''    ledger["daily_runs"].append({"run_id": run_id, "as_of_date": as_of.isoformat(), "bucket": plan["bucket"], "cycle_id": cycle["cycle_id"], "operating_state": operating_state})\n    ledger["daily_runs"] = ledger["daily_runs"][-60:]\n''',
              '''    if capture_complete:\n        ledger["daily_runs"].append({"run_id": run_id, "as_of_date": as_of.isoformat(), "bucket": plan["bucket"], "cycle_id": cycle["cycle_id"], "operating_state": operating_state, "capture_status": capture_status})\n        ledger["daily_runs"] = ledger["daily_runs"][-60:]\n''',
              'retry_safe_daily_run',
          )
          text = replace_once(
              text,
              '''    return {"due": True, "run_id": run_id, "status": proposal["status"], "operating_state": operating_state, "cycle_id": cycle["cycle_id"], "cycle_completed": cycle["completed"], "market_rotation_completed": cycle["market_rotation_completed"], "hk_success": len(hk_ok), "us_success": len(us_ok), "sec_queued": len(sec_rows), "orders": 0, "trade_authority": "NONE"}\n''',
              '''    return {"due": True, "run_id": run_id, "status": proposal["status"], "capture_status": capture_status, "operating_state": operating_state, "cycle_id": cycle["cycle_id"], "cycle_completed": cycle["completed"], "market_rotation_completed": cycle["market_rotation_completed"], "hk_success": len(hk_ok), "us_success": len(us_ok), "sec_queued": len(sec_rows), "orders": 0, "trade_authority": "NONE"}\n''',
              'return_capture_status',
          )
          script_path.write_text(text, encoding='utf-8')

          test_path = Path('automation/cross_market/tests/test_round3_limited_production.py')
          tests = test_path.read_text(encoding='utf-8')
          tests = replace_once(
              tests,
              'from datetime import date, datetime, timezone\n',
              'from datetime import date, datetime, timedelta, timezone\nfrom urllib.parse import parse_qs, urlparse\n',
              'test_imports',
          )
          tests = replace_once(
              tests,
              '"daily_rotation_batch_size": 4, "daily_sec_batch_size": 2, "minimum_weekly_rotation_attempted_count": 15, "minimum_weekly_benchmark_success_count": 2,',
              '"daily_rotation_batch_size": 4, "daily_sec_batch_size": 2, "minimum_weekly_rotation_attempted_count": 15, "minimum_weekly_rotation_success_ratio": 0.8, "minimum_weekly_benchmark_success_count": 2,',
              'test_policy_ratio',
          )
          tests = replace_once(
              tests,
              '''    if "finance/chart" in url:\n        ts = int(datetime(2026, 8, 3, tzinfo=timezone.utc).timestamp())\n''',
              '''    if "finance/chart" in url:\n        period2 = int(parse_qs(urlparse(url).query)["period2"][0])\n        as_of = datetime.fromtimestamp(period2, tz=timezone.utc).date() - timedelta(days=2)\n        ts = int(datetime.combine(as_of, datetime.min.time(), tzinfo=timezone.utc).timestamp())\n''',
              'date_aware_fake_fetcher',
          )
          insert_before = '''def test_same_date_replay_is_noop(tmp_path: Path) -> None:\n'''
          stale_test = '''def test_stale_observation_does_not_close_market_bucket_or_block_retry(tmp_path: Path) -> None:\n    install(tmp_path)\n\n    def stale_fetcher(url: str, headers: dict[str, str] | None = None) -> bytes:\n        if "finance/chart" in url:\n            ts = int(datetime(2026, 8, 2, tzinfo=timezone.utc).timestamp())\n            return json.dumps({"chart": {"result": [{"meta": {"currency": "USD"}, "timestamp": [ts], "indicators": {"quote": [{"close": [100.0], "volume": [1000]}]}}], "error": None}}).encode()\n        raise AssertionError(url)\n\n    result = run(tmp_path, Path("automation/cross_market/round3_policy.json"), date(2026, 8, 3), stale_fetcher, sleep_seconds=0)\n    ledger = json.loads((tmp_path / "investment_os_runtime/30_STATE_CURRENT/46_CROSS_MARKET_OPERATIONS/CROSS_MARKET_LIMITED_LEDGER_CURRENT.json").read_text())\n    cycle = ledger["weekly_cycles"]["2026-W32"]\n    assert result["capture_status"] == "PARTIAL_RETRYABLE_MISSING_COMPLETED_SESSION"\n    assert cycle["hk_buckets"] == []\n    assert cycle["us_buckets"] == []\n    assert ledger["daily_runs"] == []\n\n\n'''
          tests = replace_once(tests, insert_before, stale_test + insert_before, 'stale_session_test')
          test_path.write_text(tests, encoding='utf-8')
          PY
      - name: Compile and test
        run: |
          python -m pip install --retries 5 --timeout 30 pytest
          python -m py_compile automation/cross_market/build_round3_limited_production.py automation/cross_market/validate_round3_outputs.py
          pytest -q automation/cross_market/tests/test_round3_limited_production.py
      - name: Commit non-workflow fix
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/cross_market/build_round3_limited_production.py automation/cross_market/tests/test_round3_limited_production.py
          git commit -m "round3: require completed market sessions"
          git push origin HEAD:agent/round3-hk-us-limited-production
