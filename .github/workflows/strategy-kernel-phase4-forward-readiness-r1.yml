name: Strategy Kernel Phase 4 Forward Readiness R1

on:
  pull_request:
    paths:
      - 'strategy_kernel_v2/**'
      - '.github/workflows/strategy-kernel-phase4-forward-readiness-r1.yml'
  workflow_dispatch:

concurrency:
  group: strategy-kernel-phase4-forward-readiness-r1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  phase4-forward-readiness-r1:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test Phase 4 forward readiness selector
        run: python -m unittest strategy_kernel_v2.tests.test_phase4_forward_readiness_r1
      - name: Execute Phase 4 Round 1 readiness audit
        run: python -m strategy_kernel_v2.validate_phase4_forward_readiness_r1
      - name: Re-validate frozen Phase 4 contract
        run: python -m strategy_kernel_v2.validate_phase4_forward_shadow_contract
      - name: Re-validate Repeat Phase 3F
        run: python -m strategy_kernel_v2.validate_repeat_phase3f_r2
      - name: Validate program consistency
        run: python strategy_kernel_v2/program_consistency.py
      - name: Upload Phase 4 Round 1 readiness audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase4-forward-readiness-r1
          retention-days: 30
          if-no-files-found: ignore
          path: strategy_kernel_v2/generated/PHASE4_FORWARD_READINESS_R1_AUDIT.json
