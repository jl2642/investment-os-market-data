name: HKCU P4-4 Portfolio Proposal Review

on:
  pull_request:
    paths:
      - 'config/hkcu_p4_4_portfolio_proposal_review_contract.json'
      - 'pipeline/hkcu_p4_4_portfolio_proposal_review.py'
      - 'scripts/validate_hkcu_p4_4_portfolio_proposal_review.py'
      - 'tests/test_hkcu_p4_4_portfolio_proposal_review.py'
      - 'docs/HKCU-P4-4_PORTFOLIO_PROPOSAL_REVIEW.md'
      - '.github/workflows/hkcu-p4-4-portfolio-proposal-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-and-scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q tests/test_hkcu_p4_4_portfolio_proposal_review.py
      - name: Enforce isolated P4-4 proposal-review scope
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}"
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" > /tmp/p4_4_paths.txt
          cat /tmp/p4_4_paths.txt
          python - <<'PY'
          from pathlib import Path
          allowed = {
              'config/hkcu_p4_4_portfolio_proposal_review_contract.json',
              'pipeline/hkcu_p4_4_portfolio_proposal_review.py',
              'scripts/validate_hkcu_p4_4_portfolio_proposal_review.py',
              'tests/test_hkcu_p4_4_portfolio_proposal_review.py',
              'docs/HKCU-P4-4_PORTFOLIO_PROPOSAL_REVIEW.md',
              '.github/workflows/hkcu-p4-4-portfolio-proposal-review.yml',
          }
          actual = {x.strip() for x in Path('/tmp/p4_4_paths.txt').read_text().splitlines() if x.strip()}
          bad = sorted(actual - allowed)
          if bad:
              raise SystemExit('P4_4_SCOPE_VIOLATION:' + ','.join(bad))
          protected = ('outputs/hk_candidate/', 'outputs/simulation/', 'outputs/real', 'investment_os_runtime/30_STATE_CURRENT/', 'orders/')
          mutations = sorted(x for x in actual if x.startswith(protected))
          if mutations:
              raise SystemExit('P4_4_PROTECTED_PATH_MUTATION:' + ','.join(mutations))
          PY

  real-proposal-review:
    needs: unit-and-scope
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Rebuild and validate accepted P4-1R context
        run: |
          rm -rf work/hkcu_p4_4_context work/hkcu_p4_4_fit work/hkcu_p4_4_review work/hkcu_p4_4_scenarios work/hkcu_p4_4_proposal
          python -m pipeline.hkcu_p4_1r_canonical_data_adapter --repo-root . --output work/hkcu_p4_4_context
          python scripts/validate_hkcu_p4_1r_portfolio_context_completion.py --repo-root . --output work/hkcu_p4_4_context
      - name: Rebuild and validate accepted P4-1 Portfolio Fit reassessment
        run: |
          python -m pipeline.hkcu_p4_1_portfolio_fit_reassessment_decision_adapter \
            --repo-root . \
            --context-dir work/hkcu_p4_4_context \
            --output work/hkcu_p4_4_fit
          python scripts/validate_hkcu_p4_1_portfolio_fit_reassessment.py \
            --repo-root . \
            --context-dir work/hkcu_p4_4_context \
            --output work/hkcu_p4_4_fit
      - name: Rebuild and validate accepted P4-2 construction review
        run: |
          python -m pipeline.hkcu_p4_2_portfolio_construction_review_decision_adapter \
            --repo-root . \
            --context-dir work/hkcu_p4_4_context \
            --fit-dir work/hkcu_p4_4_fit \
            --output work/hkcu_p4_4_review
          python scripts/validate_hkcu_p4_2_portfolio_construction_review.py \
            --repo-root . \
            --context-dir work/hkcu_p4_4_context \
            --fit-dir work/hkcu_p4_4_fit \
            --output work/hkcu_p4_4_review
      - name: Rebuild and validate accepted P4-3 scenarios
        run: |
          python -m pipeline.hkcu_p4_3_portfolio_construction_scenario_test \
            --repo-root . \
            --p4-2-dir work/hkcu_p4_4_review \
            --output work/hkcu_p4_4_scenarios
          python scripts/validate_hkcu_p4_3_portfolio_construction_scenario_test.py \
            --repo-root . \
            --p4-2-dir work/hkcu_p4_4_review \
            --output work/hkcu_p4_4_scenarios
      - name: Execute P4-4 Portfolio Proposal Review
        run: |
          python -m pipeline.hkcu_p4_4_portfolio_proposal_review \
            --repo-root . \
            --p4-2-dir work/hkcu_p4_4_review \
            --p4-3-dir work/hkcu_p4_4_scenarios \
            --output work/hkcu_p4_4_proposal
      - name: Independently validate P4-4 Proposal Review
        run: |
          python scripts/validate_hkcu_p4_4_portfolio_proposal_review.py \
            --repo-root . \
            --p4-2-dir work/hkcu_p4_4_review \
            --p4-3-dir work/hkcu_p4_4_scenarios \
            --output work/hkcu_p4_4_proposal
      - name: Render proposal decision and preferred portfolios
        if: always()
        run: |
          test ! -f work/hkcu_p4_4_proposal/HKCU_P4_4_PROPOSAL_REVIEW_DECISION.json || cat work/hkcu_p4_4_proposal/HKCU_P4_4_PROPOSAL_REVIEW_DECISION.json
          test ! -f work/hkcu_p4_4_proposal/HKCU_P4_4_PROPOSAL_REVIEW_QUALITY_REPORT.json || cat work/hkcu_p4_4_proposal/HKCU_P4_4_PROPOSAL_REVIEW_QUALITY_REPORT.json
          test ! -f work/hkcu_p4_4_proposal/HKCU_P4_4_PROPOSAL_REVIEW_PREFERRED_PROPOSALS.csv || cat work/hkcu_p4_4_proposal/HKCU_P4_4_PROPOSAL_REVIEW_PREFERRED_PROPOSALS.csv
          test ! -f work/hkcu_p4_4_proposal/HKCU_P4_4_PROPOSAL_REVIEW_PROPOSAL_ALLOCATIONS.csv || cat work/hkcu_p4_4_proposal/HKCU_P4_4_PROPOSAL_REVIEW_PROPOSAL_ALLOCATIONS.csv
          test ! -f work/hkcu_p4_4_proposal/HKCU_P4_4_PROPOSAL_REVIEW_SCENARIO_REVIEW.csv || cat work/hkcu_p4_4_proposal/HKCU_P4_4_PROPOSAL_REVIEW_SCENARIO_REVIEW.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hkcu-p4-4-portfolio-proposal-review
          path: |
            work/hkcu_p4_4_proposal/HKCU_P4_4_PROPOSAL_REVIEW_*
            work/hkcu_p4_4_scenarios/HKCU_P4_3_SCENARIO_TEST_DECISION.json
            work/hkcu_p4_4_review/HKCU_P4_2_CONSTRUCTION_REVIEW_DECISION.json
            work/hkcu_p4_4_fit/HKCU_P4_1_REASSESSMENT_DECISION.json
            work/hkcu_p4_4_context/HKCU_P4_1R_DECISION.json
          if-no-files-found: error
