name: FMDL 5 Final Operational Acceptance
run-name: "FMDL 5 Final Operational Acceptance (retired)"

# S1 retirement: historical acceptance evidence stays in Git, but unrelated PRs no longer rebuild it.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/fmdl-5-final-operational-acceptance.yml"

permissions:
  contents: read

env:
  TRADE_AUTHORITY: NONE

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Explain retirement
        run: |
          echo "Historical FMDL-5 final acceptance workflow; development-era acceptance is retained as evidence, not rerun during current product changes."
          echo "Whole-system maturity is read from investment_os_runtime/00_CONTROL/SYSTEM_CURRENT.json."
          echo "This workflow is not an active runtime or product-health signal."
          echo "orders=0"
          echo "trade_authority=NONE"
