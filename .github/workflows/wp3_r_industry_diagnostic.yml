name: R2 WP3-R Industry Master Diagnostic
run-name: "R2 WP3-R persist industry master before fail-closed decision"

on:
  pull_request:
    branches: [main]
    paths:
      - "automation/wp3_r/refresh_industry_master.py"
      - ".github/workflows/wp3_r_industry_diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  TRADE_AUTHORITY: NONE

jobs:
  diagnose-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/r2-product-capability-hardening
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Build full industry master and retain exit status
        id: build
        shell: bash
        run: |
          set +e
          python automation/wp3_r/refresh_industry_master.py --repo-root .
          status=$?
          echo "exit_status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Validate diagnostic safety boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('investment_os_runtime/40_EVIDENCE_AND_LINEAGE/WP3_R/INDUSTRY_MASTER/SECURITY_INDUSTRY_MASTER_CURRENT.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          assert data['trade_authority'] == 'NONE'
          assert data['automatic_candidate_mutations'] == 0
          assert data['orders'] == 0
          print(json.dumps({
              'status': data['status'],
              'market_security_count': data['market_security_count'],
              'industry_board_count': data['industry_board_count'],
              'row_count': data['row_count'],
              'coverage': data['coverage'],
              'missing_count': data['missing_count'],
              'duplicates': data['duplicate_industry_assignment_count'],
              'board_failures': data['board_failure_count'],
          }, ensure_ascii=False))
          PY

      - name: Publish manifest before capability decision
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add investment_os_runtime/40_EVIDENCE_AND_LINEAGE/WP3_R/INDUSTRY_MASTER
          if git diff --cached --quiet; then
            echo "Industry manifest already current."
          else
            git commit -m "R2 WP3-R persist industry master diagnostic"
            git push origin HEAD:agent/r2-product-capability-hardening
          fi

      - name: Preserve fail-closed conclusion
        if: steps.build.outputs.exit_status != '0'
        run: exit 1
