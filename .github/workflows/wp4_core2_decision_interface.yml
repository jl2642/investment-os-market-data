name: WP4 Core2 Decision Interface
run-name: "WP4 Core2 deep research, portfolio fit and decision interface"

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "automation/wp4/**"
      - "automation/wp3_2a/tests/test_operating_closure_and_wp3_2b.py"
      - ".github/workflows/wp4_core2_decision_interface.yml"
      - "investment_os_runtime/40_EVIDENCE_AND_LINEAGE/WP4/**"
      - "investment_os_runtime/30_STATE_CURRENT/30_RESEARCH/WP4_CORE2_RESEARCH_CURRENT.json"
      - "investment_os_runtime/30_STATE_CURRENT/50_DECISION_INTERFACE/WP4_DECISION_INTERFACE_CURRENT.json"
      - "investment_os_runtime/00_CONTROL/WP4_CORE2_DECISION_INTERFACE_ACCEPTANCE_RECORD.json"
      - "investment_os_runtime/00_CONTROL/EXECUTION_REGISTER_CURRENT.json"
      - "investment_os_runtime/00_CONTROL/WORK_PACKAGE_MASTER_PLAN_CURRENT.md"

permissions:
  contents: write

env:
  TRADE_AUTHORITY: NONE
  WP4_OUTPUT_DIR: investment_os_runtime/40_EVIDENCE_AND_LINEAGE/WP4/PROPOSALS/WP4_CORE2_DECISION_INTERFACE_20260726_V1

jobs:
  build-audit-and-publish:
    if: startsWith(github.head_ref, 'automation/wp4-core2-decision-interface-')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            automation/wp3_2a/requirements.lock
            automation/wp4/requirements.lock

      - name: Install dependencies
        run: |
          python -m pip install --retries 5 --timeout 30 \
            -r automation/wp3_2a/requirements.lock \
            -r automation/wp4/requirements.lock

      - name: Build WP4 Core2 governed research and decision interface
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p .wp4_run
          rm -rf "$WP4_OUTPUT_DIR"
          python automation/wp4/build_wp4_core2.py \
            --repo-root . \
            --config automation/wp4/config.json \
            --output-dir "$WP4_OUTPUT_DIR" \
            2>&1 | tee .wp4_run/BUILD_RESULT.log

      - name: Run WP4 acceptance tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q automation/wp4/tests \
            2>&1 | tee .wp4_run/WP4_ACCEPTANCE.log

      - name: Run WP3 and control-runtime regression
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q automation/wp3_2a/tests \
            2>&1 | tee .wp4_run/WP3_FORWARD_COMPATIBILITY.log
          python -m pytest -q investment_os_runtime/80_EXECUTABLE_RUNTIME/tests \
            2>&1 | tee .wp4_run/RUNTIME_REGRESSION.log

      - name: Enforce exact WP4 scope and zero investment-domain mutation
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import subprocess

          allowed_exact = {
              ".github/workflows/wp4_core2_decision_interface.yml",
              "automation/wp3_2a/tests/test_operating_closure_and_wp3_2b.py",
              "investment_os_runtime/30_STATE_CURRENT/30_RESEARCH/WP4_CORE2_RESEARCH_CURRENT.json",
              "investment_os_runtime/30_STATE_CURRENT/50_DECISION_INTERFACE/WP4_DECISION_INTERFACE_CURRENT.json",
              "investment_os_runtime/00_CONTROL/WP4_CORE2_DECISION_INTERFACE_ACCEPTANCE_RECORD.json",
              "investment_os_runtime/00_CONTROL/EXECUTION_REGISTER_CURRENT.json",
              "investment_os_runtime/00_CONTROL/WORK_PACKAGE_MASTER_PLAN_CURRENT.md",
          }
          allowed_prefixes = (
              "automation/wp4/",
              "investment_os_runtime/40_EVIDENCE_AND_LINEAGE/WP4/",
          )
          changed = subprocess.check_output(
              ["git", "diff", "--name-only", "origin/main"], text=True
          ).splitlines()
          forbidden = [
              path for path in changed
              if path not in allowed_exact and not path.startswith(allowed_prefixes)
          ]
          if forbidden:
              raise SystemExit("WP4_SCOPE_VIOLATION:" + ",".join(sorted(forbidden)))

          immutable_domains = (
              "investment_os_runtime/30_STATE_CURRENT/10_REAL_ACCOUNT/",
              "investment_os_runtime/30_STATE_CURRENT/20_SIMULATION/",
              "investment_os_runtime/30_STATE_CURRENT/40_CANDIDATE/",
              "investment_os_runtime/30_STATE_CURRENT/60_DECISIONS/",
              "investment_os_runtime/30_STATE_CURRENT/80_GOVERNANCE/",
          )
          leaked = [path for path in changed if path.startswith(immutable_domains)]
          if leaked:
              raise SystemExit("INVESTMENT_DOMAIN_MUTATION:" + ",".join(sorted(leaked)))

          print({
              "changed_paths": changed,
              "candidate_membership_mutations": 0,
              "real_account_mutations": 0,
              "simulation_trade_mutations": 0,
              "orders": 0,
              "trade_authority": "NONE",
          })
          PY

      - name: Publish deterministic WP4 outputs to PR branch
        if: github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            "$WP4_OUTPUT_DIR" \
            investment_os_runtime/30_STATE_CURRENT/30_RESEARCH/WP4_CORE2_RESEARCH_CURRENT.json \
            investment_os_runtime/30_STATE_CURRENT/50_DECISION_INTERFACE/WP4_DECISION_INTERFACE_CURRENT.json \
            investment_os_runtime/00_CONTROL/WP4_CORE2_DECISION_INTERFACE_ACCEPTANCE_RECORD.json \
            investment_os_runtime/00_CONTROL/EXECUTION_REGISTER_CURRENT.json \
            investment_os_runtime/00_CONTROL/WORK_PACKAGE_MASTER_PLAN_CURRENT.md
          if git diff --cached --quiet; then
            echo "Deterministic WP4 outputs already published."
            exit 0
          fi
          git commit -m "WP4 publish Core2 research valuation and decision interface"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

      - name: Record WP4 summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## WP4 Core2 concentrated milestone

          - Deep Research: `2 / 2 Candidate Core`
          - Portfolio Fit: `directional role grade; position sizing blocked`
          - Decision-grade assumption-explicit valuation: `2`
          - Decision Interface: `2`
          - Ready for User Decision: `0`
          - Candidate / real account / simulation / orders: `0 / 0 / 0 / 0`
          - WP5 result may legitimately be `NO ACTION`
          - trade_authority: `NONE`
          EOF

      - name: Upload WP4 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wp4-core2-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .wp4_run/
            investment_os_runtime/40_EVIDENCE_AND_LINEAGE/WP4/PROPOSALS/WP4_CORE2_DECISION_INTERFACE_20260726_V1/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
