name: FMDL 5G Investment OS Integration

on:
  pull_request:
    paths:
      - "config/fmdl5g_*.json"
      - "schemas/fmdl5g_*.json"
      - "scripts/fmdl5g_*.py"
      - "scripts/run_fmdl5g_*.py"
      - "scripts/validate_fmdl5g_*.py"
      - "scripts/publish_fmdl5g.py"
      - "tests/test_fmdl5g_*.py"
      - "docs/FMDL-5G_*.md"
      - ".github/workflows/fmdl-5g-investment-os-integration.yml"
      - "README.md"
  push:
    branches: [main]
    paths:
      - "config/fmdl5g_*.json"
      - "schemas/fmdl5g_*.json"
      - "scripts/fmdl5g_*.py"
      - "scripts/run_fmdl5g_*.py"
      - "scripts/validate_fmdl5g_*.py"
      - "scripts/publish_fmdl5g.py"
      - "tests/test_fmdl5g_*.py"
      - "docs/FMDL-5G_*.md"
      - ".github/workflows/fmdl-5g-investment-os-integration.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fmdl-5g-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit tests
        run: python -m pytest -q tests/test_fmdl5g_integration.py
      - name: Compile checks
        run: >-
          python -m py_compile
          scripts/fmdl5g_core.py
          scripts/run_fmdl5g_integration.py
          scripts/validate_fmdl5g_candidate.py
          scripts/publish_fmdl5g.py

  build-and-accept:
    needs: quality-gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Build FMDL-5G Investment OS integration candidate
        run: |
          rm -rf outputs/fmdl5g/integration/candidate
          python scripts/run_fmdl5g_integration.py \
            --repo-root . \
            --output outputs/fmdl5g/integration/candidate
      - name: Independent validation and same-input replay
        run: python scripts/validate_fmdl5g_candidate.py --repo-root . --candidate outputs/fmdl5g/integration/candidate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fmdl5g-investment-os-integration-candidate
          path: outputs/fmdl5g/integration/candidate
          if-no-files-found: warn
          retention-days: 30
      - name: Publish Current Immutable Archive and Last-success
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && success()
        run: python scripts/publish_fmdl5g.py --repo-root . --candidate outputs/fmdl5g/integration/candidate
      - name: Commit accepted FMDL-5G state
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/fmdl5g/integration/current outputs/fmdl5g/integration/archive datasets/fmdl5g/integration/releases outputs/status/FMDL5G_LAST_SUCCESS.json
          git diff --cached --quiet && exit 0
          git commit -m "data: publish FMDL-5G Investment OS integration [skip ci]"
          git push
