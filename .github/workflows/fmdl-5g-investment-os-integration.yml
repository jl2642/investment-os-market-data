name: FMDL 5G Investment OS Integration
run-name: "FMDL 5G Investment OS Integration (retired)"

# S1 retirement: historical acceptance evidence stays in Git, but unrelated PRs no longer rebuild it.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/fmdl-5g-investment-os-integration.yml"

permissions:
  contents: read

env:
  TRADE_AUTHORITY: NONE

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Explain retirement
        run: |
          echo "Historical FMDL-5G integration acceptance workflow; whole-system authority is now SYSTEM_CURRENT.json."
          echo "Whole-system maturity is read from investment_os_runtime/00_CONTROL/SYSTEM_CURRENT.json."
          echo "This workflow is not an active runtime or product-health signal."
          echo "orders=0"
          echo "trade_authority=NONE"
