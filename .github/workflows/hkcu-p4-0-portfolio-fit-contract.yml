name: HKCU P4-0 Portfolio Fit Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'config/hkcu_p4_0_portfolio_fit_contract.json'
      - 'scripts/validate_hkcu_p4_0_portfolio_fit_contract.py'
      - 'tests/test_hkcu_p4_0_portfolio_fit_contract.py'
      - 'docs/HKCU-P4-0_PORTFOLIO_FIT_CONTRACT.md'
      - '.github/workflows/hkcu-p4-0-portfolio-fit-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-and-scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run P4-0 contract tests
        run: pytest -q tests/test_hkcu_p4_0_portfolio_fit_contract.py
      - name: Enforce isolated P4-0 contract scope
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}"
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" > /tmp/p4_0_paths.txt
          cat /tmp/p4_0_paths.txt
          python - <<'PY'
          from pathlib import Path
          allowed = {
              'config/hkcu_p4_0_portfolio_fit_contract.json',
              'scripts/validate_hkcu_p4_0_portfolio_fit_contract.py',
              'tests/test_hkcu_p4_0_portfolio_fit_contract.py',
              'docs/HKCU-P4-0_PORTFOLIO_FIT_CONTRACT.md',
              '.github/workflows/hkcu-p4-0-portfolio-fit-contract.yml',
          }
          actual = {x.strip() for x in Path('/tmp/p4_0_paths.txt').read_text().splitlines() if x.strip()}
          bad = sorted(actual - allowed)
          if bad:
              raise SystemExit('P4_0_SCOPE_VIOLATION:' + ','.join(bad))
          protected = (
              'outputs/hk_candidate/current/',
              'outputs/candidate/',
              'investment_os_runtime/30_STATE_CURRENT/10_REAL_ACCOUNT/',
              'investment_os_runtime/30_STATE_CURRENT/20_SIMULATION/',
              'orders/',
          )
          mutations = sorted(x for x in actual if x.startswith(protected))
          if mutations:
              raise SystemExit('P4_0_PROTECTED_STATE_MUTATION:' + ','.join(mutations))
          PY

  validate-contract:
    needs: unit-and-scope
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate P4-0 against Canonical Candidate and portfolio states
        run: |
          rm -rf work/hkcu_p4_0
          python scripts/validate_hkcu_p4_0_portfolio_fit_contract.py \
            --repo-root . \
            --output work/hkcu_p4_0
      - name: Render decision and quality
        if: always()
        run: |
          test ! -f work/hkcu_p4_0/HKCU_P4_0_CONTRACT_DECISION.json || cat work/hkcu_p4_0/HKCU_P4_0_CONTRACT_DECISION.json
          test ! -f work/hkcu_p4_0/HKCU_P4_0_CONTRACT_QUALITY_REPORT.json || cat work/hkcu_p4_0/HKCU_P4_0_CONTRACT_QUALITY_REPORT.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hkcu-p4-0-portfolio-fit-contract
          path: work/hkcu_p4_0/HKCU_P4_0_CONTRACT_*.json
          if-no-files-found: error
