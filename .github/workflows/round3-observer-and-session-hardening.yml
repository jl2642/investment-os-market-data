name: Round 3 observer and session hardening

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/round3-observer-and-session-hardening.yml"

permissions:
  contents: write

jobs:
  patch-test-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/round3-hk-us-limited-production
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Harden observer state and session capture
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f'ROUND3_PATCH_TARGET_MISSING:{label}')
              return text.replace(old, new, 1)

          engine_path = Path('automation/cross_market/build_round3_limited_production.py')
          engine = engine_path.read_text(encoding='utf-8')
          engine = replace_once(
              engine,
              '    us_session_observed = bool(us_ok)\n',
              '    us_session_observed = any(row["symbol"] not in benchmark_symbols for row in us_ok)\n',
              'rotation_session_required',
          )
          engine_path.write_text(engine, encoding='utf-8')

          observer_path = Path('automation/cross_market/apply_round3_sec_observer_results.py')
          observer = observer_path.read_text(encoding='utf-8')
          old = '''    run_current = read_json(root / RUN_PATH)\n    run_current["completed_weekly_cycle_count"] = ledger["completed_weekly_cycle_count"]\n    run_current["market_rotation_completed_weekly_cycle_count"] = ledger["market_rotation_completed_weekly_cycle_count"]\n    run_current["operating_state"] = operating_state\n    run_current.setdefault("united_states", {})["sec_official_completed_issuer_count"] = len(completed_ids)\n    run_current["united_states"]["sec_official_retrieval_status"] = cycle["sec_official_retrieval_status"]\n    run_current["united_states"]["sec_official_success_claimed"] = cycle["sec_official_retrieval_status"] == "PASS_CHATGPT_WEB_OFFICIAL_RETRIEVAL"\n\n    proposal = read_json(root / PROPOSAL_PATH)\n'''
          new = '''    run_current = read_json(root / RUN_PATH)\n    run_current["completed_weekly_cycle_count"] = ledger["completed_weekly_cycle_count"]\n    run_current["market_rotation_completed_weekly_cycle_count"] = ledger["market_rotation_completed_weekly_cycle_count"]\n    run_current["operating_state"] = operating_state\n    current_as_of = date.fromisoformat(str(run_current.get("as_of_date")))\n    current_iso_year, current_iso_week, _ = current_as_of.isocalendar()\n    current_cycle_id = f"{current_iso_year}-W{current_iso_week:02d}"\n    if current_cycle_id == cycle_id:\n        run_current.setdefault("united_states", {})["sec_official_completed_issuer_count"] = len(completed_ids)\n        run_current["united_states"]["sec_official_retrieval_status"] = cycle["sec_official_retrieval_status"]\n        run_current["united_states"]["sec_official_success_claimed"] = cycle["sec_official_retrieval_status"] == "PASS_CHATGPT_WEB_OFFICIAL_RETRIEVAL"\n\n    proposal = read_json(root / PROPOSAL_PATH)\n'''
          observer = replace_once(observer, old, new, 'delayed_observer_current_state')
          observer_path.write_text(observer, encoding='utf-8')

          validator_path = Path('automation/cross_market/validate_round3_outputs.py')
          validator = validator_path.read_text(encoding='utf-8')
          old = '''    if us_run.get("sec_official_success_claimed") is not False:\n        raise SystemExit("ROUND3_FALSE_SEC_SUCCESS_CLAIM")\n'''
          new = '''    sec_status = proposal.get("sec_official_retrieval_status")\n    sec_count = int(us_run.get("sec_official_completed_issuer_count", 0))\n    sec_claimed = bool(us_run.get("sec_official_success_claimed"))\n    minimum_sec = int(policy["united_states"]["minimum_weekly_official_sec_completed_count"])\n    if sec_claimed and (sec_status != "PASS_CHATGPT_WEB_OFFICIAL_RETRIEVAL" or sec_count < minimum_sec):\n        raise SystemExit("ROUND3_FALSE_SEC_SUCCESS_CLAIM")\n    if sec_status == "PASS_CHATGPT_WEB_OFFICIAL_RETRIEVAL" and not sec_claimed:\n        raise SystemExit("ROUND3_SEC_SUCCESS_STATE_MISMATCH")\n'''
          validator = replace_once(validator, old, new, 'observer_success_claim')
          old = '''    for cycle in ledger.get("weekly_cycles", {}).values():\n        if cycle.get("completed") and int(cycle.get("sec_official_completed_issuer_count", 0)) < int(policy["united_states"]["minimum_weekly_official_sec_completed_count"]):\n            raise SystemExit("ROUND3_WEEKLY_ACCEPTANCE_WITHOUT_SEC_EVIDENCE")\n'''
          new = '''    for cycle in ledger.get("weekly_cycles", {}).values():\n        issuer_ids = [str(value) for value in cycle.get("official_sec_issuer_ids", []) if str(value)]\n        issuer_count = int(cycle.get("sec_official_completed_issuer_count", 0))\n        if len(set(issuer_ids)) != issuer_count:\n            raise SystemExit("ROUND3_SEC_ISSUER_COUNT_MISMATCH")\n        cycle_status = cycle.get("sec_official_retrieval_status", "PENDING_CHATGPT_WEB_OFFICIAL_RETRIEVAL")\n        if issuer_count >= minimum_sec and cycle_status != "PASS_CHATGPT_WEB_OFFICIAL_RETRIEVAL":\n            raise SystemExit("ROUND3_SEC_STATUS_COUNT_MISMATCH")\n        if 0 < issuer_count < minimum_sec and cycle_status != "PARTIAL_CHATGPT_WEB_OFFICIAL_RETRIEVAL":\n            raise SystemExit("ROUND3_SEC_STATUS_COUNT_MISMATCH")\n        if cycle.get("completed") and (issuer_count < minimum_sec or cycle_status != "PASS_CHATGPT_WEB_OFFICIAL_RETRIEVAL"):\n            raise SystemExit("ROUND3_WEEKLY_ACCEPTANCE_WITHOUT_SEC_EVIDENCE")\n'''
          validator = replace_once(validator, old, new, 'ledger_sec_consistency')
          validator_path.write_text(validator, encoding='utf-8')

          tests_path = Path('automation/cross_market/tests/test_round3_limited_production.py')
          tests = tests_path.read_text(encoding='utf-8')
          marker = '''def test_same_date_replay_is_noop(tmp_path: Path) -> None:\n'''
          test = '''def test_benchmark_only_success_does_not_close_us_rotation_bucket(tmp_path: Path) -> None:\n    install(tmp_path)\n\n    def benchmark_only_fetcher(url: str, headers: dict[str, str] | None = None) -> bytes:\n        if "finance/chart" not in url:\n            raise AssertionError(url)\n        period2 = int(parse_qs(urlparse(url).query)["period2"][0])\n        as_of = datetime.fromtimestamp(period2, tz=timezone.utc).date() - timedelta(days=2)\n        symbol_path = urlparse(url).path\n        observed = as_of if ("AAPL" in symbol_path or "QQQ" in symbol_path) else as_of - timedelta(days=1)\n        ts = int(datetime.combine(observed, datetime.min.time(), tzinfo=timezone.utc).timestamp())\n        return json.dumps({"chart": {"result": [{"meta": {"currency": "USD"}, "timestamp": [ts], "indicators": {"quote": [{"close": [100.0], "volume": [1000]}]}}], "error": None}}).encode()\n\n    result = run(tmp_path, Path("automation/cross_market/round3_policy.json"), date(2026, 8, 3), benchmark_only_fetcher, sleep_seconds=0)\n    ledger = json.loads((tmp_path / "investment_os_runtime/30_STATE_CURRENT/46_CROSS_MARKET_OPERATIONS/CROSS_MARKET_LIMITED_LEDGER_CURRENT.json").read_text())\n    cycle = ledger["weekly_cycles"]["2026-W32"]\n    assert result["capture_status"] == "PARTIAL_RETRYABLE_MISSING_COMPLETED_SESSION"\n    assert cycle["hk_buckets"] == [0]\n    assert cycle["us_buckets"] == []\n    assert ledger["daily_runs"] == []\n\n\n'''
          tests = replace_once(tests, marker, test + marker, 'benchmark_only_session_test')
          tests_path.write_text(tests, encoding='utf-8')
          PY
      - name: Compile and run full Round 3 suite
        run: |
          python -m pip install --retries 5 --timeout 30 pytest
          python -m py_compile automation/cross_market/*.py
          pytest -q automation/cross_market/tests
      - name: Commit hardening
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/cross_market
          git commit -m "round3: close SEC observer and completed-session gates"
          git push origin HEAD:agent/round3-hk-us-limited-production
