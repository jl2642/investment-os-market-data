name: OCC-R2A full-universe exact continuation acceptance (one-off)
on:
  push:
    branches: [audit/occ-r2a-exact-replay-20261126]
    paths: ['.github/workflows/occ-r2a-exact-replay-once.yml']
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c1d2d5a426fa755f5f6ccf3e06656de60d83744d
          fetch-depth: 1
          sparse-checkout: |
            scripts
            config
            tests
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing valuation dependencies
        run: pip install 'pandas>=2.2,<3' 'pyarrow>=17,<24' pytest
      - name: Validate exact continuation logic
        run: pytest -q tests/test_occ_r2a_exact_continuation.py
      - name: Fetch only accepted immutable releases
        run: git fetch --no-tags --depth=1 --filter=blob:none origin 562ac7ad33d470c2e40c2418ec8e0764ca3f8b20 b8c927db10b7452b38b96691c2d1a356b1fbafe5 4a95886613628e8c28bd45ddbccc8efc9161a0aa
      - name: Reuse accepted inputs to calculate full-market exact-formula candidate
        run: |
          python -m scripts.run_occ_r2a_exact_continuation \
            --market-commit 4a95886613628e8c28bd45ddbccc8efc9161a0aa \
            --financial-commit b8c927db10b7452b38b96691c2d1a356b1fbafe5 \
            --exact-commit 562ac7ad33d470c2e40c2418ec8e0764ca3f8b20 \
            --output /tmp/exact-candidate
      - name: Preserve actual candidate and explicit blocking decision
        uses: actions/upload-artifact@v4
        with:
          name: full-universe-exact-continuation-20261126
          path: /tmp/exact-candidate/
          if-no-files-found: error
          retention-days: 30
