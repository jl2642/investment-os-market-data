name: WP1-5B Tree SHA Probe

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/wp1-5b-materialize-runtime.yml'

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wp1-5b-rule-schema-state-rebuild
          fetch-depth: 0
      - name: Publish current tree SHA to PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TREE_SHA=$(git rev-parse HEAD^{tree})
          python - <<'PY'
          import json, os, urllib.request
          tree = os.popen('git rev-parse HEAD^{tree}').read().strip()
          req = urllib.request.Request(
              'https://api.github.com/repos/jl2642/investment-os-market-data/issues/96/comments',
              data=json.dumps({'body': f'WP1_5B_TREE_SHA={tree}'}).encode(),
              headers={
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
              },
              method='POST',
          )
          with urllib.request.urlopen(req) as response:
              print(response.status)
          PY
