name: WP1-5B Materialize Runtime Candidate

on:
  pull_request:
    branches:
      - main
    paths:
      - 'bootstrap/wp1_5b_compact/**'
      - '.github/workflows/wp1-5b-materialize-runtime.yml'

permissions:
  contents: write

concurrency:
  group: wp1-5b-materialize-runtime
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wp1-5b-rule-schema-state-rebuild
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize and validate runtime candidate
        id: materialize
        continue-on-error: true
        run: python bootstrap/wp1_5b_compact/materialize.py
      - name: Commit runtime or diagnostic
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add investment_os_runtime outputs/status/WP1_5B_MATERIALIZATION_DIAGNOSTIC.json
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
          else
            git commit -m "WP1-5B: persist runtime materialization result"
            git pull --rebase origin agent/wp1-5b-rule-schema-state-rebuild
            git push origin HEAD:agent/wp1-5b-rule-schema-state-rebuild
          fi
      - name: Enforce materialization result
        if: steps.materialize.outcome != 'success'
        run: exit 1
