name: WP1-5B Drive Payload Probe

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/wp1-5b-materialize-runtime.yml'

permissions:
  contents: write

concurrency:
  group: wp1-5b-drive-payload-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wp1-5b-rule-schema-state-rebuild
          fetch-depth: 0
      - name: Download and verify temporary runtime ZIP
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, urllib.request
          url = 'https://drive.usercontent.google.com/download?id=1ookObLUPNK6fCj5KCPQdO2HioBX4j4oa&export=download&confirm=t'
          request = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(request, timeout=60) as response:
              data = response.read()
              print('status=', response.status)
              print('content_type=', response.headers.get('content-type'))
          Path('/tmp/runtime_payload.zip').write_bytes(data)
          actual = hashlib.sha256(data).hexdigest()
          print('size=', len(data))
          print('sha256=', actual)
          if len(data) != 106865:
              raise SystemExit(f'payload size mismatch: {len(data)}')
          if actual != 'afd0412b65a2c5fa6cf0121773ff47af61a9774a27191c225253035c05635415':
              raise SystemExit('payload hash mismatch')
          PY
