name: R0 Authority Materialize V2
run-name: "R0 simplified deterministic authority materialization"

on:
  push:
    branches: [agent/r0-product-authority-freeze]
    paths:
      - ".r0_product_authority_v2_trigger"
      - ".github/workflows/r0_product_authority_materialize_v2.yml"

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install pytest
        run: python -m pip install --retries 5 --timeout 30 pytest

      - name: Snapshot protected states
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          paths = [
              'investment_os_runtime/30_STATE_CURRENT/10_REAL_ACCOUNT/REAL_ACCOUNT_POSITIONS_CURRENT.json',
              'investment_os_runtime/30_STATE_CURRENT/20_SIMULATION/SIMULATION_POSITIONS_CURRENT.json',
              'investment_os_runtime/30_STATE_CURRENT/40_CANDIDATE/CANDIDATE_CURRENT.json',
              'investment_os_runtime/30_STATE_CURRENT/60_DECISIONS/DECISION_PROPOSALS_CURRENT.json',
          ]
          Path('/tmp/r0v2_hashes.json').write_text(
              json.dumps({p: hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in paths}, sort_keys=True),
              encoding='utf-8',
          )
          PY

      - name: Build authority products
        run: |
          python automation/r0_product_authority_freeze/build_r0_product_authority_freeze.py \
            --repo-root . \
            --source-head-sha "${GITHUB_SHA}"

      - name: Preserve WP3 historical lineage marker
        run: |
          cat >> investment_os_runtime/00_CONTROL/WORK_PACKAGE_MASTER_PLAN_CURRENT.md <<'EOF'

          ## 七、历史兼容状态

          `WP3 | INITIAL CANDIDATE BASELINE COMPLETED`

          该标记仅证明WP3初始Candidate基线历史已完成；当前更高层成熟度仍以本计划中的`ENGINE_ACCEPTED_OUTCOME_WINDOWS_INCOMPLETE`为准。
          EOF

      - name: Validate authority and protected states
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('.')
          control = root / 'investment_os_runtime/00_CONTROL'
          execution = json.loads((control / 'EXECUTION_REGISTER_CURRENT.json').read_text(encoding='utf-8'))
          registry = json.loads((control / 'AUTHORITATIVE_ASSET_REGISTRY.json').read_text(encoding='utf-8'))
          contract = json.loads((control / 'WP5_PORTFOLIO_DECISION_CONTRACT.json').read_text(encoding='utf-8'))
          acceptance = json.loads((control / 'R0_PRODUCT_AUTHORITY_FREEZE_ACCEPTANCE_RECORD.json').read_text(encoding='utf-8'))
          master = (control / 'WORK_PACKAGE_MASTER_PLAN_CURRENT.md').read_text(encoding='utf-8')
          assert execution['current_step'] == 'R0_PRODUCT_AUTHORITY_FREEZE_CURRENT_IF_PRESENT_ON_MAIN'
          assert execution['next_task'] == 'R1_DECISION_COVERAGE_COMPLETION_AFTER_R0_PRESENT_ON_MAIN'
          assert execution['wp5']['formal_plan'] == 'WP5_1_TO_WP5_5'
          assert execution['wp5']['wp5_h_status'] == 'VOID_NOT_STARTED'
          assert contract['historical_label_map']['WP5-H'] == 'VOID_NOT_STARTED'
          assert 'WP3 | INITIAL CANDIDATE BASELINE COMPLETED' in master
          assert acceptance['new_research_records'] == 0
          assert acceptance['economic_mutations']['orders'] == 0
          registered = {x['asset_id']: x for x in registry['assets']}
          assert registered['INVESTMENT_ASSISTANT_PRODUCT_CHARTER_CURRENT']['source_pr'] == 152
          before = json.loads(Path('/tmp/r0v2_hashes.json').read_text(encoding='utf-8'))
          after = {p: hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in before}
          assert before == after
          PY
          python -m pytest -q automation/wp3_2a/tests/test_operating_closure_and_wp3_2b.py

      - name: Publish R0 products
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .r0_product_authority_freeze_trigger .r0_product_authority_v2_trigger 2>/dev/null || true
          git add \
            automation/wp3_2a/tests/test_operating_closure_and_wp3_2b.py \
            investment_os_runtime/00_CONTROL/INVESTMENT_ASSISTANT_PRODUCT_CHARTER_CURRENT.md \
            investment_os_runtime/00_CONTROL/WORK_PACKAGE_MASTER_PLAN_CURRENT.md \
            investment_os_runtime/00_CONTROL/CAPABILITY_REALITY_MATRIX_CURRENT.md \
            investment_os_runtime/00_CONTROL/USER_OPERATING_GUIDE_CURRENT.md \
            investment_os_runtime/00_CONTROL/R0_PRODUCT_AUTHORITY_FREEZE_ACCEPTANCE_RECORD.json \
            investment_os_runtime/00_CONTROL/WP5_PORTFOLIO_DECISION_CONTRACT.json \
            investment_os_runtime/00_CONTROL/EXECUTION_REGISTER_CURRENT.json \
            investment_os_runtime/00_CONTROL/AUTHORITATIVE_ASSET_REGISTRY.json
          git commit -m "R0 materialize frozen product authority"
          git push origin HEAD:agent/r0-product-authority-freeze
