name: Strategy Kernel Phase 3C-R2A PIT Reconstruction

on:
  pull_request:
    paths:
      - 'strategy_kernel_v2/**'
      - '.github/workflows/strategy-kernel-phase3c-r2a-pit-reconstruction.yml'
  workflow_dispatch:

concurrency:
  group: strategy-kernel-phase3c-r2a-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  phase3c-r2a-reconstruction:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Phase 3C-R2A tests
        run: python -m unittest strategy_kernel_v2.tests.test_phase3c_r2a
      - name: Validate Phase 3C-R2A against real point-in-time history
        run: python -m strategy_kernel_v2.validate_phase3c_r2a
      - name: Validate Phase 3B-R2 dependency
        run: python -m strategy_kernel_v2.validate_phase3b_r2
      - name: Validate original Phase 3C history infrastructure remains unchanged
        run: python -m strategy_kernel_v2.validate_phase3c
      - name: Validate Post-3F research-path dependency
        run: python -m strategy_kernel_v2.validate_post3f_research_path
      - name: Validate historical Phase 3F gate remains unchanged
        run: python -m strategy_kernel_v2.validate_phase3f
      - name: Validate program consistency
        run: python strategy_kernel_v2/program_consistency.py
      - name: Run program governance regressions
        run: python -m unittest strategy_kernel_v2.tests.test_program_governance
      - name: Upload R2A reconstruction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3c-r2a-reconstruction
          path: strategy_kernel_v2/generated/PHASE3C_R2A_RECONSTRUCTION.json
          if-no-files-found: ignore
