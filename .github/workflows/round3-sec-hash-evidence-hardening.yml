name: Round 3 SEC hash evidence hardening

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/round3-sec-hash-evidence-hardening.yml"

permissions:
  contents: write

jobs:
  patch-test-push:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/round3-hk-us-limited-production
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Require official response hashes and strict failure identity
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f'ROUND3_PATCH_TARGET_MISSING:{label}')
              return text.replace(old, new, 1)

          path = Path('automation/cross_market/apply_round3_sec_observer_results.py')
          text = path.read_text(encoding='utf-8')
          old = '''def validate_official_sources(sources: Any, cik: str, resolution_source: str) -> list[str]:\n    if not isinstance(sources, list) or not sources:\n        raise SystemExit("ROUND3_SEC_OBSERVER_OFFICIAL_SOURCES_REQUIRED")\n    values = sorted({str(value).strip() for value in sources if str(value).strip()})\n    if not values or any(not value.startswith(ALLOWED_SOURCE_PREFIXES) for value in values):\n        raise SystemExit("ROUND3_SEC_OBSERVER_NON_OFFICIAL_SOURCE")\n    required = {\n        f"https://data.sec.gov/submissions/CIK{cik}.json",\n        f"https://data.sec.gov/api/xbrl/companyfacts/CIK{cik}.json",\n    }\n    if not required.issubset(set(values)):\n        raise SystemExit("ROUND3_SEC_OBSERVER_REQUIRED_SEC_ENDPOINT_MISSING")\n    if resolution_source == "SEC_COMPANY_TICKERS" and not any(value.startswith("https://www.sec.gov/files/company_tickers") for value in values):\n        raise SystemExit("ROUND3_SEC_OBSERVER_TICKER_MAP_SOURCE_MISSING")\n    return values\n'''
          new = '''def validate_official_sources(sources: Any, source_sha256: Any, cik: str, resolution_source: str) -> tuple[list[str], dict[str, str]]:\n    if not isinstance(sources, list) or not sources:\n        raise SystemExit("ROUND3_SEC_OBSERVER_OFFICIAL_SOURCES_REQUIRED")\n    values = sorted({str(value).strip() for value in sources if str(value).strip()})\n    if not values or any(not value.startswith(ALLOWED_SOURCE_PREFIXES) for value in values):\n        raise SystemExit("ROUND3_SEC_OBSERVER_NON_OFFICIAL_SOURCE")\n    required = {\n        f"https://data.sec.gov/submissions/CIK{cik}.json",\n        f"https://data.sec.gov/api/xbrl/companyfacts/CIK{cik}.json",\n    }\n    if not required.issubset(set(values)):\n        raise SystemExit("ROUND3_SEC_OBSERVER_REQUIRED_SEC_ENDPOINT_MISSING")\n    if resolution_source == "SEC_COMPANY_TICKERS" and not any(value.startswith("https://www.sec.gov/files/company_tickers") for value in values):\n        raise SystemExit("ROUND3_SEC_OBSERVER_TICKER_MAP_SOURCE_MISSING")\n    if not isinstance(source_sha256, dict) or set(source_sha256) != set(values):\n        raise SystemExit("ROUND3_SEC_OBSERVER_SOURCE_SHA256_REQUIRED_OR_MISMATCH")\n    hashes = {str(source): str(source_sha256[source]).strip().lower() for source in values}\n    if any(not HEX64.fullmatch(value) for value in hashes.values()):\n        raise SystemExit("ROUND3_SEC_OBSERVER_SOURCE_SHA256_INVALID")\n    return values, hashes\n'''
          text = replace_once(text, old, new, 'official_source_hash_validation')
          old = '''        sources = validate_official_sources(row.get("official_sources"), cik, resolution_source)\n        normalized_issuers.append({\n'''
          new = '''        sources, source_sha256 = validate_official_sources(\n            row.get("official_sources"),\n            row.get("official_source_sha256"),\n            cik,\n            resolution_source,\n        )\n        normalized_issuers.append({\n'''
          text = replace_once(text, old, new, 'official_source_hash_call')
          old = '''            "official_sources": sources,\n            "status": "PASS_OFFICIAL_SEC_REFRESH",\n'''
          new = '''            "official_sources": sources,\n            "official_source_sha256": source_sha256,\n            "status": "PASS_OFFICIAL_SEC_REFRESH",\n'''
          text = replace_once(text, old, new, 'official_source_hash_output')
          old = '''        seen.add(key)\n        normalized_failures.append({\n            "canonical_issuer_id": str(row.get("canonical_issuer_id") or "").strip(),\n            "symbol": str(row.get("symbol") or "").strip().upper(),\n'''
          new = '''        seen.add(key)\n        queued = queue_map[key]\n        issuer_id = str(row.get("canonical_issuer_id") or "").strip()\n        symbol = str(row.get("symbol") or "").strip().upper()\n        if issuer_id != str(queued.get("canonical_issuer_id") or "").strip():\n            raise SystemExit("ROUND3_SEC_OBSERVER_FAILURE_ISSUER_ID_MISMATCH")\n        if symbol != str(queued.get("symbol") or "").strip().upper():\n            raise SystemExit("ROUND3_SEC_OBSERVER_FAILURE_SYMBOL_MISMATCH")\n        normalized_failures.append({\n            "canonical_issuer_id": issuer_id,\n            "symbol": symbol,\n'''
          text = replace_once(text, old, new, 'failure_identity_validation')
          path.write_text(text, encoding='utf-8')

          test_path = Path('automation/cross_market/tests/test_round3_sec_observer.py')
          tests = test_path.read_text(encoding='utf-8')
          old = '''        "official_sources": sources,\n        "status": "PASS_OFFICIAL_SEC_REFRESH",\n'''
          new = '''        "official_sources": sources,\n        "official_source_sha256": {source: "a" * 64 for source in sources},\n        "status": "PASS_OFFICIAL_SEC_REFRESH",\n'''
          tests = replace_once(tests, old, new, 'test_official_hashes')
          marker = '''def test_observer_rejects_unqueued_issuer_and_authority_escalation(tmp_path: Path) -> None:\n'''
          extra = '''def test_observer_rejects_missing_official_response_hashes(tmp_path: Path) -> None:\n    _, evidence_dir = prepare_completed_market_cycle(tmp_path)\n    queue = json.loads((evidence_dir / "ROUND3_SEC_OFFICIAL_RETRIEVAL_QUEUE.json").read_text())\n    row = official_row(queue["queue"][0])\n    row.pop("official_source_sha256")\n    inbox = {\n        "schema_version": "1.0.0",\n        "run_id": queue["run_id"],\n        "as_of_date": queue["as_of_date"],\n        "retrieval_environment": "CHATGPT_WEB_CONTROLLED_OFFICIAL_RETRIEVAL",\n        "retrieved_at": "2026-08-08T10:30:00+08:00",\n        "issuers": [row],\n        "failures": [],\n        "orders": 0,\n        "trade_authority": "NONE",\n    }\n    try:\n        validate_inbox(inbox, queue)\n    except SystemExit as exc:\n        assert "SOURCE_SHA256_REQUIRED_OR_MISMATCH" in str(exc)\n    else:\n        raise AssertionError("missing official response hashes must fail")\n\n\n'''
          tests = replace_once(tests, marker, extra + marker, 'test_missing_hashes')
          test_path.write_text(tests, encoding='utf-8')
          PY
      - name: Run full Round 3 suite
        run: |
          python -m pip install --retries 5 --timeout 30 pytest
          python -m py_compile automation/cross_market/*.py
          pytest -q automation/cross_market/tests
      - name: Commit evidence hardening
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/cross_market/apply_round3_sec_observer_results.py automation/cross_market/tests/test_round3_sec_observer.py
          git commit -m "round3: require hashes for official SEC responses"
          git push origin HEAD:agent/round3-hk-us-limited-production
