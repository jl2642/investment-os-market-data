name: Strategy Kernel Phase 3E Ablation Robustness

on:
  pull_request:
    paths:
      - 'strategy_kernel_v2/**'
      - '.github/workflows/strategy-kernel-phase3e-ablation-robustness.yml'
  workflow_dispatch:

jobs:
  phase3e-ablation:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Phase 3E ablation tests
        run: python -m unittest strategy_kernel_v2.tests.test_phase3e
      - name: Build deterministic Phase 3E ablation result
        run: python -m strategy_kernel_v2.build_phase3e_results
      - name: Validate Phase 3D dependency
        run: python strategy_kernel_v2/validate_phase3d.py
      - name: Validate program consistency
        run: python strategy_kernel_v2/program_consistency.py
      - name: Upload Phase 3E ablation result
        uses: actions/upload-artifact@v4
        with:
          name: phase3e-ablation-results
          path: strategy_kernel_v2/PHASE3E_ABLATION_RESULTS.json
          if-no-files-found: error
