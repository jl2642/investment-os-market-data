name: FMDL 3E-A Incremental Contract and Baseline

on:
  pull_request:
    branches: [main]
    paths:
      - "config/fmdl3ea_incremental_refresh_contract.json"
      - "config/fmdl3ea_delta_event_catalog.csv"
      - "schemas/fmdl3ea_baseline_manifest_v1.schema.json"
      - "schemas/fmdl3ea_delta_event_v1.schema.json"
      - "scripts/fmdl3ea_core.py"
      - "scripts/run_fmdl3ea_baseline_freeze.py"
      - "scripts/validate_fmdl3ea_contract.py"
      - "scripts/validate_fmdl3ea_baseline.py"
      - "scripts/publish_fmdl3ea_baseline.py"
      - "tests/test_fmdl3ea_contract.py"
      - "docs/FMDL-3EA_INCREMENTAL_REFRESH_CONTRACT.md"
      - ".github/workflows/fmdl-3ea-incremental-contract-baseline.yml"
  push:
    branches: [main]
    paths:
      - "config/fmdl3ea_incremental_refresh_contract.json"
      - "config/fmdl3ea_delta_event_catalog.csv"
      - "schemas/fmdl3ea_baseline_manifest_v1.schema.json"
      - "schemas/fmdl3ea_delta_event_v1.schema.json"
      - "scripts/fmdl3ea_core.py"
      - "scripts/run_fmdl3ea_baseline_freeze.py"
      - "scripts/validate_fmdl3ea_contract.py"
      - "scripts/validate_fmdl3ea_baseline.py"
      - "scripts/publish_fmdl3ea_baseline.py"
      - "tests/test_fmdl3ea_contract.py"
      - "docs/FMDL-3EA_INCREMENTAL_REFRESH_CONTRACT.md"
      - ".github/workflows/fmdl-3ea-incremental-contract-baseline.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONPATH: .

concurrency:
  group: fmdl-3ea-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-and-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Validate incremental contract and FMDL-3D entry gate
        run: python -m scripts.validate_fmdl3ea_contract
      - name: Run deterministic contract tests
        run: python -m pytest -q tests/test_fmdl3ea_contract.py
      - name: Compile modules
        run: python -m py_compile scripts/fmdl3ea_core.py scripts/run_fmdl3ea_baseline_freeze.py scripts/validate_fmdl3ea_contract.py scripts/validate_fmdl3ea_baseline.py scripts/publish_fmdl3ea_baseline.py
      - name: Freeze FMDL-3D Baseline-0 candidate
        run: python -m scripts.run_fmdl3ea_baseline_freeze
      - name: Independently validate baseline and policies
        run: python -m scripts.validate_fmdl3ea_baseline
      - name: Upload baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fmdl3ea-incremental-contract-baseline-candidate
          path: outputs/fmdl3e/contract/candidate/
          if-no-files-found: warn
          retention-days: 30
      - name: Enforce FMDL-3E-A acceptance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("outputs/fmdl3e/contract/candidate")
          decision = json.loads((root / "FMDL3EA_DECISION.json").read_text())
          validation = json.loads((root / "FMDL3EA_VALIDATION.json").read_text())
          assert decision["status"] == "FMDL3EA_INCREMENTAL_REFRESH_CONTRACT_ACCEPTED", decision
          assert decision["hard_failures"] == [], decision
          assert validation["status"] == "PASS", validation
          assert validation["hard_failures"] == [], validation
          assert decision["trade_authority"] == "NONE"
          PY
      - name: Publish immutable FMDL-3E-A through Git data API
        if: github.event_name == 'pull_request' && github.head_ref == 'fmdl-3ea-direct-publish'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_BRANCH: fmdl-3ea-published-output-v1
        run: |
          python -m scripts.publish_fmdl3ea_baseline
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.request
          from pathlib import Path

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          target_branch = os.environ["TARGET_BRANCH"]
          api = f"https://api.github.com/repos/{repo}"

          def request(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(
                  api + path,
                  data=data,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "Content-Type": "application/json",
                  },
              )
              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          base_ref = request("GET", "/git/ref/heads/main")
          base_commit_sha = base_ref["object"]["sha"]
          base_commit = request("GET", f"/git/commits/{base_commit_sha}")
          base_tree_sha = base_commit["tree"]["sha"]

          roots = [
              Path("datasets/fmdl3e/contract/releases"),
              Path("outputs/fmdl3e/contract/current"),
              Path("outputs/fmdl3e/contract/archive"),
          ]
          files = [path for root in roots for path in root.rglob("*") if path.is_file()]
          files.append(Path("outputs/status/FMDL3EA_LAST_SUCCESS.json"))
          entries = []
          for path in sorted(set(files)):
              blob = request(
                  "POST",
                  "/git/blobs",
                  {
                      "content": base64.b64encode(path.read_bytes()).decode("ascii"),
                      "encoding": "base64",
                  },
              )
              entries.append(
                  {
                      "path": path.as_posix(),
                      "mode": "100644",
                      "type": "blob",
                      "sha": blob["sha"],
                  }
              )

          tree = request(
              "POST",
              "/git/trees",
              {"base_tree": base_tree_sha, "tree": entries},
          )
          commit = request(
              "POST",
              "/git/commits",
              {
                  "message": "data: publish FMDL-3E-A incremental baseline [skip ci]",
                  "tree": tree["sha"],
                  "parents": [base_commit_sha],
              },
          )
          request(
              "POST",
              "/git/refs",
              {
                  "ref": f"refs/heads/{target_branch}",
                  "sha": commit["sha"],
              },
          )
          print(json.dumps({"branch": target_branch, "commit": commit["sha"]}, indent=2))
          PY
