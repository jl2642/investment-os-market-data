name: One-shot dynamic holding coverage test repair 20260918

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'repair/dynamic-holding-coverage-count-20260918'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Replace brittle fixed holding count with dynamic coverage invariant
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/test_s2_investment_pipeline.py')
          text = p.read_text(encoding='utf-8')
          old1 = '    assert len(holding_ids) == 22\n'
          old2 = '    assert len(covered) == 22\n'
          assert text.count(old1) == 1, text.count(old1)
          assert text.count(old2) == 1, text.count(old2)
          text = text.replace(old1, '    assert holding_ids\n')
          text = text.replace(old2, '    assert len(covered) == len(holding_ids)\n')
          p.write_text(text, encoding='utf-8')
          PY
      - name: Remove one-shot workflow from final diff
        run: git rm .github/workflows/one-shot-dynamic-holding-coverage-test-repair-20260918.yml
      - name: Validate focused S2/S3 contracts
        run: |
          python -m pip install --retries 5 --timeout 30 pytest pyyaml
          pytest -q tests/test_s2_investment_pipeline.py tests/test_s3_portfolio_product_surface.py tests/test_s4_runtime_publishers.py
      - name: Commit bounded repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix holding coverage test for dynamic portfolio size'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
