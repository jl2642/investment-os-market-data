name: FMDL 3E-BC Market and Financial Incremental Refresh

on:
  pull_request:
    branches: [main]
    paths:
      - "config/fmdl3ebc_incremental_refresh.json"
      - "schemas/fmdl3ebc_delta_event_v1.schema.json"
      - "scripts/fmdl3ebc_core.py"
      - "scripts/run_fmdl3ebc_incremental.py"
      - "scripts/run_fmdl3ebc_replay_closure.py"
      - "scripts/validate_fmdl3ebc_candidate.py"
      - "scripts/publish_fmdl3ebc.py"
      - "tests/test_fmdl3ebc_incremental.py"
      - "docs/FMDL-3E-BC_*.md"
      - ".github/workflows/fmdl-3ebc-market-financial-incremental.yml"
  push:
    branches: [main]
    paths:
      - "config/fmdl3ebc_incremental_refresh.json"
      - "schemas/fmdl3ebc_delta_event_v1.schema.json"
      - "scripts/fmdl3ebc_core.py"
      - "scripts/run_fmdl3ebc_incremental.py"
      - "scripts/run_fmdl3ebc_replay_closure.py"
      - "scripts/validate_fmdl3ebc_candidate.py"
      - "scripts/publish_fmdl3ebc.py"
      - "tests/test_fmdl3ebc_incremental.py"
      - "docs/FMDL-3E-BC_*.md"
      - ".github/workflows/fmdl-3ebc-market-financial-incremental.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fmdl-3ebc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Unit and compile checks
        run: |
          pytest -q tests/test_fmdl3ebc_incremental.py
          python -m py_compile scripts/fmdl3ebc_core.py scripts/run_fmdl3ebc_incremental.py scripts/run_fmdl3ebc_replay_closure.py scripts/validate_fmdl3ebc_candidate.py scripts/publish_fmdl3ebc.py
      - name: Build deterministic candidate
        run: python -m scripts.run_fmdl3ebc_incremental --mode fixture
      - name: Independently validate deterministic candidate
        run: python -m scripts.validate_fmdl3ebc_candidate
      - name: Build real completed-session replay candidate
        run: python -m scripts.run_fmdl3ebc_replay_closure
      - name: Independently validate real replay candidate
        run: python -m scripts.validate_fmdl3ebc_candidate
      - name: Upload PR acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fmdl3ebc-real-replay-candidate
          path: outputs/fmdl3e/incremental/candidate/
          if-no-files-found: error
          retention-days: 30

  live-production:
    if: github.event_name != 'pull_request'
    needs: deterministic-acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Build eligible live increment or real completed-session replay from accepted Current
        run: |
          python - <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          baseline=json.loads(Path('outputs/fmdl3e/contract/current/FMDL3EA_BASELINE_MANIFEST.json').read_text())
          current=json.loads(Path('outputs/current/CURRENT_RELEASE.json').read_text())
          if current['as_of_date'] > baseline['market_as_of_date']:
              command=[sys.executable,'-m','scripts.run_fmdl3ebc_incremental','--mode','live']
          else:
              command=[sys.executable,'-m','scripts.run_fmdl3ebc_replay_closure']
          print({'selected_command': command, 'baseline_date': baseline['market_as_of_date'], 'current_date': current['as_of_date'], 'source_policy': 'ACCEPTED_CURRENT_ONLY'})
          subprocess.run(command, check=True)
          PY
      - name: Independently validate operational candidate
        run: python -m scripts.validate_fmdl3ebc_candidate
      - name: Upload production evidence before enforcement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fmdl3ebc-production-candidate
          path: outputs/fmdl3e/incremental/candidate/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce FMDL-3E-BC acceptance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('outputs/fmdl3e/incremental/candidate/FMDL3EBC_DECISION.json').read_text())
          v=json.loads(Path('outputs/fmdl3e/incremental/candidate/FMDL3EBC_VALIDATION.json').read_text())
          assert d['status']=='FMDL3EBC_MARKET_AND_FINANCIAL_INCREMENTAL_REFRESH_ACCEPTED' and d['hard_failures']==[]
          assert v['status']=='PASS' and v['hard_failures']==[]
          PY
      - name: Publish immutable Release Current Archive and Last-success
        run: python -m scripts.publish_fmdl3ebc
      - name: Commit accepted operating state
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/status outputs/fmdl3e/incremental/current outputs/fmdl3e/incremental/archive outputs/fmdl3e/incremental/candidate datasets/fmdl3e/incremental/releases
          if git diff --cached --quiet; then
            echo "No accepted FMDL-3E-BC state changes to commit"
          else
            git commit -m "data: publish FMDL-3E-B/C incremental acceptance [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
