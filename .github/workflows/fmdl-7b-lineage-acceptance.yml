name: FMDL 7B End-to-End Research and Decision Lineage Acceptance

on:
  pull_request:
    paths:
      - 'config/fmdl7b_lineage_acceptance_contract.json'
      - 'schemas/fmdl7b_lineage_acceptance_contract_v1.schema.json'
      - 'scripts/fmdl7b_lineage_acceptance.py'
      - 'tests/test_fmdl7b_lineage_acceptance.py'
      - 'docs/FMDL-7B_*.md'
      - '.github/workflows/fmdl-7b-lineage-acceptance.yml'
  push:
    branches: [main]
    paths:
      - 'config/fmdl7b_lineage_acceptance_contract.json'
      - 'schemas/fmdl7b_lineage_acceptance_contract_v1.schema.json'
      - 'scripts/fmdl7b_lineage_acceptance.py'
      - 'tests/test_fmdl7b_lineage_acceptance.py'
      - 'docs/FMDL-7B_*.md'
      - '.github/workflows/fmdl-7b-lineage-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fmdl-7b-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Contract and regression tests
        run: python -m unittest tests/test_fmdl7b_lineage_acceptance.py
      - name: Compile producer and tests
        run: python -m py_compile scripts/fmdl7b_lineage_acceptance.py tests/test_fmdl7b_lineage_acceptance.py
      - name: Validate bound lineages and fail-closed scope
        run: python scripts/fmdl7b_lineage_acceptance.py validate

  production:
    needs: quality-gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Freeze run timestamp and source commit
        run: |
          echo "RUN_TS=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
          echo "SOURCE_COMMIT=${GITHUB_SHA}" >> "$GITHUB_ENV"
      - name: Build FMDL-7B candidate
        run: |
          python scripts/fmdl7b_lineage_acceptance.py build \
            --output build/fmdl7b_candidate \
            --generated-at "$RUN_TS" \
            --source-commit "$SOURCE_COMMIT"
      - name: Independent same-input byte replay
        run: |
          python scripts/fmdl7b_lineage_acceptance.py build \
            --output build/fmdl7b_replay \
            --generated-at "$RUN_TS" \
            --source-commit "$SOURCE_COMMIT"
          diff -qr build/fmdl7b_candidate build/fmdl7b_replay
      - uses: actions/upload-artifact@v4
        with:
          name: fmdl7b-lineage-acceptance-candidate
          path: build/fmdl7b_candidate
          if-no-files-found: error
      - name: Publish Current immutable Release normalized and pointers
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python scripts/fmdl7b_lineage_acceptance.py publish --candidate build/fmdl7b_candidate
      - name: Commit accepted FMDL-7B state
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/fmdl7 datasets/fmdl7 outputs/status/FMDL7B_LAST_SUCCESS.json outputs/status/FMDL7_LINEAGE_ACCEPTANCE_LKG.json
          if git diff --cached --quiet; then
            echo "No publication changes"
          else
            git commit -m "data: publish FMDL-7B research and decision lineage acceptance [skip ci]"
            git push origin HEAD:main
          fi
