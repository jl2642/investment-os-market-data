name: WP5-E Lineage Diagnostic
on:
  push:
    branches: [agent/wp5-e-post-close-action-gate]
    paths: [".wp5_e_lineage_debug_trigger"]
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Build generated WP5-E state
        run: python automation/wp5_portfolio_decision/build_wp5_post_close_action_gate.py --repo-root . --mode branch
      - name: Capture lineage failure
        shell: bash
        run: |
          set +e
          python -m pytest -q automation/wp3_2a/tests/test_operating_closure_and_wp3_2b.py > automation/wp5_portfolio_decision/WP5_E_LINEAGE_DEBUG.txt 2>&1
          code=$?
          echo "EXIT_CODE=${code}" >> automation/wp5_portfolio_decision/WP5_E_LINEAGE_DEBUG.txt
          cat automation/wp5_portfolio_decision/WP5_E_LINEAGE_DEBUG.txt
          exit 0
      - name: Publish diagnostic and generated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .wp5_e_lineage_debug_trigger
          git add \
            automation/wp5_portfolio_decision/WP5_E_LINEAGE_DEBUG.txt \
            investment_os_runtime/00_CONTROL/AUTHORITATIVE_ASSET_REGISTRY.json \
            investment_os_runtime/00_CONTROL/EXECUTION_REGISTER_CURRENT.json \
            investment_os_runtime/00_CONTROL/WP5_P0_REUNDERWRITE_ACCEPTANCE_RECORD.json \
            investment_os_runtime/00_CONTROL/WP5_E_POST_CLOSE_ACTION_GATE_ACCEPTANCE_RECORD.json \
            investment_os_runtime/30_STATE_CURRENT/60_DECISIONS/WP5_POST_CLOSE_ACTION_GATE_CURRENT.json \
            investment_os_runtime/30_STATE_CURRENT/60_DECISIONS/WP5_USER_DECISION_QUEUE_CURRENT.json
          git commit -m "WP5-E publish lineage diagnostic"
          git pull --rebase origin agent/wp5-e-post-close-action-gate
          git push origin HEAD:agent/wp5-e-post-close-action-gate
