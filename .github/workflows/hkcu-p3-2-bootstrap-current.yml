name: HKCU P3-2 Bootstrap Current

on:
  push:
    branches:
      - agent/hkcu-p3-2-candidate-pool-promotion
    paths:
      - '.github/workflows/hkcu-p3-2-bootstrap-current.yml'
      - 'config/hkcu_p3_2_candidate_pool_promotion_contract.json'
      - 'pipeline/hkcu_p3_2_candidate_pool_promotion.py'
      - 'scripts/validate_hkcu_p3_2_candidate_pool_promotion.py'
      - 'tests/test_hkcu_p3_2_candidate_pool_promotion.py'

permissions:
  contents: write

jobs:
  materialize-current:
    if: ${{ !contains(github.event.head_commit.message, 'P3-2 bootstrap materialize Current') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/hkcu-p3-2-candidate-pool-promotion
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Rebuild accepted P3-1 and materialize exact P3-2 Current
        run: |
          rm -rf work/hkcu_p3_2_bootstrap
          python pipeline/hkcu_p3_2_candidate_pool_promotion.py \
            --repo-root . \
            --output work/hkcu_p3_2_bootstrap
          mkdir -p outputs/hk_candidate/current
          cp work/hkcu_p3_2_bootstrap/HK_CANDIDATE_* outputs/hk_candidate/current/
          python scripts/validate_hkcu_p3_2_candidate_pool_promotion.py \
            --repo-root . \
            --output work/hkcu_p3_2_bootstrap \
            --committed-current outputs/hk_candidate/current
      - name: Commit deterministic Current to P3-2 branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add outputs/hk_candidate/current/
          if git diff --cached --quiet; then
            echo 'P3-2 Current already materialized.'
            exit 0
          fi
          git commit -m 'HKCU P3-2 bootstrap materialize Current'
          git push origin HEAD:agent/hkcu-p3-2-candidate-pool-promotion
