name: S4 TEMPORARY Controlled Same-Date Replay

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/s4-controlled-same-date-replay.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch-current-main-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch current-main Daily same-date replay
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          gh workflow run fmdl-daily-production.yml \
            --repo "$GH_REPO" \
            --ref main \
            -f force_run=true \
            -f allow_same_date_refresh=true
          echo "S4 controlled replay dispatched."
          echo "This temporary workflow must be removed in Final Freeze."
