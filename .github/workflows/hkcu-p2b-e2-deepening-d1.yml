name: HKCU P2B E2 Deepening D1 Negative Catalyst Closure

on:
  pull_request:
    paths:
      - 'config/hkcu_p2b_e2_deepening_d1_contract.json'
      - 'pipeline/hkcu_p2b_e2_deepen_negative_catalyst.py'
      - 'scripts/validate_hkcu_p2b_e2_deepening_d1.py'
      - 'tests/test_hkcu_p2b_e2_deepening_d1.py'
      - 'docs/HKCU-P2B_E2_DEEPENING_D1.md'
      - '.github/workflows/hkcu-p2b-e2-deepening-d1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-and-scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q tests/test_hkcu_p2b_e2_deepening_d1.py
      - name: Enforce isolated D1 scope
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}"
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" > /tmp/p2b_e2_d1_paths.txt
          cat /tmp/p2b_e2_d1_paths.txt
          python - <<'PY'
          from pathlib import Path
          allowed = {
              "config/hkcu_p2b_e2_deepening_d1_contract.json",
              "pipeline/hkcu_p2b_e2_deepen_negative_catalyst.py",
              "scripts/validate_hkcu_p2b_e2_deepening_d1.py",
              "tests/test_hkcu_p2b_e2_deepening_d1.py",
              "docs/HKCU-P2B_E2_DEEPENING_D1.md",
              ".github/workflows/hkcu-p2b-e2-deepening-d1.yml",
          }
          actual = {x.strip() for x in Path('/tmp/p2b_e2_d1_paths.txt').read_text().splitlines() if x.strip()}
          bad = sorted(actual - allowed)
          if bad:
              raise SystemExit('P2B_E2_D1_SCOPE_VIOLATION:' + ','.join(bad))
          protected_prefixes = (
              'outputs/candidate/', 'outputs/simulation/', 'outputs/real',
              'state/', 'orders/'
          )
          protected = sorted(p for p in actual if p.startswith(protected_prefixes))
          if protected:
              raise SystemExit('P2B_E2_D1_PROTECTED_PATH_MUTATION:' + ','.join(protected))
          PY

  real-negative-catalyst-closure:
    needs: unit-and-scope
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Rebuild accepted Batch4 and close audited negative catalyst gaps
        run: |
          rm -rf work/hkcu_p2b_e2_d1
          python pipeline/hkcu_p2b_e2_deepen_negative_catalyst.py \
            --repo-root . \
            --output work/hkcu_p2b_e2_d1
      - name: Independent D1 validation
        run: |
          python scripts/validate_hkcu_p2b_e2_deepening_d1.py \
            --output work/hkcu_p2b_e2_d1
      - name: Render D1 decision and quality
        if: always()
        run: |
          test ! -f work/hkcu_p2b_e2_d1/HKCU_P2B_E2_D1_DECISION.json || cat work/hkcu_p2b_e2_d1/HKCU_P2B_E2_D1_DECISION.json
          test ! -f work/hkcu_p2b_e2_d1/HKCU_P2B_E2_D1_QUALITY_REPORT.json || cat work/hkcu_p2b_e2_d1/HKCU_P2B_E2_D1_QUALITY_REPORT.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hkcu-p2b-e2-d1-negative-catalyst-closure
          path: work/hkcu_p2b_e2_d1/HKCU_P2B_E2_D1_*
          if-no-files-found: error
