name: FMDL 3D-B Effective Share Count and Capitalization Engine

on:
  pull_request:
    branches: [main]
    paths:
      - "config/fmdl3db_engine.json"
      - "schemas/fmdl3db_effective_share_ledger_v1.schema.json"
      - "schemas/fmdl3db_capitalization_current_v1.schema.json"
      - "scripts/fmdl3db_core.py"
      - "scripts/run_fmdl3db_shard.py"
      - "scripts/validate_fmdl3db_shard.py"
      - "scripts/aggregate_fmdl3db.py"
      - "scripts/validate_fmdl3db_candidate.py"
      - "scripts/validate_fmdl3db_contract.py"
      - "scripts/publish_fmdl3db.py"
      - "tests/test_fmdl3db_engine.py"
      - "docs/FMDL-3DB_PRODUCT_SPEC.md"
      - "docs/FMDL-3DB_ACCEPTANCE.md"
      - ".github/workflows/fmdl-3db-effective-share-capitalization.yml"
  push:
    branches: [main]
    paths:
      - "config/fmdl3db_engine.json"
      - "schemas/fmdl3db_effective_share_ledger_v1.schema.json"
      - "schemas/fmdl3db_capitalization_current_v1.schema.json"
      - "scripts/fmdl3db_core.py"
      - "scripts/run_fmdl3db_shard.py"
      - "scripts/validate_fmdl3db_shard.py"
      - "scripts/aggregate_fmdl3db.py"
      - "scripts/validate_fmdl3db_candidate.py"
      - "scripts/validate_fmdl3db_contract.py"
      - "scripts/publish_fmdl3db.py"
      - "tests/test_fmdl3db_engine.py"
      - "docs/FMDL-3DB_PRODUCT_SPEC.md"
      - "docs/FMDL-3DB_ACCEPTANCE.md"
      - ".github/workflows/fmdl-3db-effective-share-capitalization.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: fmdl-3db-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: .

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Validate contract and source bindings
        run: python -m scripts.validate_fmdl3db_contract

      - name: Run deterministic tests
        run: python -m pytest -q tests/test_fmdl3db_engine.py

      - name: Compile production modules
        run: python -m py_compile scripts/fmdl3db_core.py scripts/run_fmdl3db_shard.py scripts/validate_fmdl3db_shard.py scripts/aggregate_fmdl3db.py scripts/validate_fmdl3db_candidate.py scripts/validate_fmdl3db_contract.py scripts/publish_fmdl3db.py

  shards:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard_id: ["00", "01", "02", "03", "04", "05", "06", "07", "08", "09", "10", "11", "12", "13", "14", "15"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run real effective-share shard
        id: run
        continue-on-error: true
        run: python -m scripts.run_fmdl3db_shard --shard-id ${{ matrix.shard_id }}

      - name: Independently validate shard
        id: validate
        continue-on-error: true
        run: python -m scripts.validate_fmdl3db_shard --shard-id ${{ matrix.shard_id }}

      - name: Upload shard package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fmdl3db-shard-${{ matrix.shard_id }}
          path: outputs/capitalization/full_build/shards/shard-${{ matrix.shard_id }}/
          if-no-files-found: error
          retention-days: 30

      - name: Enforce shard validation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          shard = "${{ matrix.shard_id }}"
          path = Path(f"outputs/capitalization/full_build/shards/shard-{shard}/SHARD_VALIDATION.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          assert payload["status"] == "PASS", payload
          assert payload["hard_failures"] == [], payload
          PY

  aggregate:
    needs: shards
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Download shard packages
        uses: actions/download-artifact@v4
        with:
          pattern: fmdl3db-shard-*
          path: downloaded-shards
          merge-multiple: false

      - name: Aggregate full-Universe candidate
        id: aggregate
        continue-on-error: true
        run: python -m scripts.aggregate_fmdl3db --input-root downloaded-shards

      - name: Independently validate aggregate candidate
        id: validate
        continue-on-error: true
        run: python -m scripts.validate_fmdl3db_candidate

      - name: Upload full-market candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fmdl3db-effective-share-capitalization-candidate
          path: outputs/capitalization/full_build/candidate/
          if-no-files-found: error
          retention-days: 30

      - name: Enforce aggregate acceptance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("outputs/capitalization/full_build/candidate")
          decision = json.loads((root / "FMDL3DB_DECISION.json").read_text(encoding="utf-8"))
          validation = json.loads((root / "FMDL3DB_VALIDATION.json").read_text(encoding="utf-8"))
          assert decision["status"] == "FMDL3DB_EFFECTIVE_SHARE_COUNT_AND_CAPITALIZATION_ENGINE_ACCEPTED", decision
          assert decision["hard_failures"] == [], decision
          assert validation["status"] == "PASS", validation
          assert validation["hard_failures"] == [], validation
          assert decision["trade_authority"] == "NONE"
          PY

      - name: Publish immutable Capitalization Current on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          python -m scripts.publish_fmdl3db
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config http.postBuffer 524288000
          git add datasets/capitalization/releases outputs/capitalization/current outputs/capitalization/archive outputs/status/FMDL3DB_LAST_SUCCESS.json
          if git diff --cached --quiet; then
            echo "No FMDL-3D-B publication changes"
          else
            git commit -m "data: publish FMDL-3D-B capitalization Current [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
