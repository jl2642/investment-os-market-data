name: FMDL 6X4-C Candidate Graduation Decision Interface and Guardrails

on:
  pull_request:
    paths:
      - "config/fmdl6x4c_*.json"
      - "schemas/fmdl6x4c_*.json"
      - "scripts/fmdl6x4c_*.py"
      - "tests/test_fmdl6x4c_*.py"
      - "docs/FMDL-6X4-C*.md"
      - ".github/workflows/fmdl-6x4c-candidate-graduation.yml"
  push:
    branches: [main]
    paths:
      - "config/fmdl6x4c_*.json"
      - "schemas/fmdl6x4c_*.json"
      - "scripts/fmdl6x4c_*.py"
      - "tests/test_fmdl6x4c_*.py"
      - "docs/FMDL-6X4-C*.md"
      - ".github/workflows/fmdl-6x4c-candidate-graduation.yml"
  workflow_run:
    workflows: ["FMDL 6X4-B Research Workflow Integration and Evidence Registration"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fmdl-6x4c-${{ github.workflow }}-${{ github.ref || github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  quality-gates:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Contract and graduation regression tests
        run: PYTHONPATH=scripts python -m unittest -v tests/test_fmdl6x4c_candidate_graduation.py
      - name: Compile producer and tests
        run: python -m py_compile scripts/fmdl6x4c_candidate_graduation.py tests/test_fmdl6x4c_candidate_graduation.py
      - name: Validate frozen production contract
        run: PYTHONPATH=scripts python scripts/fmdl6x4c_candidate_graduation.py --repo-root . validate-contract

  production:
    needs: quality-gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Freeze run timestamp and source commit
        run: |
          echo "RUN_AS_OF=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Build graduation candidate
        run: |
          rm -rf outputs/fmdl6x4c/candidate outputs/fmdl6x4c/candidate_replay outputs/fmdl6x4c/acceptance
          PYTHONPATH=scripts python scripts/fmdl6x4c_candidate_graduation.py --repo-root . build --candidate outputs/fmdl6x4c/candidate --accepted-at "$RUN_AS_OF" --source-commit "$SOURCE_COMMIT"
      - name: Independent same-input replay
        run: PYTHONPATH=scripts python scripts/fmdl6x4c_candidate_graduation.py --repo-root . validate-candidate --candidate outputs/fmdl6x4c/candidate --accepted-at "$RUN_AS_OF" --source-commit "$SOURCE_COMMIT" --acceptance outputs/fmdl6x4c/acceptance/FMDL6X4C_INDEPENDENT_ACCEPTANCE.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fmdl6x4c-candidate-graduation-candidate
          path: |
            outputs/fmdl6x4c/candidate
            outputs/fmdl6x4c/acceptance
          if-no-files-found: error
          retention-days: 30
      - name: Publish Current immutable Release normalized and pointers
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main' && success()) || (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main' && success())
        run: PYTHONPATH=scripts python scripts/fmdl6x4c_candidate_graduation.py --repo-root . publish --candidate outputs/fmdl6x4c/candidate --published-at "$RUN_AS_OF" --source-commit "$SOURCE_COMMIT"
      - name: Commit accepted FMDL-6X4-C state
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main' && success()) || (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main' && success())
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A outputs/fmdl6x4/current/candidate_graduation_guardrails datasets/fmdl6x4/releases datasets/fmdl6x4/normalized/candidate_graduation_guardrails outputs/status/FMDL6X4C_LAST_SUCCESS.json outputs/status/FMDL6X4_CANDIDATE_GRADUATION_GUARDRAILS_LKG.json
          if [ -d outputs/fmdl6x4/archive ]; then git add -A outputs/fmdl6x4/archive; fi
          git diff --cached --quiet && exit 0
          git commit -m "data: publish FMDL-6X4-C candidate graduation guardrails [skip ci]"
          git push
