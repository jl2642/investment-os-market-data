name: P4-2 Continuous Opportunity Funnel

on:
  pull_request:
    branches: [main]
    paths:
      - "automation/opportunity_funnel/**"
      - ".github/workflows/p4-2-continuous-opportunity-funnel.yml"
  push:
    branches: [main]
    paths:
      - "automation/opportunity_funnel/**"
      - ".github/workflows/p4-2-continuous-opportunity-funnel.yml"
  schedule:
    - cron: "5 1 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: p4-2-continuous-opportunity-funnel
  cancel-in-progress: false

env:
  TRADE_AUTHORITY: NONE
  D2_CURRENT_RUNTIME: .p4_2_runtime/RESEARCH_QUEUE_D2_CURRENT.json
  D2_DOMAIN_RUNTIME: .p4_2_runtime/RESEARCH_D2.json
  PRIOR_FUNNEL_RUNTIME: .p4_2_runtime/OPPORTUNITY_FUNNEL_PRIOR.json
  P4_2_OUTPUT: .p4_2_output

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Fetch governed operating inputs
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin             refs/heads/operating-current:refs/remotes/origin/operating-current             refs/heads/automation/research-queue-d2-current:refs/remotes/origin/automation/research-queue-d2-current             --no-tags
          mkdir -p .p4_2_runtime
          git show origin/operating-current:operating_current/domains/RESEARCH_D2.json > "$D2_DOMAIN_RUNTIME"
          git show origin/automation/research-queue-d2-current:investment_os_runtime/30_STATE_CURRENT/30_RESEARCH/RESEARCH_QUEUE_D2_CURRENT.json > "$D2_CURRENT_RUNTIME"
          if git cat-file -e origin/operating-current:operating_current/opportunity_funnel/OPPORTUNITY_FUNNEL_CURRENT.json 2>/dev/null; then
            git show origin/operating-current:operating_current/opportunity_funnel/OPPORTUNITY_FUNNEL_CURRENT.json > "$PRIOR_FUNNEL_RUNTIME"
          fi

      - name: Compile operating implementation
        run: |
          python -m py_compile             automation/opportunity_funnel/build_funnel.py             automation/opportunity_funnel/publish_funnel.py

      - name: Deterministic contract tests
        run: python -m unittest automation.opportunity_funnel.tests.test_build_funnel -v

      - name: Build unified funnel against latest governed D2 source
        run: |
          python automation/opportunity_funnel/build_funnel.py             --d2-current "$D2_CURRENT_RUNTIME"             --d2-domain "$D2_DOMAIN_RUNTIME"             --output-dir "$P4_2_OUTPUT"

      - name: Validate generated operating payload
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root=Path(".p4_2_output")
          current=json.loads((root/"OPPORTUNITY_FUNNEL_CURRENT.json").read_text(encoding="utf-8"))
          near=json.loads((root/"OPPORTUNITY_NEAR_MISS_CURRENT.json").read_text(encoding="utf-8"))
          work=json.loads((root/"D1_WORK_QUEUE_CURRENT.json").read_text(encoding="utf-8"))
          receipt=json.loads((root/"cycle_receipt.json").read_text(encoding="utf-8"))

          assert current["overall_status"] in {
              "CURRENT",
              "PARTIAL_STALE_UPSTREAM",
              "BLOCKED_SOURCE_GAP",
              "NO_NEW_THROUGHPUT_EXPLICITLY_EXPLAINED",
          }
          assert current["cycle_fingerprint"] == receipt["cycle_fingerprint"]
          assert current["controls"] == {
              "candidate_membership_mutations": 0,
              "orders": 0,
              "real_account_mutations": 0,
              "simulation_mutations": 0,
              "target_portfolio_writebacks": 0,
              "trade_authority": "NONE",
              "user_decisions_generated": 0,
          }
          assert len(work["queue"]) <= 5
          d2=next(x for x in current["stages"] if x["stage_id"]=="D2")
          assert d2["input_count"] <= 3
          assert len(near["rows"]) > 0
          assert all(
              {"security_id","last_reached_stage","disposition","reason_code","next_trigger","source_watermarks"} <= set(row)
              for row in near["rows"]
          )
          print({
              "status": current["overall_status"],
              "fingerprint": current["cycle_fingerprint"],
              "d1_queue": [row["security_id"] for row in work["queue"]],
              "near_miss_count": len(near["rows"]),
              "orders": 0,
              "trade_authority": "NONE",
          })
          PY

      - name: Enforce zero protected-state mutation on PR
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin main --no-tags
          changed="$(git diff --name-only origin/main...HEAD)"
          echo "$changed"
          if echo "$changed" | grep -Eq '^investment_os_runtime/30_STATE_CURRENT/(10_REAL_ACCOUNT|20_SIMULATION|40_CANDIDATE|50_DECISION_INTERFACE|60_DECISIONS)/'; then
            echo "P42_PROTECTED_STATE_MUTATION"
            exit 1
          fi
          if echo "$changed" | grep -Eq '^strategy_kernel_v2/'; then
            echo "P42_STACKED_CONTROL_CHAIN_MUST_NOT_ENTER_MAIN_OPERATIONAL_PR"
            exit 1
          fi

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: p4-2-opportunity-funnel-${{ github.run_id }}-a${{ github.run_attempt }}
          path: |
            .p4_2_output/
            .p4_2_runtime/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  operate:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Fetch latest governed operating inputs
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin             refs/heads/operating-current:refs/remotes/origin/operating-current             refs/heads/automation/research-queue-d2-current:refs/remotes/origin/automation/research-queue-d2-current             --no-tags
          mkdir -p .p4_2_runtime
          git show origin/operating-current:operating_current/domains/RESEARCH_D2.json > "$D2_DOMAIN_RUNTIME"
          git show origin/automation/research-queue-d2-current:investment_os_runtime/30_STATE_CURRENT/30_RESEARCH/RESEARCH_QUEUE_D2_CURRENT.json > "$D2_CURRENT_RUNTIME"
          if git cat-file -e origin/operating-current:operating_current/opportunity_funnel/OPPORTUNITY_FUNNEL_CURRENT.json 2>/dev/null; then
            git show origin/operating-current:operating_current/opportunity_funnel/OPPORTUNITY_FUNNEL_CURRENT.json > "$PRIOR_FUNNEL_RUNTIME"
          fi

      - name: Build live P4-2 funnel cycle
        run: |
          python automation/opportunity_funnel/build_funnel.py             --d2-current "$D2_CURRENT_RUNTIME"             --d2-domain "$D2_DOMAIN_RUNTIME"             --output-dir "$P4_2_OUTPUT"

      - name: Publish funnel and near-miss surfaces atomically
        shell: bash
        run: |
          set -Eeuo pipefail
          MAIN_HEAD="$(git rev-parse HEAD)"
          python automation/opportunity_funnel/publish_funnel.py             --current "$P4_2_OUTPUT/OPPORTUNITY_FUNNEL_CURRENT.json"             --near-miss "$P4_2_OUTPUT/OPPORTUNITY_NEAR_MISS_CURRENT.json"             --work-queue "$P4_2_OUTPUT/D1_WORK_QUEUE_CURRENT.json"             --cycle-receipt "$P4_2_OUTPUT/cycle_receipt.json"             --source-workflow "P4-2 Continuous Opportunity Funnel"             --source-run-id "${{ github.run_id }}"             --source-run-attempt "${{ github.run_attempt }}"             --source-branch main             --source-commit "$MAIN_HEAD"

      - name: Remote readback
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin refs/heads/operating-current:refs/remotes/origin/operating-current --force --no-tags
          python - <<'PY'
          import json, subprocess

          def show(path):
              return json.loads(subprocess.check_output(
                  ["git","show",f"origin/operating-current:{path}"], text=True
              ))

          current=show("operating_current/opportunity_funnel/OPPORTUNITY_FUNNEL_CURRENT.json")
          near=show("operating_current/opportunity_funnel/OPPORTUNITY_NEAR_MISS_CURRENT.json")
          work=show("operating_current/opportunity_funnel/D1_WORK_QUEUE_CURRENT.json")
          domain=show("operating_current/domains/OPPORTUNITY_FUNNEL.json")
          assert current["cycle_fingerprint"] == near["cycle_fingerprint"] == work["cycle_fingerprint"]
          assert domain["status"] == "PASS"
          assert domain["trade_authority"] == "NONE"
          assert domain["protected_mutations"] == {
              "candidate_membership": 0,
              "real_account": 0,
              "simulation": 0,
          }
          print({
              "readback": "PASS",
              "fingerprint": current["cycle_fingerprint"],
              "d1_queue": [row["security_id"] for row in work["queue"]],
              "near_miss_count": len(near["rows"]),
              "orders": domain["orders"],
              "trade_authority": domain["trade_authority"],
          })
          PY

      - name: Record boundary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## P4-2 Continuous Opportunity Funnel
          - Unified source-specific-watermark funnel is published to operating-current.
          - D1 bounded work queue capacity remains 5; D2 capacity remains 3.
          - D1 work-queue admission is research routing only and never auto-promotes to D2.
          - Near-miss rows preserve last stage, reason and next trigger.
          - Candidate / Real / Simulation mutations: 0 / 0 / 0.
          - Orders: 0.
          - trade_authority: NONE.
          EOF
