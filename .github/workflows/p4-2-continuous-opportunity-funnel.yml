name: RETIRED - P4-2 Continuous Opportunity Funnel
run-name: "RETIRED - P4-2 Continuous Opportunity Funnel"

# S2 retirement: historical implementation remains in Git history.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/p4-2-continuous-opportunity-funnel.yml"

permissions:
  contents: read

env:
  TRADE_AUTHORITY: NONE

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Explain S2 replacement
        run: |
          echo "S2 replaces Candidate-gated Funnel production with Opportunity Queue plus rolling D1."
          echo "Primary investment production is .github/workflows/s2-investment-pipeline.yml."
          echo "Historical P4 outputs remain evidence only and are not current S2 investment authority."
          echo "orders=0"
          echo "trade_authority=NONE"
