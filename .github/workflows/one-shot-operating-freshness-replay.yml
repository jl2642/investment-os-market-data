name: One-shot Operating Freshness Replay

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-operating-freshness-replay.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch repaired production workflows on protected main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh api --method POST             "repos/$REPO/actions/workflows/fmdl-daily-production.yml/dispatches"             -f ref=main             -f 'inputs[force_run]=true'             -f 'inputs[allow_same_date_refresh]=true'
          gh api --method POST             "repos/$REPO/actions/workflows/wp3_r_weekly_screen.yml/dispatches"             -f ref=main
          gh api --method POST             "repos/$REPO/actions/workflows/round3-cross-market-limited-production.yml/dispatches"             -f ref=main             -f 'inputs[as_of]=2026-08-27'
          echo "DISPATCHED_A_SHARE_CANDIDATE_CROSS_MARKET"
