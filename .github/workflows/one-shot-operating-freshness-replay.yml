name: One-shot A-share History Factor Recovery

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-operating-freshness-replay.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch governed FMDL 2B-4 multi-session recovery on protected main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh api --method POST \
            "repos/$REPO/actions/workflows/fmdl-2b4-full-rebase.yml/dispatches" \
            -f ref=main
          echo "DISPATCHED_FMDL2B4_MULTI_SESSION_RECOVERY"
