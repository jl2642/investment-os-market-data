name: One-shot A-share Daily Publication Repair

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-operating-freshness-replay.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout protected main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Publish already-validated daily transaction to Operating Current
        shell: bash
        run: |
          set -Eeuo pipefail
          python automation/operating_current/publish_operating_current.py \
            --domain A_SHARE_FULL_MARKET \
            --status PASS \
            --source-workflow "FMDL Daily A-share Governed Production" \
            --source-run-id "33171919097" \
            --source-run-attempt "1" \
            --source-branch "automation/fmdl-daily-33171919097-a1" \
            --source-commit "4a97defd03181707a26d72e375b1db8d588f5bf7" \
            --watermark "2026-08-28" \
            --watermark-sort-key "2026-08-28" \
            --qc-status PASS_DAILY_TRANSACTION_VALIDATED_PUBLICATION_REPAIR \
            --advance-current \
            --note "Publication-only repair after run 33171919097 passed market, history/factor, screening, screening Current, combined transaction validation, immutable artifact upload, and governed result-branch push; original final Operating Current handoff failed only on shell quoting."
