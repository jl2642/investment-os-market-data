name: One-shot A-share Final Daily Replay

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-operating-freshness-replay.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch same-date governed Daily replay on protected main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh api --method POST \
            "repos/$REPO/actions/workflows/fmdl-daily-production.yml/dispatches" \
            -f ref=main \
            -f 'inputs[force_run]=true' \
            -f 'inputs[allow_same_date_refresh]=true'
          echo "DISPATCHED_FINAL_A_SHARE_DAILY_REPLAY"
