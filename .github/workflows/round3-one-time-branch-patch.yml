name: Round 3 one-time branch patch

on:
  push:
    branches: [agent/round3-hk-us-limited-production]
    paths:
      - "automation/cross_market/apply_round3_v2_patch.py"
      - ".github/workflows/round3-one-time-branch-patch.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/round3-hk-us-limited-production
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply bounded coverage repair
        run: |
          sed -i 's/text\[end + 2:\]/text[end:]/' automation/cross_market/apply_round3_v2_patch.py
          python automation/cross_market/apply_round3_v2_patch.py
          python -m py_compile automation/cross_market/*.py
          python -m pip install --retries 5 --timeout 30 pytest
          pytest -q automation/cross_market/tests/test_round3_limited_production.py
      - name: Remove temporary patch mechanism and publish clean branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm automation/cross_market/apply_round3_v2_patch.py .github/workflows/round3-one-time-branch-patch.yml
          git add -A
          git commit -m "round3: unify initial and backfill pools with SEC web retrieval queue"
          git push origin HEAD:agent/round3-hk-us-limited-production
