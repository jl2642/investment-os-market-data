name: FMDL 3C-B Financial Factor Engine MVP

on:
  pull_request:
    paths:
      - "config/fmdl3cb_engine.json"
      - "config/fmdl3cb_sector_overrides.csv"
      - "schemas/fmdl3cb_factor_row_v1.schema.json"
      - "scripts/fmdl3cb_common.py"
      - "scripts/fmdl3cb_inputs.py"
      - "scripts/fmdl3cb_formula.py"
      - "scripts/fmdl3cb_profiles.py"
      - "scripts/fmdl3cb_core.py"
      - "scripts/run_fmdl3cb_factor_engine.py"
      - "scripts/validate_fmdl3cb_factor_engine.py"
      - "scripts/validate_fmdl3cb_sector_profiles.py"
      - "scripts/validate_fmdl3cb_engine_contract.py"
      - "scripts/publish_fmdl3cb_factor_engine.py"
      - "tests/test_fmdl3cb_factor_engine.py"
      - ".github/workflows/fmdl-3cb-financial-factor-engine.yml"
  push:
    branches: [main]
    paths:
      - "config/fmdl3cb_engine.json"
      - "config/fmdl3cb_sector_overrides.csv"
      - "schemas/fmdl3cb_factor_row_v1.schema.json"
      - "scripts/fmdl3cb_common.py"
      - "scripts/fmdl3cb_inputs.py"
      - "scripts/fmdl3cb_formula.py"
      - "scripts/fmdl3cb_profiles.py"
      - "scripts/fmdl3cb_core.py"
      - "scripts/run_fmdl3cb_factor_engine.py"
      - "scripts/validate_fmdl3cb_factor_engine.py"
      - "scripts/validate_fmdl3cb_sector_profiles.py"
      - "scripts/validate_fmdl3cb_engine_contract.py"
      - "scripts/publish_fmdl3cb_factor_engine.py"
      - "tests/test_fmdl3cb_factor_engine.py"
      - ".github/workflows/fmdl-3cb-financial-factor-engine.yml"
  workflow_dispatch:

concurrency:
  group: fmdl-3cb-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  PYTHONPATH: .

jobs:
  build-and-validate-factor-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas pyarrow pytest jsonschema

      - name: Validate frozen engine contract
        run: python scripts/validate_fmdl3cb_engine_contract.py

      - name: Run deterministic engine tests
        run: python -m pytest -q tests/test_fmdl3cb_factor_engine.py

      - name: Compile engine modules
        run: python -m py_compile scripts/fmdl3cb_common.py scripts/fmdl3cb_inputs.py scripts/fmdl3cb_formula.py scripts/fmdl3cb_profiles.py scripts/fmdl3cb_core.py scripts/run_fmdl3cb_factor_engine.py scripts/validate_fmdl3cb_factor_engine.py scripts/validate_fmdl3cb_sector_profiles.py scripts/publish_fmdl3cb_factor_engine.py

      - name: Build full-Universe financial factor candidate
        run: python scripts/run_fmdl3cb_factor_engine.py

      - name: Validate sector-profile plausibility and overrides
        run: python scripts/validate_fmdl3cb_sector_profiles.py

      - name: Independently validate factor candidate
        run: python scripts/validate_fmdl3cb_factor_engine.py

      - name: Upload factor candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: fmdl3cb-financial-factor-engine-candidate
          path: outputs/financial_factors/engine/candidate
          retention-days: 30

      - name: Enforce acceptance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('outputs/financial_factors/engine/candidate')
          decision = json.loads((root / 'FMDL3CB_DECISION.json').read_text())
          validation = json.loads((root / 'FMDL3CB_VALIDATION.json').read_text())
          assert decision['status'] == 'FMDL3CB_FINANCIAL_FACTOR_ENGINE_MVP_ACCEPTED'
          assert decision['hard_failures'] == []
          assert validation['status'] == 'PASS'
          assert validation['hard_failures'] == []
          assert decision['trade_authority'] == 'NONE'
          PY

      - name: Publish immutable factor engine Current on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          python scripts/publish_fmdl3cb_factor_engine.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datasets/financial_factors/engine outputs/financial_factors/engine outputs/status/FMDL3CB_LAST_SUCCESS.json
          git commit -m "data: publish FMDL-3C-B financial factor engine [skip ci]"
          git push
