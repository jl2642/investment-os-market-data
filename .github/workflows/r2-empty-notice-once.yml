name: R2 one-off four failed notice slots acceptance
on:
  push:
    branches: [audit/r1-live-market-20261126]
    paths: ['.github/workflows/r2-empty-notice-once.yml']
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8f9a6fd32d82da28fbde436ee2cc3cffe0d2bdfc
          sparse-checkout: |
            scripts
            tests
            config
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: pytest -q tests/test_occ_r2b_financial_backlog.py
      - name: Reuse failed scan evidence and only verify the four unresolved slots
        shell: bash
        run: |
          set -Eeuo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/15135503122/zip" > /tmp/notice-original.zip
          python - <<'PY'
          import zipfile,hashlib,json,pandas as pd
          from pathlib import Path
          from datetime import date
          from scripts import scan_occ_r2b_financial_backlog as scan
          z=Path('/tmp/notice-original.zip')
          assert hashlib.sha256(z.read_bytes()).hexdigest()=='0351184e7f67e0f79ac7a24e14f11bf4b87293bb3da0ad53853b5d126e73dde8'
          with zipfile.ZipFile(z) as arc:
              attempts=pd.read_csv(arc.open('NOTICE_SCAN_ATTEMPTS.csv'))
              events=pd.read_csv(arc.open('FINANCIAL_FILING_BACKLOG.csv'))
              decision=json.load(arc.open('FINANCIAL_FILING_BACKLOG_DECISION.json'))
          bad=attempts[attempts.source_state.eq('FAILED')]
          assert len(attempts)==32 and len(bad)==4 and len(events)==44 and events.symbol.nunique()==41
          assert set(bad.date)=={'2026-11-15','2026-11-22'} and set(bad.category)=={'财务报告','信息变更'}
          assert set(bad.error_type)=={'KeyError'} and set(bad.error_message)=={"'代码'"}
          real_get=scan.requests.get
          def recorded_get(*args,**kwargs):
              response=real_get(*args,**kwargs)
              p=response.json()
              data=p.get('data') if isinstance(p,dict) else None
              print('PROVIDER_EMPTY_EVIDENCE',json.dumps({'date':kwargs['params']['begin_time'],'category_id':kwargs['params']['f_node'],'http_status':response.status_code,'success':p.get('success') if isinstance(p,dict) else None,'total_hits':data.get('total_hits') if isinstance(data,dict) else None,'list_is_empty':isinstance(data,dict) and data.get('list')==[]},ensure_ascii=False),flush=True)
              return response
          scan.requests.get=recorded_get
          recovered=0
          for _,r in bad.iterrows():
              ok=scan.confirm_provider_empty(date.fromisoformat(r.date),r.category)
              recovered+=int(ok)
              print('SLOT_RESULT',r.date,r.category,ok,flush=True)
          print('R2_FROZEN_SLOT_ACCEPTANCE',json.dumps({'original_success':28,'confirmed_empty':recovered,'combined_coverage':(28+recovered)/32,'financial_event_count':len(events),'affected_symbol_count':events.symbol.nunique(),'production_write':False,'trade_authority':'NONE'},default=int),flush=True)
          assert recovered==4
          PY
