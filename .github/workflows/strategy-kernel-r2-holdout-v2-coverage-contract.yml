name: Strategy Kernel R2 Holdout V2 Coverage Contract

on:
  pull_request:
    paths:
      - 'strategy_kernel_v2/**'
      - '.github/workflows/strategy-kernel-r2-holdout-v2-coverage-contract.yml'
  workflow_dispatch:

concurrency:
  group: strategy-kernel-r2-holdout-v2-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  holdout-v2-coverage-contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Re-validate H0.1 freeze
        run: python -m strategy_kernel_v2.validate_phase3_r2_holdout_h0
      - name: Re-validate accepted H1 result
        run: python -m strategy_kernel_v2.validate_phase3_r2_holdout_h1
      - name: Run V2 pre-result contract tests
        run: python -m unittest strategy_kernel_v2.tests.test_phase3_r2_holdout_v2_contract
      - name: Validate V2 pre-result coverage expansion contract
        run: python -m strategy_kernel_v2.validate_phase3_r2_holdout_v2_contract
      - name: Re-validate Phase 3C-R2B parent
        run: python -m strategy_kernel_v2.validate_phase3c_r2b
      - name: Validate Post-3F research path
        run: python -m strategy_kernel_v2.validate_post3f_research_path
      - name: Validate historical Phase 3F gate remains unchanged
        run: python -m strategy_kernel_v2.validate_phase3f
      - name: Validate program consistency
        run: python strategy_kernel_v2/program_consistency.py
      - name: Run program governance regressions
        run: python -m unittest strategy_kernel_v2.tests.test_program_governance
