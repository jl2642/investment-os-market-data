name: FMDL 3D-A Valuation Contract and Pilot

on:
  pull_request:
    paths:
      - "config/fmdl3da_contract.json"
      - "config/fmdl3da_valuation_metric_registry.csv"
      - "config/fmdl3da_shareholder_event_registry.csv"
      - "config/fmdl3da_pilot_universe.csv"
      - "schemas/fmdl3da_valuation_metric_detail_v1.schema.json"
      - "schemas/fmdl3da_capitalization_snapshot_v1.schema.json"
      - "schemas/fmdl3da_shareholder_return_event_v1.schema.json"
      - "scripts/fmdl3da_core.py"
      - "scripts/run_fmdl3da_contract_pilot.py"
      - "scripts/validate_fmdl3da_contract.py"
      - "scripts/validate_fmdl3da_pilot.py"
      - "scripts/publish_fmdl3da_contract.py"
      - "tests/test_fmdl3da_contract.py"
      - "docs/FMDL-3DA_PRODUCT_SPEC.md"
      - "docs/FMDL-3DA_POINT_IN_TIME_POLICY.md"
      - ".github/workflows/fmdl-3da-valuation-contract-pilot.yml"
  push:
    branches: [main]
    paths:
      - "config/fmdl3da_contract.json"
      - "config/fmdl3da_valuation_metric_registry.csv"
      - "config/fmdl3da_shareholder_event_registry.csv"
      - "config/fmdl3da_pilot_universe.csv"
      - "schemas/fmdl3da_valuation_metric_detail_v1.schema.json"
      - "schemas/fmdl3da_capitalization_snapshot_v1.schema.json"
      - "schemas/fmdl3da_shareholder_return_event_v1.schema.json"
      - "scripts/fmdl3da_core.py"
      - "scripts/run_fmdl3da_contract_pilot.py"
      - "scripts/validate_fmdl3da_contract.py"
      - "scripts/validate_fmdl3da_pilot.py"
      - "scripts/publish_fmdl3da_contract.py"
      - "tests/test_fmdl3da_contract.py"
      - "docs/FMDL-3DA_PRODUCT_SPEC.md"
      - "docs/FMDL-3DA_POINT_IN_TIME_POLICY.md"
      - ".github/workflows/fmdl-3da-valuation-contract-pilot.yml"
  workflow_dispatch:

concurrency:
  group: fmdl-3da-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  PYTHONPATH: .

jobs:
  validate-and-run-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas pyarrow numpy pytest jsonschema

      - name: Validate frozen contract
        run: python scripts/validate_fmdl3da_contract.py

      - name: Run deterministic contract tests
        run: python -m pytest -q tests/test_fmdl3da_contract.py

      - name: Compile modules
        run: python -m py_compile scripts/fmdl3da_core.py scripts/run_fmdl3da_contract_pilot.py scripts/validate_fmdl3da_contract.py scripts/validate_fmdl3da_pilot.py scripts/publish_fmdl3da_contract.py

      - name: Run representative real-data valuation pilot
        run: python scripts/run_fmdl3da_contract_pilot.py

      - name: Independently validate pilot
        run: python scripts/validate_fmdl3da_pilot.py

      - name: Upload pilot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fmdl3da-valuation-contract-pilot
          path: outputs/valuation/contract/candidate
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce acceptance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('outputs/valuation/contract/candidate')
          decision = json.loads((root / 'FMDL3DA_DECISION.json').read_text())
          validation = json.loads((root / 'FMDL3DA_VALIDATION.json').read_text())
          assert decision['status'] == 'FMDL3DA_VALUATION_AND_SHAREHOLDER_RETURN_CONTRACT_ACCEPTED'
          assert decision['hard_failures'] == []
          assert validation['status'] == 'PASS'
          assert validation['hard_failures'] == []
          assert decision['trade_authority'] == 'NONE'
          PY

      - name: Publish immutable Contract Current on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          python scripts/publish_fmdl3da_contract.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datasets/valuation/contract outputs/valuation/contract outputs/status/FMDL3DA_LAST_SUCCESS.json
          git commit -m "data: publish FMDL-3D-A valuation contract [skip ci]"
          git push
