name: P4-4 Trigger Monitor and Autonomous Shadow Book

on:
  pull_request:
    branches: [main]
    paths:
      - "automation/shadow_book/**"
      - ".github/workflows/p4-4-trigger-shadow.yml"
  push:
    branches: [main]
    paths:
      - "automation/shadow_book/**"
      - ".github/workflows/p4-4-trigger-shadow.yml"
  schedule:
    - cron: "20 8 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: p4-4-trigger-shadow-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TRADE_AUTHORITY: NONE
  P44_CONTRACT_REF: agent/strategy-kernel-p4-4-trigger-shadow-contract-20260828
  P44_CONTRACT_HEAD: fd35c53067c47d4aa0f13a19ac479adff2fcbd39
  REC_CURRENT: .p4_4_runtime/RECOMMENDATION_CURRENT.json
  REC_DOMAIN: .p4_4_runtime/RECOMMENDATION_DOMAIN.json
  PRIOR_TRIGGER: .p4_4_runtime/TRIGGER_MONITOR_PRIOR.json
  PRIOR_SHADOW: .p4_4_runtime/SHADOW_BOOK_PRIOR.json
  PRIOR_TRIGGER_LEDGER: .p4_4_runtime/TRIGGER_EVENT_LEDGER_PRIOR.jsonl
  PRIOR_ACTION_LEDGER: .p4_4_runtime/SHADOW_ACTION_LEDGER_PRIOR.jsonl
  PLAN_DIR: .p4_4_plan
  MARK_PACKET: .p4_4_runtime/SHADOW_MARK_PACKET.json
  OUTPUT_DIR: .p4_4_output

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Fetch governed P4-4 inputs
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin             refs/heads/operating-current:refs/remotes/origin/operating-current             "refs/heads/$P44_CONTRACT_REF:refs/remotes/origin/p4-4-contract"             --force --no-tags
          CONTRACT_ACTUAL="$(git rev-parse refs/remotes/origin/p4-4-contract)"
          if [[ "$CONTRACT_ACTUAL" != "$P44_CONTRACT_HEAD" ]]; then
            echo "P44_CONTRACT_HEAD_DRIFT:$CONTRACT_ACTUAL:$P44_CONTRACT_HEAD"
            exit 1
          fi
          mkdir -p .p4_4_runtime
          git show origin/operating-current:operating_current/recommendations/RECOMMENDATION_CURRENT.json > "$REC_CURRENT"
          git show origin/operating-current:operating_current/domains/RECOMMENDATION.json > "$REC_DOMAIN"
          if git cat-file -e origin/operating-current:operating_current/trigger_monitor/TRIGGER_MONITOR_CURRENT.json 2>/dev/null; then
            git show origin/operating-current:operating_current/trigger_monitor/TRIGGER_MONITOR_CURRENT.json > "$PRIOR_TRIGGER"
            git show origin/operating-current:operating_current/trigger_monitor/TRIGGER_EVENT_LEDGER.jsonl > "$PRIOR_TRIGGER_LEDGER"
            git show origin/operating-current:operating_current/shadow_book/SHADOW_BOOK_CURRENT.json > "$PRIOR_SHADOW"
            git show origin/operating-current:operating_current/shadow_book/SHADOW_ACTION_LEDGER.jsonl > "$PRIOR_ACTION_LEDGER"
          fi

      - name: Compile P4-4 implementation
        run: |
          python -m py_compile             automation/shadow_book/build_trigger_shadow.py             automation/shadow_book/acquire_pending_marks.py             automation/shadow_book/publish_trigger_shadow.py

      - name: Deterministic trigger-shadow tests
        run: python -m unittest automation.shadow_book.tests.test_build_trigger_shadow -v

      - name: Build governed current state without network
        shell: bash
        run: |
          set -Eeuo pipefail
          PRIOR_ARGS=()
          [[ -f "$PRIOR_TRIGGER" ]] && PRIOR_ARGS+=(--prior-trigger-current "$PRIOR_TRIGGER")
          [[ -f "$PRIOR_SHADOW" ]] && PRIOR_ARGS+=(--prior-shadow-current "$PRIOR_SHADOW")
          [[ -f "$PRIOR_TRIGGER_LEDGER" ]] && PRIOR_ARGS+=(--prior-trigger-event-ledger "$PRIOR_TRIGGER_LEDGER")
          [[ -f "$PRIOR_ACTION_LEDGER" ]] && PRIOR_ARGS+=(--prior-action-ledger "$PRIOR_ACTION_LEDGER")
          python automation/shadow_book/build_trigger_shadow.py             --recommendation-current "$REC_CURRENT"             --recommendation-domain "$REC_DOMAIN"             "${PRIOR_ARGS[@]}"             --output-dir "$OUTPUT_DIR"

      - name: Validate current P4-4 contract result
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path(".p4_4_output")
          registry=json.loads((root/"TRIGGER_REGISTRY_CURRENT.json").read_text(encoding="utf-8"))
          monitor=json.loads((root/"TRIGGER_MONITOR_CURRENT.json").read_text(encoding="utf-8"))
          shadow=json.loads((root/"SHADOW_BOOK_CURRENT.json").read_text(encoding="utf-8"))
          request=json.loads((root/"MARK_REQUEST_CURRENT.json").read_text(encoding="utf-8"))
          receipt=json.loads((root/"cycle_receipt.json").read_text(encoding="utf-8"))
          assert registry["subject_count"] == 3
          assert registry["trigger_clause_count"] == 7
          assert registry["invalidation_clause_count"] == 6
          assert all(x["monitorability"] == "SEMANTIC_EVIDENCE_REQUIRED" for x in registry["clauses"])
          assert all(x["keyword_inference_authorized"] is False for x in registry["clauses"])
          assert shadow["summary"]["open_position_count"] == 0
          assert shadow["summary"]["action_signal_count_this_cycle"] == 0
          assert request["request_count"] == 0
          assert receipt["phase4_forward_observation_increment"] == 0
          assert receipt["phase4_realized_outcome_increment"] == 0
          assert shadow["controls"] == {
              "candidate_membership_mutations": 0,
              "orders": 0,
              "phase4_forward_observation_increment": 0,
              "phase4_realized_outcome_increment": 0,
              "real_account_mutations": 0,
              "simulation_mutations": 0,
              "target_portfolio_writebacks": 0,
              "trade_authority": "NONE",
          }
          print({
              "subjects": registry["subject_count"],
              "triggers": registry["trigger_clause_count"],
              "invalidations": registry["invalidation_clause_count"],
              "shadow_open": shadow["summary"]["open_position_count"],
              "pending_marks": request["request_count"],
              "observations": 0,
              "outcomes": 0,
              "orders": 0,
              "trade_authority": "NONE",
          })
          PY

      - name: Enforce protected-state isolation
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin main --no-tags
          changed="$(git diff --name-only origin/main...HEAD)"
          echo "$changed"
          if echo "$changed" | grep -Eq '^investment_os_runtime/30_STATE_CURRENT/(10_REAL_ACCOUNT|20_SIMULATION|40_CANDIDATE|50_DECISION_INTERFACE|60_DECISIONS)/'; then
            echo "P44_PROTECTED_STATE_MUTATION"
            exit 1
          fi
          if echo "$changed" | grep -Eq '^strategy_kernel_v2/'; then
            echo "P44_STACKED_GOVERNANCE_CHAIN_MUST_NOT_ENTER_MAIN"
            exit 1
          fi
          if echo "$changed" | grep -Eq '^automation/(recommendations|opportunity_funnel|research_queue_d2|wp2_r)/'; then
            echo "P44_UPSTREAM_COMPONENT_REWRITE_NOT_AUTHORIZED"
            exit 1
          fi

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: p4-4-trigger-shadow-${{ github.run_id }}-a${{ github.run_attempt }}
          path: |
            .p4_4_output/
            .p4_4_runtime/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  operate:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Fetch latest governed P4-4 inputs
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin             refs/heads/operating-current:refs/remotes/origin/operating-current             "refs/heads/$P44_CONTRACT_REF:refs/remotes/origin/p4-4-contract"             --force --no-tags
          CONTRACT_ACTUAL="$(git rev-parse refs/remotes/origin/p4-4-contract)"
          if [[ "$CONTRACT_ACTUAL" != "$P44_CONTRACT_HEAD" ]]; then
            echo "P44_CONTRACT_HEAD_DRIFT:$CONTRACT_ACTUAL:$P44_CONTRACT_HEAD"
            exit 1
          fi
          mkdir -p .p4_4_runtime
          git show origin/operating-current:operating_current/recommendations/RECOMMENDATION_CURRENT.json > "$REC_CURRENT"
          git show origin/operating-current:operating_current/domains/RECOMMENDATION.json > "$REC_DOMAIN"
          if git cat-file -e origin/operating-current:operating_current/trigger_monitor/TRIGGER_MONITOR_CURRENT.json 2>/dev/null; then
            git show origin/operating-current:operating_current/trigger_monitor/TRIGGER_MONITOR_CURRENT.json > "$PRIOR_TRIGGER"
            git show origin/operating-current:operating_current/trigger_monitor/TRIGGER_EVENT_LEDGER.jsonl > "$PRIOR_TRIGGER_LEDGER"
            git show origin/operating-current:operating_current/shadow_book/SHADOW_BOOK_CURRENT.json > "$PRIOR_SHADOW"
            git show origin/operating-current:operating_current/shadow_book/SHADOW_ACTION_LEDGER.jsonl > "$PRIOR_ACTION_LEDGER"
          fi

      - name: Plan actions from Recommendation Current
        shell: bash
        run: |
          set -Eeuo pipefail
          PRIOR_ARGS=()
          [[ -f "$PRIOR_TRIGGER" ]] && PRIOR_ARGS+=(--prior-trigger-current "$PRIOR_TRIGGER")
          [[ -f "$PRIOR_SHADOW" ]] && PRIOR_ARGS+=(--prior-shadow-current "$PRIOR_SHADOW")
          [[ -f "$PRIOR_TRIGGER_LEDGER" ]] && PRIOR_ARGS+=(--prior-trigger-event-ledger "$PRIOR_TRIGGER_LEDGER")
          [[ -f "$PRIOR_ACTION_LEDGER" ]] && PRIOR_ARGS+=(--prior-action-ledger "$PRIOR_ACTION_LEDGER")
          python automation/shadow_book/build_trigger_shadow.py             --recommendation-current "$REC_CURRENT"             --recommendation-domain "$REC_DOMAIN"             "${PRIOR_ARGS[@]}"             --output-dir "$PLAN_DIR"

      - name: Acquire bounded first-eligible marks for pending shadow actions
        run: |
          python automation/shadow_book/acquire_pending_marks.py             --mark-request "$PLAN_DIR/MARK_REQUEST_CURRENT.json"             --output "$MARK_PACKET"

      - name: Build final live trigger-shadow state
        shell: bash
        run: |
          set -Eeuo pipefail
          PRIOR_ARGS=()
          [[ -f "$PRIOR_TRIGGER" ]] && PRIOR_ARGS+=(--prior-trigger-current "$PRIOR_TRIGGER")
          [[ -f "$PRIOR_SHADOW" ]] && PRIOR_ARGS+=(--prior-shadow-current "$PRIOR_SHADOW")
          [[ -f "$PRIOR_TRIGGER_LEDGER" ]] && PRIOR_ARGS+=(--prior-trigger-event-ledger "$PRIOR_TRIGGER_LEDGER")
          [[ -f "$PRIOR_ACTION_LEDGER" ]] && PRIOR_ARGS+=(--prior-action-ledger "$PRIOR_ACTION_LEDGER")
          python automation/shadow_book/build_trigger_shadow.py             --recommendation-current "$REC_CURRENT"             --recommendation-domain "$REC_DOMAIN"             "${PRIOR_ARGS[@]}"             --mark-packet "$MARK_PACKET"             --output-dir "$OUTPUT_DIR"

      - name: Publish Trigger Monitor and Shadow Book atomically
        shell: bash
        run: |
          set -Eeuo pipefail
          MAIN_HEAD="$(git rev-parse HEAD)"
          python -m automation.shadow_book.publish_trigger_shadow             --registry "$OUTPUT_DIR/TRIGGER_REGISTRY_CURRENT.json"             --trigger-current "$OUTPUT_DIR/TRIGGER_MONITOR_CURRENT.json"             --trigger-ledger "$OUTPUT_DIR/TRIGGER_EVENT_LEDGER.jsonl"             --shadow-current "$OUTPUT_DIR/SHADOW_BOOK_CURRENT.json"             --action-ledger "$OUTPUT_DIR/SHADOW_ACTION_LEDGER.jsonl"             --mark-request "$OUTPUT_DIR/MARK_REQUEST_CURRENT.json"             --cycle-receipt "$OUTPUT_DIR/cycle_receipt.json"             --source-workflow "P4-4 Trigger Monitor and Autonomous Shadow Book"             --source-run-id "${{ github.run_id }}"             --source-run-attempt "${{ github.run_attempt }}"             --source-branch main             --source-commit "$MAIN_HEAD"

      - name: Remote readback
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin refs/heads/operating-current:refs/remotes/origin/operating-current --force --no-tags
          python - <<'PY'
          import json, subprocess
          def show(path):
              return json.loads(subprocess.check_output(
                  ["git","show",f"origin/operating-current:{path}"],text=True
              ))
          registry=show("operating_current/trigger_monitor/TRIGGER_REGISTRY_CURRENT.json")
          monitor=show("operating_current/trigger_monitor/TRIGGER_MONITOR_CURRENT.json")
          shadow=show("operating_current/shadow_book/SHADOW_BOOK_CURRENT.json")
          trigger_domain=show("operating_current/domains/TRIGGER_MONITOR.json")
          shadow_domain=show("operating_current/domains/SHADOW_BOOK.json")
          assert registry["subject_count"] == 3
          assert registry["trigger_clause_count"] == 7
          assert registry["invalidation_clause_count"] == 6
          assert monitor["controls"]["phase4_forward_observation_increment"] == 0
          assert monitor["controls"]["phase4_realized_outcome_increment"] == 0
          assert shadow["controls"]["simulation_mutations"] == 0
          assert shadow["controls"]["real_account_mutations"] == 0
          assert shadow["controls"]["candidate_membership_mutations"] == 0
          assert shadow["controls"]["orders"] == 0
          assert shadow["controls"]["trade_authority"] == "NONE"
          assert trigger_domain["status"] == "PASS"
          assert shadow_domain["status"] == "PASS"
          print({
              "readback":"PASS",
              "source_fingerprint":monitor["source_fingerprint"],
              "subjects":registry["subject_count"],
              "triggers":registry["trigger_clause_count"],
              "invalidations":registry["invalidation_clause_count"],
              "shadow_open":shadow["summary"]["open_position_count"],
              "entry_pending":shadow["summary"]["entry_pending_mark_count"],
              "exit_pending":shadow["summary"]["exit_pending_mark_count"],
              "observations":0,
              "outcomes":0,
              "orders":0,
              "trade_authority":"NONE",
          })
          PY

      - name: Record successful P4-4 boundary
        if: success()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## P4-4 Trigger Monitor & Autonomous Shadow Book
          - Trigger registry / shadow book publication and remote readback: PASS.
          - Natural-language investment triggers are evidence-required and never keyword-auto-fired.
          - BUY_NOW/ADD and AVOID/EXIT_REVIEW are the only machine-action states.
          - Shadow exposure is normalized research-only and separate from protected Simulation.
          - Pre-P4-5 actions are PRE_BASELINE_INFRASTRUCTURE_ONLY.
          - Phase-4 forward observations / realized outcomes: 0 / 0.
          - Candidate / Real / protected Simulation mutations: 0 / 0 / 0.
          - Orders: 0.
          - trade_authority: NONE.
          EOF

      - name: Record failed P4-4 boundary
        if: failure()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## P4-4 Trigger Monitor & Autonomous Shadow Book
          - Publication or readback: FAIL.
          - Existing Operating Current remains fail-closed.
          - No failed run is an accepted P4-4 live cycle.
          EOF
