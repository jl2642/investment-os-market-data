name: FMDL Daily A-share Production

on:
  schedule:
    - cron: '30 9 * * 1-5'
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Bypass trading-day and same-date no-op controls'
        required: false
        default: false
        type: boolean
      allow_same_date_refresh:
        description: 'Allow refresh when current already has the same as-of date'
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - requirements.txt
      - ingestion/**
      - pipeline/**
      - tests/**
      - config/**
      - schemas/**
      - scripts/**
      - docs/FMDL-1DE_IMPLEMENTATION.md
      - .github/workflows/fmdl-daily-production.yml
  pull_request:
    branches: [main]
    paths:
      - requirements.txt
      - ingestion/**
      - pipeline/**
      - tests/**
      - config/**
      - schemas/**
      - scripts/**
      - docs/FMDL-1DE_IMPLEMENTATION.md
      - .github/workflows/fmdl-daily-production.yml

permissions:
  contents: write

concurrency:
  group: fmdl-daily-production
  cancel-in-progress: false

jobs:
  operate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Validate frozen contracts
        run: python scripts/validate_contracts.py

      - name: Run deterministic tests
        run: pytest -q

      - name: Run operational pipeline
        id: operate
        shell: bash
        run: |
          set +e
          mkdir -p diagnostics
          args=(--trigger "${{ github.event_name }}")
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.force_run }}" == "true" ]]; then
            args+=(--force-run)
          fi
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.allow_same_date_refresh }}" == "true" ]]; then
            args+=(--allow-same-date-refresh)
          fi
          python pipeline/run_daily.py "${args[@]}" 2>&1 | tee diagnostics/FMDL_DAILY_ACTION_LOG.txt
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit $status

      - name: Write workflow summary
        if: always()
        shell: bash
        run: |
          echo '## FMDL Daily A-share Production' >> "$GITHUB_STEP_SUMMARY"
          if [[ -f outputs/status/LAST_RUN.json ]]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat outputs/status/LAST_RUN.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No LAST_RUN status file was generated.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload operating evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fmdl-daily-operating-evidence
          path: |
            diagnostics/
            outputs/status/
            outputs/current/
            outputs/quarantine/
            outputs/archive/
            outputs/candidate/
            datasets/raw/
          if-no-files-found: warn
          retention-days: 14

      - name: Commit production state
        if: always() && github.event_name != 'pull_request'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/current outputs/status outputs/quarantine outputs/archive
          if git diff --cached --quiet; then
            echo "No production-state changes to commit"
          else
            git commit -m "data: FMDL daily production state [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
