name: R6 Production Acceptance

run-name: "R6 install and validate supervised production acceptance"

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "automation/r6_production_acceptance/**"
      - ".github/workflows/r6_production_acceptance.yml"
      - "automation/wp3_2a/tests/test_operating_closure_and_wp3_2b.py"
      - "investment_os_runtime/00_CONTROL/**"
      - "investment_os_runtime/30_STATE_CURRENT/10_REAL_ACCOUNT/**"
      - "investment_os_runtime/30_STATE_CURRENT/20_SIMULATION/**"
      - "investment_os_runtime/30_STATE_CURRENT/40_CANDIDATE/**"
      - "investment_os_runtime/30_STATE_CURRENT/60_DECISIONS/**"
      - "investment_os_runtime/80_PRODUCTION_ACCEPTANCE/**"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

env:
  TRADE_AUTHORITY: NONE

jobs:
  build-validate-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install validation runtime
        run: python -m pip install --retries 5 --timeout 30 pytest

      - name: Snapshot protected economic state
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          paths = [
              "investment_os_runtime/30_STATE_CURRENT/10_REAL_ACCOUNT/REAL_ACCOUNT_POSITIONS_CURRENT.json",
              "investment_os_runtime/30_STATE_CURRENT/20_SIMULATION/SIMULATION_POSITIONS_CURRENT.json",
              "investment_os_runtime/30_STATE_CURRENT/40_CANDIDATE/CANDIDATE_CURRENT.json",
              "investment_os_runtime/30_STATE_CURRENT/60_DECISIONS/DECISION_PROPOSALS_CURRENT.json",
          ]
          payload = {path: hashlib.sha256(Path(path).read_bytes()).hexdigest() for path in paths}
          Path("/tmp/r6_protected_hashes.json").write_text(json.dumps(payload, sort_keys=True), encoding="utf-8")
          PY

      - name: Build R6 production acceptance framework
        env:
          SOURCE_PR: ${{ github.event.pull_request.number || 0 }}
          SOURCE_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python -m py_compile automation/r6_production_acceptance/build_r6_production_acceptance.py
          python automation/r6_production_acceptance/build_r6_production_acceptance.py \
            --repo-root . \
            --source-pr "$SOURCE_PR" \
            --source-branch "$SOURCE_BRANCH" \
            --source-head-sha "$SOURCE_HEAD_SHA"

      - name: Publish R6 candidate materialization
        if: github.actor != 'github-actions[bot]'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "R6 products already materialized."
          else
            git commit -m "R6 materialize production acceptance start"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Validate R6 framework and zero mutation
        run: |
          python -m py_compile automation/r6_production_acceptance/validate_r6_production_acceptance.py
          python automation/r6_production_acceptance/validate_r6_production_acceptance.py --repo-root .
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          before = json.loads(Path("/tmp/r6_protected_hashes.json").read_text(encoding="utf-8"))
          after = {path: hashlib.sha256(Path(path).read_bytes()).hexdigest() for path in before}
          assert before == after, sorted(path for path in before if before[path] != after[path])
          print({"protected_state": "UNCHANGED", "mutations": 0, "orders": 0})
          PY

      - name: Validate global forward lineage
        run: python -m pytest -q automation/wp3_2a/tests/test_operating_closure_and_wp3_2b.py

      - name: Enforce exact R6-start scope
        run: |
          git fetch origin main
          git add -A
          python - <<'PY'
          import subprocess
          changed = set(subprocess.check_output(["git", "diff", "--name-only", "--cached"], text=True).splitlines())
          changed |= set(subprocess.check_output(["git", "diff", "--name-only", "origin/main...HEAD"], text=True).splitlines())
          exact = {
              ".github/workflows/r6_production_acceptance.yml",
              "automation/r6_production_acceptance/R6_SCOPE_NOTE.md",
              "automation/r6_production_acceptance/build_r6_production_acceptance.py",
              "automation/r6_production_acceptance/validate_r6_production_acceptance.py",
              "automation/wp3_2a/tests/test_operating_closure_and_wp3_2b.py",
              "investment_os_runtime/00_CONTROL/AUTHORITATIVE_ASSET_REGISTRY.json",
              "investment_os_runtime/00_CONTROL/CAPABILITY_REALITY_MATRIX_CURRENT.md",
              "investment_os_runtime/00_CONTROL/EXECUTION_REGISTER_CURRENT.json",
              "investment_os_runtime/00_CONTROL/R5_ATTRIBUTION_AND_CALIBRATION_ACCEPTANCE_RECORD.json",
              "investment_os_runtime/00_CONTROL/R5_ATTRIBUTION_CONTRACT_CURRENT.json",
              "investment_os_runtime/00_CONTROL/R6_OPERATING_ACTIVATION_GATE_CURRENT.json",
              "investment_os_runtime/00_CONTROL/R6_PRODUCTION_ACCEPTANCE_CONTRACT_CURRENT.json",
              "investment_os_runtime/00_CONTROL/R6_PRODUCTION_ACCEPTANCE_RECORD_CURRENT.json",
              "investment_os_runtime/00_CONTROL/R6_STATUS_CURRENT.md",
              "investment_os_runtime/00_CONTROL/R6_USER_SYSTEM_RESPONSIBILITY_MATRIX_CURRENT.md",
              "investment_os_runtime/00_CONTROL/USER_OPERATING_GUIDE_CURRENT.md",
              "investment_os_runtime/00_CONTROL/WORK_PACKAGE_MASTER_PLAN_CURRENT.md",
              "investment_os_runtime/80_PRODUCTION_ACCEPTANCE/R6_OBSERVATION_LEDGER_CURRENT.json",
              "investment_os_runtime/80_PRODUCTION_ACCEPTANCE/R6_PRODUCTION_RUNBOOK_CURRENT.md",
          }
          forbidden = sorted(changed - exact)
          if forbidden:
              raise SystemExit("R6_START_SCOPE_VIOLATION:" + ",".join(forbidden))
          protected = {
              "investment_os_runtime/30_STATE_CURRENT/10_REAL_ACCOUNT/REAL_ACCOUNT_POSITIONS_CURRENT.json",
              "investment_os_runtime/30_STATE_CURRENT/20_SIMULATION/SIMULATION_POSITIONS_CURRENT.json",
              "investment_os_runtime/30_STATE_CURRENT/40_CANDIDATE/CANDIDATE_CURRENT.json",
              "investment_os_runtime/30_STATE_CURRENT/60_DECISIONS/DECISION_PROPOSALS_CURRENT.json",
          }
          leaked = sorted(changed & protected)
          if leaked:
              raise SystemExit("R6_PROTECTED_STATE_MUTATION:" + ",".join(leaked))
          print({"changed_paths": len(changed), "scope": "R6_PRODUCTION_ACCEPTANCE_START_ONLY"})
          PY

      - name: Record R6 summary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## R6 Production Acceptance Start
          - R5 merge reconciliation: PR #159 / 3cb173851eac4388f24785cd7a43cd557c58a3bc
          - Acceptance mode: supervised production acceptance
          - Full-month window: 2026-08-01 through 2026-08-31
          - Checkpoints installed: 10; preflight passed: 1
          - User/system responsibility matrix: installed
          - Recovery and rerun runbook: installed
          - Operating activation: false
          - Schedule activation: 0
          - Economic/Candidate/rule mutations: 0
          - Orders: 0; trade_authority: NONE
          EOF
