name: P4-3 Unified Decision Recommendation

on:
  pull_request:
    branches: [main]
    paths:
      - "automation/recommendations/**"
      - ".github/workflows/p4-3-unified-recommendation.yml"
  push:
    branches: [main]
    paths:
      - "automation/recommendations/**"
      - ".github/workflows/p4-3-unified-recommendation.yml"
  schedule:
    - cron: "15 1 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: p4-3-unified-recommendation-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TRADE_AUTHORITY: NONE
  P43_CONTRACT_REF: agent/strategy-kernel-p4-3-unified-recommendation-contract-20260828
  P43_CONTRACT_HEAD: 20a8605439258c7f7b6e8b2b12edd53ef240fcfd
  FUNNEL_RUNTIME: .p4_3_runtime/OPPORTUNITY_FUNNEL_CURRENT.json
  D2_RUNTIME: .p4_3_runtime/RESEARCH_QUEUE_D2_CURRENT.json
  COMPARISON_RUNTIME: .p4_3_runtime/PHASE2C_CURRENT_SHADOW_COMPARISON_PACK.json
  PRIOR_RECOMMENDATION_RUNTIME: .p4_3_runtime/RECOMMENDATION_PRIOR.json
  P4_3_OUTPUT: .p4_3_output

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Fetch governed P4-3 inputs
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin             refs/heads/operating-current:refs/remotes/origin/operating-current             refs/heads/automation/research-queue-d2-current:refs/remotes/origin/automation/research-queue-d2-current             "refs/heads/$P43_CONTRACT_REF:refs/remotes/origin/p4-3-contract"             --force --no-tags

          CONTRACT_ACTUAL="$(git rev-parse refs/remotes/origin/p4-3-contract)"
          if [[ "$CONTRACT_ACTUAL" != "$P43_CONTRACT_HEAD" ]]; then
            echo "P43_CONTRACT_HEAD_DRIFT:$CONTRACT_ACTUAL:$P43_CONTRACT_HEAD"
            exit 1
          fi

          mkdir -p .p4_3_runtime
          git show origin/operating-current:operating_current/opportunity_funnel/OPPORTUNITY_FUNNEL_CURRENT.json > "$FUNNEL_RUNTIME"
          git show origin/automation/research-queue-d2-current:investment_os_runtime/30_STATE_CURRENT/30_RESEARCH/RESEARCH_QUEUE_D2_CURRENT.json > "$D2_RUNTIME"
          git show refs/remotes/origin/p4-3-contract:strategy_kernel_v2/generated/PHASE2C_CURRENT_SHADOW_COMPARISON_PACK.json > "$COMPARISON_RUNTIME"
          if git cat-file -e origin/operating-current:operating_current/recommendations/RECOMMENDATION_CURRENT.json 2>/dev/null; then
            git show origin/operating-current:operating_current/recommendations/RECOMMENDATION_CURRENT.json > "$PRIOR_RECOMMENDATION_RUNTIME"
          fi

          echo "D2_SOURCE_COMMIT=$(git rev-parse refs/remotes/origin/automation/research-queue-d2-current)" >> "$GITHUB_ENV"

      - name: Compile P4-3 implementation
        run: |
          python -m py_compile             automation/recommendations/build_recommendations.py             automation/recommendations/publish_recommendations.py

      - name: Deterministic recommendation tests
        run: python -m unittest automation.recommendations.tests.test_build_recommendations -v

      - name: Build current recommendation surface
        shell: bash
        run: |
          set -Eeuo pipefail
          PRIOR_ARGS=()
          if [[ -f "$PRIOR_RECOMMENDATION_RUNTIME" ]]; then
            PRIOR_ARGS=(--prior-current "$PRIOR_RECOMMENDATION_RUNTIME")
          fi
          python automation/recommendations/build_recommendations.py             --funnel-current "$FUNNEL_RUNTIME"             --d2-current "$D2_RUNTIME"             --comparison-context "$COMPARISON_RUNTIME"             --d2-source-commit "$D2_SOURCE_COMMIT"             --comparison-context-source-id "$P43_CONTRACT_HEAD"             "${PRIOR_ARGS[@]}"             --output-dir "$P4_3_OUTPUT"

      - name: Validate current recommendation payload
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root=Path(".p4_3_output")
          current=json.loads((root/"RECOMMENDATION_CURRENT.json").read_text(encoding="utf-8"))
          explain=json.loads((root/"RECOMMENDATION_EXPLAIN_CURRENT.json").read_text(encoding="utf-8"))
          receipt=json.loads((root/"cycle_receipt.json").read_text(encoding="utf-8"))

          assert current["recommendation_fingerprint"] == explain["recommendation_fingerprint"]
          assert current["recommendation_fingerprint"] == receipt["recommendation_fingerprint"]
          assert current["controls"] == {
              "candidate_membership_mutations": 0,
              "new_scalar_recommendation_score": 0,
              "orders": 0,
              "real_account_mutations": 0,
              "simulation_mutations": 0,
              "target_portfolio_writebacks": 0,
              "trade_authority": "NONE",
              "user_decisions_generated": 0,
          }
          assert {x["market"] for x in current["market_coverage"]} == {
              "A_SHARE","H_SHARE","US_SHARE"
          }
          assert all(row["orders"] == 0 and row["trade_authority"] == "NONE" for row in current["records"])
          assert all(
              not (
                  row["research_status"]["d2_status"] == "D2_RESEARCH_HOLD_EVIDENCE_GAP"
                  and row["recommendation_state"] in {"BUY_NOW","BUY_ON_PRICE","ADD"}
              )
              for row in current["records"]
          )
          assert all(
              row["recommendation_state"] not in {"ADD","HOLD","TRIM_REVIEW","EXIT_REVIEW"}
              or row["subject_type"] == "EXISTING_POSITION_VERIFIED"
              for row in current["records"]
          )
          print({
              "status": current["overall_status"],
              "fingerprint": current["recommendation_fingerprint"],
              "cycle_action": current["cycle_action"],
              "state_counts": current["summary"]["state_counts"],
              "ready_for_user_decision_count": current["summary"]["ready_for_user_decision_count"],
              "orders": 0,
              "trade_authority": "NONE",
          })
          PY

      - name: Enforce main-based zero-mutation scope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin main --no-tags
          changed="$(git diff --name-only origin/main...HEAD)"
          echo "$changed"
          if echo "$changed" | grep -Eq '^investment_os_runtime/30_STATE_CURRENT/(10_REAL_ACCOUNT|20_SIMULATION|40_CANDIDATE|50_DECISION_INTERFACE|60_DECISIONS)/'; then
            echo "P43_PROTECTED_STATE_MUTATION"
            exit 1
          fi
          if echo "$changed" | grep -Eq '^strategy_kernel_v2/'; then
            echo "P43_STACKED_GOVERNANCE_CHAIN_MUST_NOT_ENTER_MAIN_OPERATIONAL_PR"
            exit 1
          fi
          if echo "$changed" | grep -Eq '^automation/(opportunity_funnel|research_queue_d2)/'; then
            echo "P43_UPSTREAM_COMPONENT_REWRITE_NOT_AUTHORIZED"
            exit 1
          fi

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: p4-3-recommendation-${{ github.run_id }}-a${{ github.run_attempt }}
          path: |
            .p4_3_output/
            .p4_3_runtime/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  operate:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Fetch latest governed P4-3 inputs
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin             refs/heads/operating-current:refs/remotes/origin/operating-current             refs/heads/automation/research-queue-d2-current:refs/remotes/origin/automation/research-queue-d2-current             "refs/heads/$P43_CONTRACT_REF:refs/remotes/origin/p4-3-contract"             --force --no-tags

          CONTRACT_ACTUAL="$(git rev-parse refs/remotes/origin/p4-3-contract)"
          if [[ "$CONTRACT_ACTUAL" != "$P43_CONTRACT_HEAD" ]]; then
            echo "P43_CONTRACT_HEAD_DRIFT:$CONTRACT_ACTUAL:$P43_CONTRACT_HEAD"
            exit 1
          fi

          mkdir -p .p4_3_runtime
          git show origin/operating-current:operating_current/opportunity_funnel/OPPORTUNITY_FUNNEL_CURRENT.json > "$FUNNEL_RUNTIME"
          git show origin/automation/research-queue-d2-current:investment_os_runtime/30_STATE_CURRENT/30_RESEARCH/RESEARCH_QUEUE_D2_CURRENT.json > "$D2_RUNTIME"
          git show refs/remotes/origin/p4-3-contract:strategy_kernel_v2/generated/PHASE2C_CURRENT_SHADOW_COMPARISON_PACK.json > "$COMPARISON_RUNTIME"
          if git cat-file -e origin/operating-current:operating_current/recommendations/RECOMMENDATION_CURRENT.json 2>/dev/null; then
            git show origin/operating-current:operating_current/recommendations/RECOMMENDATION_CURRENT.json > "$PRIOR_RECOMMENDATION_RUNTIME"
          fi

          echo "D2_SOURCE_COMMIT=$(git rev-parse refs/remotes/origin/automation/research-queue-d2-current)" >> "$GITHUB_ENV"

      - name: Build live Recommendation Current
        shell: bash
        run: |
          set -Eeuo pipefail
          PRIOR_ARGS=()
          if [[ -f "$PRIOR_RECOMMENDATION_RUNTIME" ]]; then
            PRIOR_ARGS=(--prior-current "$PRIOR_RECOMMENDATION_RUNTIME")
          fi
          python automation/recommendations/build_recommendations.py             --funnel-current "$FUNNEL_RUNTIME"             --d2-current "$D2_RUNTIME"             --comparison-context "$COMPARISON_RUNTIME"             --d2-source-commit "$D2_SOURCE_COMMIT"             --comparison-context-source-id "$P43_CONTRACT_HEAD"             "${PRIOR_ARGS[@]}"             --output-dir "$P4_3_OUTPUT"

      - name: Publish Recommendation Current atomically
        shell: bash
        run: |
          set -Eeuo pipefail
          MAIN_HEAD="$(git rev-parse HEAD)"
          python -m automation.recommendations.publish_recommendations             --current "$P4_3_OUTPUT/RECOMMENDATION_CURRENT.json"             --explain "$P4_3_OUTPUT/RECOMMENDATION_EXPLAIN_CURRENT.json"             --cycle-receipt "$P4_3_OUTPUT/cycle_receipt.json"             --source-workflow "P4-3 Unified Decision Recommendation"             --source-run-id "${{ github.run_id }}"             --source-run-attempt "${{ github.run_attempt }}"             --source-branch main             --source-commit "$MAIN_HEAD"

      - name: Remote readback
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin refs/heads/operating-current:refs/remotes/origin/operating-current --force --no-tags
          python - <<'PY'
          import json, subprocess

          def show(path):
              return json.loads(subprocess.check_output(
                  ["git","show",f"origin/operating-current:{path}"], text=True
              ))

          current=show("operating_current/recommendations/RECOMMENDATION_CURRENT.json")
          explain=show("operating_current/recommendations/RECOMMENDATION_EXPLAIN_CURRENT.json")
          domain=show("operating_current/domains/RECOMMENDATION.json")
          assert current["recommendation_fingerprint"] == explain["recommendation_fingerprint"]
          assert domain["status"] == "PASS"
          assert domain["trade_authority"] == "NONE"
          assert domain["protected_mutations"] == {
              "candidate_membership": 0,
              "real_account": 0,
              "simulation": 0,
          }
          assert current["controls"]["target_portfolio_writebacks"] == 0
          assert current["controls"]["user_decisions_generated"] == 0
          assert current["controls"]["orders"] == 0
          print({
              "readback": "PASS",
              "fingerprint": current["recommendation_fingerprint"],
              "state_counts": current["summary"]["state_counts"],
              "ready_for_user_decision_count": current["summary"]["ready_for_user_decision_count"],
              "orders": 0,
              "trade_authority": "NONE",
          })
          PY

      - name: Record successful P4-3 boundary
        if: success()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## P4-3 Unified Decision Recommendation
          - Recommendation Current publication and remote readback: PASS.
          - D2 completion alone cannot trigger BUY.
          - Stale WP4/R3/WP5 decision labels are context only.
          - No scalar recommendation score or R2 rewrite is used.
          - Candidate / Real / protected Simulation mutations: 0 / 0 / 0.
          - Target portfolio writebacks: 0.
          - User decisions generated: 0.
          - Orders: 0.
          - trade_authority: NONE.
          EOF

      - name: Record failed P4-3 boundary
        if: failure()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## P4-3 Unified Decision Recommendation
          - Publication or remote readback: FAIL.
          - This run is not an accepted Recommendation Current cycle.
          - Existing Current is preserved fail-closed.
          EOF
