name: RETIRED - P4-3 Unified Decision Recommendation
run-name: "RETIRED - P4-3 Unified Decision Recommendation"

# S2 retirement: historical implementation remains in Git history.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/p4-3-unified-recommendation.yml"

permissions:
  contents: read

env:
  TRADE_AUTHORITY: NONE

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Explain S2 replacement
        run: |
          echo "S2 replaces orphan boolean gates and frozen Phase2C comparison with underwriting-driven live capital comparison."
          echo "Primary investment production is .github/workflows/s2-investment-pipeline.yml."
          echo "Historical P4 outputs remain evidence only and are not current S2 investment authority."
          echo "orders=0"
          echo "trade_authority=NONE"
