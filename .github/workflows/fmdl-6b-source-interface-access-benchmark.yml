name: INVOS-MOD-001 isolated data access probe 20261126
on:
  push:
    branches: [sandbox/invos-mod-p2-20261126]
    paths: ['.github/workflows/fmdl-6b-source-interface-access-benchmark.yml']
permissions:
  contents: read
concurrency:
  group: invos-mod-p2-probe
  cancel-in-progress: false
jobs:
  public-read-only-probe:
    if: github.ref == 'refs/heads/sandbox/invos-mod-p2-20261126'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Authorized bounded Hithink read-only test
        env:
          HITHINK_FINANCE_API_KEY: ${{ secrets.HITHINK_FINANCE_API_KEY }}
        run: |
          timeout 360 python3 -u - <<'PY'
          import os,json,datetime as dt,urllib.request,urllib.parse,urllib.error,time,hashlib,ssl,sys
          from zoneinfo import ZoneInfo
          from pathlib import Path
          def emit(**r):print(json.dumps(r,ensure_ascii=False),flush=True)
          key=os.environ.get("HITHINK_FINANCE_API_KEY","")
          if not key:
              emit(test="AUTH",status="SECRET_NOT_AVAILABLE");sys.exit(2)
          emit(test="AUTH",status="SECRET_PRESENT")
          # Authentication is confined to the exact HTTPS origin. No redirect may forward credentials.
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl):return None
          opener=urllib.request.build_opener(NoRedirect())
          origin="https://fuyao.aicubes.cn"; zone=ZoneInfo("Asia/Shanghai")
          def ms(y,m,d):return int(dt.datetime(y,m,d,tzinfo=zone).timestamp()*1000)
          def date(v):
              try:return dt.datetime.fromtimestamp(int(v)/1000,zone).date().isoformat()
              except:return None
          def api(label,path,params={}):
              t=time.monotonic()
              try:
                  url=origin+path+("?"+urllib.parse.urlencode(params) if params else "")
                  req=urllib.request.Request(url,headers={"X-api-key":key,"Accept":"application/json","User-Agent":"INVOS-MOD-001-bounded-test/1.0"})
                  with opener.open(req,timeout=25) as r:
                      raw=r.read(4_000_001);http=r.status
                  if len(raw)>4_000_000:raise ValueError("cap")
                  j=json.loads(raw);code=j.get("code");d=j.get("data")
                  emit(test="API",label=label,http=http,code=code if isinstance(code,int) else None,seconds=round(time.monotonic()-t,3),response_bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest(),data_type=type(d).__name__)
                  if code!=0 or not isinstance(d,dict):return None
                  return d
              except urllib.error.HTTPError as e:emit(test="API",label=label,http=e.code,status="HTTP_ERROR");return None
              except Exception as e:emit(test="API",label=label,error_type=type(e).__name__);return None
          def rows(d):return d.get("item",[]) if isinstance(d,dict) and isinstance(d.get("item"),list) else []
          def summary(label,d,expected):
              groups=rows(d);result=[]
              for g in groups:
                  if not isinstance(g,dict) or g.get("thscode") not in expected:continue
                  v=g.get("item",[])
                  if not isinstance(v,list):continue
                  vv=[x for x in v if isinstance(x,dict)]
                  result.append({"symbol":g["thscode"],"rows":len(vv),"fields":sorted(set().union(*(set(x) for x in vv))) if vv else [],"dates":sorted(set(filter(None,(date(x.get("date_ms") or x.get("period_end_ms")) for x in vv)))),"disclosure_dates":sorted(set(filter(None,(date(x.get("report_date_ms")) for x in vv)))),"null_fields":sorted({k for x in vv for k,val in x.items() if val is None})})
              emit(test="GROUPS",label=label,groups=result,missing=sorted(set(expected)-{x["symbol"] for x in result}))
          syms=["605090.SH","600519.SH","300750.SZ","920001.BJ"]
          p={"thscodes":",".join(syms),"interval":"1d","start":ms(2026,11,18),"end":ms(2026,11,25)-1,"adjust":"none"}
          d=api("historical-batch","/api/a-share/prices/historical-batch",p)
          if d is None:
              emit(test="AUTH",status="FIRST_READ_UNVERIFIED_STOP");sys.exit(3)
          summary("historical-batch",d,syms)
          # Four public-company financial samples. No trading, no billing calls.
          for name in ("income-statements","balance-sheets","cash-flow-statements"):
              d=api(name,"/api/a-share/financials/"+name+"-batch",{"thscodes":",".join(syms),"period":"quarterly","limit":4})
              summary(name,d,syms)
          d=api("valuations","/api/a-share/valuations/snapshot",{"thscodes":",".join(syms)})
          r=[x for x in rows(d) if isinstance(x,dict) and x.get("thscode") in syms]
          emit(test="VALUATION",rows=len(r),timestamp_date=date(d.get("timestamp")) if d else None,numeric={f:sum(isinstance(x.get(f),(int,float)) for x in r) for f in ("pe_ttm","pe_mrq","pb_mrq","ps_ttm","pcf_ttm")},symbols=[x["thscode"] for x in r])
          # Only incremental dump and adjustment dump are downloaded; full history ticket availability only.
          tmp=Path(os.environ["RUNNER_TEMP"])/"invos_mod_ephemeral";tmp.mkdir(exist_ok=True)
          for label,cap in (("daily-k-10d",64*1024*1024),("adjustment-factors",24*1024*1024),("daily-k",0)):
              d=api(label,"/api/dump/market-dumps/"+label+"/download-url")
              url=d.get("presigned_url") if d else None
              if not isinstance(url,str) or urllib.parse.urlsplit(url).scheme!="https":
                  emit(test="DUMP",label=label,status="NO_VALID_TICKET");continue
              emit(test="DUMP",label=label,status="TICKET_AVAILABLE")
              if not cap:continue
              # Presigned download URL is never printed. No API key in object-store request.
              dest=tmp/(label+".parquet");t=time.monotonic()
              try:
                  h=hashlib.sha256();n=0
                  with urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"INVOS-MOD-001-bounded-test/1.0"}),timeout=45) as r, dest.open("wb") as f:
                      while True:
                          chunk=r.read(1024*1024)
                          if not chunk:break
                          n+=len(chunk)
                          if n>cap:raise ValueError("cap")
                          h.update(chunk);f.write(chunk)
                  with dest.open("rb") as f:
                      first=f.read(4);f.seek(-4,2);last=f.read(4)
                  ok=first==last==b"PAR1"
                  emit(test="DUMP",label=label,status="PARQUET_MAGIC_OK" if ok else "NOT_PARQUET",bytes=n,sha256=h.hexdigest(),seconds=round(time.monotonic()-t,3))
                  if not ok:dest.unlink(missing_ok=True)
              except Exception as e:
                  dest.unlink(missing_ok=True);emit(test="DUMP",label=label,status="DOWNLOAD_FAILED",error_type=type(e).__name__)
          emit(test="END_AUTH",orders=0,production_write=False,trade_authority="NONE")
          
          PY
      - name: Inspect downloaded parquet without credentials
        run: |
          python3 -m pip install --only-binary=:all: --disable-pip-version-check --retries 0 --timeout 15 duckdb
          timeout 90 python3 -u - <<'PY'
          import os,duckdb,json,csv,hashlib,urllib.request,io
          from pathlib import Path
          def emit(**r):print(json.dumps(r,default=str),flush=True)
          p=Path(os.environ["RUNNER_TEMP"])/"invos_mod_ephemeral"
          c=duckdb.connect(":memory:")
          for label in ("daily-k-10d","adjustment-factors"):
              f=p/(label+".parquet")
              if not f.exists():emit(test="PARQUET",label=label,status="NO_FILE");continue
              try:
                  c.execute("CREATE OR REPLACE VIEW src AS SELECT * FROM read_parquet('"+str(f).replace("'","''")+"')")
                  cols=[x[0] for x in c.execute("DESCRIBE src").fetchall()]
                  if label=="daily-k-10d":
                      out=c.execute("SELECT count(*), count(DISTINCT thscode), count(DISTINCT date_ms), min(date_ms), max(date_ms), count(*)-count(DISTINCT (thscode,date_ms)), count(*) FILTER (WHERE close_price<=0 OR low_price>least(open_price,close_price) OR high_price<greatest(open_price,close_price) OR volume<0), count(*) FILTER (WHERE volume IS NULL) FROM src").fetchone()
                      emit(test="PARQUET",label=label,fields=cols,rows=out[0],symbols=out[1],dates=out[2],min_ms=out[3],max_ms=out[4],duplicate=out[5],invalid=out[6],null_volume=out[7])
                      b=urllib.request.urlopen("https://raw.githubusercontent.com/jl2642/investment-os-market-data/59c71bd5097af14a1785bc7e1625038bf9cc6cb4/outputs/current/DAILY_MARKET_SNAPSHOT.csv",timeout=25).read(4000000)
                      if hashlib.sha256(b).hexdigest()!="5876ebcdd8a99c411a4552c6e2178bde7d52b8f89844ac6a11f62fb87179e988":raise ValueError("BASELINE_HASH_MISMATCH")
                      base={r["symbol"]:r for r in csv.DictReader(io.StringIO(b.decode("utf-8-sig")))}
                      data=c.execute("SELECT thscode,open_price,high_price,low_price,close_price,volume,turnover FROM src WHERE CAST(to_timestamp(date_ms/1000) AT TIME ZONE 'Asia/Shanghai' AS DATE)=DATE '2026-11-24'").fetchall()
                      comp=[0]*6;bad=[0]*6;covered=set();fields=["open","high","low","close","volume_shares","turnover_cny"]
                      for row in data:
                          s=row[0];covered.add(s);r=base.get(s)
                          if not r or r["data_status"]!="TRADED":continue
                          for i,(x,k) in enumerate(zip(row[1:],fields)):
                              try:y=float(r[k]);x=float(x)
                              except:continue
                              comp[i]+=1;tol=.01000001 if i<4 else (0.000001 if i==4 else max(1,abs(y)*.0001))
                              bad[i]+=int(abs(x-y)>tol)
                      missing=set(base)-covered
                      emit(test="BASELINE_COMPARE",source_rows=len(data),baseline=len(base),matched=len(covered&set(base)),extra=len(covered-set(base)),missing=len(missing),missing_boards={k:sum(s.endswith("."+k) for s in missing) for k in ("SH","SZ","BJ")},compared=dict(zip(fields,comp)),mismatch=dict(zip(fields,bad)))
                  else:
                      o=c.execute("SELECT count(*),count(DISTINCT thscode),min(ex_date_ms),max(ex_date_ms),count(*)-count(DISTINCT (thscode,ex_date_ms)) FROM src").fetchone()
                      emit(test="PARQUET",label=label,fields=cols,rows=o[0],symbols=o[1],min_ms=o[2],max_ms=o[3],duplicate_symbol_date=o[4])
              except Exception as e:emit(test="PARQUET",label=label,status="VALIDATION_ERROR",error_type=type(e).__name__)
          
          PY
      - name: Remove ephemeral data
        if: always()
        run: rm -rf "$RUNNER_TEMP/invos_mod_ephemeral"
