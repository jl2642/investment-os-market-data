name: INVOS-MOD-001 isolated data access probe 20261126
on:
  push:
    branches: [sandbox/invos-mod-p2-20261126]
    paths: ['.github/workflows/fmdl-6b-source-interface-access-benchmark.yml']
permissions:
  contents: read
concurrency:
  group: invos-mod-p2-probe
  cancel-in-progress: false
jobs:
  public-read-only-probe:
    if: github.ref == 'refs/heads/sandbox/invos-mod-p2-20261126'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Fetch exact reviewed adapter and formal contract without credentials
        run: |
          python3 -u - <<'PY'
          import os,hashlib,urllib.request
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"invos_p5";p.mkdir(exist_ok=True)
          def fetch(commit,name,sha,dest):
              with urllib.request.urlopen("https://raw.githubusercontent.com/jl2642/investment-os-market-data/"+commit+"/"+name,timeout=25) as r:b=r.read(2000001)
              assert hashlib.sha1(("blob "+str(len(b))+"\0").encode()+b).hexdigest()==sha
              f=p/dest;f.parent.mkdir(parents=True,exist_ok=True);f.write_bytes(b)
          fetch("7effd2768d12cf3fac7da63989de2334aa7db236","ingestion/hithink_daily_shadow.py","33d345ab1d62e2250dc6087f5ce3b9f7d46b4a39","adapter.py")
          for name,sha in {"pipeline/common.py":"fe995d3f45dff0fcf4b558fe61371b3bd0714236","pipeline/quality.py":"ae8ce39b049d326a54100675cdd3f2d75c5b2a9d","schemas/daily_market_snapshot.schema.json":"6ba47c24f3771c7e67b18b953edf84c7fa738dd1","schemas/a_share_universe.schema.json":"3408affa409de8a30f3bf817637e5447c1e9466c","config/quality_gates.json":"d69b46da46cf9b3b32bd5e216ec0fbff2597546c"}.items():fetch("9ca05b86ee9ad26e16215c0ab305f7c7ab593c55",name,sha,name)
          print("PINNED_ADAPTER_AND_FORMAL_CONTRACTS_VERIFIED",flush=True)
          
          PY
      - name: Actual bounded adapter fetch
        env:
          HITHINK_FINANCE_API_KEY: ${{ secrets.HITHINK_FINANCE_API_KEY }}
        run: |
          timeout 100 python3 -u - <<'PY'
          import os,sys,json,time
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"invos_p5";sys.path.insert(0,str(p))
          from adapter import read_incremental_dump,SourceUnavailable
          t=time.monotonic()
          try:
              r=read_incremental_dump(os.environ.get("HITHINK_FINANCE_API_KEY",""),p/"daily.parquet")
              print(json.dumps({"test":"LIVE_DOWNLOAD",**r,"seconds":round(time.monotonic()-t,3)}),flush=True)
          except SourceUnavailable as e:print(json.dumps({"test":"LIVE_DOWNLOAD","status":"FAIL","reason":str(e)}),flush=True);raise SystemExit(2)
          
          PY
      - name: Fault tests and actual formal snapshot quality evaluation
        run: |
          python3 -m pip install --only-binary=:all: --disable-pip-version-check --retries 0 --timeout 15 duckdb pandas jsonschema
          timeout 150 python3 -u - <<'PY'
          import os,sys,json,urllib.request,urllib.error,hashlib,io,datetime as dt,time
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"invos_p5";sys.path.insert(0,str(p))
          import duckdb,pandas as pd
          from adapter import *
          from pipeline.common import stable_row_hash,clean_scalar
          from pipeline.quality import evaluate_snapshot,evaluate_universe
          def emit(**r):print(json.dumps(r,default=str),flush=True)
          D="2026-11-24";s="600519.SH";s2="600185.SH";s3="300750.SZ"
          def bar(symbol=s,day=D,**kwargs):
              return dict(thscode=symbol,date_ms=int(dt.datetime.fromisoformat(day).replace(tzinfo=ZONE).timestamp()*1000),adjusted="none",currency="CNY",interval="1d",open_price=10,high_price=11,low_price=9,close_price=10,volume=1000,turnover=10000,**kwargs)
          def meta(symbol):
              return dict(symbol=symbol,as_of_date=D,prev_close=10,pct_change=0,data_status="TRADED",open=10,high=11,low=9,close=10,volume_shares=1000,turnover_cny=10000,record_quality="VALID",source_primary="legacy")
          q,c=normalize_rows([bar(),bar(),bar(s2,"2026-11-25"),dict(bar(s3),high_price=1)],{D},{s,s2,s3})
          assert len(q)==0 and c["duplicate_key"]==1 and c["outside_session"]==1 and c["invalid_bar"]==1
          calls=[]
          def fb(ids):calls.append(ids);return {s:meta(s),s3:{**meta(s3),"as_of_date":"2026-11-23"}}
          a,b=resolve_day(q,D,{x:meta(x) for x in (s,s2,s3)},fb,{s2})
          assert len(calls)==1 and b=={"needs_legacy":2,"confirmed_suspension":1,"legacy":1,"unresolved":1} and a[s2]["close"] is None and s3 not in a
          q,_=normalize_rows([bar()],{D},{s});a,b=resolve_day(q,D,{s:meta(s)},lambda ids: (_ for _ in ()).throw(AssertionError("unnecessary fallback")))
          assert b=={"primary":1} and a[s]["source_primary"].startswith("hithink")
          assert raw_gap_plan(q,[D],[s,s2],{(s2,D)})=={"raw_ready":1,"confirmed_no_trade":1,"status_conflict":0,"missing":0,"history_append_authorized":False,"adjustment_mode":"none"}
          for kind in ("timeout","429","403"):
              tries=[]
              def fail(req,timeout):
                  tries.append(1)
                  if kind=="timeout":raise TimeoutError()
                  raise urllib.error.HTTPError(req.full_url,int(kind),"",{},None)
              try:read_incremental_dump("synthetic-test-only",p/"fault.parquet",sleep=lambda _:None,opener=fail)
              except SourceUnavailable:pass
              else:raise AssertionError("failure not raised")
              assert len(tries)==(1 if kind=="403" else 2)
          emit(test="FAULT_TESTS",status="PASS",cases=["duplicate","wrong_date","invalid_ohlc","partial_fallback","stale_fallback_rejected","confirmed_suspension","no_fallback_for_valid_row","raw_gap_no_qfq","timeout_retry","429_retry","403_no_retry"])
          # Frozen accepted baseline. This is a shadow integration test, not a live fallback fetch.
          baseurl="https://raw.githubusercontent.com/jl2642/investment-os-market-data/59c71bd5097af14a1785bc7e1625038bf9cc6cb4/outputs/current/"
          def frozen(name,sha):
              with urllib.request.urlopen(baseurl+name,timeout=25) as r:b=r.read(4000000)
              assert hashlib.sha256(b).hexdigest()==sha
              return pd.read_csv(io.BytesIO(b),dtype={"symbol":str,"source_symbol":str})
          snap=frozen("DAILY_MARKET_SNAPSHOT.csv","5876ebcdd8a99c411a4552c6e2178bde7d52b8f89844ac6a11f62fb87179e988");univ=frozen("A_SHARE_UNIVERSE.csv","ab6c9ea596da0c29ec87dc8c7c54bc5a41db340783fd1cec58c9ed551488d054")
          def records(frame):return [{k:clean_scalar(v) for k,v in r.items()} for r in frame.to_dict("records")]
          md={r["symbol"]:r for r in records(snap)}
          conn=duckdb.connect(":memory:")
          f=str(p/"daily.parquet").replace("'","''")
          res=conn.execute("SELECT * FROM read_parquet('"+f+"')");cols=[x[0] for x in res.description];rows=[dict(zip(cols,r)) for r in res.fetchall()]
          # Calendar frozen from the already confirmed 10-day session range up through comparison date.
          sessions=["2026-11-12","2026-11-13","2026-11-16","2026-11-17","2026-11-18","2026-11-19","2026-11-20","2026-11-23","2026-11-24"]
          t=time.monotonic();q,counts=normalize_rows(rows,sessions,md);susp={"002717.SZ","600185.SH","600567.SH","688121.SH","688496.SH"}
          a,b=resolve_day(q,D,md,lambda ids:{k:md[k] for k in ids},susp)
          for row in a.values():row["row_hash"]=stable_row_hash(row)
          out=pd.DataFrame(list(a.values()),columns=snap.columns)
          # Adjust only shadow universe status for the five independently established frozen-date suspensions.
          u=univ.copy()
          for i,r in u.iterrows():
              if r["symbol"] in susp:
                  u.loc[i,"is_suspended"]=True;u.loc[i,"listing_status"]="SUSPENDED";u.loc[i,"record_quality"]="PARTIAL"
                  u.loc[i,"row_hash"]=stable_row_hash({k:clean_scalar(v) for k,v in u.loc[i].to_dict().items()})
          assert len(out)==len(snap) and set(out.symbol)==set(snap.symbol)
          qa=evaluate_snapshot(out,universe=u,root=p);old=evaluate_snapshot(snap,universe=univ,root=p);uq=evaluate_universe(u,root=p,lkg_frame=univ)
          emit(test="FORMAL_SNAPSHOT_SHADOW",rows=len(out),routes=b,normalization=counts,seconds=round(time.monotonic()-t,3),new_hard_gates=qa.hard_failures,old_hard_gates=old.hard_failures,universe_hard_gates=uq.hard_failures,old_qa=old.qa_status,new_qa=qa.qa_status,old_traded=old.metrics["traded_row_count"],new_traded=qa.metrics["traded_row_count"],scope="actual frozen-day integration, same-session legacy metadata and fallback, no production efficiency or live fallback claim")
          assert not qa.hard_failures and not uq.hard_failures
          emit(test="SHORT_GAP_INVENTORY",**raw_gap_plan(q,sessions,list(md),{(s,D) for s in susp}),scope="raw only; historical qfq continuity and factor screening not executed")
          emit(test="END",production_write=False,orders=0,trade_authority="NONE")
          
          PY
      - name: Remove all transient data
        if: always()
        run: rm -rf "$RUNNER_TEMP/invos_p5"
