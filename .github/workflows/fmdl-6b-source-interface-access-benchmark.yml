name: INVOS-MOD-001 isolated data access probe 20261126
on:
  push:
    branches: [sandbox/invos-mod-p2-20261126]
    paths: ['.github/workflows/fmdl-6b-source-interface-access-benchmark.yml']
permissions:
  contents: read
concurrency:
  group: invos-mod-p2-probe
  cancel-in-progress: false
jobs:
  public-read-only-probe:
    if: github.ref == 'refs/heads/sandbox/invos-mod-p2-20261126'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Bounded P2 remaining sample verification
        env:
          HITHINK_FINANCE_API_KEY: ${{ secrets.HITHINK_FINANCE_API_KEY }}
        run: |
          timeout 180 python3 -u - <<'PY'
          import os,json,datetime as dt,urllib.request,urllib.parse,urllib.error,time,hashlib,ssl,sys
          from zoneinfo import ZoneInfo
          from pathlib import Path
          def emit(**r):print(json.dumps(r,ensure_ascii=False),flush=True)
          key=os.environ.get("HITHINK_FINANCE_API_KEY","")
          if not key:
              emit(test="AUTH",status="SECRET_NOT_AVAILABLE");sys.exit(2)
          emit(test="AUTH",status="SECRET_PRESENT")
          # Authentication is confined to the exact HTTPS origin. No redirect may forward credentials.
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl):return None
          opener=urllib.request.build_opener(NoRedirect())
          origin="https://fuyao.aicubes.cn"; zone=ZoneInfo("Asia/Shanghai")
          def ms(y,m,d):return int(dt.datetime(y,m,d,tzinfo=zone).timestamp()*1000)
          def date(v):
              try:return dt.datetime.fromtimestamp(int(v)/1000,zone).date().isoformat()
              except:return None
          def api(label,path,params={}):
              t=time.monotonic()
              try:
                  url=origin+path+("?"+urllib.parse.urlencode(params) if params else "")
                  req=urllib.request.Request(url,headers={"X-api-key":key,"Accept":"application/json","User-Agent":"INVOS-MOD-001-bounded-test/1.0"})
                  with opener.open(req,timeout=25) as r:
                      raw=r.read(4_000_001);http=r.status
                  if len(raw)>4_000_000:raise ValueError("cap")
                  j=json.loads(raw);code=j.get("code");d=j.get("data")
                  emit(test="API",label=label,http=http,code=code if isinstance(code,int) else None,seconds=round(time.monotonic()-t,3),response_bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest(),data_type=type(d).__name__)
                  if code!=0 or not isinstance(d,dict):return None
                  return d
              except urllib.error.HTTPError as e:emit(test="API",label=label,http=e.code,status="HTTP_ERROR");return None
              except Exception as e:emit(test="API",label=label,error_type=type(e).__name__);return None
          def rows(d):return d.get("item",[]) if isinstance(d,dict) and isinstance(d.get("item"),list) else []
          def summary(label,d,expected):
              groups=rows(d);result=[]
              for g in groups:
                  if not isinstance(g,dict) or g.get("thscode") not in expected:continue
                  v=g.get("item",[])
                  if not isinstance(v,list):continue
                  vv=[x for x in v if isinstance(x,dict)]
                  result.append({"symbol":g["thscode"],"rows":len(vv),"fields":sorted(set().union(*(set(x) for x in vv))) if vv else [],"dates":sorted(set(filter(None,(date(x.get("date_ms") or x.get("period_end_ms")) for x in vv)))),"disclosure_dates":sorted(set(filter(None,(date(x.get("report_date_ms")) for x in vv)))),"null_fields":sorted({k for x in vv for k,val in x.items() if val is None})})
              emit(test="GROUPS",label=label,groups=result,missing=sorted(set(expected)-{x["symbol"] for x in result}))
          
          # Bounded four-symbol 71-session window, not whole-market download.
          syms=["605090.SH","600519.SH","300750.SZ","920001.BJ"]
          for mode in ("none","forward"):
              d=api("gap_sample_"+mode,"/api/a-share/prices/historical-batch",{"thscodes":",".join(syms),"interval":"1d","start":ms(2026,8,8),"end":ms(2026,11,25)-1,"adjust":mode})
              summary("gap_sample_"+mode,d,syms)
              for g in rows(d):
                  if g.get("thscode") not in syms:continue
                  rr=g.get("item",[]);ds=[date(x.get("date_ms")) for x in rr]
                  emit(test="GAP_SAMPLE",symbol=g["thscode"],mode=mode,rows=len(rr),first=min(ds) if ds else None,last=max(ds) if ds else None,duplicates=len(ds)-len(set(ds)),future=sum(x>"2026-11-24" for x in ds if x),invalid=sum(not(0<x["low_price"]<=min(x["open_price"],x["close_price"])<=max(x["open_price"],x["close_price"])<=x["high_price"] and x["volume"]>=0) for x in rr if all(isinstance(x.get(f),(int,float)) for f in ("low_price","open_price","close_price","high_price","volume"))))
          # Actual financial fields, only selected public issuers and report periods. Compare via summary numbers rather than raw data.
          for name,fields in [("income-statements",["operating_income","parent_holder_net_profit","basic_eps"]),("balance-sheets",["assets_total","total_debt","holder_equity_total"]),("cash-flow-statements",["act_cash_flow_net","pay_fixed_assets_etc_cash"])]:
              d=api("numeric_"+name,"/api/a-share/financials/"+name+"-batch",{"thscodes":",".join(syms[:3]),"period":"quarterly","limit":2})
              for g in rows(d):
                  if g.get("thscode") not in syms[:3]:continue
                  for r in g.get("item",[]):
                      # Summaries at report scale (million CNY), not a raw dump.
                      if date(r.get("period_end_ms"))!="2026-09-30":continue
                      emit(test="FINANCIAL_Q3",symbol=g["thscode"],statement=name,period=date(r.get("period_end_ms")),disclosure=date(r.get("report_date_ms")),amount_million_cny={f:round(r[f]/1e6,3) if isinstance(r.get(f),(int,float)) else None for f in fields if f!="basic_eps"},eps=r.get("basic_eps") if "basic_eps" in fields else None)
          # Explicit state conflicts from E12. Date and no synthetic carry forward.
          edge=["002717.SZ","689009.SH","000010.SZ","920067.BJ","688827.SH"]
          d=api("edge_history","/api/a-share/prices/historical-batch",{"thscodes":",".join(edge),"interval":"1d","start":ms(2026,11,18),"end":ms(2026,11,25)-1,"adjust":"none"})
          for g in rows(d):
              if g.get("thscode") not in edge:continue
              rr=g.get("item",[]);emit(test="EDGE",symbol=g["thscode"],dates=[date(r.get("date_ms")) for r in rr],nonzero_volume_dates=[date(r.get("date_ms")) for r in rr if isinstance(r.get("volume"),(int,float)) and r["volume"]>0])
          emit(test="END",orders=0,production_write=False,trade_authority="NONE")
          
          PY
