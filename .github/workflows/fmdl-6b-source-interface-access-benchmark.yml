name: INVOS-MOD-001 isolated data access probe 20261126
on:
  push:
    branches: [sandbox/invos-mod-p2-20261126]
    paths: ['.github/workflows/fmdl-6b-source-interface-access-benchmark.yml']
permissions:
  contents: read
concurrency:
  group: invos-mod-p2-probe
  cancel-in-progress: false
jobs:
  public-read-only-probe:
    if: github.ref == 'refs/heads/sandbox/invos-mod-p2-20261126'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Bounded corporate action and 251 close replay
        env:
          HITHINK_FINANCE_API_KEY: ${{ secrets.HITHINK_FINANCE_API_KEY }}
        run: |
          timeout 150 python3 -u - <<'PY'
          import os,json,datetime as dt,urllib.request,urllib.parse,urllib.error,time,hashlib,ssl,sys
          from zoneinfo import ZoneInfo
          from pathlib import Path
          def emit(**r):print(json.dumps(r,ensure_ascii=False),flush=True)
          key=os.environ.get("HITHINK_FINANCE_API_KEY","")
          if not key:
              emit(test="AUTH",status="SECRET_NOT_AVAILABLE");sys.exit(2)
          emit(test="AUTH",status="SECRET_PRESENT")
          # Authentication is confined to the exact HTTPS origin. No redirect may forward credentials.
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl):return None
          opener=urllib.request.build_opener(NoRedirect())
          origin="https://fuyao.aicubes.cn"; zone=ZoneInfo("Asia/Shanghai")
          def ms(y,m,d):return int(dt.datetime(y,m,d,tzinfo=zone).timestamp()*1000)
          def date(v):
              try:return dt.datetime.fromtimestamp(int(v)/1000,zone).date().isoformat()
              except:return None
          def api(label,path,params={}):
              t=time.monotonic()
              try:
                  url=origin+path+("?"+urllib.parse.urlencode(params) if params else "")
                  req=urllib.request.Request(url,headers={"X-api-key":key,"Accept":"application/json","User-Agent":"INVOS-MOD-001-bounded-test/1.0"})
                  with opener.open(req,timeout=25) as r:
                      raw=r.read(4_000_001);http=r.status
                  if len(raw)>4_000_000:raise ValueError("cap")
                  j=json.loads(raw);code=j.get("code");d=j.get("data")
                  emit(test="API",label=label,http=http,code=code if isinstance(code,int) else None,seconds=round(time.monotonic()-t,3),response_bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest(),data_type=type(d).__name__)
                  if code!=0 or not isinstance(d,dict):return None
                  return d
              except urllib.error.HTTPError as e:emit(test="API",label=label,http=e.code,status="HTTP_ERROR");return None
              except Exception as e:emit(test="API",label=label,error_type=type(e).__name__);return None
          def rows(d):return d.get("item",[]) if isinstance(d,dict) and isinstance(d.get("item"),list) else []
          def summary(label,d,expected):
              groups=rows(d);result=[]
              for g in groups:
                  if not isinstance(g,dict) or g.get("thscode") not in expected:continue
                  v=g.get("item",[])
                  if not isinstance(v,list):continue
                  vv=[x for x in v if isinstance(x,dict)]
                  result.append({"symbol":g["thscode"],"rows":len(vv),"fields":sorted(set().union(*(set(x) for x in vv))) if vv else [],"dates":sorted(set(filter(None,(date(x.get("date_ms") or x.get("period_end_ms")) for x in vv)))),"disclosure_dates":sorted(set(filter(None,(date(x.get("report_date_ms")) for x in vv)))),"null_fields":sorted({k for x in vv for k,val in x.items() if val is None})})
              emit(test="GROUPS",label=label,groups=result,missing=sorted(set(expected)-{x["symbol"] for x in result}))
          
          
          import math,statistics,collections
          D="2026-11-24"
          ss=["605090.SH","600519.SH","300750.SZ","920001.BJ"]
          p={"thscodes":",".join(ss),"interval":"1d","start":ms(2025,11,1),"end":ms(2026,11,25)-1}
          def bars(mode):
              d=api("251_"+mode,"/api/a-share/prices/historical-batch",{**p,"adjust":mode})
              return {g["thscode"]:{date(r["date_ms"]):r for r in g.get("item",[]) if date(r.get("date_ms"))} for g in rows(d) if g.get("thscode") in ss}
          u=bars("none");f=bars("forward")
          for s in ss:
              x=u.get(s,{});y=f.get(s,{});common=sorted(set(x)&set(y))
              event=api("events_"+s,"/api/a-share/corporate-actions/adjustment-factors",{"thscode":s,"from":"2025-11-01","to":D})
              ev=rows(event);by=collections.defaultdict(list);bad=0;unmapped=0
              for z in ev:
                  ed=date(z.get("ex_date_ms"))
                  if not ed or ed>D:bad+=1;continue
                  eff=next((d for d in sorted(x) if d>=ed),None)
                  if eff:by[eff].append(z)
                  else:unmapped+=1
              # Replay documented multiplier on actual raw close and event data, not the installed provider package.
              # No future events are included; multiple same-day events are explicitly flagged.
              calc={};mul=1.;prior=None;skipped=0
              for d in sorted(x):
                  if d in by:
                      for z in by[d]:
                          try:
                              dps=float(z.get("dividend_per_share") or 0);bonus=float(z.get("per_share_bonus") or 0);r=float(z.get("allotment_ratio") or 0);p0=float(z.get("allotment_price") or 0)
                              if prior is None or prior-dps+r*p0<=0:skipped+=1;continue
                              mul*=prior*(1+bonus+r)/(prior-dps+r*p0)
                          except Exception:skipped+=1
                  calc[d]=mul;prior=float(x[d]["close_price"])
              denom=mul;inconsistent=0;maxspread=0.;maxreturn=0.;retbad=0;maxclose=0.;last=None
              for d in common:
                  try:
                      ratios=[float(y[d][k])/float(x[d][k]) for k in ("open_price","high_price","low_price","close_price")]
                      spread=max(ratios)-min(ratios);maxspread=max(spread,max(ratios)-min(ratios));inconsistent+=int(spread>0.0001)
                      c=float(x[d]["close_price"])*calc[d]/denom;v=float(y[d]["close_price"]);maxclose=max(maxclose,abs(c-v))
                      if last:
                          dr=abs(c/last[0]-v/last[1]);maxreturn=max(maxreturn,dr);retbad+=int(dr>0.001)
                      last=(c,v)
                  except Exception:pass
              emit(test="ADJUST_REPLAY",symbol=s,raw_rows=len(x),forward_rows=len(y),matched_days=len(common),first=min(common) if common else None,last=max(common) if common else None,events=len(ev),event_dates=sorted(by),duplicate_effective_dates=sum(len(v)>1 for v in by.values()),future_or_invalid_event_dates=bad,unmapped_events=unmapped,skipped_event_count=skipped,provider_ohlc_ratio_spread_over_1bp=inconsistent,max_ratio_spread=maxspread,max_close_abs_diff_vs_replay=maxclose,max_adj_return_abs_diff=maxreturn,return_diff_over_10bp=retbad,raw_251_ready=len(x)>=251,scope="bounded sample formula replay; event announcements and rights issue completeness not independently verified")
          emit(test="AUTH_END",orders=0,production_write=False,trade_authority="NONE")
          
          PY
      - name: Formal shard volume ratio and overseas sample
        if: always()
        run: |
          python3 -m pip install --only-binary=:all: --disable-pip-version-check --retries 0 --timeout 15 duckdb
          timeout 150 python3 -u - <<'PY'
          import duckdb,urllib.request,urllib.parse,hashlib,os,json,datetime as dt,statistics,collections,math,tempfile
          from zoneinfo import ZoneInfo
          def emit(**x):print(json.dumps(x,default=str),flush=True)
          base="https://raw.githubusercontent.com/jl2642/investment-os-market-data/59c71bd5097af14a1785bc7e1625038bf9cc6cb4/"
          path="datasets/history/repair/FMDL2B4_REBASE_45469058502_A1/shard_00_full_rebase.parquet"
          try:
              with urllib.request.urlopen(base+path,timeout=30) as r:b=r.read(8_000_001)
              if hashlib.sha256(b).hexdigest()!="0e8a3fade9b818e7776607dea389e3d8319563c88c310b545e6c905bdea74f17":raise ValueError("SHARD_HASH_MISMATCH")
              with tempfile.TemporaryDirectory() as tmp:
                  p=tmp+"/sample.parquet";open(p,"wb").write(b);c=duckdb.connect(":memory:")
                  c.execute("CREATE VIEW hist AS SELECT * FROM read_parquet('"+p+"')")
                  fields=[x[0] for x in c.execute("DESCRIBE hist").fetchall()]
                  emit(test="FORMAL_SHARD",rows=c.execute("SELECT count(*) FROM hist").fetchone()[0],fields=fields,sha256=hashlib.sha256(b).hexdigest())
                  ss=[r[0] for r in c.execute("SELECT DISTINCT symbol FROM hist WHERE symbol LIKE '%.BJ' ORDER BY symbol LIMIT 20").fetchall()]
                  end=int(dt.datetime(2026,11,25,tzinfo=ZoneInfo("Asia/Shanghai")).timestamp()*1000)-1
                  if not ss:raise ValueError("NO_BJ_SAMPLES")
                  url="https://free-api.tickflow.org/v1/klines/batch?"+urllib.parse.urlencode({"symbols":",".join(ss),"period":"1d","adjust":"none","count":60,"end_time":end})
                  with urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"INVOS-MOD-001-bounded-test/1.0"}),timeout=25) as r:raw=r.read(2_000_001)
                  j=json.loads(raw).get("data",{});cmp=[];flip=collections.Counter();max_abs=0;max_rel=0;exclusions=collections.Counter()
                  for s in ss:
                      old=c.execute("SELECT CAST(trade_date AS DATE),volume_shares FROM hist WHERE symbol=? AND volume_shares IS NOT NULL ORDER BY trade_date DESC LIMIT 60",[s]).fetchall()
                      a={str(d):float(v) for d,v in old}
                      z=j.get(s,{})
                      ts=z.get("timestamp",[]);vol=z.get("volume",[])
                      n={dt.datetime.fromtimestamp(t/1000,ZoneInfo("Asia/Shanghai")).date().isoformat():float(v)*100 for t,v in zip(ts,vol)}
                      if len(a)!=60 or len(n)!=60 or set(a)!=set(n):exclusions["date_or_length_mismatch"]+=1;continue
                      d=sorted(a);u=[a[i] for i in d];v=[n[i] for i in d]
                      if sum(u)<=0 or sum(v)<=0:exclusions["nonpositive_mean"]+=1;continue
                      x=3*sum(u[-20:])/sum(u);y=3*sum(v[-20:])/sum(v);cmp.append((s,x,y))
                      for lo in (1.05,1.1):flip[str(lo)]+=int((lo<=x<=3)!=(lo<=y<=3))
                      max_abs=max(max_abs,max(abs(aa-bb) for aa,bb in zip(u,v)));max_rel=max(max_rel,max(abs(aa-bb)/max(aa,1) for aa,bb in zip(u,v)))
                  r1=sorted(cmp,key=lambda t:(-t[1],t[0]));r2=sorted(cmp,key=lambda t:(-t[2],t[0]))
                  emit(test="FACTOR_REPLAY",requested=len(ss),returned=len(j),comparable=len(cmp),exclusions=dict(exclusions),max_ratio_delta=max((abs(x-y) for _,x,y in cmp),default=None),volume_gate_flips=dict(flip),sample_rank_changes=sum(a[0]!=b[0] for a,b in zip(r1,r2)),max_volume_shares_delta=max_abs,max_relative_volume_delta=max_rel,sha256=hashlib.sha256(raw).hexdigest(),scope="single immutable shard, volume-ratio only; not full ranking")
          except Exception as e:emit(test="FACTOR_REPLAY_ERROR",error_type=type(e).__name__,error=str(e)[:200])
          # Verify at least 251 close observations for the two prior overseas sample symbols.
          for s,zone in [("00700.HK","Asia/Hong_Kong"),("AAPL.US","America/New_York")]:
              try:
                  tz=ZoneInfo(zone);end=int(dt.datetime(2026,11,25,tzinfo=tz).timestamp()*1000)-1
                  url="https://free-api.tickflow.org/v1/klines/batch?"+urllib.parse.urlencode({"symbols":s,"period":"1d","adjust":"none","count":251,"end_time":end})
                  with urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"INVOS-MOD-001-bounded-test/1.0"}),timeout=25) as r:raw=r.read(2_000_001)
                  x=json.loads(raw).get("data",{}).get(s,{});ds=[dt.datetime.fromtimestamp(t/1000,tz).date().isoformat() for t in x.get("timestamp",[])]
                  emit(test="OVERSEAS_251",symbol=s,rows=len(ds),first=min(ds) if ds else None,last=max(ds) if ds else None,duplicate=len(ds)-len(set(ds)),future=sum(d>"2026-11-24" for d in ds),weekend=sum(dt.date.fromisoformat(d).weekday()>4 for d in ds),sha256=hashlib.sha256(raw).hexdigest(),scope="local timezone and weekend only; not independent full holiday calendar")
              except Exception as e:emit(test="OVERSEAS_251",symbol=s,error_type=type(e).__name__)
          emit(test="END",orders=0,production_write=False,trade_authority="NONE")
          
          PY
