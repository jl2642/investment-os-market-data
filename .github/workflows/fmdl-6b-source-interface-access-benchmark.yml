name: INVOS-MOD-001 isolated data access probe 20261126
on:
  push:
    branches: [sandbox/invos-mod-p2-20261126]
    paths: ['.github/workflows/fmdl-6b-source-interface-access-benchmark.yml']
permissions:
  contents: read
concurrency:
  group: invos-mod-p2-probe
  cancel-in-progress: false
jobs:
  public-read-only-probe:
    if: github.ref == 'refs/heads/sandbox/invos-mod-p2-20261126'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Reacquire only two bounded prior test exports to identify missing IDs and event keys
        env:
          HITHINK_FINANCE_API_KEY: ${{ secrets.HITHINK_FINANCE_API_KEY }}
        run: |
          timeout 100 python3 -u - <<'PY'
          import os,sys,json,time,hashlib,urllib.request,urllib.parse,urllib.error
          from pathlib import Path
          def emit(**x):print(json.dumps(x),flush=True)
          key=os.environ.get("HITHINK_FINANCE_API_KEY","")
          if not key:emit(test="AUTH",status="SECRET_MISSING");sys.exit(2)
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args):return None
          opener=urllib.request.build_opener(NoRedirect())
          p=Path(os.environ["RUNNER_TEMP"])/"invos_mod_p2_e18";p.mkdir(exist_ok=True)
          for name,cap in [("daily-k-10d",16*1024*1024),("adjustment-factors",8*1024*1024)]:
              t=time.monotonic()
              try:
                  with opener.open(urllib.request.Request("https://fuyao.aicubes.cn/api/dump/market-dumps/"+name+"/download-url",headers={"X-api-key":key,"User-Agent":"INVOS-MOD-001-bounded-test/1.0"}),timeout=20) as r:res=json.loads(r.read(65536))
                  code=res.get("code")
                  if code!=0:emit(test="BOUNDED_DUMP",label=name,code=code,status="NO_TICKET");continue
                  url=res.get("data",{}).get("presigned_url","")
                  if urllib.parse.urlsplit(url).scheme!="https":raise ValueError("URL_SCHEME")
                  # No credential follows the object store request; never print the signed URL or raw exception.
                  dest=p/(name+".parquet");h=hashlib.sha256();n=0
                  with urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"INVOS-MOD-001-bounded-test/1.0"}),timeout=30) as r,dest.open("wb") as f:
                      while True:
                          b=r.read(1024*1024)
                          if not b:break
                          n+=len(b)
                          if n>cap:raise ValueError("BYTE_CAP")
                          h.update(b);f.write(b)
                  with dest.open("rb") as f:
                      valid=f.read(4)==b"PAR1";f.seek(-4,2);valid=valid and f.read(4)==b"PAR1"
                  if not valid:dest.unlink(missing_ok=True)
                  emit(test="BOUNDED_DUMP",label=name,code=0,valid=valid,bytes=n,sha256=h.hexdigest(),seconds=round(time.monotonic()-t,3))
              except Exception as e:
                  (p/(name+".parquet")).unlink(missing_ok=True);emit(test="BOUNDED_DUMP",label=name,status="ERROR",error_type=type(e).__name__)
          
          PY
      - name: Inspect identities and execute reviewed upstream adjustment component without API key
        run: |
          python3 -m pip install --only-binary=:all: --disable-pip-version-check --retries 0 --timeout 15 duckdb pytest
          timeout 150 python3 -u - <<'PY'
          import csv,io,datetime as dt,os,sys,json,hashlib,urllib.request,collections,math
          from pathlib import Path
          from zoneinfo import ZoneInfo
          import duckdb
          def emit(**x):print(json.dumps(x,default=str),flush=True)
          p=Path(os.environ["RUNNER_TEMP"])/"invos_mod_p2_e18"
          c=duckdb.connect(":memory:");D="2026-11-24";zone=ZoneInfo("Asia/Shanghai")
          def get(url,cap):
              with urllib.request.urlopen(url,timeout=30) as r:b=r.read(cap+1)
              if len(b)>cap:raise ValueError("CAP")
              return b
          def view(name,path):c.execute("CREATE OR REPLACE VIEW "+name+" AS SELECT * FROM read_parquet('"+str(path).replace("'","''")+"')")
          def dateexpr(col):return "CAST(to_timestamp("+col+"/1000) AT TIME ZONE 'Asia/Shanghai' AS DATE)"
          baseurl="https://raw.githubusercontent.com/jl2642/investment-os-market-data/59c71bd5097af14a1785bc7e1625038bf9cc6cb4/outputs/current/"
          raw=get(baseurl+"DAILY_MARKET_SNAPSHOT.csv",4000000)
          assert hashlib.sha256(raw).hexdigest()=="5876ebcdd8a99c411a4552c6e2178bde7d52b8f89844ac6a11f62fb87179e988"
          base={r["symbol"]:r for r in csv.DictReader(io.StringIO(raw.decode("utf-8-sig")))}
          rawu=get(baseurl+"A_SHARE_UNIVERSE.csv",4000000)
          assert hashlib.sha256(rawu).hexdigest()=="ab6c9ea596da0c29ec87dc8c7c54bc5a41db340783fd1cec58c9ed551488d054"
          univ={r["symbol"]:r for r in csv.DictReader(io.StringIO(rawu.decode("utf-8-sig")))}
          if (p/"daily-k-10d.parquet").exists():
              view("daily",p/"daily-k-10d.parquet")
              dates=c.execute("SELECT min("+dateexpr("date_ms")+"),max("+dateexpr("date_ms")+"),count(*) FROM daily").fetchone()
              seen={x[0] for x in c.execute("SELECT DISTINCT thscode FROM daily WHERE "+dateexpr("date_ms")+"=DATE '2026-11-24'").fetchall()}
              missing=sorted(set(base)-seen)
              extra=sorted(seen-set(base))
              if seen:
                  emit(test="T01_MISSING_ID",base=len(base),matched=len(seen&set(base)),extra=len(extra),missing=[{"symbol":s,"formal_status":base[s].get("data_status"),"is_suspended":univ.get(s,{}).get("is_suspended"),"security_type":univ.get(s,{}).get("security_type"),"is_st":univ.get(s,{}).get("is_st"),"list_date":univ.get(s,{}).get("list_date")} for s in missing],window=[str(dates[0]),str(dates[1])],rows=dates[2],note="no raw quote output; original E15 file was not retained, current export may be revised")
              else:emit(test="T01_MISSING_ID",status="FROZEN_DATE_NOT_INCLUDED")
          else:emit(test="T01_MISSING_ID",status="NO_FILE")
          if (p/"adjustment-factors.parquet").exists():
              view("events",p/"adjustment-factors.parquet")
              q=c.execute("SELECT thscode,"+dateexpr("ex_date_ms")+" AS d,count(*) AS n,count(DISTINCT (dividend_per_share,per_share_bonus,allotment_ratio,allotment_price,currency)) AS variants FROM events GROUP BY thscode,d HAVING count(*)>1 ORDER BY thscode,d").fetchall()
              z=c.execute("SELECT count(*) FILTER (WHERE "+dateexpr("ex_date_ms")+">DATE '2026-11-24'),count(*) FILTER (WHERE "+dateexpr("ex_date_ms")+" IS NULL),count(*) FILTER (WHERE dividend_per_share IS NULL OR per_share_bonus IS NULL OR allotment_ratio IS NULL OR allotment_price IS NULL) FROM events").fetchone()
              emit(test="T04_EVENT_KEYS",duplicate_groups=[{"symbol":s,"date":str(d),"rows":n,"distinct_event_payloads":v} for s,d,n,v in q],future_after_frozen_date=z[0],null_dates=z[1],rows_with_null_event_field=z[2],note="same-day variants not automatically duplicates; future events must be excluded in frozen replay")
          else:emit(test="T04_EVENT_KEYS",status="NO_FILE")
          # Fetch only reviewed upstream source files pinned to exact commit, validate Git blob digests before executing.
          ref="63ecb1d2ea56b7c083a1f2280977b5ebf75b2a6e"
          files={"marketdb/calculations/adjustment.py":"df9e5d60ada6953b14452aff94f4c4c14137aa2f","marketdb/calculations/__init__.py":"0aa6413d510dbec24c0a927b3472d34a5b465a29","marketdb/batch.py":"376dce8fd29ebf31e74854f13040e273a7fc3fe5","marketdb/schema.py":"241cb47e4f845da85317c54a17123957a8c746e2","marketdb/__init__.py":"e15ea3720cd1d350a612666ce601a4f572da68b6","marketdb/db.py":"eef62c4625af1cda8e1ae15831a29c2f79bba9a0","marketdb/_version.py":"cd12bdb87d94650bb60bf2167d32a2f88ef6a68b","marketdb/sql/schema.sql":"b55af9d65384276a0872747654bf0bbddb5eeb2f","marketdb/sql/views.sql":"1e292ad0611ec63b2c6fcfc6a16c29edc7c3f1d0","tests/conftest.py":"d15e549be28a63f1689d75761b0969d7d6bf25aa","tests/test_adjustment.py":"4fd74c36930e219d344559f389b4c28a880d06b6"}
          root=p/"upstream";root.mkdir(exist_ok=True)
          for name,want in files.items():
              b=get("https://raw.githubusercontent.com/Hithink-Tech-Org/Financial-API/"+ref+"/python/"+name,100000)
              assert hashlib.sha1(("blob "+str(len(b))+"\0").encode()+b).hexdigest()==want
              f=root/name;f.parent.mkdir(parents=True,exist_ok=True);f.write_bytes(b)
          b=get("https://raw.githubusercontent.com/Hithink-Tech-Org/Financial-API/"+ref+"/LICENSE",20000)
          assert hashlib.sha1(("blob "+str(len(b))+"\0").encode()+b).hexdigest()=="b5c8de1300abe6bf17213830d090d91e43805f22"
          (root/"LICENSE").write_bytes(b)
          sys.path.insert(0,str(root))
          import pytest
          ret=pytest.main(["-q","-p","no:cacheprovider",str(root/"tests/test_adjustment.py")])
          emit(test="UPSTREAM_TEST",pinned_commit=ref,verified_files=len(files)+1,pytest_exit_code=int(ret),scope="exact upstream 3 adjustment tests; not entire CLI")
          from marketdb.schema import init_schema
          from marketdb.calculations.adjustment import rebuild_adjustment_factors
          db=duckdb.connect(":memory:");init_schema(db)
          # Additional deliberate synthetic test of duplicate keys and point-in-time freeze, no live financial data.
          db.execute("INSERT INTO raw_kline_daily(thscode,date,open,high,low,close,volume,turnover) VALUES ('TEST',DATE '2026-11-23',100,101,99,100,1000,100000),('TEST',DATE '2026-11-24',95,96,94,95,1000,95000)")
          db.execute("INSERT INTO raw_adjustment_events(thscode,ex_date,dividend_per_share,per_share_bonus,allotment_ratio,allotment_price) VALUES ('TEST',DATE '2026-11-24',5,0,0,0),('TEST',DATE '2026-11-26',2,0,0,0)")
          duplicate_rejected=False
          try:db.execute("INSERT INTO raw_adjustment_events(thscode,ex_date,dividend_per_share,per_share_bonus,allotment_ratio,allotment_price) VALUES ('TEST',DATE '2026-11-24',0,0.1,0,0)")
          except duckdb.ConstraintException:duplicate_rejected=True
          n=rebuild_adjustment_factors(db);q=db.execute("SELECT date,forward_factor,backward_factor FROM calc_adjust_factor_daily ORDER BY date").fetchall()
          emit(test="UPSTREAM_EDGE",rows=n,duplicate_same_day_insert_rejected=duplicate_rejected,future_event_no_factor_at_frozen_date=(len(q)==2 and abs(q[0][1]-.95)<1e-9 and abs(q[1][1]-1)<1e-9),scope="synthetic exact upstream function; no full market or independent live corporate-action confirmation")
          # Actual event sample with both a prior close and a later raw close available in existing 10-day export, no duplicate group.
          if (p/"daily-k-10d.parquet").exists() and (p/"adjustment-factors.parquet").exists():
              pairs=c.execute("WITH k AS (SELECT thscode,"+dateexpr("date_ms")+" d,open_price,high_price,low_price,close_price,volume,turnover FROM daily WHERE "+dateexpr("date_ms")+"<=DATE '2026-11-24'), e AS (SELECT thscode,"+dateexpr("ex_date_ms")+" d,dividend_per_share,per_share_bonus,allotment_ratio,allotment_price FROM events WHERE "+dateexpr("ex_date_ms")+"<=DATE '2026-11-24' QUALIFY count(*) OVER(PARTITION BY thscode,"+dateexpr("ex_date_ms")+")=1) SELECT e.* FROM e JOIN k ON e.thscode=k.thscode AND e.d=k.d WHERE EXISTS(SELECT 1 FROM k k2 WHERE k2.thscode=e.thscode AND k2.d<e.d) ORDER BY e.thscode,e.d LIMIT 8").fetchall()
              tested=0;fail=0
              for s,d,div,bonus,rights,rprice in pairs:
                  db=duckdb.connect(":memory:");init_schema(db)
                  k=c.execute("SELECT "+dateexpr("date_ms")+",open_price,high_price,low_price,close_price,volume,turnover FROM daily WHERE thscode=? AND "+dateexpr("date_ms")+"<=DATE '2026-11-24' ORDER BY date_ms",[s]).fetchall()
                  db.executemany("INSERT INTO raw_kline_daily(thscode,date,open,high,low,close,volume,turnover) VALUES (?,?,?,?,?,?,?,?)",[(s,*r) for r in k])
                  db.execute("INSERT INTO raw_adjustment_events(thscode,ex_date,dividend_per_share,per_share_bonus,allotment_ratio,allotment_price) VALUES (?,?,?,?,?,?)",[s,d,div,bonus,rights,rprice])
                  prev=[r[4] for r in k if r[0]<d][-1];expected=prev*(1+(bonus or 0)+(rights or 0))/(prev-(div or 0)+(rights or 0)*(rprice or 0))
                  rebuild_adjustment_factors(db);row=db.execute("SELECT backward_factor FROM calc_adjust_factor_daily WHERE date=?",[d]).fetchone()
                  ok=row and abs(row[0]-expected)<1e-9
                  tested+=1;fail+=int(not ok)
              emit(test="UPSTREAM_LIVE_EVENT",sample_events=tested,formula_failures=fail,scope="official component applied to bounded live event pairs and independent arithmetic; event completeness and exchange-source amounts unverified")
          emit(test="END",production_write=False,orders=0,trade_authority="NONE")
          
          PY
      - name: Remove ephemeral downloads and upstream source
        if: always()
        run: rm -rf "$RUNNER_TEMP/invos_mod_p2_e18"
