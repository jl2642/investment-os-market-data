name: INVOS-MOD-001 isolated data access probe 20261126
on:
  push:
    branches: [sandbox/invos-mod-p2-20261126]
    paths: ['.github/workflows/fmdl-6b-source-interface-access-benchmark.yml']
permissions:
  contents: read
concurrency:
  group: invos-mod-p2-probe
  cancel-in-progress: false
jobs:
  public-read-only-probe:
    if: github.ref == 'refs/heads/sandbox/invos-mod-p2-20261126'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Single-symbol long adjustment retry only
        env:
          HITHINK_FINANCE_API_KEY: ${{ secrets.HITHINK_FINANCE_API_KEY }}
        run: |
          timeout 110 python3 -u - <<'PY'
          import os,json,datetime as dt,urllib.request,urllib.parse,urllib.error,time,hashlib,ssl,sys
          from zoneinfo import ZoneInfo
          from pathlib import Path
          def emit(**r):print(json.dumps(r,ensure_ascii=False),flush=True)
          key=os.environ.get("HITHINK_FINANCE_API_KEY","")
          if not key:
              emit(test="AUTH",status="SECRET_NOT_AVAILABLE");sys.exit(2)
          emit(test="AUTH",status="SECRET_PRESENT")
          # Authentication is confined to the exact HTTPS origin. No redirect may forward credentials.
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl):return None
          opener=urllib.request.build_opener(NoRedirect())
          origin="https://fuyao.aicubes.cn"; zone=ZoneInfo("Asia/Shanghai")
          def ms(y,m,d):return int(dt.datetime(y,m,d,tzinfo=zone).timestamp()*1000)
          def date(v):
              try:return dt.datetime.fromtimestamp(int(v)/1000,zone).date().isoformat()
              except:return None
          def api(label,path,params={}):
              t=time.monotonic()
              try:
                  url=origin+path+("?"+urllib.parse.urlencode(params) if params else "")
                  req=urllib.request.Request(url,headers={"X-api-key":key,"Accept":"application/json","User-Agent":"INVOS-MOD-001-bounded-test/1.0"})
                  with opener.open(req,timeout=25) as r:
                      raw=r.read(4_000_001);http=r.status
                  if len(raw)>4_000_000:raise ValueError("cap")
                  j=json.loads(raw);code=j.get("code");d=j.get("data")
                  emit(test="API",label=label,http=http,code=code if isinstance(code,int) else None,seconds=round(time.monotonic()-t,3),response_bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest(),data_type=type(d).__name__)
                  if code!=0 or not isinstance(d,dict):return None
                  return d
              except urllib.error.HTTPError as e:emit(test="API",label=label,http=e.code,status="HTTP_ERROR");return None
              except Exception as e:emit(test="API",label=label,error_type=type(e).__name__);return None
          def rows(d):return d.get("item",[]) if isinstance(d,dict) and isinstance(d.get("item"),list) else []
          def summary(label,d,expected):
              groups=rows(d);result=[]
              for g in groups:
                  if not isinstance(g,dict) or g.get("thscode") not in expected:continue
                  v=g.get("item",[])
                  if not isinstance(v,list):continue
                  vv=[x for x in v if isinstance(x,dict)]
                  result.append({"symbol":g["thscode"],"rows":len(vv),"fields":sorted(set().union(*(set(x) for x in vv))) if vv else [],"dates":sorted(set(filter(None,(date(x.get("date_ms") or x.get("period_end_ms")) for x in vv)))),"disclosure_dates":sorted(set(filter(None,(date(x.get("report_date_ms")) for x in vv)))),"null_fields":sorted({k for x in vv for k,val in x.items() if val is None})})
              emit(test="GROUPS",label=label,groups=result,missing=sorted(set(expected)-{x["symbol"] for x in result}))
          
          
          
          # Retry only one symbol with the previously failed long-window endpoint; independent comparison on same dates.
          import math
          s="600519.SH";p={"thscode":s,"interval":"1d","start":ms(2025,11,1),"end":ms(2026,11,25)-1}
          def series(d):return {date(r["date_ms"]):r for r in rows(d) if date(r.get("date_ms"))}
          x=series(api("retry_maotai_raw","/api/a-share/prices/historical",{**p,"adjust":"none"}))
          y=series(api("retry_maotai_forward","/api/a-share/prices/historical",{**p,"adjust":"forward"}))
          ev=rows(api("retry_maotai_events","/api/a-share/corporate-actions/adjustment-factors",{"thscode":s,"from":"2025-11-01","to":"2026-11-24"}))
          ds=sorted(set(x)&set(y));by={date(r["ex_date_ms"]):r for r in ev};calc={};m=1.;prev=None;skipped=0
          for d in sorted(x):
              if d in by:
                  z=by[d];div=float(z.get("dividend_per_share") or 0);bonus=float(z.get("per_share_bonus") or 0)
                  if prev is None or prev<=div:skipped+=1
                  else:m*=prev*(1+bonus)/(prev-div)
              calc[d]=m;prev=float(x[d]["close_price"])
          spreads=[];returns=[];level=[];last=None
          for d in ds:
              k=[float(y[d][f])/float(x[d][f]) for f in ("open_price","high_price","low_price","close_price")]
              spreads.append(max(k)-min(k));c=float(x[d]["close_price"])*calc[d]/m;v=float(y[d]["close_price"])
              level.append(abs(c-v))
              if last:returns.append(abs(c/last[0]-v/last[1]))
              last=(c,v)
          emit(test="RETRY_ADJUST",symbol=s,raw=len(x),forward=len(y),matched=len(ds),events=len(ev),event_dates=sorted(by),unmapped=len(set(by)-set(x)),skipped=skipped,ratio_spread_over_1bp=sum(v>.0001 for v in spreads) if spreads else None,return_diff_over_10bp=sum(v>.001 for v in returns) if returns else None,max_return_diff=max(returns,default=None),max_close_difference=max(level,default=None),status="COMPARISON_EXECUTED" if len(ds)>=251 and ev else "INCOMPLETE",scope="single bounded sample; formula replay not official package deployment")
          emit(test="AUTH_END",orders=0,production_write=False,trade_authority="NONE")
          
          PY
      - name: Existing bounded cross-market capture comparison
        if: always()
        run: |
          timeout 110 python3 -u - <<'PY'
          import urllib.request,urllib.parse,hashlib,json,datetime as dt,math,time
          from zoneinfo import ZoneInfo
          def emit(**x):print(json.dumps(x),flush=True)
          def get(u,cap=3000000):
              t=time.monotonic()
              with urllib.request.urlopen(urllib.request.Request(u,headers={"User-Agent":"INVOS-MOD-001-bounded-test/1.0"}),timeout=25) as r:b=r.read(cap+1)
              if len(b)>cap:raise ValueError("cap")
              return b,round(time.monotonic()-t,3)
          u="https://raw.githubusercontent.com/jl2642/investment-os-market-data/7e9fd3e5183b44e349276f01522f0b55be50ef4f/investment_os_runtime/40_EVIDENCE_AND_LINEAGE/CROSS_MARKET_LIMITED/ROUND3_2026-11-24_B1_2605adeecc/ROUND3_RUN_EVIDENCE.json"
          b,t=get(u)
          # Verify the exact Git blob ID (not confuse Git SHA1 with raw SHA256).
          if hashlib.sha1(("blob "+str(len(b))+"\0").encode()+b).hexdigest()!="1aad56cbba87ab81a0e96b36a0a06e45e73c64c0":raise ValueError("formal evidence blob mismatch")
          j=json.loads(b);D="2026-11-24"
          for market,p,zone in [("HK","hk","Asia/Hong_Kong"),("US","us","America/New_York")]:
              good={r["symbol"]:r for r in j[p+"_market_successes"]};fail={r["symbol"]:r for r in j[p+"_market_failures"]};ids=list(dict.fromkeys(list(good)+list(fail)));mapping={s+"."+market:s for s in ids}
              tz=ZoneInfo(zone);end=int(dt.datetime(2026,11,25,tzinfo=tz).timestamp()*1000)-1
              data={};requests=0;errors=0
              for i in range(0,len(mapping),100):
                  batch=list(mapping)[i:i+100];requests+=1
                  try:
                      raw,sec=get("https://free-api.tickflow.org/v1/klines/batch?"+urllib.parse.urlencode({"symbols":",".join(batch),"period":"1d","adjust":"none","count":1,"end_time":end}))
                      resp=json.loads(raw).get("data",{});data.update(resp)
                      emit(test="CROSS_BATCH",market=market,requested=len(batch),returned=len(resp),seconds=sec,sha256=hashlib.sha256(raw).hexdigest())
                  except Exception as ex:errors+=1;emit(test="CROSS_BATCH",market=market,error_type=type(ex).__name__)
              same={};stale=0;bad=0
              for k,v in data.items():
                  if k not in mapping:continue
                  try:
                      d=dt.datetime.fromtimestamp(v["timestamp"][-1]/1000,tz).date().isoformat();price=float(v["close"][-1])
                      if d==D and math.isfinite(price) and price>0:same[mapping[k]]=price
                      elif d!=D:stale+=1
                      else:bad+=1
                  except:bad+=1
              common=set(good)&set(same);mismatch=[s for s in common if abs(float(good[s]["close"])-same[s])>.0100001]
              emit(test="CROSS_SCOPE",market=market,formal_attempted=len(ids),formal_success=len(good),formal_failed=len(fail),source_returned=len(data),same_day_positive=len(same),stale=stale,invalid=bad,common_success=len(common),close_match_1cent=len(common)-len(mismatch),close_mismatch=len(mismatch),max_relative_delta=max((abs(float(good[s]["close"])-same[s])/float(good[s]["close"]) for s in common if float(good[s]["close"])>0),default=None),prior_failures_recovered=len(set(fail)&set(same)),requests=requests,request_errors=errors,note="finite formal sample only; raw code mapping, price cross-check not exchange official; volume units not assumed")
          emit(test="CROSS_END",orders=0,production_write=False,trade_authority="NONE")
          
          PY
      - name: Same-date valuation comparison to immutable formal release
        if: always()
        run: |
          python3 -m pip install --only-binary=:all: --disable-pip-version-check --retries 0 --timeout 15 duckdb baostock==0.9.4
          timeout 100 python3 -u - <<'PY'
          import baostock as bs,duckdb,urllib.request,hashlib,tempfile,json,math
          def emit(**x):print(json.dumps(x,default=str),flush=True)
          url="https://raw.githubusercontent.com/jl2642/investment-os-market-data/562ac7ad33d470c2e40c2418ec8e0764ca3f8b20/outputs/valuation/engine/current/FMDL3DC_VALUATION_CURRENT.parquet"
          with urllib.request.urlopen(url,timeout=20) as r:b=r.read(2000000)
          assert hashlib.sha256(b).hexdigest()=="5befdc50e863bb0d857b38f9c1de8dfa1af27276a0b3c81616306eff81b998d8"
          with tempfile.TemporaryDirectory() as tmp:
              p=tmp+"/val.parquet";open(p,"wb").write(b);c=duckdb.connect(":memory:");c.execute("CREATE VIEW val AS SELECT * FROM read_parquet('"+p+"')")
              lg=bs.login();emit(test="VALUATION_LOGIN",code=lg.error_code)
              if lg.error_code=="0":
                  try:
                      for s in ["605090.SH","600519.SH","300750.SZ","000010.SZ"]:
                          a,k=s.split(".");r=bs.query_history_k_data_plus(k.lower()+"."+a,"date,code,close,peTTM,pbMRQ,psTTM",start_date="2026-11-18",end_date="2026-11-18",frequency="d",adjustflag="3");rows=[]
                          while r.error_code=="0" and r.next():rows.append(dict(zip(r.fields,r.get_row_data())))
                          q=c.execute("SELECT market_as_of_date,pe_ttm,pe_ttm_state,pb,pb_state,ps_ttm,ps_ttm_state FROM val WHERE symbol=?",[s]).fetchone()
                          if not q or not rows:emit(test="VALUATION_SAME_DATE",symbol=s,status="NO_COMPARABLE",code=r.error_code);continue
                          z=rows[0];out={}
                          for field,i,ext in [("PE",1,"peTTM"),("PB",3,"pbMRQ"),("PS",5,"psTTM")]:
                              try:
                                  x=float(q[i]);y=float(z[ext]);out[field]={"formal_state":q[i+1],"formal":round(x,6),"external":round(y,6),"relative_delta":round(abs(x-y)/max(abs(x),0.000001),8)}
                              except:out[field]={"formal_state":q[i+1],"external_numeric":bool(z.get(ext)),"compared":False}
                          emit(test="VALUATION_SAME_DATE",symbol=s,date=str(q[0]),external_date=z["date"],code=r.error_code,metrics=out,note="same session not necessarily same denominator; negative earnings not converted to valid PE")
                  finally:bs.logout()
          emit(test="END",orders=0,production_write=False,trade_authority="NONE")
          
          PY
