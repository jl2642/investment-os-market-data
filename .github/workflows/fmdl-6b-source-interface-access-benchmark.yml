name: INVOS-MOD-001 isolated data access probe 20261126
on:
  push:
    branches: [sandbox/invos-mod-p2-20261126]
    paths: ['.github/workflows/fmdl-6b-source-interface-access-benchmark.yml']
permissions:
  contents: read
concurrency:
  group: invos-mod-p2-probe
  cancel-in-progress: false
jobs:
  public-read-only-probe:
    if: github.ref == 'refs/heads/sandbox/invos-mod-p2-20261126'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install pinned SDK
        run: python3 -m pip install --disable-pip-version-check --retries 1 --timeout 15 baostock==0.9.4
      - name: P2 targeted calendar and finance continuation only
        run: |
          timeout 240 python3 -u - <<'PY'
          import csv,datetime as dt,hashlib,io,json,time,urllib.request,urllib.parse,math,collections
          from zoneinfo import ZoneInfo
          import baostock as bs
          D="2026-11-24"; core=["605090.SH","600519.SH","300750.SZ","00700.HK","AAPL.US"]
          def emit(**x): print(json.dumps(x,ensure_ascii=False,default=str),flush=True)
          def sha(b):return hashlib.sha256(b).hexdigest()
          def fetch(url):
              t=time.monotonic()
              with urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"INVOS-MOD-001-bounded-read-only/1.0"}),timeout=30) as r:
                  b=r.read(12_000_001)
                  if len(b)>12_000_000:raise ValueError("payload cap")
                  return b,round(time.monotonic()-t,3)
          def readbase(path,digest):
              b,t=fetch("https://raw.githubusercontent.com/jl2642/investment-os-market-data/59c71bd5097af14a1785bc7e1625038bf9cc6cb4/outputs/current/"+path)
              if sha(b)!=digest:raise ValueError("baseline hash mismatch")
              z={r["symbol"]:r for r in csv.DictReader(io.StringIO(b.decode("utf-8-sig")))}
              emit(test="BASE",path=path,rows=len(z),sha256=sha(b));return z
          base=readbase("DAILY_MARKET_SNAPSHOT.csv","5876ebcdd8a99c411a4552c6e2178bde7d52b8f89844ac6a11f62fb87179e988")
          univ=readbase("A_SHARE_UNIVERSE.csv","ab6c9ea596da0c29ec87dc8c7c54bc5a41db340783fd1cec58c9ed551488d054")
          def num(x):
              try:
                  v=float(x);return v if math.isfinite(v) else None
              except:return None
          def sym(x):
              a,b=x.split(".");return b+"."+a.upper()
          def br(rs):
              rows=[]
              while rs.error_code=="0" and rs.next():rows.append(dict(zip(rs.fields,rs.get_row_data())))
              return rows
          def bcode(s):a,b=s.split(".");return b.lower()+"."+a
          def tick(ss,count=1,adjust="none"):
              if not ss:return {}
              zone=ZoneInfo("America/New_York" if all(s.endswith(".US") for s in ss) else "Asia/Shanghai")
              end=int((dt.datetime(2026,11,25,tzinfo=zone)-dt.timedelta(milliseconds=1)).timestamp()*1000)
              params={"symbols":",".join(ss),"period":"1d","adjust":adjust,"count":count,"end_time":end}
              try:
                  b,t=fetch("https://free-api.tickflow.org/v1/klines/batch?"+urllib.parse.urlencode(params));data=json.loads(b).get("data",{})
                  out={};invalid=0;dups=0;future=0
                  for s in ss:
                      a=data.get(s,{})
                      if not isinstance(a,dict):continue
                      ts=a.get("timestamp",[]);fs=["open","high","low","close","volume","amount"]
                      if not ts or any(not isinstance(a.get(f),list) or len(a[f])!=len(ts) for f in fs[:5]):continue
                      rr={}
                      for i,v in enumerate(ts):
                          date=dt.datetime.fromtimestamp(v/1000,dt.timezone.utc).astimezone(zone).date().isoformat()
                          row={f:num(a[f][i]) if isinstance(a.get(f),list) and len(a[f])==len(ts) else None for f in fs}
                          o,h,l,c,vv=[row[f] for f in fs[:5]]
                          # Zero/blank suspended bars tracked separately; no synthetic filling.
                          if None in (o,h,l,c,vv) or not (0<l<=min(o,c)<=max(o,c)<=h and vv>=0):invalid+=1
                          dups+=int(date in rr);future+=int(date>D);rr[date]=row
                      out[s]=rr
                  emit(test="TICK_BATCH",requested=len(ss),received=len(out),count=count,adjust=adjust,seconds=t,hash=sha(b),lengths=dict(collections.Counter(len(x) for x in out.values())),invalid=invalid,duplicates=dups,future=future)
                  return out
              except Exception as e:emit(test="TICK_BATCH",requested=len(ss),count=count,error=str(e)[:200]);return {}
          def compare(rows,scale=1):
              fields={"open":"open","high":"high","low":"low","close":"close","volume":"volume_shares","amount":"turnover_cny"}
              cnt=collections.Counter();bad=collections.Counter();maxrel=collections.defaultdict(float)
              for s,r in rows.items():
                  if s not in base or base[s].get("data_status")!="TRADED":continue
                  for f,k in fields.items():
                      x=num(r.get(f));y=num(base[s].get(k))
                      if x is None or y is None:continue
                      if f=="volume":x*=scale
                      cnt[f]+=1;diff=abs(x-y);maxrel[f]=max(maxrel[f],diff/max(abs(y),1))
                      tol=0.01000001 if f in ("open","high","low","close") else (max(1,abs(y)*0.0001) if f=="amount" else 0.000001)
                      bad[f]+=int(diff>tol)
              return dict(compared=dict(cnt),mismatch=dict(bad),max_relative=dict(maxrel))
          def sample(s,fn,**kw):
              t=time.monotonic()
              try:
                  rs=fn(**kw);rr=br(rs)
                  emit(test="FINANCE_OR_FACTOR",symbol=s,method=fn.__name__,code=rs.error_code,rows=len(rr),fields=rs.fields,pub_dates=sorted(set(r.get("pubDate","") for r in rr)),stat_dates=sorted(set(r.get("statDate","") for r in rr)),hash=sha(json.dumps(rr,sort_keys=True).encode()),seconds=round(time.monotonic()-t,3))
                  return rr
              except Exception as e:emit(test="FINANCE_OR_FACTOR",symbol=s,method=fn.__name__,error=str(e)[:200]);return []
          lg=bs.login();emit(test="BAO_LOGIN",code=lg.error_code)
          if lg.error_code!="0":raise SystemExit(1)
          try:
              cn=core[:4];longs=tick(cn,250);longs.update(tick([core[4]],250))
              try:
                  rs=bs.query_trade_dates(start_date="2025-09-01",end_date=D);cal=br(rs)
                  emit(test="CALENDAR_SCHEMA",code=rs.error_code,fields=rs.fields,rows=len(cal))
                  normalized=[{k.lower().replace("_",""):v for k,v in r.items()} for r in cal]
                  expected=[r["calendardate"] for r in normalized if r.get("istradingday")=="1"][-250:]
                  for s,r in longs.items():emit(test="LONG",symbol=s,rows=len(r),first=min(r),last=max(r),cn_calendar_match=(len(expected)==250 and set(expected)==set(r)) if s.endswith((".SH",".SZ")) else None)
              except Exception as e:emit(test="CALENDAR_ERROR",error=str(e)[:250])
              for s in core[:3]:
                  h=br(bs.query_history_k_data_plus(bcode(s),"date,code,open,high,low,close,volume,amount",start_date="2025-09-01",end_date=D,frequency="d",adjustflag="3")); h={r["date"]:r for r in h}
                  z=longs.get(s,{});rat=[];pricebad=0;volbad=0;volmax=0
                  for d in set(h)&set(z):
                      for f in ("open","high","low","close"):
                          x=num(h[d].get(f));y=num(z[d].get(f))
                          if x is not None and y is not None:pricebad+=int(abs(x-y)>.01000001)
                      x=num(h[d].get("volume"));y=num(z[d].get("volume"))
                      if x is not None and y is not None:
                          delta=abs(100*y-x);volbad+=int(delta>0.000001);volmax=max(volmax,delta)
                          if x:rat.append(delta/x)
                  emit(test="LONG_CROSS",symbol=s,common=len(set(h)&set(z)),pricebad=pricebad,volume_exact_mismatch=volbad,volume_max_shares=volmax,volume_max_relative=max(rat) if rat else None)
                  for fn in (bs.query_profit_data,bs.query_balance_data,bs.query_cash_flow_data):
                      sample(s,fn,code=bcode(s),year=2026,quarter=3)
              sample(core[0],bs.query_adjust_factor,code=bcode(core[0]),start_date="2025-09-01",end_date=D)
          finally:bs.logout()
          emit(test="END",orders=0,production_write=False,trade_authority="NONE")
          
          PY
