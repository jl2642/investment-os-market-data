name: WP5 Branch Canonical Finalization Materialization

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/wp5_branch_finalize_materialize.yml"
      - "automation/wp5_portfolio_decision/finalize_wp5_branch.py"

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'agent/wp5-portfolio-decision-start' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Finalize and validate WP5 branch Canonical state
        run: |
          python automation/wp5_portfolio_decision/finalize_wp5_branch.py --repo-root .
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('.')
          execution = json.loads((root / 'investment_os_runtime/00_CONTROL/EXECUTION_REGISTER_CURRENT.json').read_text(encoding='utf-8'))
          registry = json.loads((root / 'investment_os_runtime/00_CONTROL/AUTHORITATIVE_ASSET_REGISTRY.json').read_text(encoding='utf-8'))
          start = json.loads((root / 'investment_os_runtime/00_CONTROL/WP5_START_RECORD_CURRENT.json').read_text(encoding='utf-8'))
          queue = json.loads((root / 'investment_os_runtime/30_STATE_CURRENT/60_DECISIONS/WP5_USER_DECISION_QUEUE_CURRENT.json').read_text(encoding='utf-8'))
          assert execution['latest_governed_merge_sha'] == '17db72e866bff027e1f786a8fd0c051ddfcd6c3a'
          assert execution['r2_capability_merge_sha'] == '33a5484f2ca919e80eef96a6750f801f751f8bdf'
          assert execution['next_task'] == 'WP5_P0_EXTERNAL_PRIMARY_SOURCE_REUNDERWRITE_AND_FRESH_INPUT_REFRESH'
          assert execution['wp5']['p0_internal_evidence_inventory_complete'] is True
          assert execution['wp5']['p0_external_primary_source_reunderwrite_complete'] is False
          assert execution['wp5']['position_mutation_allowed'] is False
          assert execution['wp5']['order_execution_allowed'] is False
          assert registry['latest_governed_merge_sha'] == '17db72e866bff027e1f786a8fd0c051ddfcd6c3a'
          assert registry['r2_capability_merge_sha'] == '33a5484f2ca919e80eef96a6750f801f751f8bdf'
          asset_ids = {item.get('asset_id') for item in registry['assets'] if isinstance(item, dict)}
          assert {'WP5_P0_REUNDERWRITE_WORKPLAN_CURRENT', 'WP5_P0_INTERNAL_EVIDENCE_INVENTORY_CURRENT'} <= asset_ids
          assert start['p0_internal_evidence_inventory_complete'] is True
          assert start['implementation_ready'] is False
          assert queue['ready_for_user_decision_count'] == 0
          assert queue['orders'] == 0
          assert execution['trade_authority'] == registry['trade_authority'] == start['trade_authority'] == queue['trade_authority'] == 'NONE'
          PY

      - name: Commit finalized Canonical controls
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            investment_os_runtime/00_CONTROL/EXECUTION_REGISTER_CURRENT.json \
            investment_os_runtime/00_CONTROL/AUTHORITATIVE_ASSET_REGISTRY.json \
            investment_os_runtime/00_CONTROL/WP5_START_RECORD_CURRENT.json \
            investment_os_runtime/30_STATE_CURRENT/60_DECISIONS/WP5_USER_DECISION_QUEUE_CURRENT.json
          git commit -m "WP5 finalize branch Canonical lineage and P0 assets"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
