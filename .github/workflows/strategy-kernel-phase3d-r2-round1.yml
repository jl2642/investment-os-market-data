name: Strategy Kernel Phase 3D-R2 Round 1 Measurability

on:
  pull_request:
    paths:
      - 'strategy_kernel_v2/**'
      - '.github/workflows/strategy-kernel-phase3d-r2-round1.yml'
  workflow_dispatch:

concurrency:
  group: strategy-kernel-phase3d-r2-round1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  phase3d-r2-round1:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Phase 3D-R2 Round 1 contract tests
        run: python -m unittest strategy_kernel_v2.tests.test_phase3d_r2_round1
      - name: Validate accepted independent Holdout parent
        run: python -m strategy_kernel_v2.validate_phase3_r2_independent_holdout_replay
      - name: Build and validate Phase 3D-R2 Round 1 evidence audit
        run: python -m strategy_kernel_v2.validate_phase3d_r2_round1
      - name: Re-validate Phase 3C-R2B parent
        run: python -m strategy_kernel_v2.validate_phase3c_r2b
      - name: Re-validate Phase 3B-R2 contract
        run: python -m strategy_kernel_v2.validate_phase3b_r2
      - name: Validate Post-3F research path
        run: python -m strategy_kernel_v2.validate_post3f_research_path
      - name: Validate historical Phase 3F gate remains unchanged
        run: python -m strategy_kernel_v2.validate_phase3f
      - name: Validate program consistency
        run: python strategy_kernel_v2/program_consistency.py
      - name: Run program governance regressions
        run: python -m unittest strategy_kernel_v2.tests.test_program_governance
      - name: Upload Phase 3D-R2 Round 1 audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3d-r2-round1-evidence-audit
          path: strategy_kernel_v2/generated/PHASE3D_R2_ROUND1_EVIDENCE_AUDIT.json
          if-no-files-found: ignore
