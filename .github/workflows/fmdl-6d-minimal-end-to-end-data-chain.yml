name: FMDL 6D Minimal End-to-End Data Chain

on:
  pull_request:
    paths:
      - "config/fmdl6d_*.json"
      - "datasets/fmdl6d/source_snapshots/*.json"
      - "schemas/fmdl6d_*.json"
      - "scripts/fmdl6d_*.py"
      - "scripts/publish_fmdl6d.py"
      - "scripts/validate_fmdl6d_*.py"
      - "tests/test_fmdl6d_*.py"
      - "docs/FMDL-6D*.md"
      - ".github/workflows/fmdl-6d-minimal-end-to-end-data-chain.yml"
  push:
    branches: [main]
    paths:
      - "config/fmdl6d_*.json"
      - "datasets/fmdl6d/source_snapshots/*.json"
      - "schemas/fmdl6d_*.json"
      - "scripts/fmdl6d_*.py"
      - "scripts/publish_fmdl6d.py"
      - "scripts/validate_fmdl6d_*.py"
      - "tests/test_fmdl6d_*.py"
      - "docs/FMDL-6D*.md"
      - ".github/workflows/fmdl-6d-minimal-end-to-end-data-chain.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fmdl-6d-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Schema validation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          schema = json.loads(Path("schemas/fmdl6d_minimal_chain_v1.schema.json").read_text())
          contract = json.loads(Path("config/fmdl6d_minimal_end_to_end_data_chain_contract.json").read_text())
          errors = list(Draft202012Validator(schema).iter_errors(contract))
          for error in errors:
              print(error.json_path, error.message)
          raise SystemExit(1 if errors else 0)
          PY
      - name: Unit and failure-injection tests
        run: python -m pytest -q tests/test_fmdl6d_minimal_chain.py
      - name: Compile checks
        run: >-
          python -m py_compile
          scripts/fmdl6d_minimal_chain.py
          scripts/publish_fmdl6d.py
          scripts/validate_fmdl6d_candidate.py
      - name: Validate bounded chain contract
        run: |
          python scripts/fmdl6d_minimal_chain.py contract --repo-root .

  build-and-accept:
    needs: quality-gates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Capture bounded live market and official FX inputs
        run: |
          rm -rf outputs/fmdl6d/work outputs/fmdl6d/candidate outputs/fmdl6d/acceptance
          python scripts/fmdl6d_minimal_chain.py fetch \
            --repo-root . \
            --capture outputs/fmdl6d/work/FMDL6D_RAW_CAPTURE.json
      - name: Build minimal end-to-end candidate
        run: |
          python scripts/fmdl6d_minimal_chain.py build \
            --repo-root . \
            --capture outputs/fmdl6d/work/FMDL6D_RAW_CAPTURE.json \
            --candidate outputs/fmdl6d/candidate
      - name: Independent validation and captured-input replay
        run: |
          python scripts/fmdl6d_minimal_chain.py validate \
            --repo-root . \
            --capture outputs/fmdl6d/work/FMDL6D_RAW_CAPTURE.json \
            --candidate outputs/fmdl6d/candidate \
            --acceptance outputs/fmdl6d/acceptance/FMDL6D_INDEPENDENT_ACCEPTANCE.json
      - uses: actions/upload-artifact@v4
        with:
          name: fmdl6d-minimal-end-to-end-data-chain-candidate
          path: |
            outputs/fmdl6d/candidate
            outputs/fmdl6d/acceptance/FMDL6D_INDEPENDENT_ACCEPTANCE.json
          if-no-files-found: error
          retention-days: 30
      - name: Publish Current Immutable Archive and Last-success
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && success()
        run: |
          python scripts/fmdl6d_minimal_chain.py publish \
            --repo-root . \
            --candidate outputs/fmdl6d/candidate
      - name: Commit accepted FMDL-6D state
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/fmdl6d/current outputs/fmdl6d/archive datasets/fmdl6d/releases outputs/status/FMDL6D_LAST_SUCCESS.json
          git diff --cached --quiet && exit 0
          git commit -m "data: publish FMDL-6D minimal end-to-end data chain [skip ci]"
          git push
