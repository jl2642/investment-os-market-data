name: WP5-C P0 Internal Evidence Materialization

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/wp5_p0_internal_evidence_materialize.yml"
      - "automation/wp5_portfolio_decision/extract_wp5_p0_internal_evidence.py"

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'agent/wp5-portfolio-decision-start' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: automation/wp4_b/requirements.lock

      - name: Install governed data runtime
        run: python -m pip install --retries 5 --timeout 30 -r automation/wp4_b/requirements.lock

      - name: Extract and validate P0 internal evidence
        run: |
          python automation/wp5_portfolio_decision/extract_wp5_p0_internal_evidence.py --repo-root .
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('investment_os_runtime/40_EVIDENCE_AND_LINEAGE/WP5/P0_REUNDERWRITE/WP5_P0_INTERNAL_EVIDENCE_INVENTORY_CURRENT.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          assert data['status'] == 'INTERNAL_EVIDENCE_INVENTORY_COMPLETE_EXTERNAL_PRIMARY_SOURCE_REUNDERWRITE_PENDING'
          assert set(data['objects']) == {'300124.SZ', '300750.SZ', '601138.SH'}
          assert data['summary']['p0_object_count'] == 3
          assert data['summary']['implementation_ready_count'] == 0
          assert data['summary']['orders'] == 0
          assert data['economic_mutations'] == {'real_account': 0, 'simulation': 0, 'candidate_membership': 0, 'orders': 0}
          assert data['trade_authority'] == 'NONE'
          PY

      - name: Commit governed evidence inventory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add investment_os_runtime/40_EVIDENCE_AND_LINEAGE/WP5/P0_REUNDERWRITE/WP5_P0_INTERNAL_EVIDENCE_INVENTORY_CURRENT.json
          git commit -m "WP5-C publish P0 internal evidence inventory"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
