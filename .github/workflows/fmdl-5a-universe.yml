name: FMDL 5A Market Contract and Universe Boundary

on:
  pull_request:
    paths:
      - "config/fmdl5a_*.json"
      - "scripts/run_fmdl5a_universe.py"
      - "scripts/run_fmdl5a_candidate.py"
      - "scripts/publish_fmdl5a.py"
      - "tests/test_fmdl5a_universe.py"
      - ".github/workflows/fmdl-5a-universe.yml"
  push:
    branches: [main]
    paths:
      - "config/fmdl5a_*.json"
      - "scripts/run_fmdl5a_universe.py"
      - "scripts/run_fmdl5a_candidate.py"
      - "scripts/publish_fmdl5a.py"
      - "tests/test_fmdl5a_universe.py"
      - ".github/workflows/fmdl-5a-universe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  universe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests pytest
      - name: Unit tests
        run: python -m pytest -q tests/test_fmdl5a_universe.py
      - name: Compile checks
        run: python -m py_compile scripts/run_fmdl5a_universe.py scripts/run_fmdl5a_candidate.py scripts/publish_fmdl5a.py
      - name: Build official PIT universe
        run: |
          rm -rf outputs/fmdl5a/candidate
          PYTHONPATH=scripts python scripts/run_fmdl5a_candidate.py --output outputs/fmdl5a/candidate
      - name: Independent release checks
        run: |
          python - <<'PY'
          import csv,json,pathlib
          p=pathlib.Path('outputs/fmdl5a/candidate')
          d=json.load(open(p/'FMDL5A_DECISION.json'))
          rows=list(csv.DictReader(open(p/'FMDL5A_CANONICAL_UNIVERSE.csv',encoding='utf-8-sig')))
          assert not d['hard_failures']
          assert d['metrics']['canonical_count']==len(rows)
          assert len(rows)>=500
          assert len({x['stock_code'] for x in rows})==len(rows)
          assert all(len(x['stock_code'])==5 and x['stock_code'].isdigit() for x in rows)
          assert d['trade_authority']=='NONE'
          assert d['candidate_pool_mutation_count']==d['simulation_mutation_count']==d['real_account_mutation_count']==d['order_generation_count']==0
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fmdl5a-universe-candidate
          path: outputs/fmdl5a/candidate
          if-no-files-found: warn
          retention-days: 30
      - name: Publish Current Immutable Archive and Last-success
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && success()
        run: python scripts/publish_fmdl5a.py --repo-root . --candidate outputs/fmdl5a/candidate
      - name: Commit accepted FMDL-5A state
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/fmdl5a/current outputs/fmdl5a/archive datasets/fmdl5a/releases outputs/status/FMDL5A_LAST_SUCCESS.json
          git diff --cached --quiet && exit 0
          git commit -m "data: publish FMDL-5A Southbound universe [skip ci]"
          git push
