name: Stock Investment Assistant Final Integration
run-name: "Stock Investment Assistant Final Integration (retired)"

# S1 retirement: this historical acceptance gate no longer runs on unrelated PRs.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/stock-investment-assistant-final-integration.yml"

permissions:
  contents: read

env:
  TRADE_AUTHORITY: NONE

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Explain retirement
        run: |
          echo "Historical final-integration acceptance gate. Superseded by the S1-S4 simplification program and no longer a whole-system completion authority."
          echo "The historical implementation and evidence remain available in Git history."
          echo "Whole-system maturity is read from investment_os_runtime/00_CONTROL/SYSTEM_CURRENT.json."
          echo "orders=0"
          echo "trade_authority=NONE"
