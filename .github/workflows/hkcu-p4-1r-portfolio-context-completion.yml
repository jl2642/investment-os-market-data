name: HKCU P4-1R Portfolio Context Completion

on:
  pull_request:
    paths:
      - 'config/hkcu_p4_1r_portfolio_context_completion_contract.json'
      - 'pipeline/hkcu_p4_1r_portfolio_context_completion.py'
      - 'scripts/validate_hkcu_p4_1r_portfolio_context_completion.py'
      - 'tests/test_hkcu_p4_1r_portfolio_context_completion.py'
      - 'docs/HKCU-P4-1R_PORTFOLIO_CONTEXT_COMPLETION.md'
      - '.github/workflows/hkcu-p4-1r-portfolio-context-completion.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-and-scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q tests/test_hkcu_p4_1r_portfolio_context_completion.py
      - name: Enforce isolated P4-1R initial scope
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}"
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" > /tmp/p4_1r_paths.txt
          cat /tmp/p4_1r_paths.txt
          python - <<'PY'
          from pathlib import Path
          allowed = {
              'config/hkcu_p4_1r_portfolio_context_completion_contract.json',
              'pipeline/hkcu_p4_1r_portfolio_context_completion.py',
              'scripts/validate_hkcu_p4_1r_portfolio_context_completion.py',
              'tests/test_hkcu_p4_1r_portfolio_context_completion.py',
              'docs/HKCU-P4-1R_PORTFOLIO_CONTEXT_COMPLETION.md',
              '.github/workflows/hkcu-p4-1r-portfolio-context-completion.yml',
          }
          actual = {x.strip() for x in Path('/tmp/p4_1r_paths.txt').read_text().splitlines() if x.strip()}
          bad = sorted(actual - allowed)
          if bad:
              raise SystemExit('P4_1R_SCOPE_VIOLATION:' + ','.join(bad))
          protected = ('outputs/hk_candidate/', 'outputs/simulation/', 'outputs/real', 'investment_os_runtime/30_STATE_CURRENT/', 'orders/')
          mutations = sorted(x for x in actual if x.startswith(protected))
          if mutations:
              raise SystemExit('P4_1R_PROTECTED_PATH_MUTATION:' + ','.join(mutations))
          PY

  real-context-completion:
    needs: unit-and-scope
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build real P4-1R context
        run: |
          rm -rf work/hkcu_p4_1r
          python pipeline/hkcu_p4_1r_portfolio_context_completion.py --repo-root . --output work/hkcu_p4_1r
      - name: Independent P4-1R validation
        run: |
          python scripts/validate_hkcu_p4_1r_portfolio_context_completion.py --repo-root . --output work/hkcu_p4_1r
      - name: Render decision, quality and residual gaps
        if: always()
        run: |
          test ! -f work/hkcu_p4_1r/HKCU_P4_1R_DECISION.json || cat work/hkcu_p4_1r/HKCU_P4_1R_DECISION.json
          test ! -f work/hkcu_p4_1r/HKCU_P4_1R_QUALITY_REPORT.json || cat work/hkcu_p4_1r/HKCU_P4_1R_QUALITY_REPORT.json
          test ! -f work/hkcu_p4_1r/HKCU_P4_1R_RESIDUAL_GAPS.csv || cat work/hkcu_p4_1r/HKCU_P4_1R_RESIDUAL_GAPS.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hkcu-p4-1r-portfolio-context-completion
          path: work/hkcu_p4_1r/HKCU_P4_1R_*
          if-no-files-found: error
