name: FMDL 2B-2 Full-Universe Historical Backfill Recovery

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - triggers/FMDL2B2_RUN.md

permissions:
  actions: read
  contents: write

env:
  SOURCE_RUN_ID: '29556547410'
  RELEASE_ID: FMDL2B2_29556547410_1
  TARGET_REF: ${{ github.head_ref || github.ref_name }}

concurrency:
  group: fmdl-2b2-full-backfill-recovery
  cancel-in-progress: true

jobs:
  recover-aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_REF }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Validate contracts and quarantine policy
        run: |
          python scripts/validate_investment_os_interface.py
          pytest -q tests/test_fmdl2a_contract.py tests/test_fmdl2b1_history_pilot.py tests/test_fmdl2b2_full_backfill.py tests/test_fmdl2b2_aggregate_policy.py

      - name: Download all accepted shard artifacts from source run
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          pattern: fmdl2b2-shard-*
          path: incoming/fmdl2b2
          merge-multiple: false

      - name: Aggregate with quarantine-aware hard gates
        id: aggregate
        shell: bash
        run: |
          set +e
          mkdir -p diagnostics
          python -m scripts.aggregate_full_backfill_v2 \
            --incoming incoming/fmdl2b2 \
            --release-id "$RELEASE_ID" \
            2>&1 | tee diagnostics/FMDL2B2_AGGREGATE_LOG.txt
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload aggregation diagnostics and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fmdl2b2-aggregate-recovery-evidence
          path: |
            diagnostics/FMDL2B2_AGGREGATE_LOG.txt
            outputs/history/candidate/
            datasets/history/base/${{ env.RELEASE_ID }}/manifests/
          if-no-files-found: warn
          retention-days: 14

      - name: Retire trigger and commit accepted candidate
        if: steps.aggregate.outputs.exit_code == '0'
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/fmdl-2b2-full-backfill.yml')
          text = path.read_text(encoding='utf-8')
          start = text.index('on:\n')
          end = text.index('\n\npermissions:')
          path.write_text(text[:start] + 'on:\n  workflow_dispatch:\n' + text[end:], encoding='utf-8')
          PY
          rm -f triggers/FMDL2B2_RUN.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/fmdl-2b2-full-backfill.yml triggers/FMDL2B2_RUN.md datasets/history/base/$RELEASE_ID outputs/history/candidate
          git commit -m "data: FMDL-2B-2 full-universe historical candidate [skip ci]"
          git push origin HEAD:${{ env.TARGET_REF }}

      - name: Enforce aggregate result
        if: steps.aggregate.outputs.exit_code != '0'
        run: exit ${{ steps.aggregate.outputs.exit_code }}
